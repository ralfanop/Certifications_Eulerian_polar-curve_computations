name: V007 genuine intrinsic Gaussian Fock HS rational enclosure

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireHSRationalEnclosure.lean'
      - '.github/workflows/v007-intrinsic-fock-hs-rational-enclosure.yml'
  workflow_dispatch:

jobs:
  real-hs-rational:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib and cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit intrinsic actual HS energy and Gram trace rational bounds
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireHSRationalEnclosure 2>&1 | tee /tmp/v007-intrinsic-rational-build.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireHSRationalEnclosure.lean 2>&1 | tee /tmp/v007-intrinsic-rational-audit.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-intrinsic-rational-build.log /tmp/v007-intrinsic-rational-audit.log; then
            echo "::error::Forbidden Lean axiom in intrinsic Fock rational enclosure"
            exit 1
          fi
          for theorem in C_intrinsicEntire_HS_energy_legendre_eq_integral C_intrinsicEntire_HS_energy_legendre_decimal_enclosure C_intrinsicEntire_Gram_trace_legendre_eq_integral C_intrinsicEntire_Gram_trace_legendre_decimal_enclosure; do
            grep -F "${theorem}' depends on axioms:" /tmp/v007-intrinsic-rational-audit.log
          done
          echo 'V007 intrinsic actual HS and Gram trace rational enclosures: Lean kernel and axiom audit clean.'
