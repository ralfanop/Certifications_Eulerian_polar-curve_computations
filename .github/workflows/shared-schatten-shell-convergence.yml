name: Shared core Schatten shell convergence and strict Arb
on:
  pull_request:
    paths:
      - 'lean/SharedCore/SchattenShellConvergence.lean'
      - '.github/workflows/shared-schatten-shell-convergence.yml'
      - 'numerics/arb/million_decimal_shared_det4.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Lean and Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          grep -F '0272bbe1c093d038d7257ab15306abd58245f9ff' lakefile.toml
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile and audit exact declarations
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean SharedCore/SchattenShellConvergence.lean 2>&1 | tee /tmp/shared-det4-lean.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/shared-det4-lean.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/shared-det4-lean.log').read_text()
          for suffix in ['fourth_shell_nonneg','fourth_shell_le_square','fourth_shell_summable','third_shell_lower','third_shell_nonsummable','fourth_term_le_telescope','fourth_finite_tail_bound','fourth_shell_zeta_difference']:
              name = 'SharedCore.SchattenFredholm.'+suffix
              matches = re.findall(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", log, re.S)
              assert matches or ("'"+name+"' does not depend on any axioms") in log, name
              for match in matches:
                  assert {x.strip() for x in match.split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'}
              print('AXIOM AUDIT SUCCESS:',name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-schatten-shell-convergence-audit
          path: /tmp/shared-det4-lean.log
  arb:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned FLINT and verify exact head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m pip install python-flint==0.9.0
      - name: Certify new spectral invariant
        run: |
          set -euo pipefail
          python numerics/arb/million_decimal_shared_det4.py | tee shared-det4-arb.log
          grep -F 'MILLION SUCCESS shared_det4_moment checks 3' shared-det4-arb.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-det4-moment-enclosures
          path: |
            shared-det4-arb.log
            million-shared_det4_moment.json
            million-enclosures.jsonl.gz
            det4-exact-endpoints.jsonl.gz
