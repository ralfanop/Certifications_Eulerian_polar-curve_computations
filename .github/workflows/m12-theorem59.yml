name: M12 Theorem 5.9 assembled under Levin-Lubinsky (105)
on:
  pull_request:
    paths:
      - 'lean/EulerianGrothendieck/UniformLanczos/Theorem59.lean'
      - '.github/workflows/m12-theorem59.yml'
  workflow_dispatch:

jobs:
  theorem59:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Source hygiene
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          f=UniformLanczos/Theorem59.lean
          ! grep -n -E '^\s*(axiom|opaque)\b' "$f"
          ! grep -n -w -E 'sorry|admit|native_decide' "$f"
      - name: Build prerequisites and check Theorem59.lean
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          lean --version
          lake exe cache get
          lake build UniformLanczos.Lemma58Uniform UniformLanczos.Arcsine UniformLanczos.Diagonal
          lake env lean UniformLanczos/Theorem59.lean 2>&1 | tee /tmp/m12-theorem59.log
          lake build UniformLanczos.Theorem59
          git rev-parse HEAD
      - name: Strict individual axiom audit
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          text = Path('/tmp/m12-theorem59.log').read_text()
          assert ': error' not in text, 'compilation error'
          assert "declaration uses 'sorry'" not in text
          assert 'sorryAx' not in text and 'Lean.ofReduceBool' not in text
          names = ['UniformLanczos.Theorem59.' + n for n in (
              'recSq_eq_norm_ratio', 'recSq_scale', 'LLA_tendsto', 'moment_QjM', 'scaling_142',
              'classQ_seq', 'seq_limit', 'theorem_5_9_interval', 'theorem_5_9', 'theorem_5_9_sup')]
          for name in names:
              match = re.search(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", text)
              assert match, name
              axioms = {x.strip() for x in match.group(1).split(',') if x.strip()}
              assert axioms <= allowed, (name, axioms)
              print('AXIOM AUDIT SUCCESS', name, sorted(axioms))
          print('AUDITED', len(names))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-theorem59-audit
          path: /tmp/m12-theorem59.log
