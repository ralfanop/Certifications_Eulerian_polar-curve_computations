name: M13 lemniscate Beta exact-head audit
on:
  pull_request:
    paths:
      - 'lean/Manuscript13/CrossThroatElliptic20261125.lean'
      - 'lean/Manuscript13/EllisFourier20261124.lean'
      - 'lean/EulerianGrothendieck/CriticalWindowGammaVacuum.lean'
      - 'lean/Manuscript13/CrossThroatLemniscate20261126.lean'
      - '.github/workflows/m13-lemniscate-beta-20261126.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-head pinned Lean 4 compile and axiom audit
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
          git rev-parse HEAD | tee /tmp/m13-lemniscate-beta.log
          mkdir -p /tmp/m13-cross-olean/Manuscript13 /tmp/m13-cross-olean/EulerianGrothendieck
          lake env bash -c 'export LEAN_PATH="/tmp/m13-cross-olean:$LEAN_PATH"; lean -M16768 -o /tmp/m13-cross-olean/Manuscript13/EllisFourier20261124.olean Manuscript13/EllisFourier20261124.lean' 2>&1 | tee -a /tmp/m13-lemniscate-beta.log
          lake env bash -c 'export LEAN_PATH="/tmp/m13-cross-olean:$LEAN_PATH"; lean -M16768 -o /tmp/m13-cross-olean/EulerianGrothendieck/CriticalWindowGammaVacuum.olean EulerianGrothendieck/CriticalWindowGammaVacuum.lean' 2>&1 | tee -a /tmp/m13-lemniscate-beta.log
          lake env bash -c 'export LEAN_PATH="/tmp/m13-cross-olean:$LEAN_PATH"; lean -M16768 -o /tmp/m13-cross-olean/Manuscript13/CrossThroatElliptic20261125.olean Manuscript13/CrossThroatElliptic20261125.lean' 2>&1 | tee -a /tmp/m13-lemniscate-beta.log
          lake env bash -c 'export LEAN_PATH="/tmp/m13-cross-olean:$LEAN_PATH"; lean -M16768 Manuscript13/CrossThroatLemniscate20261126.lean' 2>&1 | tee -a /tmp/m13-lemniscate-beta.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/m13-lemniscate-beta.log; then exit 1; fi
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/m13-lemniscate-beta.log').read_text()
          names=["selfdual_sq","lem_map_sq","lem_map_pos","lem_map_jacobian","lem_map_inj","lem_map_image","lem_weight","lem_period","actual_throat_lemniscate","critical_gamma_exact","beta_map_inj","beta_map_image","beta_map_jacobian","beta_weight","lem_beta_integral","gamma_beta_ratio","lem_gamma_of_beta","actual_throat_gamma","actual_throat_critical"]
          count=0
          for name in names:
              full="'Manuscript13.CrossThroatLemniscate20261126."+name+"'"
              found=re.findall(re.escape(full)+r" depends on axioms: \[([^\]]*)\]",t,re.S)
              assert found or full+" does not depend on any axioms" in t,full
              for a in found:
                  assert {x.strip() for x in a.split(',') if x.strip()} <= {'propext','Quot.sound','Classical.choice'},(full,a)
              count+=1
          assert count==19
          print("SUCCESS M13 LEMNISCATE BETA AUDIT",count)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m13-lemniscate-beta-audit
          path: /tmp/m13-lemniscate-beta.log
          if-no-files-found: warn
