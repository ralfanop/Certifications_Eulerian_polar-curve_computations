name: "Priority 3 — trace-norm exponential perturbation gives N-uniform equicontinuity"

on:
  push:
    branches:
      - manuscript14-priority3-exp-tracenorm-equicont-20261111
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3ExpTraceNormEquicont.lean'
      - '.github/workflows/manuscript14-priority3-exp-tracenorm-equicont.yml'
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3ExpTraceNormEquicont.lean'
      - '.github/workflows/manuscript14-priority3-exp-tracenorm-equicont.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile equicontinuity from exponential norm bound
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -M16768 SpecialImaginaryPoint/V14119Priority3ExpTraceNormEquicont.lean 2>&1 | tee /tmp/p3-exp-tracenorm-equicont.log
      - name: Audit equicontinuity from uniform exponential perturbation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          log=pathlib.Path("/tmp/p3-exp-tracenorm-equicont.log").read_text()
          prefix="Manuscript14Priority3.ExpTraceNormEquicont."
          names=["equicontinuity_of_exponential_norm_perturbation"]
          reports={}
          for m in re.finditer(r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms",log,re.MULTILINE):
            reports[m.group(1) or m.group(3)]={x.strip() for x in (m.group(2) or "").split(",") if x.strip()}
          allowed={"propext","Quot.sound","Classical.choice"}
          for suffix in names:
            key=prefix+suffix
            assert key in reports, f"Missing exact kernel declaration audit: {key}"
            assert reports[key] <= allowed, f"Nonstandard axioms: {key}: {reports[key]-allowed}"
          assert "sorryAx" not in log and "Lean.ofReduceBool" not in log
          assert not re.search(r"\.lean:\d+:\d+: error",log)
          print("SUCCESS: compression uniform equicontinuity from exponential norm bound")
          PY
      - name: Upload Lean log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priority3-exp-tracenorm-equicont-logs
          path: /tmp/p3-exp-tracenorm-equicont.log
          if-no-files-found: ignore
