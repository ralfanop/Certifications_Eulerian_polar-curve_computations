name: "M15 S2.7 nonnegative admissible integral costs — Lean"
on:
  push:
    branches:
      - draft/m15-s27-admissible-cost-nonnegative-20261114
    paths:
      - 'lean/Manuscript15/Section27AdmissibleCostPositivity.lean'
      - '.github/workflows/m15-s27-admissible-cost-positivity.yml'
  pull_request:
    paths:
      - 'lean/Manuscript15/Section27AdmissibleCostPositivity.lean'
      - '.github/workflows/m15-s27-admissible-cost-positivity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile exact dependency chain and check new declarations
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Manuscript15
          for mod in Section27CouplingIntegral Section27TwoCoordinate Section27WeightedCoordinate Section27CostInfimum Section27AdmissibleMeasureCosts; do
            lake env lean -M16768 -o ".lake/build/lib/lean/Manuscript15/${mod}.olean" "Manuscript15/${mod}.lean" 2>&1 | tee "/tmp/${mod}.log"
          done
          lake env lean -M16768 Manuscript15/Section27AdmissibleCostPositivity.lean 2>&1 | tee /tmp/positivity.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:' /tmp/Section27*.log /tmp/positivity.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/positivity.log').read_text()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for name in ('admissible_integral_costs_nonnegative',
                       'nonneg_infimum_admissible_measure_costs'):
              target = 'Manuscript15.Section27.' + name
              hits = re.findall(r"'" + re.escape(target) + r"' depends on axioms: \[([^\]]*)\]", log, re.S)
              assert len(hits) == 1, ('missing/duplicate axiom audit', target)
              used = {s.strip() for s in hits[0].split(',') if s.strip()}
              assert used <= allowed, (target, used - allowed)
              print('AXIOM AUDIT SUCCESS:', target, sorted(used))
          PY
      - name: Preserve full Lean logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-admissible-cost-positivity-lean
          path: /tmp/*.log
