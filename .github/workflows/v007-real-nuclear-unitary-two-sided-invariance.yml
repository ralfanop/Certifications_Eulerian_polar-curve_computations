name: V007 real nuclear S1 two-sided unitary exact invariance

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/RealNuclearUnitaryRightTwoSidedInvariance.lean'
      - '.github/workflows/v007-real-nuclear-unitary-two-sided-invariance.yml'
  workflow_dispatch:

jobs:
  unitary-two-sided:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Certify sharp two-sided unitary invariance of real nuclear costs
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealNuclearUnitaryRightTwoSidedInvariance 2>&1 | tee /tmp/v007-real-unitary-two-sided.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-unitary-two-sided.log; then
            echo '::error::Nonstandard axiom in two-sided real nuclear norm proof.'
            exit 1
          fi
          for theorem in realUnitaryRightCLM_rankOne RealNuclearCosts.unitary_right realUnitaryRightCLM_symm_comp RealNuclearCosts.unitary_right_iff realNuclearInfimum_unitary_right_eq realNuclearInfimum_unitary_two_sided_eq; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-real-unitary-two-sided.log
          done
          echo 'V007 real nuclear norm exact two-sided unitary invariance kernel-certified.'
