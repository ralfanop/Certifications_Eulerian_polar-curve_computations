name: "Manuscript 15 — exact Eulerian complex Fourier interval integral"
on:
  push:
    branches:
      - manuscript15-eulerian-characteristic-integral-20261111
    paths:
      - 'lean/Manuscript15/EulerianCharacteristicIntegral.lean'
      - 'lean/EulerianCert/FourierModes.lean'
      - '.github/workflows/manuscript15-eulerian-characteristic-integral.yml'
  pull_request:
    paths:
      - 'lean/Manuscript15/EulerianCharacteristicIntegral.lean'
      - 'lean/EulerianCert/FourierModes.lean'
      - '.github/workflows/manuscript15-eulerian-characteristic-integral.yml'
  workflow_dispatch:
jobs:
  kernel:
    name: "Exact Eulerian sinc complex Fourier integral — Lean kernel audit"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors \
            --retry-delay 5 --connect-timeout 20 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
      - name: Download pinned Mathlib cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile Eulerian sinc prerequisite and exact Fourier integral
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/EulerianCert
          lake env lean -M16768 -o .lake/build/lib/lean/EulerianCert/FourierModes.olean \
            EulerianCert/FourierModes.lean 2>&1 | tee /tmp/m15-eulerian-fourier-prerequisite.log
          lake env lean -M16768 Manuscript15/EulerianCharacteristicIntegral.lean 2>&1 | tee /tmp/m15-eulerian-fourier-integral.log
      - name: Strict kernel axiom audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path("/tmp/m15-eulerian-fourier-integral.log").read_text()
          pre=pathlib.Path("/tmp/m15-eulerian-fourier-prerequisite.log").read_text()
          key="Manuscript15.eulerian_sinc_eq_symmetric_interval_fourierIntegral"
          reports={}
          for m in re.finditer(r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms",s,re.MULTILINE):
            reports[m.group(1) or m.group(3)]={a.strip() for a in (m.group(2) or "").split(",") if a.strip()}
          allowed={"propext","Classical.choice","Quot.sound"}
          assert key in reports, f"Missing kernel audit {key}"
          assert reports[key] <= allowed, f"Unaccepted axioms: {reports[key]-allowed}"
          for log in (pre,s):
            assert "sorryAx" not in log and "Lean.ofReduceBool" not in log
            assert not re.search(r"\.lean:\d+:\d+: error",log)
          print(key, sorted(reports[key]))
          print("SUCCESS: Eulerian sinc equals exact complex Fourier transform of unit interval density")
          PY
      - name: Upload Lean kernel audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript15-eulerian-characteristic-integral-audit
          path: |
            /tmp/m15-eulerian-fourier-prerequisite.log
            /tmp/m15-eulerian-fourier-integral.log
          if-no-files-found: ignore
