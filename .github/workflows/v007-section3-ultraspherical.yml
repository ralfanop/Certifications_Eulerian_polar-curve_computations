name: V007 Section 3 Fourier-Bessel, Eulerian and Catalan (13, Prop 3.3, 3.4, 3.6)
on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/Manuscript13Beta.lean'
      - 'lean/GegenbauerFock/Manuscript13Measure.lean'
      - 'lean/GegenbauerFock/Manuscript13Fourier.lean'
      - 'lean/GegenbauerFock/Section3Ultraspherical.lean'
      - '.github/workflows/v007-section3-ultraspherical.yml'
  workflow_dispatch:
jobs:
  section3-ultraspherical:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit V007 Section 3 Fourier-Bessel, Eulerian and Catalan (13, Prop 3.3, 3.4, 3.6)
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.Section3Ultraspherical 2>&1 | tee /tmp/section3-ultraspherical-build.log
          lake env lean -M16768 GegenbauerFock/Section3Ultraspherical.lean 2>&1 | tee /tmp/section3-ultraspherical-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/section3-ultraspherical-build.log /tmp/section3-ultraspherical-axioms.log; then
            echo '::error::Forbidden axiom in Section3Ultraspherical.'
            exit 1
          fi
          grep -F "GegenbauerFock.Section3.measure_eq_nu' depends on axioms:" /tmp/section3-ultraspherical-axioms.log
          grep -F "GegenbauerFock.Section3.Phi_differentiable' depends on axioms:" /tmp/section3-ultraspherical-axioms.log
          grep -F "GegenbauerFock.Section3.Phi_series' depends on axioms:" /tmp/section3-ultraspherical-axioms.log
          grep -F "GegenbauerFock.Section3.Phi_bessel'' depends on axioms:" /tmp/section3-ultraspherical-axioms.log
          grep -F "GegenbauerFock.Section3.proposition_3_4' depends on axioms:" /tmp/section3-ultraspherical-axioms.log
          grep -F "GegenbauerFock.Section3.proposition_3_6' depends on axioms:" /tmp/section3-ultraspherical-axioms.log
          echo 'V007 Section 3 Fourier-Bessel, Eulerian and Catalan (13, Prop 3.3, 3.4, 3.6): kernel-certified.'
