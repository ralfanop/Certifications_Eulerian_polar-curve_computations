name: V007 real Gram positive singular basis nuclear bridge

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/RealCompactGramPositiveSingularBasisBridge.lean'
      - 'lean/GegenbauerFock/RealNuclearOneCompleteSourceSingularS1.lean'
      - 'lean/GegenbauerFock/RealNuclearTwoOrthonormalAllCostsDual.lean'
      - '.github/workflows/v007-real-gram-positive-singular-basis-bridge.yml'
  workflow_dispatch:

jobs:
  real-gram-positive-singular-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel audit of real positive Gram singular source-basis bridge
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealCompactGramPositiveSingularBasisBridge 2>&1 | tee /tmp/v007-real-gram-positive-singular-bridge.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-gram-positive-singular-bridge.log; then
            echo '::error::Forbidden axiom in real Gram singular basis bridge.'
            exit 1
          fi
          for theorem in realGram_compact_of_compact_v007 realGram_eigenvector_norm_sq_v007 realGram_normalized_eigenvector_norm_v007 realGram_positiveEigenfamily_output_orthonormal_v007 realGram_completePositiveEigenbasis_nuclear_exact_trace_v007; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-real-gram-positive-singular-bridge.log
          done
          echo 'Real positive Gram source-basis singular output and nuclear S1 bridge kernel-certified.'
