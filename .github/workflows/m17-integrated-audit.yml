name: M17 integrated exact head audit
on:
  pull_request:
    paths:
      - 'lean/Manuscript17/**'
      - 'lean/EulerianCert/CassiniAreaIntegral20261124.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - '.github/workflows/m17-integrated-audit.yml'
  push:
    branches: [main]
    paths:
      - 'lean/Manuscript17/**'
      - 'lean/EulerianCert/CassiniAreaIntegral20261124.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - '.github/workflows/m17-integrated-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact HEAD and byte identity with certifying heads
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD | tee /tmp/m17-audit-head.log
          git merge-base --is-ancestor 5c36eba71306420fc58df71613fe51f1f3b5c42c HEAD
          git show '5c36eba71306420fc58df71613fe51f1f3b5c42c:lean/EulerianCert/CassiniAreaIntegral20261124.lean' | cmp - 'EulerianCert/CassiniAreaIntegral20261124.lean'
          git merge-base --is-ancestor 6381fba2bfe3e7eb3ea5b4fb3b7e7e4ab004cea7 HEAD
          git show '6381fba2bfe3e7eb3ea5b4fb3b7e7e4ab004cea7:lean/Manuscript17/CassiniChartGeometry20261127.lean' | cmp - 'Manuscript17/CassiniChartGeometry20261127.lean'
          git merge-base --is-ancestor 8af0628e675c69814b75fb1adc8dcf12a526e99a HEAD
          git show '8af0628e675c69814b75fb1adc8dcf12a526e99a:lean/Manuscript17/StrongCycleGeneral20261127.lean' | cmp - 'Manuscript17/StrongCycleGeneral20261127.lean'
          git merge-base --is-ancestor 0ca743fda482bff0e138cf7b57aced74a956799c HEAD
          git show '0ca743fda482bff0e138cf7b57aced74a956799c:lean/Manuscript17/StrongCycleKrylov20261127.lean' | cmp - 'Manuscript17/StrongCycleKrylov20261127.lean'
          git merge-base --is-ancestor cb839dc5521ef108191604da03dadd6e2c4f32d2 HEAD
          git show 'cb839dc5521ef108191604da03dadd6e2c4f32d2:lean/Manuscript17/CassiniChartMeasure20261127.lean' | cmp - 'Manuscript17/CassiniChartMeasure20261127.lean'
          git merge-base --is-ancestor 4719dbbc4b95a367c5f18f186ea12260b9422444 HEAD
          git show 'c1d3f32d12cffe9f90129b35b55f9e2d9ded835d:numerics/arb/m17_cassini_area_million.py' | cmp - ../numerics/arb/m17_cassini_area_million.py
          git merge-base --is-ancestor 10c6efabd27c85e37bcf818956b9988d468f2b2e HEAD
          git show '10c6efabd27c85e37bcf818956b9988d468f2b2e:lean/EulerianCert/CassiniFeffermanTangent20261124.lean' | cmp - 'EulerianCert/CassiniFeffermanTangent20261124.lean'
          git merge-base --is-ancestor b8a953ae6be27ce4a518a2b69f9b673e795f0abb HEAD
          git show 'b8a953ae6be27ce4a518a2b69f9b673e795f0abb:lean/Manuscript17/StrongCycleMinpoly20261127.lean' | cmp - 'Manuscript17/StrongCycleMinpoly20261127.lean'
          git merge-base --is-ancestor f0ac4219911e70359956ed09de2c9b18213076b3 HEAD
          git show 'f0ac4219911e70359956ed09de2c9b18213076b3:lean/Manuscript17/StrongCycleOriginal20261127.lean' | cmp - 'Manuscript17/StrongCycleOriginal20261127.lean'
          git merge-base --is-ancestor bdb9c449d09bed35123be86993069419fa7cea2b HEAD
          git show 'bdb9c449d09bed35123be86993069419fa7cea2b:lean/Manuscript17/CassiniPolynomialLift20261127.lean' | cmp - 'Manuscript17/CassiniPolynomialLift20261127.lean'
          git merge-base --is-ancestor acd5f88209c49baaa8a88016c51bdf2a26c0c892 HEAD
          git show 'acd5f88209c49baaa8a88016c51bdf2a26c0c892:lean/Manuscript17/StrongCycleChebyshev20261128.lean' | cmp - 'Manuscript17/StrongCycleChebyshev20261128.lean'
          git merge-base --is-ancestor 18d139aea825062d86beeb4488e5884611b31636 HEAD
          git show '18d139aea825062d86beeb4488e5884611b31636:lean/Manuscript17/ChebyshevCriticalSpectrum20261128.lean' | cmp - 'Manuscript17/ChebyshevCriticalSpectrum20261128.lean'
          git merge-base --is-ancestor fd333c15ba7be5c7a8e6d5e19f916135fb535070 HEAD
          git show 'fd333c15ba7be5c7a8e6d5e19f916135fb535070:lean/Manuscript17/CassiniGlobalImage20261128.lean' | cmp - 'Manuscript17/CassiniGlobalImage20261128.lean'
          git merge-base --is-ancestor b307be8147093b4dc052700210b829f577074df4 HEAD
          git show 'b307be8147093b4dc052700210b829f577074df4:lean/Manuscript17/CrossConnections20261125.lean' | cmp - 'Manuscript17/CrossConnections20261125.lean'
          git merge-base --is-ancestor b8c5697d160e374b041b21c14a820c8b87fff2a7 HEAD
          git show 'b8c5697d160e374b041b21c14a820c8b87fff2a7:lean/Manuscript17/StrongCycleJordan20261128.lean' | cmp - 'Manuscript17/StrongCycleJordan20261128.lean'
          git merge-base --is-ancestor 65d2048ee0d2ad64e12c2447e1d5d2b648c7a706 HEAD
          git show '65d2048ee0d2ad64e12c2447e1d5d2b648c7a706:lean/Manuscript17/CassiniGlobalGraph20261128.lean' | cmp - 'Manuscript17/CassiniGlobalGraph20261128.lean'
          git merge-base --is-ancestor 40f6ff309fe1edc7840d7fd2033f4d0c91cce426 HEAD
          git show '40f6ff309fe1edc7840d7fd2033f4d0c91cce426:lean/Manuscript17/CassiniMeridianLength20261128.lean' | cmp - 'Manuscript17/CassiniMeridianLength20261128.lean'
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          grep -F '0272bbe1c093d038d7257ab15306abd58245f9ff' lakefile.toml
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
      - name: Recompile all merged M17 modules and dependencies
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/{EulerianCert,Manuscript17}
          lake env lean -o '.lake/build/lib/lean/EulerianCert/CassiniAreaIntegral20261124.olean' 'EulerianCert/CassiniAreaIntegral20261124.lean' 2>&1 | tee '/tmp/m17-audit-CassiniAreaIntegral20261124.log'
          lake env lean -o '.lake/build/lib/lean/Manuscript17/CassiniChartGeometry20261127.olean' 'Manuscript17/CassiniChartGeometry20261127.lean' 2>&1 | tee '/tmp/m17-audit-CassiniChartGeometry20261127.log'
          lake env lean -o '.lake/build/lib/lean/Manuscript17/StrongCycleGeneral20261127.olean' 'Manuscript17/StrongCycleGeneral20261127.lean' 2>&1 | tee '/tmp/m17-audit-StrongCycleGeneral20261127.log'
          lake env lean -o '.lake/build/lib/lean/Manuscript17/StrongCycleKrylov20261127.olean' 'Manuscript17/StrongCycleKrylov20261127.lean' 2>&1 | tee '/tmp/m17-audit-StrongCycleKrylov20261127.log'
          lake env lean -o '.lake/build/lib/lean/Manuscript17/CassiniChartMeasure20261127.olean' 'Manuscript17/CassiniChartMeasure20261127.lean' 2>&1 | tee '/tmp/m17-audit-CassiniChartMeasure20261127.log'
          mkdir -p .lake/build/lib/lean/Manuscript16
          lake env lean -o '.lake/build/lib/lean/Manuscript16/QuarticPartitionSusceptibility20261125.olean' 'Manuscript16/QuarticPartitionSusceptibility20261125.lean'
          lake env lean -o '.lake/build/lib/lean/EulerianCert/CassiniFeffermanTangent20261124.olean' 'EulerianCert/CassiniFeffermanTangent20261124.lean' 2>&1 | tee '/tmp/m17-audit-CassiniFeffermanTangent20261124.log'
          lake env lean -o '.lake/build/lib/lean/Manuscript17/StrongCycleMinpoly20261127.olean' 'Manuscript17/StrongCycleMinpoly20261127.lean' 2>&1 | tee '/tmp/m17-audit-StrongCycleMinpoly20261127.log'
          lake env lean -o '.lake/build/lib/lean/Manuscript17/StrongCycleOriginal20261127.olean' 'Manuscript17/StrongCycleOriginal20261127.lean' 2>&1 | tee '/tmp/m17-audit-StrongCycleOriginal20261127.log'
          lake env lean -o '.lake/build/lib/lean/Manuscript17/CassiniPolynomialLift20261127.olean' 'Manuscript17/CassiniPolynomialLift20261127.lean' 2>&1 | tee '/tmp/m17-audit-CassiniPolynomialLift20261127.log'
          lake env lean -o '.lake/build/lib/lean/Manuscript17/StrongCycleChebyshev20261128.olean' 'Manuscript17/StrongCycleChebyshev20261128.lean' 2>&1 | tee '/tmp/m17-audit-StrongCycleChebyshev20261128.log'
          lake env lean -o '.lake/build/lib/lean/Manuscript17/ChebyshevCriticalSpectrum20261128.olean' 'Manuscript17/ChebyshevCriticalSpectrum20261128.lean' 2>&1 | tee '/tmp/m17-audit-ChebyshevCriticalSpectrum20261128.log'
          lake env lean -o '.lake/build/lib/lean/Manuscript17/CassiniGlobalImage20261128.olean' 'Manuscript17/CassiniGlobalImage20261128.lean' 2>&1 | tee '/tmp/m17-audit-CassiniGlobalImage20261128.log'
          lake env lean -o '.lake/build/lib/lean/Manuscript17/CrossConnections20261125.olean' 'Manuscript17/CrossConnections20261125.lean' 2>&1 | tee '/tmp/m17-audit-CrossConnections20261125.log'
          lake env lean -o '.lake/build/lib/lean/Manuscript17/StrongCycleJordan20261128.olean' 'Manuscript17/StrongCycleJordan20261128.lean' 2>&1 | tee '/tmp/m17-audit-StrongCycleJordan20261128.log'
          lake env lean -o '.lake/build/lib/lean/Manuscript17/CassiniGlobalGraph20261128.olean' 'Manuscript17/CassiniGlobalGraph20261128.lean' 2>&1 | tee '/tmp/m17-audit-CassiniGlobalGraph20261128.log'
          lake env lean -o '.lake/build/lib/lean/Manuscript17/CassiniMeridianLength20261128.olean' 'Manuscript17/CassiniMeridianLength20261128.lean' 2>&1 | tee '/tmp/m17-audit-CassiniMeridianLength20261128.log'
          python - <<'PY'
          import re
          from pathlib import Path
          modules = [["CassiniAreaIntegral20261124",13],["CassiniChartGeometry20261127",13],["StrongCycleGeneral20261127",9],["StrongCycleKrylov20261127",7],["CassiniChartMeasure20261127",9],["CassiniFeffermanTangent20261124",8],["StrongCycleMinpoly20261127",5],["StrongCycleOriginal20261127",5],["CassiniPolynomialLift20261127",8],["StrongCycleChebyshev20261128",7],["ChebyshevCriticalSpectrum20261128",7],["CassiniGlobalImage20261128",9],["CrossConnections20261125",8],["StrongCycleJordan20261128",12],["CassiniGlobalGraph20261128",16],["CassiniMeridianLength20261128",17]]
          total = 0
          for m,n in modules:
              s = Path('/tmp/m17-audit-'+m+'.log').read_text()
              assert not re.search(r'sorryAx|Lean.ofReduceBool|error:', s)
              a = re.findall(r"depends on axioms: \[([^\]]*)\]", s, re.S)
              assert len(a)+s.count('does not depend on any axioms') == n
              assert all(set(x.strip() for x in b.split(',') if x.strip()) <= {'propext','Classical.choice','Quot.sound'} for b in a)
              total += n
          assert total == 153
          print('SUCCESS M17 integrated 153 reports; standard axioms only')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m17-integrated-audit
          path: /tmp/m17-audit-*.log
