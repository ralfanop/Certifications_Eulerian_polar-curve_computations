name: V007 real Sturm nuclear S1 norm exact trace equality

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventRealNuclearDualLower.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventRealNuclearFiniteDual.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventRealNuclearNorm.lean'
      - '.github/workflows/v007-sturm-real-nuclear-dual-lower.yml'
  workflow_dispatch:

jobs:
  nuclear-duality:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then exit 0; fi
            sleep "$((attempt * 8))"
          done
          exit 1
      - name: Prepare exact Mathlib dependencies
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Certify all nuclear representations' sharp trace lower bound and equality
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleResolventRealNuclearDualLower 2>&1 | tee /tmp/v007-real-nuclear-lower.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-nuclear-lower.log; then
            echo '::error::Nonstandard axiom in exact real nuclear norm proof.'
            exit 1
          fi
          for theorem in realHilbertFiniteTraceCLM_apply realHilbertFiniteTrace_abs_le_nuclearCost sturmRealClosedResolvent_spectralTrace_le_allNuclearCosts sturmRealClosedResolvent_nuclearInfimum_eq_spectralTrace; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-real-nuclear-lower.log
          done
          echo 'Real closed Sturm S1 nuclear norm equals spectral trace — kernel-certified.'
