name: V007 exact continuous spectral zero of real Sturm resolvent

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealResolventZeroSpectrum.lean'
      - '.github/workflows/v007-ultraspherical-sturm-resolvent-zero-spectrum.yml'
  workflow_dispatch:

jobs:
  real-sturm-resolvent-zero-spectrum-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and axiom audit genuine continuous spectral zero
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealResolventZeroSpectrum 2>&1 | tee /tmp/v007-reszerospec-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealResolventZeroSpectrum.lean 2>&1 | tee /tmp/v007-reszerospec-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-reszerospec-build.log /tmp/v007-reszerospec-axioms.log; then
            echo '::error::Forbidden axiom in continuous zero spectrum.'
            exit 1
          fi
          grep -F "sturmRealResolvent_zero_mem_spectrum' depends on axioms:" /tmp/v007-reszerospec-axioms.log
          grep -F "sturmRealResolvent_zero_continuous_spectrum' depends on axioms:" /tmp/v007-reszerospec-axioms.log
          echo 'V007 real closed resolvent continuous spectral zero kernel-audited.'
