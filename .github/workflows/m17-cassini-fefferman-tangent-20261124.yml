name: M17 Cassini Fefferman tangent metric exact-head Lean 4
on:
  pull_request:
    paths:
      - 'lean/EulerianCert/CassiniFeffermanTangent20261124.lean'
      - '.github/workflows/m17-cassini-fefferman-tangent-20261124.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tangent-metric:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compile and audit exact HEAD
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
          git rev-parse HEAD | tee /tmp/m17-tangent.log
          lake env lean -M16768 EulerianCert/CassiniFeffermanTangent20261124.lean 2>&1 | tee -a /tmp/m17-tangent.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/m17-tangent.log; then exit 1; fi
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/m17-tangent.log').read_text()
          ns='EulerianCert.CassiniFeffermanTangent20261124'
          declarations=['ambient_mixed_expansion','ambient_symmetric','null_curve_tangent','normalized_coordinate_derivative','normalized_null_pullback','cassini_tangent_metric','hereditary_pullback','dirichlet_chart_integral']
          for dec in declarations:
              name="'"+ns+'.'+dec+"'"
              found=re.findall(re.escape(name)+r" depends on axioms: \[([^\]]*)\]",s,re.S)
              assert found or name+" does not depend on any axioms" in s, name
              for a in found:
                  assert {x.strip() for x in a.split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'},(name,a)
          print("SUCCESS M17 TANGENT METRIC AXIOM AUDIT",len(declarations))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m17-cassini-fefferman-tangent-log
          path: /tmp/m17-tangent.log
