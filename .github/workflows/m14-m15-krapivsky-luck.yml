name: M14-M15 Krapivsky-Luck shared Lean bridge
on:
  pull_request:
    paths:
      - 'lean/Manuscript15/KrapivskyLuckMobiusBridge.lean'
      - '.github/workflows/m14-m15-krapivsky-luck.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Lean and Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Lean compilation and audit
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 Manuscript15/KrapivskyLuckMobiusBridge.lean 2>&1 | tee /tmp/kl-lean.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/kl-lean.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/kl-lean.log').read_text()
          for n in ['mobius_fibre_delta','weighted_fibre_delta','fibre_tsum_delta','mobius_kernel_tsum','sinc_square_kernel']:
              name = 'Manuscripts14And15.KrapivskyLuck.'+n
              matches = re.findall(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", log, re.S)
              assert matches, 'missing audit: '+name
              for match in matches:
                  assert {a.strip() for a in match.split(',') if a.strip()} <= {'propext','Classical.choice','Quot.sound'}
          print('AXIOM AUDIT SUCCESS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kl-lean
          path: /tmp/kl-lean.log
