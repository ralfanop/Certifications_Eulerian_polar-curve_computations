name: M12 strict fixed decimal-place reconciliation
on:
  pull_request:
    paths:
      - 'numerics/arb/m12_fixed_place_replay.py'
      - '.github/workflows/m12-fixed-place-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [historical, additional, lanczos]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin exact HEAD and FLINT
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m pip install python-flint==0.9.0
      - name: Fetch authenticated Lanczos exact endpoints
        if: matrix.mode == 'lanczos'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=44313014167
          head=8fc451ce053a769087fb25ed16289018890bc926
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" | jq -e --arg sha "$head" '.head_sha == $sha and .conclusion == "success"'
          mkdir -p sources
          for spec in \
            '100 14431877216 8f2e19d47c0d0ff4011f23a915b6f3ba7c700616805f4ce5849c929dad66e784' \
            '200 14435228234 eb184d12ad6db434bbc533b0cfde30d83fa08f54b6917e54284ea4aeca8f2a26' \
            '400 14449268572 2155c46f7bef8ec70bb4bc6e5966b2ee2a485ab306299817640961fbc75ba2e6'; do
            read -r m id digest <<< "$spec"
            ep="repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            gh api "$ep" | jq -e --arg sha "$head" --arg digest "sha256:$digest" --arg name "m12-lanczos-$m" '.workflow_run.head_sha == $sha and .workflow_run.id == 44313014167 and .digest == $digest and .name == $name and .expired == false'
            gh api "$ep/zip" > "sources/$m.zip"
            printf '%s  %s\n' "$digest" "sources/$m.zip" | sha256sum -c -
            unzip -j "sources/$m.zip" "m12-lanczos-$m.json" -d sources
          done
      - name: Validate both exact rounding standards
        run: |
          set -euo pipefail
          python numerics/arb/m12_fixed_place_replay.py ${{ matrix.mode }} 2>&1 | tee replay.log
          grep -F 'FIXED REPLAY SUCCESS' replay.log
          gzip -t m12-fixed-${{ matrix.mode }}.jsonl.gz
      - uses: actions/upload-artifact@v4
        with:
          name: m12-fixed-${{ matrix.mode }}
          path: |
            replay.log
            m12-fixed-${{ matrix.mode }}.json
            m12-fixed-${{ matrix.mode }}.jsonl.gz
          if-no-files-found: error
          compression-level: 0
