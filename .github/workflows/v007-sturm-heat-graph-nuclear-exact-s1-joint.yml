name: V007 heat closed graph compact nuclear exact real S1 joint

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatGraphNuclearExactS1Certificate.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatGraphNuclearJointCertificate.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatNuclearProjectiveTrace.lean'
      - '.github/workflows/v007-sturm-heat-graph-nuclear-exact-s1-joint.yml'
  workflow_dispatch:

jobs:
  heat-graph-compact-nuclear-exact-s1:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build final five-property operator certificate and audit axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealHeatGraphNuclearExactS1Certificate 2>&1 | tee /tmp/v007-final-heat-S1-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatGraphNuclearExactS1Certificate.lean 2>&1 | tee /tmp/v007-final-heat-S1-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-final-heat-S1-build.log /tmp/v007-final-heat-S1-axioms.log; then
            echo '::error::Forbidden axiom in final five-property V007 heat S1 certificate.'
            exit 1
          fi
          grep -F "sturmRealHeat_closed_graph_compact_nuclear_exactS1_joint_certificate' depends on axioms:" /tmp/v007-final-heat-S1-axioms.log
          echo 'V007 final real heat closed graph, compact nuclear and exact S1 certificate audited.'
