name: V007 general real nuclear S1 left-unitary exact invariance

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/RealNuclearUnitaryLeftInvariance.lean'
      - '.github/workflows/v007-real-nuclear-left-unitary-invariance.yml'
  workflow_dispatch:

jobs:
  nuclear-unitary:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then exit 0; fi
            sleep "$((attempt * 8))"
          done
          exit 1
      - name: Prepare pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Certify full nuclear costs and exact norm invariance
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealNuclearUnitaryLeftInvariance 2>&1 | tee /tmp/v007-real-unitary-nuclear.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-unitary-nuclear.log; then
            echo '::error::Nonstandard axiom in real-unitary nuclear norm proof.'
            exit 1
          fi
          for theorem in realUnitaryLeftCLM_rankOne RealNuclearCosts.unitary_left realUnitaryLeftCLM_symm_comp RealNuclearCosts.unitary_left_iff realNuclearInfimum_unitary_left_eq; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-real-unitary-nuclear.log
          done
          echo 'Real nuclear trace norm left-unitary invariance kernel-certified.'
