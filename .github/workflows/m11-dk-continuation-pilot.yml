name: M11 curvature zero-inversion continuation
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'numerics/arb/m11_dk_continuation.py'
      - '.github/workflows/m11-dk-continuation-pilot.yml'
  workflow_dispatch:
jobs:
  curvature-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - order: 1024
            bits: 4096
            panels: 32
            threshold: 2000
          - order: 2048
            bits: 8192
            panels: 32
            threshold: 4000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact head and pin FLINT
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git rev-parse HEAD
          python -m pip install python-flint==0.9.0
      - name: Certified continuation from the symmetry vertex
        shell: bash
        run: |
          set -o pipefail
          python -u numerics/arb/m11_dk_continuation.py --bits ${{ matrix.bits }} --order ${{ matrix.order }} --panels ${{ matrix.panels }} --minimum-bits ${{ matrix.threshold }} --adaptive | tee m11-dk-continuation.log
      - uses: actions/upload-artifact@v4
        with:
          name: m11-dk-continuation-${{ matrix.threshold }}
          path: |
            m11-dk-continuation.json
            m11-dk-continuation.log
