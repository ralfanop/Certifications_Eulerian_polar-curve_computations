name: V007 Gaussian Bargmann-Fock planar factorization bridge certificate

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/GaussianAreaNormalization.lean'
      - 'lean/GegenbauerFock/GaussianAreaMonomialNorm.lean'
      - 'lean/GegenbauerFock/GaussianAreaAngularOrthogonality.lean'
      - 'lean/GegenbauerFock/GaussianAreaPolarAngularOrthogonality.lean'
      - 'lean/GegenbauerFock/GaussianAreaPolarProductOrthogonality.lean'
      - 'lean/GegenbauerFock/GaussianAreaPolarMixedPullback.lean'
      - 'lean/GegenbauerFock/GaussianAreaPlanarFactorizationBridge.lean'
      - 'lean/GegenbauerFock/GaussianAreaPolarAngularAlgebra.lean'
      - 'lean/GegenbauerFock/GaussianAreaFullMonomialOrthogonality.lean'
      - 'lean/GegenbauerFock/GaussianAreaNormalizedMonomialGram.lean'
      - 'lean/GegenbauerFock/GaussianAreaRadialIntegrability.lean'
      - 'lean/GegenbauerFock/GaussianAreaPolarProductIntegrability.lean'
      - 'lean/GegenbauerFock/GaussianAreaMixedPullbackIntegrability.lean'
      - 'lean/GegenbauerFock/GaussianAreaComplexMonomialGram.lean'
      - 'lean/GegenbauerFock/GaussianAreaPlanarIntegrabilityTransfer.lean'
      - 'lean/GegenbauerFock/GaussianAreaNormalizedBasis.lean'
      - 'lean/GegenbauerFock/GaussianAreaFiniteMonomialGramIsometry.lean'
      - 'lean/GegenbauerFock/GaussianAreaMonomialL2Integrability.lean'
      - 'lean/GegenbauerFock/GaussianAreaWeightedMonomialL2.lean'
      - 'lean/GegenbauerFock/GaussianAreaActualL2Vectors.lean'
      - 'lean/GegenbauerFock/GaussianAreaL2Orthonormality.lean'
      - 'lean/GegenbauerFock/GaussianAreaTrueL2OrthonormalFamily.lean'
      - 'lean/GegenbauerFock/GaussianAreaCoefficientSynthesisL2.lean'
      - 'lean/GegenbauerFock/GaussianAreaCoefficientSynthesisClosedRange.lean'
      - 'lean/GegenbauerFock/GaussianAreaCoefficientRecovery.lean'
      - 'lean/GegenbauerFock/GaussianAreaPolynomialClosureEquiv.lean'
      - 'lean/GegenbauerFock/GaussianAreaEntireL2Submodule.lean'
      - 'lean/GegenbauerFock/GaussianAreaPolynomialOrthogonalCriterion.lean'
      - 'lean/GegenbauerFock/GaussianAreaEntireRepresentativeUniqueness.lean'
      - 'lean/GegenbauerFock/GaussianAreaIntrinsicEntireEvaluation.lean'
      - 'lean/GegenbauerFock/GaussianAreaIntrinsicMonomialEvaluation.lean'
      - 'lean/GegenbauerFock/GaussianAreaCoefficientAnalysisAdjoint.lean'
      - 'lean/GegenbauerFock/GaussianAreaPolynomialProjector.lean'
      - 'lean/GegenbauerFock/GaussianAreaPolynomialParseval.lean'
      - 'lean/GegenbauerFock/GaussianAreaProjectedPointEvaluation.lean'
      - 'lean/GegenbauerFock/GaussianAreaFinitePolynomialEvaluation.lean'
      - 'lean/GegenbauerFock/GaussianAreaCoherentSeriesHasSum.lean'
      - 'lean/GegenbauerFock/GaussianAreaCoherentSeriesAe.lean'
      - 'lean/GegenbauerFock/GaussianAreaCoherentIntrinsicAgreement.lean'
      - 'lean/GegenbauerFock/GaussianAreaIntrinsicResidualCriterion.lean'
      - 'lean/GegenbauerFock/GaussianAreaReproducingCriterion.lean'
      - 'lean/GegenbauerFock/GaussianAreaTaylorUniqueness.lean'
      - 'lean/GegenbauerFock/GaussianAreaEntireCircleMean.lean'
      - 'lean/GegenbauerFock/GaussianAreaEntireCircularTaylor.lean'
      - 'lean/GegenbauerFock/GaussianAreaEntireAngularMoments.lean'
      - 'lean/GegenbauerFock/GaussianAreaAngularMomentUniqueness.lean'
      - '.github/workflows/gegenbauer-fock-gaussian-area.yml'
  workflow_dispatch:

jobs:
  gaussian-area-normalization:
    # Public-repository GitHub-hosted Linux runners supply 16 GB RAM in
    # TOTAL per VM/job (shared by all Lean/Lake processes in that job).
    # This cannot be interpreted as 16 GB for every concurrent process.
    runs-on: ubuntu-24.04
    steps:
      - name: Verify available 16 GB runner memory budget
        shell: bash
        run: |
          set -euo pipefail
          echo 'Public Ubuntu runner nominal RAM budget: 16 GB total per job.'
          free -h
          grep -E '^MemTotal:' /proc/meminfo
          if [ -f /sys/fs/cgroup/memory.max ]; then
            printf 'cgroup memory.max: '
            cat /sys/fs/cgroup/memory.max
          fi
          mem_kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          # 16 GB nominal VMs report slightly less after reserved memory.
          if [ "$mem_kib" -lt 14500000 ]; then
            echo "::error::Runner has less memory than the nominal 16 GB public runner."
            exit 1
          fi
          echo '16 GB public runner memory tier confirmed.'
      - uses: actions/checkout@v4

      # The existing certification repository does not check in a
      # lake-manifest.json. The lean-action composite itself refuses to
      # initialize without it, even with auto-config: false; install
      # elan directly and run lake update before requesting Mathlib cache.
      - name: Install elan and pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          # Upstream GitHub and Lean release endpoints can return transient HTTP 504.
          # Retry downloads, but never change lean/lean-toolchain or Mathlib pins.
          curl --proto '=https' --tlsv1.2 -fsSL \
            --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then
              installed=1
              break
            fi
            echo "::warning::elan bootstrap failed, attempt ${attempt}/6"
            sleep "$((attempt * 8))"
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::elan bootstrap unavailable after six attempts"
            exit 1
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            # lean --version triggers installation of the EXACT pinned
            # toolchain (lean/lean-toolchain); some failures originate here.
            if "$HOME/.elan/bin/lean" --version &&
               "$HOME/.elan/bin/lake" --version; then
              ready=1
              break
            fi
            echo "::warning::pinned Lean toolchain download failed, attempt ${attempt}/6"
            sleep "$((attempt * 8))"
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::pinned Lean installation unavailable after six attempts"
            exit 1
          fi

      - name: Generate Lake manifest for existing pinned Mathlib
        working-directory: lean
        run: lake update

      - name: Fetch Mathlib build artifacts
        working-directory: lean
        run: lake exe cache get

      # All Lake builds inherit weakLeanArgs = ["-M16768"] from
      # lean/lakefile.toml. Direct lake env lean invocations below
      # receive the same flag explicitly.
      - name: Check per-process Lean -M16768 option
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 --version

      - name: Certify Gaussian area diagonal monomials and angular Fourier modes
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GaussianAreaNormalization GegenbauerFock.GaussianAreaMonomialNorm GegenbauerFock.GaussianAreaAngularOrthogonality GegenbauerFock.GaussianAreaPolarAngularOrthogonality GegenbauerFock.GaussianAreaPolarProductOrthogonality GegenbauerFock.GaussianAreaPolarMixedPullback GegenbauerFock.GaussianAreaPlanarFactorizationBridge GegenbauerFock.GaussianAreaPolarAngularAlgebra GegenbauerFock.GaussianAreaFullMonomialOrthogonality GegenbauerFock.GaussianAreaNormalizedMonomialGram GegenbauerFock.GaussianAreaRadialIntegrability GegenbauerFock.GaussianAreaPolarProductIntegrability GegenbauerFock.GaussianAreaMixedPullbackIntegrability GegenbauerFock.GaussianAreaComplexMonomialGram GegenbauerFock.GaussianAreaPlanarIntegrabilityTransfer GegenbauerFock.GaussianAreaNormalizedBasis GegenbauerFock.GaussianAreaFiniteMonomialGramIsometry GegenbauerFock.GaussianAreaMonomialL2Integrability GegenbauerFock.GaussianAreaWeightedMonomialL2 GegenbauerFock.GaussianAreaActualL2Vectors GegenbauerFock.GaussianAreaL2Orthonormality GegenbauerFock.GaussianAreaTrueL2OrthonormalFamily GegenbauerFock.GaussianAreaCoefficientSynthesisL2 GegenbauerFock.GaussianAreaCoefficientSynthesisClosedRange GegenbauerFock.GaussianAreaCoefficientRecovery GegenbauerFock.GaussianAreaPolynomialClosureEquiv GegenbauerFock.GaussianAreaEntireL2Submodule GegenbauerFock.GaussianAreaPolynomialOrthogonalCriterion GegenbauerFock.GaussianAreaEntireRepresentativeUniqueness GegenbauerFock.GaussianAreaIntrinsicEntireEvaluation GegenbauerFock.GaussianAreaIntrinsicMonomialEvaluation GegenbauerFock.GaussianAreaCoefficientAnalysisAdjoint GegenbauerFock.GaussianAreaPolynomialProjector GegenbauerFock.GaussianAreaPolynomialParseval GegenbauerFock.GaussianAreaProjectedPointEvaluation GegenbauerFock.GaussianAreaFinitePolynomialEvaluation GegenbauerFock.GaussianAreaCoherentSeriesHasSum GegenbauerFock.GaussianAreaCoherentSeriesAe GegenbauerFock.GaussianAreaCoherentIntrinsicAgreement GegenbauerFock.GaussianAreaIntrinsicResidualCriterion GegenbauerFock.GaussianAreaReproducingCriterion GegenbauerFock.GaussianAreaTaylorUniqueness GegenbauerFock.GaussianAreaEntireCircleMean GegenbauerFock.GaussianAreaEntireCircularTaylor GegenbauerFock.GaussianAreaEntireAngularMoments GegenbauerFock.GaussianAreaAngularMomentUniqueness 2>&1 | tee /tmp/v007-gaussian-area.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-gaussian-area.log; then
            echo "::error::Nonstandard axiom in Gaussian-area certificate."
            exit 1
          fi
          echo 'Gaussian area normalization: no forbidden axioms.'
