name: V007 real nuclear S1 bounded-right and two-sided ideal estimates

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/RealNuclearBoundedRightIdeal.lean'
      - 'lean/GegenbauerFock/RealNuclearBoundedLeftIdeal.lean'
      - '.github/workflows/v007-real-nuclear-bounded-right-two-sided.yml'
  workflow_dispatch:

jobs:
  nuclear-bounded-right-two-sided:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then exit 0; fi
            sleep "$((attempt * 8))"
          done
          exit 1
      - name: Prepare pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Certify bounded-right and two-sided nuclear ideal cost estimates
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealNuclearBoundedRightIdeal 2>&1 | tee /tmp/v007-real-bounded-right-two-sided.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-bounded-right-two-sided.log; then
            echo '::error::Nonstandard axiom in real bounded-right and two-sided nuclear ideal proof.'
            exit 1
          fi
          for theorem in realNuclearBoundedRightCLM_rankOne RealNuclearCosts.bounded_right HasRealNuclearRankOneSeries.bounded_right RealNuclearCosts.bounded_two_sided HasRealNuclearRankOneSeries.bounded_two_sided; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-real-bounded-right-two-sided.log
          done
          echo 'Real nuclear bounded-right and two-sided ideal estimates kernel-certified.'
