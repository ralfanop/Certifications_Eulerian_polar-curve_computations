name: "Priority 3 — weighted uniform CFC S1 Fredholm extension"

on:
  push:
    branches:
      - manuscript14-priority3-weighted-uniform-extension-20261111
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3WeightedUniformExtension.lean'
      - '.github/workflows/manuscript14-priority3-weighted-uniform-extension.yml'
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3WeightedUniformExtension.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3UniversalNuclearDensity.lean'
      - '.github/workflows/manuscript14-priority3-weighted-uniform-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Weighted uniform extension to all CFC S1 — three kernel audits
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build true CFC-S1 and Hilbert-Schmidt prerequisite modules
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealComplexPositiveSpectralAutomaticTraceClassBridge GegenbauerFock.PositiveTraceDiagonalSpectralBridge GegenbauerFock.PhyslibTraceClassSandwichContinuous GegenbauerFock.PhyslibTraceClassSeriesTailEstimate GegenbauerFock.PhyslibTraceClassHSFactorization GegenbauerFock.PhyslibHilbertSchmidtAdditive GegenbauerFock.PhyslibTraceClassOperatorEmbedding
      - name: Compile complete finite rank-one nuclear density chain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          for f in DirichletFiniteDeterminant Section67ScalarCertificate V14119Priority3SpectralDetBridge V14119Priority3DirichletDiagonal V14119Priority3TraceClassModel V14119Priority3RankOneS1 V14119Priority3S1Truncation V14119Priority3OperatorCompression V14119Priority3PositiveDiagonalFredholm V14119Priority3FredholmSectorFunctional V14119Priority3ComplexDiagonalS1 V14119Priority3ArbitraryNuclearRankOne V14119Priority3UniversalNuclearDensity; do
            lake env lean -M16768 -o ".lake/build/lib/lean/SpecialImaginaryPoint/$f.olean" \
              "SpecialImaginaryPoint/$f.lean"
          done
      - name: Compile certified continuous uniqueness dependency
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/V14119Priority3UniversalContinuousUniqueness.olean \
            SpecialImaginaryPoint/V14119Priority3UniversalContinuousUniqueness.lean
      - name: Compile certified dense uniform extension prerequisite
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/V14119Priority3DenseUniformExtension.olean \
            SpecialImaginaryPoint/V14119Priority3DenseUniformExtension.lean
      - name: Compile weighted conditional extension of finite nuclear functional
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -M16768 \
            SpecialImaginaryPoint/V14119Priority3WeightedUniformExtension.lean 2>&1 | tee /tmp/p3-weighted-extension.log
      - name: Audit three weighted extension theorem declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          log=pathlib.Path("/tmp/p3-weighted-extension.log").read_text()
          prefix="Manuscript14Priority3.WeightedUniformExtension."
          names=[
            "restoreFiniteFunctional_continuous",
            "restoreFiniteFunctional_eq",
            "continuous_extension_of_weighted_uniform",
          ]
          reports={}
          for m in re.finditer(r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms",log,re.MULTILINE):
            reports[m.group(1) or m.group(3)]={x.strip() for x in (m.group(2) or "").split(",") if x.strip()}
          allowed={"propext","Quot.sound","Classical.choice"}
          for suffix in names:
            n=prefix+suffix
            assert n in reports, f"Missing audit for {n}"
            assert reports[n] <= allowed, f"Nonstandard axiom: {n}: {reports[n]-allowed}"
            print(n, sorted(reports[n]))
          assert "sorryAx" not in log and "Lean.ofReduceBool" not in log
          assert not re.search(r"\.lean:\d+:\d+: error",log)
          print("SUCCESS: weighted conditional CFC-S1 extension and uniqueness")
          PY
      - name: Upload Lean log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priority3-weighted-uniform-extension-log
          path: /tmp/p3-weighted-extension.log
          if-no-files-found: ignore
