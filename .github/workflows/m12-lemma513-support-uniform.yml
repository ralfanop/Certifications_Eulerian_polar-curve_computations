name: M12 Lemma 5.13 closed support and uniform constants
on:
  pull_request:
    paths:
      - 'lean/EulerianGrothendieck/UniformLanczos/Lemma513SupportUniform.lean'
      - 'lean/EulerianGrothendieck/UniformLanczos/Lemma513ActualGM.lean'
      - '.github/workflows/m12-lemma513-support-uniform.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  support-uniform:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore pinned Lean 4
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile actual support and uniform-tail assembly
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.24.0'
          for f in UniformLanczos/Lemma513ActualGM.lean UniformLanczos/Lemma513SupportUniform.lean; do
            ! grep -n -E '^\s*(axiom|opaque)\b|\b(sorry|admit|native_decide)\b' "$f"
          done
          lake exe cache get
          lake build UniformLanczos.Lemma513ActualGM 2>&1 | tee /tmp/m12-support-uniform-build.log
          lake env lean UniformLanczos/Lemma513SupportUniform.lean 2>&1 | tee /tmp/m12-support-uniform.log
      - name: Strict support-uniform axiom audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/m12-support-uniform.log').read_text()
          assert not re.search(r'(^|\n).*: error:',s)
          assert 'sorryAx' not in s and 'Lean.ofReduceBool' not in s
          names=["actual_gM_zero_closed_outside","actual_deriv_zero_closed_outside","weighted_log_deriv_global","second_tail_closed_support","original_signed_closed_tails","weighted_integrand_continuous","continuous_supported_integrable","support_tail_split","uniform_scale_previous","square_supported_integrable","tailMass_mono","first_tail_half_bounds","global_weighted_tail","uniform_actual_two_tails"]
          for suffix in names:
              name='UniformLanczos.Lemma513SupportUniform.'+suffix
              match=re.search(r"'"+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]",s)
              if match: a={x.strip() for x in match.group(1).split(',') if x.strip()}
              else:
                  assert "'"+name+"' does not depend on any axioms" in s,name
                  a=set()
              assert a <= {'propext','Classical.choice','Quot.sound'},(name,a)
              print('AUDIT',name,sorted(a))
          print('M12 CLOSED SUPPORT UNIFORM TAILS SUCCESS',len(names))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-support-uniform
          path: |
            /tmp/m12-support-uniform-build.log
            /tmp/m12-support-uniform.log
