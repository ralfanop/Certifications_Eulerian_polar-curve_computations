name: M16 post-merge exact audit of #659
on:
  pull_request:
    paths:
      - '.github/workflows/m16-post-merge-659-20261127.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fb42433d2430eb0f62719bcd9c406c6631cce263
      - name: Pinned Lean 4 toolchain and Mathlib
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fb42433d2430eb0f62719bcd9c406c6631cce263"
          git rev-parse HEAD | tee /tmp/m16-rbs-head.log
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          grep -F '0272bbe1c093d038d7257ab15306abd58245f9ff' lakefile.toml
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
          lake env lean --version | tee -a /tmp/m16-rbs-head.log
      - name: Compile the 8 imported modules and the new module, audit every declaration
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          SRC=Manuscript16/RobinDirichletBoundState20261127
          DEPS="Manuscript16/RobinDirichletRankOne20261125 Manuscript16/RobinDirichletL2Bounded20261125 Manuscript16/RobinDirichletPositive20261125 Manuscript16/RobinDirichletInjective20261125 Manuscript16/RobinDirichletWeakResolvent20261125 Manuscript16/RobinDirichletRealisation20261125 Manuscript16/RobinDirichletPole20261125 Manuscript16/RobinDirichletLevelIndependence20261126"
          mkdir -p .lake/build/lib/lean/Manuscript16
          for m in $DEPS $SRC; do
            if grep -nE '\bsorry\b|\badmit\b|^\s*axiom\b|\bunsafe\b|implemented_by|extern' "$m.lean"; then exit 1; fi
          done
          for m in $DEPS; do
            lake env lean -M16768 -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 | tee "/tmp/m16-rbs-dep-$(basename $m).log"
            if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' "/tmp/m16-rbs-dep-$(basename $m).log"; then exit 1; fi
          done
          lake env lean -M16768 -o ".lake/build/lib/lean/$SRC.olean" "$SRC.lean" 2>&1 | tee /tmp/m16-rbs-lean.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|warning:|declaration uses .sorry.|Try this' /tmp/m16-rbs-lean.log; then exit 1; fi
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          # Line-based parser: a report starts with a quoted name (primes allowed) at the start of a
          # line; its axiom list may wrap over several lines and ends at the first ']'.
          start = re.compile(r"^'(\S+)' (depends on axioms: \[|does not depend on any axioms)")
          def parse(text):
              lines = text.split('\n')
              out, wrapped, i = [], 0, 0
              while i < len(lines):
                  m = start.match(lines[i])
                  if not m:
                      i += 1
                      continue
                  name = m.group(1)
                  if m.group(2).startswith('does not'):
                      out.append((name, []))
                      i += 1
                      continue
                  body = lines[i][m.end():]
                  j = i
                  while ']' not in body:
                      j += 1
                      body += ' ' + lines[j].strip()
                  wrapped += j > i
                  out.append((name, sorted({x.strip() for x in body.split(']')[0].split(',') if x.strip()})))
                  i = j + 1
              return out, wrapped
          deps, dep_wrapped = {}, 0
          for p in sorted(Path('/tmp').glob('m16-rbs-dep-*.log')):
              text = p.read_text()
              found, w = parse(text)
              n_marks = len(re.findall(r"' depends on axioms: \[", text)) + len(re.findall(r"' does not depend on any axioms", text))
              assert len(found) == n_marks, (p.name, len(found), n_marks)
              dep_wrapped += w
              for name, axioms in found:
                  assert set(axioms) <= allowed, (p.name, name, axioms)
                  deps[name] = axioms
          assert len(deps) == 296, len(deps)
          src = Path('Manuscript16/RobinDirichletBoundState20261127.lean')
          log = Path('/tmp/m16-rbs-lean.log').read_text()
          requested = re.findall(r'^#print axioms (\S+)', src.read_text(), re.M)
          assert len(requested) == 22 and len(set(requested)) == 22, requested
          found, own_wrapped = parse(log)
          own = dict(found)
          assert len(found) == 22 and set(own) == set(requested), (len(found), sorted(set(requested) ^ set(own)))
          for name in requested:
              assert set(own[name]) <= allowed, (name, own[name])
              print('AXIOM AUDIT SUCCESS:', name, own[name])
          out = {
              'head': Path('/tmp/m16-rbs-head.log').read_text().split()[0],
              'source_sha256': hashlib.sha256(src.read_bytes()).hexdigest(),
              'olean_sha256': hashlib.sha256(Path('.lake/build/lib/lean/Manuscript16/RobinDirichletBoundState20261127.olean').read_bytes()).hexdigest(),
              'log_sha256': hashlib.sha256(log.encode()).hexdigest(),
              'axioms': own,
              'wrapped_lists': own_wrapped,
              'imported_module_axioms': deps,
              'imported_wrapped_lists': dep_wrapped,
          }
          Path('/tmp/m16-rbs-audit.json').write_text(json.dumps(out, indent=2) + '\n')
          print('SUCCESS:', len(own), 'declarations (', own_wrapped, 'wrapped lists ) and', len(deps), 'imported reports (', dep_wrapped, 'wrapped lists ); standard axioms only')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m16-robin-bound-state-audit
          path: |
            /tmp/m16-rbs-*.log
            /tmp/m16-rbs-audit.json
