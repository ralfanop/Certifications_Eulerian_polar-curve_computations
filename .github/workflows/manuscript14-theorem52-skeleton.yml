name: Manuscript 14 Theorem 5.2 — Lean 4 certificate (domain-level commutation)

# Theorem 5.2 of manuscript 14 (domain-level commutation of the Legendre-Gram
# operator with A_c = D - c^2 M_{u^2}): the module is compiled against the
# pinned Mathlib and the GegenbauerFock library, and the job fails on any
# compile error, on any `sorry`, and on the axioms sorryAx / Lean.ofReduceBool.
# The audit must show only propext, Classical.choice and Quot.sound.

on:
  push:
    branches:
      - manuscript14-theorem52-skeleton-20261106
    paths:
      - 'lean/SpecialImaginaryPoint/GramCommutationTheorem52.lean'
      - 'lean/SpecialImaginaryPoint/GramKernelBispectral.lean'
      - '.github/workflows/manuscript14-theorem52-skeleton.yml'
  workflow_dispatch:

jobs:
  lean:
    name: Lean 4 kernel check of Theorem 5.2
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install repository-pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Retrieve pinned Mathlib cache
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build the GegenbauerFock modules imported by the skeleton
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GramIntegralComplete GegenbauerFock.UltrasphericalSturmLiouvillePolynomialCore GegenbauerFock.UltrasphericalSturmLiouvilleMonicRealL2Nonzero GegenbauerFock.UltrasphericalLegendreDensityExact GegenbauerFock.OutputComplexHolomorphy GegenbauerFock.UltrasphericalContinuousDensity 2>&1 | tail -n 40
      - name: Kernel-check Theorem 5.2 and audit its axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/GramKernelBispectral.olean \
            SpecialImaginaryPoint/GramKernelBispectral.lean 2>&1 | tee /tmp/theorem52-skeleton.log
          lake env lean -M16768 SpecialImaginaryPoint/GramCommutationTheorem52.lean 2>&1 | tee -a /tmp/theorem52-skeleton.log
          if grep -nE '^[^ ]+:[0-9]+:[0-9]+: error' /tmp/theorem52-skeleton.log; then
            echo '::error::Compile error in the Theorem 5.2 skeleton'
            exit 1
          fi
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' -e 'declaration uses' /tmp/theorem52-skeleton.log; then
            echo '::error::Forbidden axiom or sorry in the Theorem 5.2 certificate'
            exit 1
          fi
          echo 'Theorem 5.2: no sorry, no sorryAx, no Lean.ofReduceBool'
      - name: Upload Lean log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript14-theorem52-skeleton-lean
          path: /tmp/theorem52-skeleton.log
          if-no-files-found: ignore
