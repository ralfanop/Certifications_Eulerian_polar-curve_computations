name: Manuscript 14 — Lindemann upstream compatibility certificate

on:
  push:
    branches:
      - manuscript14-lindemann-pr28013-experiment-20261104
    paths:
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/SpecialImaginaryPoint/HermiteLindemannPrExperiment.lean'
      - 'lean/SpecialImaginaryPoint/HermiteEulerianCompleteExperiment.lean'
      - 'lean/SpecialImaginaryPoint/ParryThresholds.lean'
      - 'lean/SpecialImaginaryPoint/EulerianAnalyticBracket.lean'
      - 'lean/SpecialImaginaryPoint/PeriodicOrbitAlgebraicity.lean'
      - 'lean/SpecialImaginaryPoint/EulerianTranscendenceReduction.lean'
      - '.github/workflows/manuscript14-lindemann-port.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manuscript14-lindemann-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Retrieve pinned Mathlib
        working-directory: lean
        run: |
          lake update
          lake exe cache get
      - name: Kernel-check Hermite Lindemann PR #28013 theorem and axiom audit
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          lake env lean -M16768 -T1000000 -o .lake/build/lib/lean/SpecialImaginaryPoint/ParryThresholds.olean SpecialImaginaryPoint/ParryThresholds.lean 2>&1 | tee /tmp/manuscript14-lindemann.log
          lake env lean -M16768 -T1000000 -o .lake/build/lib/lean/SpecialImaginaryPoint/EulerianAnalyticBracket.olean SpecialImaginaryPoint/EulerianAnalyticBracket.lean 2>&1 | tee -a /tmp/manuscript14-lindemann.log
          lake env lean -M16768 -T1000000 -o .lake/build/lib/lean/SpecialImaginaryPoint/PeriodicOrbitAlgebraicity.olean SpecialImaginaryPoint/PeriodicOrbitAlgebraicity.lean 2>&1 | tee -a /tmp/manuscript14-lindemann.log
          lake env lean -M16768 -T1000000 -o .lake/build/lib/lean/SpecialImaginaryPoint/EulerianTranscendenceReduction.olean SpecialImaginaryPoint/EulerianTranscendenceReduction.lean 2>&1 | tee -a /tmp/manuscript14-lindemann.log
          lake env lean -M16768 -T1000000 -o .lake/build/lib/lean/SpecialImaginaryPoint/HermiteLindemannPrExperiment.olean SpecialImaginaryPoint/HermiteLindemannPrExperiment.lean 2>&1 | tee -a /tmp/manuscript14-lindemann.log
          lake env lean -M16768 -T1000000 SpecialImaginaryPoint/HermiteEulerianCompleteExperiment.lean 2>&1 | tee -a /tmp/manuscript14-lindemann.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/manuscript14-lindemann.log; then
            echo "::error::Forbidden Lean axiom present"
            exit 1
          fi
      - name: Upload compilation and axiom log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript14-lindemann-lean-log
          path: /tmp/manuscript14-lindemann.log
          if-no-files-found: ignore
