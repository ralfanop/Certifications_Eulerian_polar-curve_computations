name: Manuscript 14 — Lindemann upstream compatibility certificate

on:
  push:
    branches:
      - manuscript14-section11-parry-cert-20261103
    paths:
      - 'lean/SpecialImaginaryPoint/UpstreamLindemannAlgebraicPart.lean'
      - 'lean/SpecialImaginaryPoint/UpstreamLindemannBasic.lean'
      - 'lean/SpecialImaginaryPoint/HermiteEulerianSpecial.lean'
      - '.github/workflows/manuscript14-lindemann-port.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manuscript14-lindemann-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Retrieve pinned Mathlib
        working-directory: lean
        run: |
          lake update
          lake exe cache get
      - name: Kernel-check Apache-2.0 upstream Lindemann modules
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/UpstreamLindemannAlgebraicPart.olean SpecialImaginaryPoint/UpstreamLindemannAlgebraicPart.lean 2>&1 | tee /tmp/manuscript14-lindemann.log
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/UpstreamLindemannBasic.olean SpecialImaginaryPoint/UpstreamLindemannBasic.lean 2>&1 | tee -a /tmp/manuscript14-lindemann.log
          if test -f SpecialImaginaryPoint/HermiteEulerianSpecial.lean; then
            lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/ParryThresholds.olean SpecialImaginaryPoint/ParryThresholds.lean 2>&1 | tee -a /tmp/manuscript14-lindemann.log
            lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/EulerianAnalyticBracket.olean SpecialImaginaryPoint/EulerianAnalyticBracket.lean 2>&1 | tee -a /tmp/manuscript14-lindemann.log
            lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/PeriodicOrbitAlgebraicity.olean SpecialImaginaryPoint/PeriodicOrbitAlgebraicity.lean 2>&1 | tee -a /tmp/manuscript14-lindemann.log
            lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/EulerianTranscendenceReduction.olean SpecialImaginaryPoint/EulerianTranscendenceReduction.lean 2>&1 | tee -a /tmp/manuscript14-lindemann.log
            lake env lean -M16768 SpecialImaginaryPoint/HermiteEulerianSpecial.lean 2>&1 | tee -a /tmp/manuscript14-lindemann.log
          fi
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/manuscript14-lindemann.log; then
            echo "::error::Forbidden Lean axiom present"
            exit 1
          fi
      - name: Upload compilation and axiom log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript14-lindemann-lean-log
          path: /tmp/manuscript14-lindemann.log
          if-no-files-found: ignore
