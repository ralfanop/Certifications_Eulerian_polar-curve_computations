name: M12 Theorem514 proof components
on:
  pull_request:
    paths:
      - 'lean/EulerianGrothendieck/UniformLanczos/Theorem514.lean'
      - 'lean/EulerianGrothendieck/UniformLanczos/Lemma51[123].lean'
      - '.github/workflows/m12-theorem514.yml'
  workflow_dispatch:

jobs:
  theorem514:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Source hygiene
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          f=UniformLanczos/Theorem514.lean
          ! grep -n -E '^\s*(axiom|opaque)\b' "$f"
          ! grep -n -w -E 'sorry|admit|native_decide' "$f"
      - name: Build prerequisites and check Theorem514.lean
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          lean --version
          lake exe cache get
          lake build UniformLanczos.Lemma511 UniformLanczos.Lemma512 UniformLanczos.Lemma513 2>&1 | tee /tmp/m12-theorem514-build.log
          lake env lean UniformLanczos/Theorem514.lean 2>&1 | tee /tmp/m12-theorem514.log
          lake build UniformLanczos.Theorem514
          git rev-parse HEAD
      - name: Strict individual axiom audit
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          text = Path('/tmp/m12-theorem514.log').read_text()
          assert ': error' not in text, 'compilation error'
          assert "declaration uses 'sorry'" not in text
          assert 'sorryAx' not in text and 'Lean.ofReduceBool' not in text
          names = ['UniformLanczos.Theorem514.' + n for n in (
              'weighted_energy', 'square_rate_transfer', 'beta_rate_of_sqrt_rate')]
          for name in names:
              match = re.search(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", text)
              if match:
                  axioms = {x.strip() for x in match.group(1).split(',') if x.strip()}
              else:
                  assert "'" + name + "' does not depend on any axioms" in text, name
                  axioms = set()
              assert axioms <= allowed, (name, axioms)
              print('AXIOM AUDIT SUCCESS', name, sorted(axioms))
          print('AUDITED', len(names))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-theorem514-audit
          path: |
            /tmp/m12-theorem514-build.log
            /tmp/m12-theorem514.log
