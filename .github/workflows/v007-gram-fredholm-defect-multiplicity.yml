name: V007 bilateral Gram Fredholm nullity and range defect multiplicity
on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/TwoSidedGramFredholmDefectMultiplicity.lean'
      - 'lean/GegenbauerFock/TwoSidedGramFredholmNullityDefect.lean'
      - 'lean/GegenbauerFock/TwoSidedGramNonzeroFredholmIndexZero.lean'
      - '.github/workflows/v007-gram-fredholm-defect-multiplicity.yml'
  workflow_dispatch:

# Keep the current expensive Lean audit running; GitHub may supersede obsolete
# queued builds without interrupting a kernel check already underway.
concurrency:
  group: v007-fredholm-defect-multiplicity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bilateral-fredholm-defect-multiplicity:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then break; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep "$((attempt * 8))"
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then break; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep "$((attempt * 8))"
          done
      - name: Prepare pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-check equal bilateral nonzero shift range defects and audit axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.TwoSidedGramFredholmDefectMultiplicity 2>&1 | tee /tmp/v007-defect-multiplicity.log
          for theorem in continuousGramShift_kernel_eq_eigenspace two_sided_nonzero_gram_shift_kernel_finrank_eq two_sided_nonzero_gram_shift_range_defects_equal sourceGram_nonzero_shift_defect_eq_eigenspace_finrank outputGram_nonzero_shift_defect_eq_eigenspace_finrank; do
            grep -qF "${theorem}' depends on axioms" /tmp/v007-defect-multiplicity.log
          done
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-defect-multiplicity.log; then
            echo '::error::Forbidden axiom in bilateral Gram Fredholm defect equality'
            exit 1
          fi
          echo 'V007 bilateral Fredholm range defects and nonzero eigenspace multiplicities: kernel-audited.'
