name: "Manuscript 15 — Fredholm–Langevin special scalars Arb 10000-bit"
on:
  push:
    branches:
      - draft/m15-fredholm-langevin-special-arb10000-20261112
    paths:
      - 'numerics/manuscript15_fredholm_langevin_special_arb10000.py'
      - '.github/workflows/manuscript15-fredholm-langevin-special-arb10000.yml'
  pull_request:
    paths:
      - 'numerics/manuscript15_fredholm_langevin_special_arb10000.py'
      - '.github/workflows/manuscript15-fredholm-langevin-special-arb10000.yml'
  workflow_dispatch:

jobs:
  arb10000:
    name: Strict 8182-bit certified interval accuracy for Fredholm-Langevin special scalars
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Arb Python bindings
        run: python -m pip install 'python-flint==0.9.0'
      - name: Syntax check
        run: python -m py_compile numerics/manuscript15_fredholm_langevin_special_arb10000.py
      - name: Verify outward balls, certified relative bits, strict signs and consistency checks
        shell: bash
        run: |
          set -euo pipefail
          python numerics/manuscript15_fredholm_langevin_special_arb10000.py 2>&1 | tee /tmp/manuscript15-fredholm-langevin-arb10000.log
          grep -F "SUCCESS: twelve rigorous nonzero interval values" /tmp/manuscript15-fredholm-langevin-arb10000.log
      - name: Archive complete interval certification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript15-fredholm-langevin-arb10000
          path: /tmp/manuscript15-fredholm-langevin-arb10000.log
          if-no-files-found: ignore
