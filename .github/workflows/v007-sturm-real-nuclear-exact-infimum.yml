name: V007 real Schatten S1 exact Sturm nuclear norm

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventRealNuclearExactInfimum.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventRealNuclearFiniteSumDual.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventRealNuclearFiniteDual.lean'
      - '.github/workflows/v007-sturm-real-nuclear-exact-infimum.yml'
  workflow_dispatch:

jobs:
  real-nuclear-exact-infimum:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Prove exact real nuclear infimum and axiom audit
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleResolventRealNuclearExactInfimum 2>&1 | tee /tmp/v007-real-nuclear-exact.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-nuclear-exact.log; then
            echo '::error::Nonstandard axiom in exact real S1 norm.'
            exit 1
          fi
          for theorem in realHilbertFiniteTrace_rankOne_tsum_abs_le realHilbertFiniteTrace_le_all_realNuclearCosts sturmRealClosedResolvent_spectralTrace_le_all_nuclearCosts sturmRealClosedResolvent_realNuclearInfimum_eq_spectralTrace; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-real-nuclear-exact.log
          done
          echo 'Exact real nuclear norm kernel-certified.'
