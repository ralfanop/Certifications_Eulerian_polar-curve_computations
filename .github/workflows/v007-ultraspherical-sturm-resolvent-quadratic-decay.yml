name: V007 quadratic decay of genuine Sturm resolvent eigenmode norms

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventQuadraticDecay.lean'
      - '.github/workflows/v007-ultraspherical-sturm-resolvent-quadratic-decay.yml'
  workflow_dispatch:

jobs:
  resolvent-quadratic-decay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then exit 0; fi
            sleep "$((attempt * 8))"
          done
          exit 1
      - name: Prepare exact Mathlib dependencies
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Certify exact quadratic modewise decay of closed Sturm resolvent
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleResolventQuadraticDecay 2>&1 | tee /tmp/gf-resolvent-quadratic-decay.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleResolventQuadraticDecay.lean 2>&1 | tee /tmp/gf-resolvent-multiplier-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/gf-resolvent-quadratic-decay.log /tmp/gf-resolvent-multiplier-axioms.log; then
            echo '::error::Nonstandard axiom in resolvent multiplier decay.'
            exit 1
          fi
          for theorem in sturmResolventMultiplier_le_inv_degree_sq sturmRealPositiveResolvent_normalized_mode_quadratic_decay; do
            grep -F "${theorem}' depends on axioms:" /tmp/gf-resolvent-multiplier-axioms.log
          done
          echo 'V007 exact normalized Gegenbauer resolvent modewise quadratic decay kernel-certified.'
