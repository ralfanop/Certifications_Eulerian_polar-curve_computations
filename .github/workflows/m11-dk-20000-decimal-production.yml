          printf '%s\n' "$M11_PRODUCER_HEAD" > result/producer-head.txt
          (cd result && sha256sum coefficients.gz > sha256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: m11-newton-${{ matrix.direction }}-${{ matrix.kind }}-4096
          path: result/
