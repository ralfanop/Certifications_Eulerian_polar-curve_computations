          test "$(gh api repos/${{ github.repository }}/actions/runs/45357327165 --jq .head_sha)" = 59d9884b7346b4e3296336be56f3bb702f1b2686
      - uses: actions/download-artifact@v4
        with:
          run-id: 45357327165
          github-token: ${{ github.token }}
          name: m11-length-130k-curvature-chart-certified
          path: length
      - name: Validate length and pin FLINT
        run: |
          (cd length && sha256sum -c combined-130k-sha256.txt)
          python -m pip install python-flint==0.9.0
      - uses: actions/download-artifact@v4
        with:
          name: m11-newton-${{ matrix.direction }}-${{ matrix.kind }}-2048
          path: previous
      - name: Check exact previous coefficient artifact
        run: |
          test "$(cat previous/producer-head.txt)" = "${{ github.event.pull_request.head.sha || github.sha }}"
