name: M11 curvature 30000 fractional decimal production
on:
  pull_request:
    paths:
      - '.github/workflows/m11-dk-20000-decimal-production.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  halves:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        direction: [1,-1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify length provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${{ github.repository }}/actions/runs/45357327165 --jq .conclusion)" = success
          test "$(gh api repos/${{ github.repository }}/actions/runs/45357327165 --jq .head_sha)" = 59d9884b7346b4e3296336be56f3bb702f1b2686
      - uses: actions/download-artifact@v4
        with:
          run-id: 45357327165
          github-token: ${{ github.token }}
          name: m11-length-130k-curvature-chart-certified
          path: length
      - run: |
          cd length
          sha256sum -c combined-130k-sha256.txt
          python -m pip install python-flint==0.9.0
      - name: Integrate first checkpoint
        run: |
          python -u numerics/arb/m11_dk_adaptive_radius.py --bits 150000 --target 100100 --panels 128 --direction ${{ matrix.direction }} --certified-length-manifest length/m11-length-130k-curvature-chart.json --stop-after 2 --output checkpoint-2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m11-dk-30k-first-checkpoint-${{ matrix.direction }}
          path: checkpoint-2.json
      - name: Continue with exact checkpoints
        run: |
          set -euo pipefail
          prev=checkpoint-2.json
          for n in 8 16 24 32 40 48 56 64; do
            python -u numerics/arb/m11_dk_adaptive_radius.py --bits 150000 --target 100100 --panels 128 --direction ${{ matrix.direction }} --certified-length-manifest length/m11-length-130k-curvature-chart.json --resume "$prev" --stop-after "$n" --output "checkpoint-$n.json"
            prev="checkpoint-$n.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m11-dk-30k-half-${{ matrix.direction }}
          path: checkpoint-*.json
  audit:
    needs: halves
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-flint==0.9.0
      - uses: actions/download-artifact@v4
        with:
          pattern: m11-dk-30k-half-*
          path: halves
      - uses: actions/download-artifact@v4
        with:
          run-id: 45357327165
          github-token: ${{ github.token }}
          name: m11-length-130k-curvature-chart-certified
          path: length
      - run: |
          python -u numerics/arb/m11_dk_adaptive_radius.py --bits 150000 --target 100100 --panels 128 --combine halves/m11-dk-30k-half-1/checkpoint-64.json halves/m11-dk-30k-half--1/checkpoint-64.json --output combined.json
          python -u numerics/arb/m11_30000_curvature_final_verify.py --combined combined.json --positive-half halves/m11-dk-30k-half-1/checkpoint-64.json --negative-half halves/m11-dk-30k-half--1/checkpoint-64.json --length-manifest length/m11-length-130k-curvature-chart.json --length-run-id 45357327165 --length-source-head 59d9884b7346b4e3296336be56f3bb702f1b2686 --producer-head "$(git rev-parse HEAD)" --output certified.json
      - uses: actions/upload-artifact@v4
        with:
          name: m11-dk-30000-final
          path: |
            combined.json
            certified.json
