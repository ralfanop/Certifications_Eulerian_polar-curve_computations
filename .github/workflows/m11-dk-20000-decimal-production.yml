          python -c 'import json; m=json.load(open("result/checkpoint.json")); assert m["parameters"]=={"bits":60000,"target":34000,"panels":128}; assert m["checkpoint"]["direction"]==${{ matrix.direction }} and m["checkpoint"]["next_panel"]==1 and len(m["checkpoint"]["orders"])==1 '
