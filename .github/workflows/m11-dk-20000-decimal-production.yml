name: M11 curvature 10000 fractional decimal production
on:
  pull_request:
    paths:
      - '.github/workflows/m11-dk-20000-decimal-production.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: m11-dk-10k-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  newton_smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install python-flint==0.9.0
          python -m py_compile numerics/arb/m11_dk_newton_checkpoint.py numerics/arb/m11_dk_ode.py numerics/arb/m11_dk_continuation.py
          python -u numerics/arb/m11_dk_newton_checkpoint.py --smoke
  newton_2048:
    name: "Newton 2048 direction ${{ matrix.direction }} curve ${{ matrix.kind }}"
    needs: newton_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        direction: [1, -1]
        kind: [E, L]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin source and length provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(gh api repos/${{ github.repository }}/actions/runs/45357327165 --jq .conclusion)" = success
          test "$(gh api repos/${{ github.repository }}/actions/runs/45357327165 --jq .head_sha)" = 59d9884b7346b4e3296336be56f3bb702f1b2686
      - uses: actions/download-artifact@v4
        with:
          run-id: 45357327165
          github-token: ${{ github.token }}
          name: m11-length-130k-curvature-chart-certified
          path: length
      - name: Validate length and pin FLINT
        run: |
          (cd length && sha256sum -c combined-130k-sha256.txt)
          python -m pip install python-flint==0.9.0
      - name: Continue one curve to order 2048
        env:
          M11_PRODUCER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p result
          /usr/bin/time -v python -u numerics/arb/m11_dk_newton_checkpoint.py --bits 60000 --target 34000 --panels 128 --length length/m11-length-130k-curvature-chart.json --direction ${{ matrix.direction }} --kind ${{ matrix.kind }} --degree 2048 --output result/coefficients.gz 2>&1 | tee result/production.log
          printf '%s\n' "$M11_PRODUCER_HEAD" > result/producer-head.txt
          (cd result && sha256sum coefficients.gz > sha256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: m11-newton-${{ matrix.direction }}-${{ matrix.kind }}-2048
          path: result/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
  newton_4096:
    name: "Newton 4096 direction ${{ matrix.direction }} curve ${{ matrix.kind }}"
    needs: newton_2048
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
