name: "M11 Dkappa 20,000 decimals — rigorous production (cached historical length)"
on:
  push:
    branches:
      - 'draft/m11-dk-20000-decimal-production-20261123'
    paths:
      - '.github/workflows/m11-dk-20000-decimal-production.yml'
  pull_request:
    paths:
      - '.github/workflows/m11-dk-20000-decimal-production.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: m11-dk-20k-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  halves:
    name: "Certified 70k-bit curvature half ${{ matrix.direction }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        direction: [1, -1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source and historical successful runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(gh api "repos/$REPO/actions/runs/44359739062" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/runs/44359739062" --jq .head_sha)" = 6ddb354a85832bf5b35538996d7d619c63ac9a16
          test "$(gh api "repos/$REPO/actions/runs/45179196734" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/runs/45183766473" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/runs/45184373077" --jq .conclusion)" = success
      - uses: actions/download-artifact@v4
        with:
          run-id: 44359739062
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          name: m11-euler-panel-certified-100k
          path: historical-length
      - name: Pin historical length bytes and FLINT
        run: |
          set -euo pipefail
          echo 'a606d305f7d4c773695cee61cf56268022ec9cc5525f689f301e8822f22fe7b5  historical-length/m11-euler-panel-100k.json' | sha256sum --check
          python -m pip install 'python-flint==0.9.0'
      - name: Produce 64 panels in eight resumable exact-rational batches
        shell: bash
        env:
          DIRECTION: ${{ matrix.direction }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p checkpoints
          previous=""
          for stop in 8 16 24 32 40 48 56 64; do
            output="checkpoints/half-${DIRECTION}-panel-${stop}.json"
            cmd=(python -u numerics/arb/m11_dk_adaptive_radius.py
              --bits 105000 --target 70000 --panels 128
              --direction "$DIRECTION"
              --certified-length-manifest historical-length/m11-euler-panel-100k.json
              --stop-after "$stop" --output "$output")
            if [[ -n "$previous" ]]; then cmd+=(--resume "$previous"); fi
            /usr/bin/time -v "${cmd[@]}" 2>&1 | tee -a "checkpoints/half-${DIRECTION}.log"
            test -s "$output"
            if [[ "$stop" -lt 64 ]]; then
              python - "$output" "$stop" "$DIRECTION" <<'PY'
import json,sys
m=json.load(open(sys.argv[1]))
assert m['checkpoint']['next_panel']==int(sys.argv[2])
assert m['checkpoint']['direction']==int(sys.argv[3])
assert m['checkpoint']['historical_euler_source']['manifest_sha256']=='a606d305f7d4c773695cee61cf56268022ec9cc5525f689f301e8822f22fe7b5'
PY
            else
              python - "$output" "$DIRECTION" <<'PY'
import json,sys
m=json.load(open(sys.argv[1]))
assert m['parameters']=={'bits':105000,'target':70000,'panels':128}
assert m['half']['direction']==int(sys.argv[2])
assert len(m['half']['orders'])==64
assert m['half']['historical_euler_source']['source_ci']==44359739062
PY
              cp "$output" half.json
            fi
            previous="$output"
          done
          sha256sum checkpoints/*.json > checkpoints/sha256sums.txt
          printf '%s\n' "$HEAD_SHA" > checkpoints/source-head-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m11-dk-20k-half-${{ matrix.direction }}
          path: |
            half.json
            checkpoints/
          retention-days: 90
          if-no-files-found: warn
  combine:
    name: "Final exact rational 20,000-decimal curvature audit"
    needs: halves
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'python-flint==0.9.0'
      - uses: actions/download-artifact@v4
        with:
          name: m11-dk-20k-half-1
          path: positive
      - uses: actions/download-artifact@v4
        with:
          name: m11-dk-20k-half--1
          path: negative
      - name: Recombine certified halves without numerical reintegration
        run: |
          set -euo pipefail
          python -u numerics/arb/m11_dk_adaptive_radius.py \
            --bits 105000 --target 70000 --panels 128 \
            --combine positive/half.json negative/half.json \
            --output m11-dk-20k-combined.json
      - name: Independent exact-rational square containment, strict decimal cell, and 24 printed digits
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
import hashlib,json,os,sys
from pathlib import Path
sys.path.insert(0,'numerics/arb')
from m11_remaining_3600000_final_audit import verify_curvature,check_bits,same_decimal_cell,exact_decimal,PLACES
p=Path('m11-dk-20k-combined.json')
m=json.loads(p.read_bytes())
assert m['parameters']=={'bits':105000,'target':70000,'panels':128}
assert len(m['halves'])==2
for half in m['halves']:
    tag=half['historical_euler_source']
    assert tag['source_ci']==44359739062
    assert tag['source_head_sha']=='6ddb354a85832bf5b35538996d7d619c63ac9a16'
    assert tag['manifest_sha256']=='a606d305f7d4c773695cee61cf56268022ec9cc5525f689f301e8822f22fe7b5'
lo,hi=verify_curvature(m)
bits=check_bits(lo,hi,'D_kappa')
assert bits>=70000,(bits,70000)
decimal=exact_decimal(same_decimal_cell(lo,hi))
assert len(decimal.split('.')[1])==PLACES
result={'quantity':'D_kappa Eq. (50)','fractional_places':PLACES,
        'rounded_decimal':decimal,'relative_bits_from_arb':bits,
        'source_head_sha':os.environ['HEAD_SHA'],
        'historical_length_source_ci':44359739062,
        'historical_length_manifest_sha256':'a606d305f7d4c773695cee61cf56268022ec9cc5525f689f301e8822f22fe7b5',
        'curvature_manifest_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
        'rounded_decimal_sha256':hashlib.sha256(decimal.encode()).hexdigest()}
Path('m11-dk-20000-decimal-audit.json').write_text(json.dumps(result,indent=2)+'\n')
print('D_KAPPA 20,000 FRACTIONAL DECIMALS: EXACT RATIONAL AUDIT SUCCESS')
print('Measured Arb relative bits:',bits)
print('Rounded decimal SHA256:',result['rounded_decimal_sha256'])
PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m11-dk-20000-final-audit
          path: |
            m11-dk-20k-combined.json
            m11-dk-20000-decimal-audit.json
          retention-days: 90
          if-no-files-found: warn
