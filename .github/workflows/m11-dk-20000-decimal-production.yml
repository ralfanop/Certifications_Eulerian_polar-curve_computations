name: M11 curvature 30000 fractional decimal production
on:
  pull_request:
    paths:
      - '.github/workflows/m11-dk-20000-decimal-production.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: m11-dk-30k-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  panel_0:
    name: "M11 30k direction ${{ matrix.direction }} through panel 0"
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        direction: [1, -1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin source and length provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(gh api repos/${{ github.repository }}/actions/runs/45357327165 --jq .conclusion)" = success
          test "$(gh api repos/${{ github.repository }}/actions/runs/45357327165 --jq .head_sha)" = 59d9884b7346b4e3296336be56f3bb702f1b2686
      - uses: actions/download-artifact@v4
        with:
          run-id: 45357327165
          github-token: ${{ github.token }}
          name: m11-length-130k-curvature-chart-certified
          path: length
      - name: Validate length and pin FLINT
        run: |
          (cd length && sha256sum -c combined-130k-sha256.txt)
          python -m pip install python-flint==0.9.0
      - name: Produce rigorous checkpoint 0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          /usr/bin/time -v python -u numerics/arb/m11_dk_adaptive_radius.py --bits 150000 --target 100100 --panels 128 --direction ${{ matrix.direction }} --certified-length-manifest length/m11-length-130k-curvature-chart.json --stop-after 0 --output result/checkpoint.json 2>&1 | tee result/production.log
          python -c 'import json; m=json.load(open("result/checkpoint.json")); assert m["parameters"]=={"bits":150000,"target":100100,"panels":128}; assert m["checkpoint"]["direction"]==${{ matrix.direction }} and m["checkpoint"]["next_panel"]==0 and len(m["checkpoint"]["orders"])==0 '
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > result/producer-head.txt
          (cd result && sha256sum checkpoint.json > checkpoint.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: m11-dk-30k-${{ matrix.direction }}-panel-0
          path: result/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: m11-dk-30k-diagnostics-${{ matrix.direction }}-panel-0
          path: result/production.log
          if-no-files-found: ignore
