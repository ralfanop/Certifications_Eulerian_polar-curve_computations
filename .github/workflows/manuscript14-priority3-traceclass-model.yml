name: "Manuscript 14.119 Priority 3 — actual l2 Dirichlet trace class"

on:
  push:
    branches:
      - manuscript14-priority3-traceclass-diagonal-20261109
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3TraceClassModel.lean'
      - '.github/workflows/manuscript14-priority3-traceclass-model.yml'
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3TraceClassModel.lean'
      - '.github/workflows/manuscript14-priority3-traceclass-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean kernel — spectral inverse operator and CFC trace class
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib cache
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build registered GegenbauerFock trace-class dependencies
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealComplexPositiveSpectralAutomaticTraceClassBridge GegenbauerFock.PositiveTraceDiagonalSpectralBridge 2>&1 |
            tee /tmp/priority3-traceclass-build.log
      - name: Kernel compile section 6 Euler product dependency and actual spectral model
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/Section67ScalarCertificate.olean SpecialImaginaryPoint/Section67ScalarCertificate.lean 2>&1 |
            tee /tmp/priority3-traceclass-section67.log
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/V14119Priority3TraceClassModel.olean SpecialImaginaryPoint/V14119Priority3TraceClassModel.lean 2>&1 |
            tee /tmp/priority3-traceclass-axioms.log
      - name: Kernel audit of seven inverse and trace-class statements
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          src = pathlib.Path("/tmp/priority3-traceclass-axioms.log").read_text()
          names = [
            "σ_summable", "term_summable", "inverse_eigen",
            "inverse_nonneg", "inverse_diagonal",
            "inverse_isTraceClass", "inverse_traceNorm_eq",
          ]
          prefix = "Manuscript14Priority3.TraceClassModel."
          ax = {}
          for m in re.finditer(
              r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms",
              src):
              ax[m.group(1) or m.group(3)] = {
                  x.strip() for x in (m.group(2) or "").split(",") if x.strip()
              }
          allowed = {"propext", "Quot.sound", "Classical.choice"}
          for suffix in names:
              name = prefix + suffix
              assert name in ax, f"Missing kernel audit: {name}"
              assert not ax[name] - allowed, f"Nonstandard axioms: {name}: {ax[name] - allowed}"
              print(f"{name}: axioms={sorted(ax[name])}")
          assert "sorryAx" not in src and "Lean.ofReduceBool" not in src
          assert not re.search(r"\.lean:\d+:\d+: error:", src)
          print("SUCCESS: 7 theorems, genuine l2 inverse operator and CFC trace class")
          PY
      - name: Preserve kernel log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript14-priority3-l2-traceclass-audit
          path: /tmp/priority3-traceclass-*.log
          if-no-files-found: ignore
