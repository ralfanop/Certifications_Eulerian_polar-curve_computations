name: V007 genuine intrinsic dual Gram Fredholm shift classification

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireTwoGramFredholmShifts.lean'
      - '.github/workflows/v007-intrinsic-two-gram-fredholm-shifts.yml'
  workflow_dispatch:

jobs:
  actual-two-gram-fredholm-shifts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Check real holomorphic two-Gram Fredholm shifts and axioms
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireTwoGramFredholmShifts 2>&1 | tee /tmp/v007-real-fock-fredholm-shifts.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireTwoGramFredholmShifts.lean 2>&1 | tee -a /tmp/v007-real-fock-fredholm-shifts.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-fock-fredholm-shifts.log; then
            echo "::error::Forbidden axiom in full genuine two-Gram Fredholm shifts"
            exit 1
          fi
          grep -F "C_intrinsicEntire_outputGram_shift_fredholm_iff_nonzero' depends on axioms:" /tmp/v007-real-fock-fredholm-shifts.log
          grep -F "C_intrinsicEntire_two_gram_shifts_fredholm_iff_nonzero' depends on axioms:" /tmp/v007-real-fock-fredholm-shifts.log
          echo 'V007 exact genuine holomorphic-source/output Fredholm shifts audited.'
