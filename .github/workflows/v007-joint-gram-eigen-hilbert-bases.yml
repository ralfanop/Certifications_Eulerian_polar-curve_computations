name: V007 matched source and output Gram complete eigenbases

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/JointGramEigenHilbertBases.lean'
      - 'lean/GegenbauerFock/CompletePositiveSingularFamily.lean'
      - '.github/workflows/v007-joint-gram-eigen-hilbert-bases.yml'
  workflow_dispatch:

jobs:
  joint-gram-eigenbases:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit common-index bilateral Gram complete eigenbases
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.JointGramEigenHilbertBases 2>&1 | tee /tmp/v007-joint-gram-eigenbasis-build.log
          lake env lean -M16768 GegenbauerFock/JointGramEigenHilbertBases.lean 2>&1 | tee /tmp/v007-joint-gram-eigenbasis-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-joint-gram-eigenbasis-build.log /tmp/v007-joint-gram-eigenbasis-axioms.log; then
            echo '::error::Forbidden axiom in joint positive complete Gram eigenbases.'
            exit 1
          fi
          grep -F "exists_joint_gram_eigenHilbert_bases_kummer' depends on axioms:" /tmp/v007-joint-gram-eigenbasis-axioms.log
          echo 'V007 matching complete Gram Hilbert eigenbases verified and audited.'
