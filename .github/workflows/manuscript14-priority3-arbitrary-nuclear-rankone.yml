name: "Manuscript 14.119 Priority 3 — arbitrary nuclear rank-one CFC S1 series"

on:
  push:
    branches:
      - main
      - manuscript14-priority3-arbitrary-nuclear-rankone-20261110
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3ArbitraryNuclearRankOne.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - '.github/workflows/manuscript14-priority3-arbitrary-nuclear-rankone.yml'
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3ArbitraryNuclearRankOne.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - '.github/workflows/manuscript14-priority3-arbitrary-nuclear-rankone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Genuine arbitrary CFC S1 rank-one trace norm and nuclear series
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build genuine V007 CFC Schatten-S1 operator and series dependencies
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealComplexPositiveSpectralAutomaticTraceClassBridge GegenbauerFock.PositiveTraceDiagonalSpectralBridge GegenbauerFock.PhyslibTraceClassSandwichContinuous GegenbauerFock.PhyslibTraceClassSeriesTailEstimate 2>&1 | tee /tmp/p3-nuclear-dependencies.log
      - name: Compile rank-one arbitrary nuclear and actual operatorial CFC S1 sector
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          for f in DirichletFiniteDeterminant Section67ScalarCertificate V14119Priority3SpectralDetBridge V14119Priority3DirichletDiagonal V14119Priority3TraceClassModel V14119Priority3RankOneS1 V14119Priority3S1Truncation V14119Priority3OperatorCompression V14119Priority3PositiveDiagonalFredholm V14119Priority3FredholmSectorFunctional V14119Priority3ComplexDiagonalS1 V14119Priority3ArbitraryNuclearRankOne; do
            lake env lean -M16768 -o ".lake/build/lib/lean/SpecialImaginaryPoint/$f.olean" \
              "SpecialImaginaryPoint/$f.lean" 2>&1 | tee "/tmp/p3-nuclear-$f.log"
          done
      - name: Audit eight exact CFC S1 nuclear rank-one kernel declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path("/tmp/p3-nuclear-V14119Priority3ArbitraryNuclearRankOne.log").read_text()
          prefix = "Manuscript14Priority3.NuclearRankOne."
          required = [
            "rankOneS1_operator", "rankOneS1_norm_le",
            "rankOneS1_norm_eq", "rankOneS1_traceNorm_eq",
            "rankOne_nuclear_summable", "rankOne_operator_summable",
            "rankOne_nuclear_operator_eq", "rankOne_nuclear_traceNorm_error_le_tail"
          ]
          found = {}
          for m in re.finditer(
              r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms",
              log, re.MULTILINE):
            found[m.group(1) or m.group(3)] = {
              x.strip() for x in (m.group(2) or "").split(",") if x.strip()
            }
          allowed = {"propext", "Quot.sound", "Classical.choice"}
          for suffix in required:
            name = prefix + suffix
            assert name in found, f"Missing exact report: {name}"
            assert found[name] <= allowed, f"Nonstandard axioms in {name}: {found[name] - allowed}"
            print(name, sorted(found[name]))
          assert "sorryAx" not in log and "Lean.ofReduceBool" not in log
          assert not re.search(r"\.lean:\d+:\d+: error", log)
          print("SUCCESS: eight genuine CFC S1 arbitrary rank-one nuclear series declarations")
          PY
      - name: Upload kernel logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priority3-arbitrary-nuclear-rankone-logs
          path: /tmp/p3-nuclear-*.log
          if-no-files-found: ignore
