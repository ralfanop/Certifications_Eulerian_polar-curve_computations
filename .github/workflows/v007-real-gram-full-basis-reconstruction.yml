name: V007 real Gram full eigenbasis reconstruction

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/RealNuclearGramFullBasisReconstruction.lean'
      - 'lean/GegenbauerFock/RealCompactGramActiveSingularModes.lean'
      - '.github/workflows/v007-real-gram-full-basis-reconstruction.yml'
  workflow_dispatch:

jobs:
  real-gram-full-basis-reconstruction:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Verify actual full Gram eigenbasis reconstruction with zero modes
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealNuclearGramFullBasisReconstruction 2>&1 | tee /tmp/v007-real-gram-full-basis-reconstruction.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-gram-full-basis-reconstruction.log; then
            echo '::error::Forbidden axiom in real Gram full basis reconstruction.'
            exit 1
          fi
          for theorem in \
            realGram_fullEigenbasis_active_singular_hasSum \
            realGram_fullEigenbasis_zero_mode_vanishes; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-real-gram-full-basis-reconstruction.log
          done
          echo 'Actual real Gram full eigenbasis reconstruction with zero modes kernel-certified.'
