name: "Manuscript 14.119 Priority 3 — norm-controlled optimal nuclear truncations"

on:
  push:
    branches:
      - manuscript14-priority3-nuclear-truncation-control-20261110
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3OptimalNuclearTruncations.lean'
      - '.github/workflows/manuscript14-priority3-nuclear-truncation-control.yml'
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3OptimalNuclearTruncations.lean'
      - '.github/workflows/manuscript14-priority3-nuclear-truncation-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Genuine S1 finite nuclear norm control and two axiom audits
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build CFC S1 polar and nuclear prerequisites
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealComplexPositiveSpectralAutomaticTraceClassBridge GegenbauerFock.PositiveTraceDiagonalSpectralBridge GegenbauerFock.PhyslibTraceClassSandwichContinuous GegenbauerFock.PhyslibTraceClassSeriesTailEstimate GegenbauerFock.PhyslibTraceClassOperatorEmbedding GegenbauerFock.PhyslibTraceClassHSFactorization GegenbauerFock.PhyslibTraceNormSqrtAbsEnergy GegenbauerFock.PhyslibHilbertSchmidtAdditive 2>&1 | tee /tmp/p3-truncation-deps.log
      - name: Compile CFC nuclear norm-controlled truncations
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          for f in DirichletFiniteDeterminant Section67ScalarCertificate V14119Priority3SpectralDetBridge V14119Priority3DirichletDiagonal V14119Priority3TraceClassModel V14119Priority3RankOneS1 V14119Priority3S1Truncation V14119Priority3OperatorCompression V14119Priority3PositiveDiagonalFredholm V14119Priority3FredholmSectorFunctional V14119Priority3ComplexDiagonalS1 V14119Priority3ArbitraryNuclearRankOne V14119Priority3UniversalNuclearDensity V14119Priority3OptimalNuclearMass V14119Priority3OptimalNuclearTruncations; do
            lake env lean -M16768 -o ".lake/build/lib/lean/SpecialImaginaryPoint/$f.olean" \
              "SpecialImaginaryPoint/$f.lean" 2>&1 | tee "/tmp/p3-truncation-$f.log"
          done
      - name: Audit exact two kernel declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path("/tmp/p3-truncation-V14119Priority3OptimalNuclearTruncations.log").read_text()
          prefix = "Manuscript14Priority3.NuclearRankOne."
          required = [
            "nuclear_finset_traceNorm_le_mass",
            "traceClass_exists_optimal_normControlled_truncations"
          ]
          found = {}
          for m in re.finditer(
              r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms",
              log, re.MULTILINE):
            found[m.group(1) or m.group(3)] = {
              x.strip() for x in (m.group(2) or "").split(",") if x.strip()
            }
          allowed = {"propext", "Quot.sound", "Classical.choice"}
          for suffix in required:
            name = prefix + suffix
            assert name in found, f"Missing axiom report: {name}"
            assert found[name] <= allowed, f"Nonstandard axioms for {name}: {found[name] - allowed}"
            print(name, sorted(found[name]))
          assert "sorryAx" not in log and "Lean.ofReduceBool" not in log
          assert not re.search(r"\.lean:\d+:\d+: error", log)
          print("SUCCESS: both norm-controlled nuclear truncation theorems")
          PY
      - name: Upload kernel logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priority3-nuclear-truncation-logs
          path: /tmp/p3-truncation-*.log
          if-no-files-found: ignore
