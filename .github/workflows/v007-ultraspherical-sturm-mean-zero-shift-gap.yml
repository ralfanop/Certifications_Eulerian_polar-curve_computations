name: V007 sharp mean-zero genuine closed Sturm positive-shift gap

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonicClosedMeanZeroShiftGap.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonicClosedMeanZeroDifferenceStability.lean'
      - '.github/workflows/v007-ultraspherical-sturm-mean-zero-shift-gap.yml'
  workflow_dispatch:

jobs:
  sharp-mean-zero-shift:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and axiom-audit sharp real-L2 mean-zero shift gap
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleMonicClosedMeanZeroShiftGap 2>&1 | tee /tmp/v007-shift-gap-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleMonicClosedMeanZeroShiftGap.lean 2>&1 | tee /tmp/v007-shift-gap-audit.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-shift-gap-build.log /tmp/v007-shift-gap-audit.log; then
            echo '::error::Forbidden axiom in mean-zero closed Sturm positive-shift gap.'
            exit 1
          fi
          grep -F "sturmRealClosed_meanZero_positiveShift_gap' depends on axioms:" /tmp/v007-shift-gap-audit.log
          grep -F "sturmRealClosed_meanZero_positiveShift_gap_attained' depends on axioms:" /tmp/v007-shift-gap-audit.log
          grep -F "sturmRealClosed_meanZero_positiveShift_gap_optimal' depends on axioms:" /tmp/v007-shift-gap-audit.log
          echo 'V007 sharp mean-zero closed Sturm positive-shift gap: kernel-certified.'
