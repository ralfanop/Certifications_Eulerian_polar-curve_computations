name: V007 numerical certificates (exact and Arb)

on:
  push:
    branches:
      - v007-arb
    paths:
      - 'numerics/arb/v007_arb.py'
      - '.github/workflows/v007-arb.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  arb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install python-flint==0.9.0
      - name: V007 certificates
        working-directory: numerics/arb
        run: python v007_arb.py | tee v007_arb.log
      - name: Commit the log of this run to the branch
        if: always() && github.ref == 'refs/heads/v007-arb'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f numerics/arb/v007_arb.log
          git diff --cached --quiet || git commit -m "CI log of the V007 numerical certificates (run ${{ github.run_id }})"
          git push
