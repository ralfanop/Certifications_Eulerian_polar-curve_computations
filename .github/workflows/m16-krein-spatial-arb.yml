name: M16 Krein spatial Arb exact digits
on:
  pull_request:
    paths:
      - 'numerics/arb/m16_krein_spatial_million.py'
      - '.github/workflows/m16-krein-spatial-arb.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact head and strict certification
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          python -m pip install python-flint==0.9.0
          python numerics/arb/m16_krein_spatial_million.py 2>&1 | tee m16-krein-spatial.log
          grep -F 'MILLION SUCCESS m16-krein-spatial checks 3' m16-krein-spatial.log
          test "$(grep -c '1000001 fixed decimal places: PASS' m16-krein-spatial.log)" -eq 3
          gzip -t million-enclosures.jsonl.gz m16-krein-fixed-endpoints.jsonl.gz
          sha256sum million-enclosures.jsonl.gz m16-krein-fixed-endpoints.jsonl.gz million-m16-krein-spatial.json m16-krein-spatial.log > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: m16-krein-spatial-million
          path: |
            million-enclosures.jsonl.gz
            m16-krein-fixed-endpoints.jsonl.gz
            million-m16-krein-spatial.json
            m16-krein-spatial.log
            SHA256SUMS
          compression-level: 0
          if-no-files-found: error
