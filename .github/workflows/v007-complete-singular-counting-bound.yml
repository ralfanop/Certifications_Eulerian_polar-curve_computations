name: V007 exact Kummer spectral multiplicity counting bound

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/CompleteSingularCountingBound.lean'
      - 'lean/GegenbauerFock/CompletePositiveSingularHilbertBasis.lean'
      - '.github/workflows/v007-complete-singular-counting-bound.yml'
  workflow_dispatch:

jobs:
  spectral-counting-bound:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit Kummer spectral threshold counting
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.CompleteSingularCountingBound 2>&1 | tee /tmp/v007-counting-build.log
          lake env lean -M16768 GegenbauerFock/CompleteSingularCountingBound.lean 2>&1 | tee /tmp/v007-counting-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-counting-build.log /tmp/v007-counting-axioms.log; then
            echo '::error::Forbidden axiom in Kummer spectral multiplicity count certificate.'
            exit 1
          fi
          grep -F "finite_threshold_count_le_tsum' depends on axioms:" /tmp/v007-counting-axioms.log
          grep -F "exists_complete_singular_kummer_counting_bound' depends on axioms:" /tmp/v007-counting-axioms.log
          echo 'V007 exact Kummer spectral multiplicity bound kernel-checked and audited.'
