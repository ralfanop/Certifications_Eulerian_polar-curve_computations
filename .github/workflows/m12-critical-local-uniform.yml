name: M12 actual quartic locally uniform convergence
on:
  pull_request:
    paths:
      - 'lean/EulerianGrothendieck/CriticalWindowLocalUniform.lean'
      - '.github/workflows/m12-critical-local-uniform.yml'
  workflow_dispatch:
jobs:
  uniform:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore pinned Lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile actual uniform convergence
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          lake exe cache get
          mkdir -p .lake/build/lib/lean
          for module in CriticalWindowQuartic CriticalWindowGlobalMGF CriticalWindowComplexMGF CriticalWindowAnalyticRemainder CriticalWindowFockDomination CriticalWindowGammaVacuum CriticalWindowFinalAssembly CriticalWindowPointwise CriticalWindowDCT; do
            lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean"
          done
          lake env lean CriticalWindowLocalUniform.lean 2>&1 | tee /tmp/m12-uniform.log
      - name: Strict declaration audit
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          data=Path('/tmp/m12-uniform.log').read_text()
          src=Path('lean/EulerianGrothendieck/CriticalWindowLocalUniform.lean').read_text()
          assert not re.search(r'\b(sorry|admit|axiom|opaque|native_decide)\b',src)
          assert ': error' not in data and 'sorryAx' not in data and 'Lean.ofReduceBool' not in data
          allowed={'propext','Classical.choice','Quot.sound'}
          names=['H_factor','G_factor','G_nonneg','err_nonneg','uniform_pointwise_error',
                 'err_measurable','err_tendsto','errBound_integrable','eventual_err_bound',
                 'integral_err_tendsto','eventual_integral_error','eventual_A_eq','F_eq_plane',
                 'uniformBound_tendsto','eventual_normalized_error','locally_uniform_Fock']
          for name in names:
              full='M12CriticalUniform.'+name
              m=re.search(r"'"+re.escape(full)+r"' depends on axioms: \[([^\]]*)\]",data)
              if m:
                  assert {x.strip() for x in m.group(1).split(',') if x.strip()}<=allowed,full
              else:
                  assert "'"+full+"' does not depend on any axioms" in data,full
              print('AXIOM AUDIT SUCCESS',full)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-critical-local-uniform-audit
          path: /tmp/m12-uniform.log
