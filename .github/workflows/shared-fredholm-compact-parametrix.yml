name: Shared Fredholm compact parametrix criterion
on:
  pull_request:
    paths:
      - 'lean/SharedCore/FredholmCompactParametrix.lean'
      - '.github/workflows/shared-fredholm-compact-parametrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Lean and Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD | tee /tmp/fredholm-parametrix-head.log
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          grep -F '0272bbe1c093d038d7257ab15306abd58245f9ff' lakefile.toml
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile and audit
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean SharedCore/FredholmCompactParametrix.lean 2>&1 | tee /tmp/fredholm-parametrix-lean.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/fredholm-parametrix-lean.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/fredholm-parametrix-lean.log').read_text()
          for suffix in ['lower_bound_on_kernel_orthogonal','closed_range_of_left_compact_defect','finite_kernel_of_left_compact_defect','finite_range_orthogonal_of_right_compact_defect','fredholm_components_of_compact_parametrix']:
              name = 'SharedCore.FredholmParametrix.'+suffix
              matches = re.findall(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", log, re.S)
              assert matches or ("'"+name+"' does not depend on any axioms") in log, name
              for match in matches:
                  assert {x.strip() for x in match.split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'}
              print('AXIOM AUDIT SUCCESS:',name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-fredholm-parametrix-audit
          path: /tmp/fredholm-parametrix-*.log
