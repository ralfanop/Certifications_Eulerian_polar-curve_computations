name: V007 intrinsic Fock Gram singular Weyl zero and inverse instability

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireGramWeylInstability.lean'
      - '.github/workflows/v007-intrinsic-gram-weyl-instability.yml'
  workflow_dispatch:

jobs:
  intrinsic-weyl-instability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit intrinsic Fock Gram continuous spectral zero and Weyl
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireGramWeylInstability 2>&1 | tee /tmp/v007-intrinsic-gram-weyl-instability.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireGramWeylInstability.lean 2>&1 | tee -a /tmp/v007-intrinsic-gram-weyl-instability.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-intrinsic-gram-weyl-instability.log; then
            echo "::error::Forbidden axiom in intrinsic Gaussian Fock Weyl and inverse instability"
            exit 1
          fi
          for theorem in \
            C_intrinsicEntire_gram_zero_continuous_spectrum \
            C_intrinsicEntire_gram_has_singular_weyl_zero \
            C_intrinsicEntire_gram_range_not_closed \
            C_intrinsicEntire_gram_inverse_unbounded_on_range; do
              grep -F "$theorem' depends on axioms:" /tmp/v007-intrinsic-gram-weyl-instability.log
          done
          echo 'V007 intrinsic Fock Gram Weyl and quantitative inverse instability: verified.'
