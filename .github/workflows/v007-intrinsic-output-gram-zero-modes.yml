name: V007 intrinsic entire Fock output Gram zero-mode exclusion

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireOutputGramZeroModes.lean'
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireCompactQuasiaffinity.lean'
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireOutputGram.lean'
      - '.github/workflows/v007-intrinsic-output-gram-zero-modes.yml'
  workflow_dispatch:

jobs:
  intrinsic-output-zero:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Check true analytic output Gram kernel and zero eigenspace
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireOutputGramZeroModes 2>&1 | tee /tmp/v007-intrinsic-output-zero.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireOutputGramZeroModes.lean 2>&1 | tee -a /tmp/v007-intrinsic-output-zero.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-intrinsic-output-zero.log; then
            echo "::error::Forbidden axiom in intrinsic Fock output zero eigenspace"
            exit 1
          fi
          for theorem in \
            C_intrinsicEntire_adjoint_injective \
            C_intrinsicEntire_outputGram_ker_eq_adjoint_ker \
            C_intrinsicEntire_outputGram_ker_bot \
            C_intrinsicEntire_outputGram_zero_eigenspace_bot; do
              grep -F "$theorem' depends on axioms:" /tmp/v007-intrinsic-output-zero.log
          done
          echo 'V007 genuine intrinsic Gaussian Fock output zero-mode absence proved and audited.'
