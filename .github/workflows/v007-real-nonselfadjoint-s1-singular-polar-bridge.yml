name: V007 real nonselfadjoint S1 two-basis polar nuclear bridge

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/RealNuclearUnitaryPolarS1Bridge.lean'
      - '.github/workflows/v007-real-nonselfadjoint-s1-singular-polar-bridge.yml'
  workflow_dispatch:

jobs:
  real-svd-nuclear:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then exit 0; fi
            sleep "$((attempt * 8))"
          done
          exit 1
      - name: Prepare pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Certify nonselfadjoint two-Hilbert-basis S1 and exact nuclear norm
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealNuclearUnitaryPolarS1Bridge 2>&1 | tee /tmp/v007-real-nonselfadjoint-S1.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-nonselfadjoint-S1.log; then
            echo '::error::Nonstandard axiom in real nonselfadjoint S1 singular bridge.'
            exit 1
          fi
          for theorem in HasRealSummableSingularHilbertBases.toUnitaryPolarS1 HasRealUnitaryPolarS1Factorization.toRealNuclearRankOneSeries HasRealUnitaryPolarS1Factorization.exists_exact_singular_norm HasRealSummableSingularHilbertBases.nuclear_and_exact_norm; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-real-nonselfadjoint-S1.log
          done
          echo 'V007 real nonselfadjoint S1 two-basis singular bridge kernel-certified.'
