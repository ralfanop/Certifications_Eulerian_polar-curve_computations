name: V007 data-adaptive comparable lambda alpha recovery from Fock S2 norm

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireHSMixedObservedCoordinateRecovery.lean'
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireHSMixedQuantitativeGap.lean'
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireHSMixedCoordinateRecovery.lean'
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireHSMixedNormCoordinateRecovery.lean'
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireHSMixedNoisySeparation.lean'
      - '.github/workflows/v007-intrinsic-fock-hs-mixed-observed-coordinate-recovery.yml'
  workflow_dispatch:

jobs:
  mixed-observed-coordinate-recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit data-adaptive lambda alpha recovery without a lower Gaussian bound
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireHSMixedObservedCoordinateRecovery 2>&1 | tee /tmp/v007-mixed-observed-coordinate-recovery.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireHSMixedObservedCoordinateRecovery.lean 2>&1 | tee -a /tmp/v007-mixed-observed-coordinate-recovery.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-mixed-observed-coordinate-recovery.log; then
            echo "::error::Forbidden axiom in mixed lambda alpha noisy separation"
            exit 1
          fi
          for name in \
            kummerSeries_mixed_observed_energy_gap \
            kummerSeries_mixed_observed_coordinate_recovery \
            C_intrinsicEntire_basisHSNorm_mixed_observed_coordinate_recovery; do
            grep -F "${name}' depends on axioms:" /tmp/v007-mixed-observed-coordinate-recovery.log
          done
          echo 'V007 observed-data lambda alpha recovery with true S2 norms: kernel checked.'
