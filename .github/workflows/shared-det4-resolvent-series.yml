name: Shared core det4 global resolvent series
on:
  pull_request:
    paths:
      - 'lean/SharedCore/Det4ResolventSeries.lean'
      - '.github/workflows/shared-det4-resolvent-series.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Lean and Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          grep -F '0272bbe1c093d038d7257ab15306abd58245f9ff' lakefile.toml
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile and audit exact declarations
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SharedCore
          lake env lean -o .lake/build/lib/lean/SharedCore/Det4ZetaMoments.olean SharedCore/Det4ZetaMoments.lean
          lake env lean -o .lake/build/lib/lean/SharedCore/Det4ComplexProduct.olean SharedCore/Det4ComplexProduct.lean
          lake env lean -o .lake/build/lib/lean/SharedCore/Det4Entire.olean SharedCore/Det4Entire.lean
          lake env lean -o .lake/build/lib/lean/SharedCore/Det4Zeros.olean SharedCore/Det4Zeros.lean
          lake env lean -o .lake/build/lib/lean/SharedCore/Det4LogDeriv.olean SharedCore/Det4LogDeriv.lean
          lake env lean SharedCore/Det4ResolventSeries.lean 2>&1 | tee /tmp/det4-resolvent-series-lean.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/det4-resolvent-series-lean.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/det4-resolvent-series-lean.log').read_text()
          for suffix in ["one_add_argument_ne","resolvent_term_rational","argument_half_bound","resolvent_tail_bound","resolvent_tail_norm_summable","resolvent_norm_summable","resolvent_summable","spectral_log_summable","resolvent_tail_uniform","spectral_log_tail_bound","spectral_log_tail_uniform","local_log_derivative","shell_log_derivative","shell_log_at_zero","tail_log_derivative","shell_log_deriv_all","global_spectral_log_derivative","determinant_resolvent_trace","determinant_resolvent_rational_series","diagonal_trace_at_zero"]:
              name = 'SharedCore.Det4ResolventSeries.'+suffix
              matches = re.findall(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", log, re.S)
              assert matches or ("'"+name+"' does not depend on any axioms") in log, name
              for match in matches:
                  assert {x.strip() for x in match.split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'}
              print('AXIOM AUDIT SUCCESS:',name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-det4-resolvent-series-audit
          path: /tmp/det4-resolvent-series-lean.log
