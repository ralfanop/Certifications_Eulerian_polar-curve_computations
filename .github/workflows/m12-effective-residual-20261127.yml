name: M12 Theorem 5.14 / 5.16 — effective residual constants and arbitrary-order tail absorption
on:
  pull_request:
    paths:
      - 'lean/EulerianGrothendieck/EffectiveResidual20261127.lean'
      - '.github/workflows/m12-effective-residual-20261127.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compile exact source and audit transitive axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
          mkdir -p /tmp/EffectiveResidual20261127/EulerianGrothendieck
          git rev-parse HEAD | tee /tmp/EffectiveResidual20261127.log
          lake env bash -c 'export LEAN_PATH="/tmp/EffectiveResidual20261127:$LEAN_PATH"; lean -M16768 EulerianGrothendieck/EffectiveResidual20261127.lean' 2>&1 | tee -a /tmp/EffectiveResidual20261127.log
          python - <<'PY'
          from pathlib import Path
          import re
          source=Path('EulerianGrothendieck/EffectiveResidual20261127.lean').read_text()
          log=Path('/tmp/EffectiveResidual20261127.log').read_text()
          assert not re.search(r'\b(sorry|admit|axiom|opaque|native_decide)\b',source)
          assert 'sorryAx' not in log and 'Lean.ofReduceBool' not in log and not re.search(r'\.lean:\d+:\d+: error',log)
          names=re.findall(r'^#print axioms (\S+)$',source,re.M)
          assert len(names)==4
          for name in names:
              m=re.search(r"'"+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]",log)
              if m:
                  assert {x.strip() for x in m.group(1).split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'},name
              else:
                  assert "'"+name+"' does not depend on any axioms" in log,name
              print('AXIOM AUDIT SUCCESS',name)
          print('SUCCESS',len(names))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EffectiveResidual20261127-audit
          path: /tmp/EffectiveResidual20261127.log
          if-no-files-found: warn
