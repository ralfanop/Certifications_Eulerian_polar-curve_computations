name: V007 true holomorphic Gaussian Fock output Gram singular Weyl sequence

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireOutputGramSingularWeyl.lean'
      - '.github/workflows/v007-intrinsic-output-gram-singular-weyl.yml'
  workflow_dispatch:

jobs:
  true-output-singular-weyl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build and audit true holomorphic output singular Weyl sequence
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireOutputGramSingularWeyl 2>&1 | tee /tmp/v007-intrinsic-output-singular-weyl.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireOutputGramSingularWeyl.lean 2>&1 | tee -a /tmp/v007-intrinsic-output-singular-weyl.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-intrinsic-output-singular-weyl.log; then
            echo "::error::Forbidden axiom in genuine holomorphic output singular Weyl sequence"
            exit 1
          fi
          grep -F "C_intrinsicEntire_outputGram_singular_weyl_zero' depends on axioms:" /tmp/v007-intrinsic-output-singular-weyl.log
          echo 'V007 full analytic Gaussian output Gram singular Weyl sequence checked.'
