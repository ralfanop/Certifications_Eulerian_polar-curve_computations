name: V007 exact closed Sturm weighted Gegenbauer Hilbert domain
on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonicHilbertWeightedDomain.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonicHilbertResolventCoordinates.lean'
      - '.github/workflows/v007-sturm-monic-hilbert-weighted-domain.yml'
  workflow_dispatch:
jobs:
  exact-weighted-hilbert-domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and kernel-audit exact Sturm weighted Hilbert domain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleMonicHilbertWeightedDomain 2>&1 | tee /tmp/v007-weighted-domain-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleMonicHilbertWeightedDomain.lean 2>&1 | tee /tmp/v007-weighted-domain-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-weighted-domain-build.log /tmp/v007-weighted-domain-axioms.log; then
            echo '::error::Forbidden axiom in weighted Sturm domain.'
            exit 1
          fi
          grep -F "sturmRealClosed_domain_eq_monicHilbert_weightedL2' depends on axioms:" /tmp/v007-weighted-domain-axioms.log
          echo 'Exact canonical closed Gegenbauer Sturm domain in weighted ℓ² certified.'
