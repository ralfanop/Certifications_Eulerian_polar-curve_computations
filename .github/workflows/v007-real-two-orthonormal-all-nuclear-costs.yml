name: V007 mixed orthonormal real nuclear dual all costs

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/RealNuclearTwoOrthonormalAllCostsDual.lean'
      - 'lean/GegenbauerFock/RealNuclearTwoOrthonormalFiniteTraceDual.lean'
      - '.github/workflows/v007-real-two-orthonormal-all-nuclear-costs.yml'
  workflow_dispatch:

jobs:
  mixed-orthonormal-all-costs:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel audit of universal mixed trace duality
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealNuclearTwoOrthonormalAllCostsDual 2>&1 | tee /tmp/v007-two-ortho-all-costs.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-two-ortho-all-costs.log; then
            echo '::error::Forbidden axiom in two-orthonormal all nuclear costs duality.'
            exit 1
          fi
          for theorem in realTwoOrthonormalFiniteTraceCLM_apply realTwoOrthonormalFiniteTrace_abs_le_nuclearCost; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-two-ortho-all-costs.log
          done
          echo 'Mixed finite trace nuclear cost bound kernel-certified.'
