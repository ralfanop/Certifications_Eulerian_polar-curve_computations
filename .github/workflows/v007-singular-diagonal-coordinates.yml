name: V007 true bilateral diagonal conjugacy in complete singular Hilbert coordinates

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/SingularDiagonalCoordinates.lean'
      - 'lean/GegenbauerFock/CompletePositiveSingularFamily.lean'
      - '.github/workflows/v007-singular-diagonal-coordinates.yml'
  workflow_dispatch:

jobs:
  singular-diagonal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit two-sided singular coordinate diagonalization
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.SingularDiagonalCoordinates 2>&1 | tee /tmp/v007-singular-diagonal-build.log
          lake env lean -M16768 GegenbauerFock/SingularDiagonalCoordinates.lean 2>&1 | tee /tmp/v007-singular-diagonal-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-singular-diagonal-build.log /tmp/v007-singular-diagonal-axioms.log; then
            echo '::error::Forbidden axiom in bilateral exact singular diagonal coordinates.'
            exit 1
          fi
          grep -F "exists_bilateral_singular_diagonal_coordinates_kummer' depends on axioms:" /tmp/v007-singular-diagonal-axioms.log
          echo 'V007 exact bilateral singular diagonal coordinates verified and audited.'
