name: M15 DiskFamily exhaustive extremizers
on:
  pull_request:
    paths:
      - 'lean/Manuscript15/DiskFamilyExtremizers20261127.lean'
      - 'lean/Manuscript15/DiskFamily20261127.lean'
      - '.github/workflows/m15-disk-family-extremizers-20261127.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned toolchain and mathlib
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
      - name: Compile dependency and exhaustive classification
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          lake build EulerianGrothendieck.ComplexArcsineDisk Bridge.AppendixAGd 2>&1 | tee /tmp/extremizers-build.log
          mkdir -p Manuscript15 .lake/build/lib/lean/Manuscript15
          cp ../Manuscript15/DiskFamily20261127.lean ../Manuscript15/DiskFamilyExtremizers20261127.lean Manuscript15/
          lake env lean -o .lake/build/lib/lean/Manuscript15/DiskFamily20261127.olean Manuscript15/DiskFamily20261127.lean 2>&1 | tee /tmp/extremizers-base.log
          lake env lean Manuscript15/DiskFamilyExtremizers20261127.lean 2>&1 | tee /tmp/extremizers-axioms.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/extremizers-{build,base,axioms}.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          names = re.findall(r'^#print axioms (\S+)', Path('Manuscript15/DiskFamilyExtremizers20261127.lean').read_text(), re.M)
          log = Path('/tmp/extremizers-axioms.log').read_text()
          assert len(names) == 6, names
          for name in names:
              m = re.search(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", log, re.S)
              if m is None:
                  assert "'" + name + "' does not depend on any axioms" in log, name
              else:
                  assert {a.strip() for a in m.group(1).split(',') if a.strip()} <= {'propext','Classical.choice','Quot.sound'}, name
          print('AXIOM AUDIT SUCCESS:', len(names))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disk-family-extremizers-audit
          path: /tmp/extremizers-*.log
