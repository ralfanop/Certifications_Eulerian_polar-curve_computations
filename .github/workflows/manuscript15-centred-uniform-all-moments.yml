name: Manuscript 15 — genuine conditional uniform all-order moment bridge

on:
  push:
    branches:
      - draft/m15-centred-uniform-all-moments-20261112
    paths:
      - 'lean/Manuscript15/UniformAllOrderMomentBridge.lean'
      - '.github/workflows/manuscript15-centred-uniform-all-moments.yml'
  pull_request:
    paths:
      - 'lean/Manuscript15/UniformAllOrderMomentBridge.lean'
      - '.github/workflows/manuscript15-centred-uniform-all-moments.yml'
  workflow_dispatch:

jobs:
  kernel:
    name: Genuine centered uniform all-order moments — Lean kernel audit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors \
            --retry-delay 5 --connect-timeout 20 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
      - name: Retrieve pinned Mathlib cache
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build genuine probability prerequisites and all-order statements
        working-directory: lean
        run: |
          set -euo pipefail
          lake build Manuscript15.UniformAllOrderMomentBridge
      - name: Audit every new theorem and reject all nonstandard axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean Manuscript15/UniformAllOrderMomentBridge.lean 2>&1 | tee /tmp/m15-uniform-allorder.log
          python3 - <<'PY'
          import pathlib, re
          log=pathlib.Path('/tmp/m15-uniform-allorder.log').read_text()
          requested = [
            'Manuscript15.centredUniformLaw_even_moment_all',
            'Manuscript15.centredUniformLaw_odd_moment_all',
            'Manuscript15.centredUniformLaw_even_moment_factorial_all',
            'Manuscript15.centredUniformLaw_even_signed_coefficient_all',
          ]
          expr=r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms"
          found={}
          for m in re.finditer(expr,log):
            found[m.group(1) or m.group(3)]={a.strip() for a in (m.group(2) or '').split(',') if a.strip()}
          allowed={'propext','Classical.choice','Quot.sound'}
          assert 'sorryAx' not in log and 'Lean.ofReduceBool' not in log
          assert not re.search(r'\.lean:\d+:\d+: error',log)
          for key in requested:
            assert key in found, 'Missing named theorem axiom audit: '+key
            assert found[key] <= allowed, 'Forbidden axioms in '+key
            print(key,sorted(found[key]))
          print('SUCCESS: all-order conditional uniform moment bridge kernel certified')
          PY
      - name: Store complete proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript15-conditional-uniform-allorder-kernel
          path: /tmp/m15-uniform-allorder.log
          if-no-files-found: ignore
