name: Manuscript 14.1 — Gram bispectral kernel and Dirichlet traces

on:
  push:
    branches:
      - manuscript14-v141-gram-resolvent-20261104
    paths:
      - 'lean/SpecialImaginaryPoint/GramKernelBispectral.lean'
      - 'numerics/arb/manuscript14_gram_resolvent_arb.py'
      - '.github/workflows/manuscript14-gram-resolvent.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manuscript14-gram-resolvent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel compilation and axiom audit
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -M16768 SpecialImaginaryPoint/GramKernelBispectral.lean 2>&1 | tee /tmp/gram-kernel-lean.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/gram-kernel-lean.log; then
            echo "::error::Forbidden axiom in output"
            exit 1
          fi
      - name: Upload Lean log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript14-gram-kernel-lean
          path: /tmp/gram-kernel-lean.log
          if-no-files-found: ignore
  arb:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned python-flint
        run: python -m pip install python-flint==0.9.0
      - name: Rigorous exact rational and Arb traces
        shell: bash
        run: |
          set -euo pipefail
          python numerics/arb/manuscript14_gram_resolvent_arb.py 2>&1 | tee /tmp/gram-resolvent-arb.log
      - name: Upload Arb log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript14-gram-resolvent-arb
          path: /tmp/gram-resolvent-arb.log
          if-no-files-found: ignore
