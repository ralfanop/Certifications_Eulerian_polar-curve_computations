name: V007 genuine bilateral singular Weyl sequence certificate

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/TwoSidedGramSingularWeylZero.lean'
      - 'lean/GegenbauerFock/TwoSidedGramWeakConvergence.lean'
      - '.github/workflows/gegenbauer-fock-gram-singular-weyl.yml'
  workflow_dispatch:

jobs:
  singular-weyl-bilateral:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then break; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep "$((attempt * 8))"
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then break; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep "$((attempt * 8))"
          done
      - name: Load pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-check bilateral singular Weyl sequences at zero
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.TwoSidedGramSingularWeylZero 2>&1 | tee /tmp/v007-gram-singular-weyl.log
          for theorem in sourceGram_has_singular_weyl_sequence_at_zero outputGram_has_singular_weyl_sequence_at_zero two_sided_gram_has_singular_weyl_sequences_at_zero; do
            grep -qF "${theorem}' depends on axioms" /tmp/v007-gram-singular-weyl.log
          done
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-gram-singular-weyl.log; then
            echo '::error::Forbidden proof axiom in full bilateral singular Weyl certificate'
            exit 1
          fi
          echo 'V007 singular Weyl sequences at zero certified for source and output Grams.'
