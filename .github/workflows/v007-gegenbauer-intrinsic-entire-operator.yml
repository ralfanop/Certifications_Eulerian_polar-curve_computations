name: V007 genuine ultraspherical transform into intrinsic entire Gaussian Fock

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireFockOperator.lean'
      - '.github/workflows/v007-gegenbauer-intrinsic-entire-operator.yml'
  workflow_dispatch:

jobs:
  gegenbauer-intrinsic-entire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore fixed Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile exact theorem and inspect axioms
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireFockOperator 2>&1 | tee /tmp/v007-intrinsic-operator.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireFockOperator.lean 2>&1 | tee /tmp/v007-intrinsic-operator-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-intrinsic-operator.log /tmp/v007-intrinsic-operator-axioms.log; then
            echo "::error::Nonstandard axiom found."
            exit 1
          fi
          for name in C_intrinsicEntire_apply C_intrinsicEntire_norm C_intrinsicEntire_injective; do
            grep -F "${name}' depends on axioms:" /tmp/v007-intrinsic-operator-axioms.log
          done
          echo 'Intrinsic entire Gegenbauer operator: kernel and axiom audit successful.'
