name: V007 exact monic Gegenbauer polynomial positive-shift diagonal

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonicPolynomialShiftDiagonal.lean'
      - '.github/workflows/v007-sturm-monic-polynomial-shift-diagonal.yml'
  workflow_dispatch:

jobs:
  monic-positive-shift-diagonal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version
      - name: Restore pinned Mathlib cache
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit monic polynomial shift and exact preimages
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleMonicPolynomialShiftDiagonal 2>&1 | tee /tmp/v007-monic-shift-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleMonicPolynomialShiftDiagonal.lean 2>&1 | tee /tmp/v007-monic-shift-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-monic-shift-build.log /tmp/v007-monic-shift-axioms.log; then
            echo '::error::Forbidden axiom in monic polynomial positive-shift formula.'
            exit 1
          fi
          grep -F "sturmMonicEigenCandidate_shift_diagonal' depends on axioms:" /tmp/v007-monic-shift-axioms.log
          grep -F "sturmMonicEigenCandidate_shift_exact_preimage' depends on axioms:" /tmp/v007-monic-shift-axioms.log
          echo 'V007 monic Gegenbauer exact polynomial shift verified and kernel-audited.'
