name: V007 actual real nuclear Gram zero spectral support

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/RealNuclearGramZeroSupport.lean'
      - 'lean/GegenbauerFock/RealNuclearGramCompactPositiveKernel.lean'
      - '.github/workflows/v007-real-nuclear-gram-zero-support.yml'
  workflow_dispatch:

jobs:
  real-gram-zero-support:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Verify real Gram actual zero eigenspace and support orthogonality
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealNuclearGramZeroSupport 2>&1 | tee /tmp/v007-real-gram-zero-support.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-gram-zero-support.log; then
            echo '::error::Forbidden axiom in real Gram zero support.'
            exit 1
          fi
          for theorem in \
            realNuclearGram_zero_eigenspace_eq_kernel \
            realNuclearGram_nonzero_mode_orthogonal_kernel \
            realNuclearGram_nonzero_family_orthogonal_kernel; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-real-gram-zero-support.log
          done
          echo 'Real Gram exact zero eigenspace and orthogonal source support kernel-certified.'
