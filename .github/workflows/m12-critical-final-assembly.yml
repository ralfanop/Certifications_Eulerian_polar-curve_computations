name: M12 quartic full theorem vertical assembly
on:
  pull_request:
    paths:
      - 'lean/EulerianGrothendieck/CriticalWindowFinalAssembly.lean'
      - '.github/workflows/m12-critical-final-assembly.yml'
  workflow_dispatch:
jobs:
  finalassembly:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore pinned Lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile actual Fock vertical assembly and prerequisites
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          lake exe cache get
          mkdir -p .lake/build/lib/lean
          for module in CriticalWindowQuartic CriticalWindowGlobalMGF CriticalWindowComplexMGF CriticalWindowAnalyticRemainder CriticalWindowFockDomination CriticalWindowGammaVacuum; do
            lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean"
          done
          lake env lean CriticalWindowFinalAssembly.lean 2>&1 | tee /tmp/m12-critical-final-assembly.log
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
      - name: Strict exact-declaration axiom audit
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          data = Path('/tmp/m12-critical-final-assembly.log').read_text()
          assert ': error' not in data and 'sorryAx' not in data and 'Lean.ofReduceBool' not in data
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          names = ['line_dilation','plane_dilation','originalFockNorm_plane_dilation',
                   'critical_jacobian','normalized_originalFockNorm']
          for name in names:
              full = 'M12CriticalAssembly.' + name
              match = re.search(r"'" + re.escape(full) + r"' depends on axioms: \[([^\]]*)\]", data)
              if match:
                  axioms = {x.strip() for x in match.group(1).split(',') if x.strip()}
                  assert axioms <= allowed, (full, axioms - allowed)
              else:
                  assert "'" + full + "' does not depend on any axioms" in data, full
              print('AXIOM AUDIT SUCCESS', full)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-critical-final-assembly-audit
          path: /tmp/m12-critical-final-assembly.log
