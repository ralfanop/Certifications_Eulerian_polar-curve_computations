name: V007 closed Gegenbauer Sturm first nonconstant eigenvalue and gap

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonicClosedSpectralGap.lean'
      - '.github/workflows/v007-ultraspherical-sturm-closed-spectral-gap.yml'
  workflow_dispatch:

jobs:
  closed-sturm-spectral-gap:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and axiom-audit genuine Gegenbauer spectral gap
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleMonicClosedSpectralGap 2>&1 | tee /tmp/v007-closed-sturm-gap-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleMonicClosedSpectralGap.lean 2>&1 | tee /tmp/v007-closed-sturm-gap-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-closed-sturm-gap-build.log /tmp/v007-closed-sturm-gap-axioms.log; then
            echo '::error::Forbidden axiom in true Sturm spectral gap.'
            exit 1
          fi
          grep -F "sturmEigenvalue_positive_degree_gap' depends on axioms:" /tmp/v007-closed-sturm-gap-axioms.log
          grep -F "sturmEigenvalue_degree_ge_two_strict' depends on axioms:" /tmp/v007-closed-sturm-gap-axioms.log
          grep -F "sturmRealClosed_first_nonconstant_eigenmode' depends on axioms:" /tmp/v007-closed-sturm-gap-axioms.log
          grep -F "sturmRealClosed_first_nonconstant_Fourier_coordinate' depends on axioms:" /tmp/v007-closed-sturm-gap-axioms.log
          echo 'V007 true closed Sturm first spectral gap: kernel-certified.'
