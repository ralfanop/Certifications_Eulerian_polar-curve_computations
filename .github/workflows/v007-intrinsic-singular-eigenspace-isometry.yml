name: V007 actual holomorphic Fock singular eigenspace norm and distance isometry

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireSingularEigenspaceIsometry.lean'
      - '.github/workflows/v007-intrinsic-singular-eigenspace-isometry.yml'
  workflow_dispatch:

jobs:
  true-analytic-eigenspace-normalized-isometry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Check actual holomorphic output singular isometry and axioms
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireSingularEigenspaceIsometry 2>&1 | tee /tmp/v007-analytic-singular-isometry.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireSingularEigenspaceIsometry.lean 2>&1 | tee -a /tmp/v007-analytic-singular-isometry.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-analytic-singular-isometry.log; then
            echo "::error::Forbidden axiom in true Gaussian Fock singular eigenspace isometry"
            exit 1
          fi
          for theorem in \
            C_intrinsicEntire_positive_gram_eigenvector_norm \
            C_intrinsicEntire_normalized_positive_eigenvector_norm \
            C_intrinsicEntire_normalized_positive_eigenspace_dist; do
            grep -F "$theorem' depends on axioms:" /tmp/v007-analytic-singular-isometry.log
          done
          echo 'V007 true Fock Hilbert normalized singular eigenspace metric isometry audited.'
