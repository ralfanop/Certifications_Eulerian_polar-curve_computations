name: V007 genuine intrinsic Gaussian Fock inverse instability

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireInverseInstability.lean'
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireApproximateNullSequence.lean'
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireFockOperator.lean'
      - 'lean/GegenbauerFock/FockNoContinuousReconstruction.lean'
      - 'lean/GegenbauerFock/FockInverseInstability.lean'
      - '.github/workflows/v007-intrinsic-fock-inverse-instability.yml'
  workflow_dispatch:

jobs:
  intrinsic-fock-inverse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Resolve pinned Mathlib and cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit intrinsic Gaussian Fock inverse instability
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireInverseInstability GegenbauerFock.GegenbauerIntrinsicEntireApproximateNullSequence 2>&1 | tee /tmp/v007-intrinsic-inverse.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireInverseInstability.lean 2>&1 | tee -a /tmp/v007-intrinsic-inverse.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireApproximateNullSequence.lean 2>&1 | tee -a /tmp/v007-intrinsic-inverse.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-intrinsic-inverse.log; then
            echo "::error::Forbidden axioms in intrinsic Gaussian Fock inverse instability"
            exit 1
          fi
          grep -F "C_intrinsicEntire_no_continuous_global_reconstruction' depends on axioms:" /tmp/v007-intrinsic-inverse.log
          grep -F "C_intrinsicEntire_no_uniform_lower_norm_bound' depends on axioms:" /tmp/v007-intrinsic-inverse.log
          grep -F "C_intrinsicEntire_normalized_approximate_null_no_strong_limit' depends on axioms:" /tmp/v007-intrinsic-inverse.log
          echo 'Intrinsic Gaussian Fock inverse instability: Lean kernel and axioms clean.'
