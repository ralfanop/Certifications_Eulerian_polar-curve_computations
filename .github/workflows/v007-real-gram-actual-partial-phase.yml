name: V007 actual real Gram positive bounded partial phase

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/RealNuclearGramActualPartialPhase.lean'
      - 'lean/GegenbauerFock/RealNuclearGramBoundedPartialPhase.lean'
      - '.github/workflows/v007-real-gram-actual-partial-phase.yml'
  workflow_dispatch:

jobs:
  actual-real-gram-partial-phase:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Certify actual Gram positive bounded partial phase
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealNuclearGramActualPartialPhase 2>&1 | tee /tmp/v007-real-actual-partial-phase.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-actual-partial-phase.log; then
            echo '::error::Forbidden axiom in actual real Gram positive partial phase.'
            exit 1
          fi
          for theorem in \
            realGramPositivePartialPhase_on_mode \
            realGramPositivePartialPhase_initial_projection \
            realGramPositivePartialPhase_final_projection; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-real-actual-partial-phase.log
          done
          echo 'Actual real Gram bounded polar phase and exact initial/final projections kernel-certified.'
