name: M16 equation 60 trilogarithm and strict Arb
on:
  pull_request:
    paths:
      - 'lean/Manuscript16/Eq60Trilogarithm.lean'
      - 'numerics/arb/m16_eq60_trilogarithm_million.py'
      - '.github/workflows/m16-eq60-trilogarithm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Lean and Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD | tee /tmp/m16-eq60-head.log
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          grep -F '0272bbe1c093d038d7257ab15306abd58245f9ff' lakefile.toml
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile and audit
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SharedCore
          lake env lean -o .lake/build/lib/lean/SharedCore/Det4ZetaMoments.olean SharedCore/Det4ZetaMoments.lean
          lake env lean Manuscript16/Eq60Trilogarithm.lean 2>&1 | tee /tmp/m16-eq60-lean.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/m16-eq60-lean.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/m16-eq60-lean.log').read_text()
          for suffix in ['partial_fraction', 'reciprocal_summable', 'telescoping_partial', 'complement_real', 'trilog_term_bound', 'trilog_uniform', 'integral_term', 'integral_trilogarithm', 'eq60_series', 'eq60_integral', 'eq60_chain']:
              name = 'Manuscript16.Eq60.'+suffix
              matches = re.findall(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", log, re.S)
              assert matches or ("'"+name+"' does not depend on any axioms") in log, name
              for match in matches:
                  assert {x.strip() for x in match.split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'}
              print('AXIOM AUDIT SUCCESS:',name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m16-eq60-lean
          path: /tmp/m16-eq60-*.log
  arb:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact commit and pinned FLINT
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee m16-eq60-head.log
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m pip install python-flint==0.9.0
      - name: Individual accuracy and strict exact rounding
        run: |
          set -euo pipefail
          /usr/bin/time -v python numerics/arb/m16_eq60_trilogarithm_million.py 2>&1 | tee m16-eq60-arb.log
          grep -F 'MILLION SUCCESS m16-eq60-trilogarithm' m16-eq60-arb.log
          test -s million-m16-eq60-trilogarithm.json
          gzip -t million-enclosures.jsonl.gz m16-eq60-endpoints.jsonl.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m16-eq60-trilogarithm-million
          path: |
            m16-eq60-head.log
            m16-eq60-arb.log
            million-m16-eq60-trilogarithm.json
            m16-eq60-endpoints.jsonl.gz
            million-enclosures.jsonl.gz
          compression-level: 0
          if-no-files-found: warn
