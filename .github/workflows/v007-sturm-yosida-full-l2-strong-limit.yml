name: V007 genuine full L2 Yosida semigroup strong limit

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealYosidaAllL2StrongLimit.lean'
      - '.github/workflows/v007-sturm-yosida-full-l2-strong-limit.yml'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealYosidaFiniteSpanLimit.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealYosidaStrongLimitDensityPrinciple.lean'
  workflow_dispatch:

jobs:
  genuine-full-l2-yosida-strong-limit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and kernel audit actual full L2 Yosida strong limit
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealYosidaAllL2StrongLimit 2>&1 | tee /tmp/v007-full-l2-strong-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealYosidaAllL2StrongLimit.lean 2>&1 | tee /tmp/v007-full-l2-strong-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-full-l2-strong-build.log /tmp/v007-full-l2-strong-axioms.log; then
            echo '::error::Forbidden axiom in genuine full-L2 Yosida strong limit.'
            exit 1
          fi
          grep -F "sturmRealYosidaExponential_allL2_strong_limit_exists' depends on axioms:" /tmp/v007-full-l2-strong-axioms.log
          echo 'V007 genuine weighted-real-L2 strong Yosida semigroup limit kernel-certified.'
