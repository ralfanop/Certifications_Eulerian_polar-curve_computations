name: V007 exact rectangular Fock-adjoint Hilbert-Schmidt norm

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/FockAdjointHilbertSchmidtExact.lean'
      - '.github/workflows/gegenbauer-fock-adjoint-hs-exact.yml'
  workflow_dispatch:

jobs:
  adjoint-hs-exact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and Lake
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors \
            --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then
              installed=1
              break
            fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then
              installed=1
              break
            fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
      - name: Restore pinned Mathlib and precompiled cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build actual adjoint S2 norm module
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.FockAdjointHilbertSchmidtExact 2>&1 | tee /tmp/v007-fockadjoint-build.log
      - name: Recheck kernel axioms for all three new declarations
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/FockAdjointHilbertSchmidtExact.lean 2>&1 | tee /tmp/v007-fockadjoint-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-fockadjoint-axioms.log; then
            echo '::error::Forbidden Lean axiom detected.'
            exit 1
          fi
          grep -F 'C_adjoint_any_Fock_basis_HSEnergy_summable' /tmp/v007-fockadjoint-axioms.log
          grep -F 'C_adjoint_any_Fock_basis_HSEnergy_eq_kummer' /tmp/v007-fockadjoint-axioms.log
          grep -F 'C_adjoint_any_Fock_basis_HSNorm_eq_sqrt_kummer' /tmp/v007-fockadjoint-axioms.log
