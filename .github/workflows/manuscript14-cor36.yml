name: Manuscript 14.1 Corollary 3.6 — isolated Lean and Arb checks

on:
  push:
    branches:
      - manuscript14-cor36-lean-arb-20261104
    paths:
      - 'lean/SpecialImaginaryPoint/Corollary36.lean'
      - 'lean/SpecialImaginaryPoint/Corollary36Analytic.lean'
      - 'numerics/arb/manuscript14_cor36_arb.py'
      - '.github/workflows/manuscript14-cor36.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean_corollary36:
    name: Kernel check / axioms — Corollary 3.6
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib cache
        working-directory: lean
        run: |
          lake update
          lake exe cache get
      - name: Compile dependencies and Corollary 3.6 (only)
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/FormalBorelComplex.olean SpecialImaginaryPoint/FormalBorelComplex.lean 2>&1 | tee /tmp/manuscript14_cor36_lean.log
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/BorelAnalyticConvergence.olean SpecialImaginaryPoint/BorelAnalyticConvergence.lean 2>&1 | tee -a /tmp/manuscript14_cor36_lean.log
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/Corollary36.olean SpecialImaginaryPoint/Corollary36.lean 2>&1 | tee -a /tmp/manuscript14_cor36_lean.log
          lake env lean -M16768 SpecialImaginaryPoint/Corollary36Analytic.lean 2>&1 | tee -a /tmp/manuscript14_cor36_lean.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/manuscript14_cor36_lean.log; then
            echo "::error::Forbidden Lean axiom found"
            exit 1
          fi
      - name: Upload Lean log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cor36-lean-log
          path: /tmp/manuscript14_cor36_lean.log
          if-no-files-found: ignore

  arb_corollary36:
    name: Arb / exact Q — Corollary 3.6
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Arb python-flint binding (pinned)
        run: python -m pip install python-flint==0.9.0
      - name: Execute Corollary 3.6 only
        shell: bash
        run: |
          set -euo pipefail
          python numerics/arb/manuscript14_cor36_arb.py 2>&1 | tee /tmp/manuscript14_cor36_arb.log
      - name: Upload Arb log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cor36-arb-log
          path: /tmp/manuscript14_cor36_arb.log
          if-no-files-found: ignore
