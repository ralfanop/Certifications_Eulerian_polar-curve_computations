name: M13 Mellin-Rindler 2026-11-24 Lean exact-head audit
on:
  pull_request:
    paths:
      - 'lean/Manuscript13/MellinRindler20261124.lean'
      - '.github/workflows/m13-mellin-rindler-20261124.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-head pinned Lean 4 compile and axiom audit
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
          git rev-parse HEAD | tee /tmp/mellin-rindler-lean.log
          for f in Manuscript13/MellinRindler20261124.lean; do
            echo "COMPILING $f" | tee -a /tmp/mellin-rindler-lean.log
            lake env lean -M16768 "$f" 2>&1 | tee -a /tmp/mellin-rindler-lean.log
          done
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/mellin-rindler-lean.log; then exit 1; fi
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/mellin-rindler-lean.log').read_text()
          declarations={
            "Manuscript13.MellinRindler20261124":[
              "multiplier_pos","multiplier_reciprocal","multiplier_zero","multiplier_add",
              "multiplier_inverse","multiplier_bound","multiplier_attains","multiplier_isGreatest",
              "project_idempotent","project_add","mono_zero","mono_add","mono_inverse","mono_project_commute"]
          }
          count=0
          for ns, names in declarations.items():
            for name in names:
              full="'"+ns+"."+name+"'"
              found=re.findall(re.escape(full)+r" depends on axioms: \[([^\]]*)\]",t,re.S)
              assert found or full+" does not depend on any axioms" in t,full
              for a in found:
                assert {x.strip() for x in a.split(',') if x.strip()} <= {
                   'propext','Quot.sound','Classical.choice'},(full,a)
              count+=1
          assert count==14
          print("SUCCESS MELLIN RINDLER M13 LEAN AXIOM AUDIT",count)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mellin-rindler-m13-lean-20261124-log
          path: /tmp/mellin-rindler-lean.log
          if-no-files-found: warn
