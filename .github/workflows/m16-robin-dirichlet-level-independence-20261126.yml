name: M16 Proposition 14.2 level independence of H_D, H_R and first resolvent identity (exact HEAD)
on:
  pull_request:
    paths:
      - 'lean/Manuscript16/RobinDirichletLevelIndependence20261126.lean'
      - 'lean/Manuscript16/RobinDirichletRankOne20261125.lean'
      - 'lean/Manuscript16/RobinDirichletL2Bounded20261125.lean'
      - 'lean/Manuscript16/RobinDirichletPositive20261125.lean'
      - 'lean/Manuscript16/RobinDirichletInjective20261125.lean'
      - 'lean/Manuscript16/RobinDirichletWeakResolvent20261125.lean'
      - 'lean/Manuscript16/RobinDirichletRealisation20261125.lean'
      - 'lean/lakefile.toml'
      - 'lean/lean-toolchain'
      - 'audits/manuscript16/M16_robin_dirichlet_level_independence_20261126.md'
      - '.github/workflows/m16-robin-dirichlet-level-independence-20261126.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Lean 4 toolchain and Mathlib
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD | tee /tmp/m16-rdlev-head.log
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          grep -F '0272bbe1c093d038d7257ab15306abd58245f9ff' lakefile.toml
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
          lake env lean --version | tee -a /tmp/m16-rdlev-head.log
      - name: Compile the 6 imported modules and the new module, audit every declaration
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          SRC=Manuscript16/RobinDirichletLevelIndependence20261126
          DEPS="Manuscript16/RobinDirichletRankOne20261125 Manuscript16/RobinDirichletL2Bounded20261125 Manuscript16/RobinDirichletPositive20261125 Manuscript16/RobinDirichletInjective20261125 Manuscript16/RobinDirichletWeakResolvent20261125 Manuscript16/RobinDirichletRealisation20261125"
          mkdir -p .lake/build/lib/lean/Manuscript16
          for m in $DEPS $SRC; do
            if grep -nE '\bsorry\b|\badmit\b|^\s*axiom\b|\bunsafe\b|implemented_by|extern' "$m.lean"; then exit 1; fi
          done
          for m in $DEPS; do
            lake env lean -M16768 -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 | tee "/tmp/m16-rdlev-dep-$(basename $m).log"
            if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' "/tmp/m16-rdlev-dep-$(basename $m).log"; then exit 1; fi
          done
          lake env lean -M16768 -o ".lake/build/lib/lean/$SRC.olean" "$SRC.lean" 2>&1 | tee /tmp/m16-rdlev-lean.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|warning:|declaration uses .sorry.|Try this' /tmp/m16-rdlev-lean.log; then exit 1; fi
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          # Names may contain primes (e.g. `foo'`): match the whole non-blank token between quotes.
          report = re.compile(r"'(\S+)' depends on axioms: \[([^\]]*)\]", re.S)
          deps = {}
          wrapped = 0
          for p in sorted(Path('/tmp').glob('m16-rdlev-dep-*.log')):
              text = p.read_text()
              n_lines = len(re.findall(r"' depends on axioms: \[", text)) + len(re.findall(r"' does not depend on any axioms", text))
              found = report.findall(text)
              assert len(found) == n_lines, (p.name, len(found), n_lines)
              for name, a in found:
                  wrapped += '\n' in a
                  axioms = sorted({x.strip() for x in a.split(',') if x.strip()})
                  assert set(axioms) <= allowed, (p.name, name, axioms)
                  deps[name] = axioms
          assert len(deps) == 219, len(deps)
          src = Path('Manuscript16/RobinDirichletLevelIndependence20261126.lean')
          log = Path('/tmp/m16-rdlev-lean.log').read_text()
          requested = re.findall(r'^#print axioms (\S+)', src.read_text(), re.M)
          assert len(requested) == 39 and len(set(requested)) == 39, requested
          own_wrapped = 0
          audit = {}
          for name in requested:
              found = re.findall(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", log, re.S)
              assert found or ("'" + name + "' does not depend on any axioms") in log, name
              own_wrapped += sum('\n' in a for a in found)
              axioms = sorted({x.strip() for a in found for x in a.split(',') if x.strip()})
              assert set(axioms) <= allowed, (name, axioms)
              audit[name] = axioms
              print('AXIOM AUDIT SUCCESS:', name, axioms)
          out = {
              'head': Path('/tmp/m16-rdlev-head.log').read_text().split()[0],
              'source_sha256': hashlib.sha256(src.read_bytes()).hexdigest(),
              'olean_sha256': hashlib.sha256(Path('.lake/build/lib/lean/Manuscript16/RobinDirichletLevelIndependence20261126.olean').read_bytes()).hexdigest(),
              'log_sha256': hashlib.sha256(log.encode()).hexdigest(),
              'axioms': audit,
              'wrapped_lists': own_wrapped,
              'imported_module_axioms': deps,
              'imported_wrapped_lists': wrapped,
          }
          Path('/tmp/m16-rdlev-audit.json').write_text(json.dumps(out, indent=2) + '\n')
          print('SUCCESS:', len(audit), 'declarations (', own_wrapped, 'wrapped lists ) and', len(deps), 'imported reports (', wrapped, 'wrapped lists ); standard axioms only')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m16-robin-dirichlet-level-independence-audit
          path: |
            /tmp/m16-rdlev-*.log
            /tmp/m16-rdlev-audit.json
