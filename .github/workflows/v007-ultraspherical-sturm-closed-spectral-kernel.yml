name: V007 exact kernel of closed Sturm operator in Gegenbauer spectral coordinates

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealClosedSpectralKernel.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleExactGegenbauerSpectralClosure.lean'
      - '.github/workflows/v007-ultraspherical-sturm-closed-spectral-kernel.yml'
  workflow_dispatch:

jobs:
  exact-closed-spectral-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and kernel-audit exact Sturm zero eigenspace
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealClosedSpectralKernel 2>&1 | tee /tmp/v007-spectral-kernel-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealClosedSpectralKernel.lean 2>&1 | tee /tmp/v007-spectral-kernel-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-spectral-kernel-build.log /tmp/v007-spectral-kernel-axioms.log; then
            echo '::error::Forbidden axiom in closed Sturm spectral-kernel identification.'
            exit 1
          fi
          grep -F "sturmRealClosed_kernel_iff_monicHilbert_positive_coeff_zero' depends on axioms:" /tmp/v007-spectral-kernel-axioms.log
          echo 'V007 exact Sturm zero eigenspace kernel-certified.'
