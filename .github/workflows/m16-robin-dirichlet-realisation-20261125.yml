name: M16 v16.5 Prop 14.2 self-adjoint H_D, H_R on L2(0,inf) with resolvents K_D, K_R at t (exact HEAD)
on:
  pull_request:
    paths:
      - 'lean/Manuscript16/RobinDirichletRealisation20261125.lean'
      - 'lean/Manuscript16/RobinDirichletWeakResolvent20261125.lean'
      - 'lean/Manuscript16/RobinDirichletInjective20261125.lean'
      - 'lean/Manuscript16/RobinDirichletPositive20261125.lean'
      - 'lean/Manuscript16/RobinDirichletL2Bounded20261125.lean'
      - 'lean/Manuscript16/RobinDirichletRankOne20261125.lean'
      - '.github/workflows/m16-robin-dirichlet-realisation-20261125.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Lean 4 toolchain and Mathlib
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD | tee /tmp/m16-rdsa-head.log
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          grep -F '0272bbe1c093d038d7257ab15306abd58245f9ff' lakefile.toml
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
          lake env lean --version | tee -a /tmp/m16-rdsa-head.log
      - name: Compile the five imported modules and the new module, audit every declaration
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          DEPS="RobinDirichletRankOne20261125 RobinDirichletL2Bounded20261125 RobinDirichletPositive20261125 RobinDirichletInjective20261125 RobinDirichletWeakResolvent20261125"
          SRC=RobinDirichletRealisation20261125
          mkdir -p .lake/build/lib/lean/Manuscript16
          for m in $DEPS $SRC; do
            if grep -nE '\bsorry\b|\badmit\b|^\s*axiom\b|\bunsafe\b|implemented_by|extern' "Manuscript16/$m.lean"; then exit 1; fi
          done
          for m in $DEPS $SRC; do
            lake env lean -M16768 -o ".lake/build/lib/lean/Manuscript16/$m.olean" "Manuscript16/$m.lean" 2>&1 | tee "/tmp/m16-rdsa-$m.log"
            if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|warning:|declaration uses .sorry.|Try this' "/tmp/m16-rdsa-$m.log"; then exit 1; fi
          done
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}

          def audit(mod, expected, verbose):
              src = Path('Manuscript16/' + mod + '.lean')
              log = Path('/tmp/m16-rdsa-' + mod + '.log').read_text()
              requested = re.findall(r'^#print axioms (\S+)', src.read_text(), re.M)
              assert len(requested) == expected and len(set(requested)) == expected, (mod, len(requested))
              out = {}
              for name in requested:
                  found = re.findall(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", log, re.S)
                  assert found or ("'" + name + "' does not depend on any axioms") in log, name
                  axioms = sorted({x.strip() for a in found for x in a.split(',') if x.strip()})
                  assert set(axioms) <= allowed, (name, axioms)
                  out[name] = axioms
                  if verbose:
                      print('AXIOM AUDIT SUCCESS:', name, axioms)
              assert len(out) == expected, len(out)
              return out

          deps = {
              'RobinDirichletRankOne20261125': 64,
              'RobinDirichletL2Bounded20261125': 29,
              'RobinDirichletPositive20261125': 50,
              'RobinDirichletInjective20261125': 17,
              'RobinDirichletWeakResolvent20261125': 36,
          }
          ndep = sum(len(audit(m, n, False)) for m, n in deps.items())
          new = audit('RobinDirichletRealisation20261125', 23, True)
          sha = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          out = {
              'head': Path('/tmp/m16-rdsa-head.log').read_text().split()[0],
              'source_sha256': sha('Manuscript16/RobinDirichletRealisation20261125.lean'),
              'dependency_sha256': {('Manuscript16/' + m + '.lean'): sha('Manuscript16/' + m + '.lean') for m in deps},
              'olean_sha256': sha('.lake/build/lib/lean/Manuscript16/RobinDirichletRealisation20261125.olean'),
              'log_sha256': sha('/tmp/m16-rdsa-RobinDirichletRealisation20261125.log'),
              'dependency_declarations': ndep,
              'axioms': new,
          }
          Path('/tmp/m16-rdsa-audit.json').write_text(json.dumps(out, indent=2) + '\n')
          print('SUCCESS:', len(new), 'theorems and', ndep, 'imported declarations; standard axioms only')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m16-robin-dirichlet-realisation-audit
          path: |
            /tmp/m16-rdsa-*.log
            /tmp/m16-rdsa-audit.json
