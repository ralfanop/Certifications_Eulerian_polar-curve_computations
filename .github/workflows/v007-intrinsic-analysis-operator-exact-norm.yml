name: V007 genuine analytic Fock analysis operator norm equality

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireAnalysisOperatorExactNorm.lean'
      - '.github/workflows/v007-intrinsic-analysis-operator-exact-norm.yml'
  workflow_dispatch:

jobs:
  true-analytic-analysis-exact-norm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Check three genuine Gaussian analysis operator exact norm identities
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireAnalysisOperatorExactNorm 2>&1 | tee /tmp/v007-intrinsic-analysis-exact-norm.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireAnalysisOperatorExactNorm.lean 2>&1 | tee -a /tmp/v007-intrinsic-analysis-exact-norm.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-intrinsic-analysis-exact-norm.log; then
            echo "::error::Forbidden axiom in actual analytic analysis exact norm"
            exit 1
          fi
          for theorem in \
            C_intrinsicEntire_operator_norm_eq \
            C_intrinsicEntire_outputGram_norm_eq_intrinsic_operator_sq \
            C_intrinsicEntire_both_gram_norms_eq_intrinsic_operator_sq; do
            grep -F "$theorem' depends on axioms:" /tmp/v007-intrinsic-analysis-exact-norm.log
          done
          echo 'V007 exact true analytic analysis operator and both Gram norms audited.'
