name: V007 true Gaussian Fock output Fredholm essential spectral zero

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireOutputGramEssentialSpectrum.lean'
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireOutputGramSpectral.lean'
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireOutputGramContinuousSpectrum.lean'
      - '.github/workflows/v007-intrinsic-output-gram-essential-spectrum.yml'
  workflow_dispatch:

jobs:
  intrinsic-output-essential-zero:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Verify true output Fredholm zero and audit 3 theorems
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireOutputGramEssentialSpectrum 2>&1 | tee /tmp/v007-intrinsic-output-essential.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireOutputGramEssentialSpectrum.lean 2>&1 | tee -a /tmp/v007-intrinsic-output-essential.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-intrinsic-output-essential.log; then
            echo "::error::Forbidden axiom in true output Gram Fredholm essential zero"
            exit 1
          fi
          for theorem in \
            C_intrinsicEntire_outputGram_zero_not_fredholm \
            C_intrinsicEntire_outputGram_zero_mem_fredholm_essential \
            C_intrinsicEntire_two_gram_zero_fredholm_essential; do
              grep -F "$theorem' depends on axioms:" /tmp/v007-intrinsic-output-essential.log
          done
          echo 'V007 real entire Gaussian output Gram essential spectral zero audited.'
