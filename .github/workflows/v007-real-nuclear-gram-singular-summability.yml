name: V007 actual real nuclear Gram singular summability

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/RealNuclearGramSingularSummability.lean'
      - 'lean/GegenbauerFock/RealNuclearGramAdjointSingularRelation.lean'
      - 'lean/GegenbauerFock/RealNuclearGramNonzeroSingularTransfer.lean'
      - 'lean/GegenbauerFock/RealNuclearTwoOrthonormalAllCostsDual.lean'
      - '.github/workflows/v007-real-nuclear-gram-singular-summability.yml'
  workflow_dispatch:

jobs:
  real-gram-singular-summability:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Verify actual real nuclear Gram singular summability
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealNuclearGramSingularSummability 2>&1 | tee /tmp/v007-real-gram-singular-summability.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-gram-singular-summability.log; then
            echo '::error::Forbidden axiom in real Gram singular summability.'
            exit 1
          fi
          for theorem in \
            realNuclearSingularFamily_finite_sum_le_cost \
            HasRealNuclearRankOneSeries.singularFamily_summable \
            HasRealNuclearRankOneSeries.singularFamily_tsum_le_infimum \
            HasRealNuclearRankOneSeries.gram_nonzero_singular_summable \
            HasRealNuclearRankOneSeries.gram_nonzero_singular_tsum_le_infimum; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-real-gram-singular-summability.log
          done
          echo 'Actual real Gram singular summability and universal nuclear-infimum bounds kernel-certified.'
