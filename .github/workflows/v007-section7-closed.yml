name: V007 Section 7 closed realization and Gegenbauer eigenfamily (13, Thm 7.3, Cor 7.4)
on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/Section7Closed.lean'
      - '.github/workflows/v007-section7-closed.yml'
  workflow_dispatch:
jobs:
  section7-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit V007 Section 7 closed realization and Gegenbauer eigenfamily (13, Thm 7.3, Cor 7.4)
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.Section7Closed 2>&1 | tee /tmp/section7-closed-build.log
          lake env lean -M16768 GegenbauerFock/Section7Closed.lean 2>&1 | tee /tmp/section7-closed-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/section7-closed-build.log /tmp/section7-closed-axioms.log; then
            echo '::error::Forbidden axiom in Section7Closed.'
            exit 1
          fi
          grep -F "GegenbauerFock.Section7Closed.theorem_7_3_closed' depends on axioms:" /tmp/section7-closed-axioms.log
          grep -F "GegenbauerFock.Section7Closed.theorem_7_3_dense' depends on axioms:" /tmp/section7-closed-axioms.log
          grep -F "GegenbauerFock.Section7Closed.theorem_7_3_intertwining' depends on axioms:" /tmp/section7-closed-axioms.log
          grep -F "GegenbauerFock.Section7Closed.corollary_7_4_ne_zero' depends on axioms:" /tmp/section7-closed-axioms.log
          grep -F "GegenbauerFock.Section7Closed.corollary_7_4_eigen' depends on axioms:" /tmp/section7-closed-axioms.log
          grep -F "GegenbauerFock.Section7Closed.corollary_7_4_complete' depends on axioms:" /tmp/section7-closed-axioms.log
          echo 'V007 Section 7 closed realization and Gegenbauer eigenfamily (13, Thm 7.3, Cor 7.4): kernel-certified.'
