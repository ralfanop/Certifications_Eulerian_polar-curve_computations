name: V007 genuine Fourier not a topological embedding

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireFourierNotTopologicalEmbedding.lean'
      - '.github/workflows/v007-fourier-bochner-not-topological-embedding.yml'
  workflow_dispatch:

jobs:
  actual-fourier-not-embedding:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib and cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile nonembedding and discontinuity of inverse restricted to actual Fourier range
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireFourierNotTopologicalEmbedding 2>&1 | tee /tmp/v007-fourier-not-embedding-build.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireFourierNotTopologicalEmbedding.lean 2>&1 | tee /tmp/v007-fourier-not-embedding-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-fourier-not-embedding-build.log /tmp/v007-fourier-not-embedding-axioms.log; then
            echo "::error::Forbidden axiom in Fourier nonembedding theorem"
            exit 1
          fi
          for name in ultraspherical_fourierBochner_function_zero ultraspherical_fourierBochner_not_isEmbedding ultraspherical_fourierBochner_rangeZero ultraspherical_fourierBochner_range_inverse_not_continuousAt_zero; do
            grep -F "${name}' depends on axioms:" /tmp/v007-fourier-not-embedding-axioms.log
          done
          echo 'V007 Fourier nonembedding and inverse discontinuity on image kernel audit successful.'
