name: M14 Lang-Alfano complex Chebyshev lift
on:
  push:
    branches: [main, m14-chebyshev-complex-lang-alfano-20261128]
    paths:
      - 'lean/SpecialImaginaryPoint/LangAlfanoComplexChebyshev.lean'
      - '.github/workflows/m14-lang-alfano-chebyshev.yml'
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/LangAlfanoComplexChebyshev.lean'
      - '.github/workflows/m14-lang-alfano-chebyshev.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake exe cache get
        working-directory: lean
      - name: Compile dependencies and audit
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean SpecialImaginaryPoint/LangAlfanoComplexChebyshev.lean 2>&1 | tee /tmp/lang-alfano-chebyshev.log
          python - <<'PY'
          import re
          s=open('/tmp/lang-alfano-chebyshev.log').read()
          assert not re.search(r'sorryAx|Lean\.ofReduceBool|declaration uses|: error:',s)
          a=re.findall(r"^'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s,re.M)
          assert len(a)==len({n for n,_ in a})==10,a
          for n,ax in a:
              assert set(filter(None,(v.strip() for v in ax.split(',')))) <= {'propext','Classical.choice','Quot.sound'},(n,ax)
          print('10/10 complex Chebyshev declarations audited')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lang-alfano-chebyshev-audit
          path: /tmp/lang-alfano-chebyshev.log
