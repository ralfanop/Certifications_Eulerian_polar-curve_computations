name: V007 true Gram positive shift coercivity
on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/CanonicalCFCGramPositiveShiftCoercivity.lean'
      - 'lean/GegenbauerFock/CanonicalCFCGramTikhonovContraction.lean'
      - 'lean/GegenbauerFock/CanonicalCFCGramTikhonovDenseRangeError.lean'
      - '.github/workflows/v007-gram-positive-shift-coercivity.yml'
  workflow_dispatch:
concurrency:
  group: v007-gram-positive-coercivity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  norm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile coercivity and kernel axiom audit
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.CanonicalCFCGramPositiveShiftCoercivity GegenbauerFock.CanonicalCFCGramTikhonovContraction GegenbauerFock.CanonicalCFCGramTikhonovDenseRangeError 2>&1 | tee /tmp/v007-coercivity-build.log
          lake env lean -M16768 GegenbauerFock/CanonicalCFCGramPositiveShiftCoercivity.lean 2>&1 | tee /tmp/v007-coercivity-axioms.log
          lake env lean -M16768 GegenbauerFock/CanonicalCFCGramTikhonovContraction.lean 2>&1 | tee -a /tmp/v007-coercivity-axioms.log
          lake env lean -M16768 GegenbauerFock/CanonicalCFCGramTikhonovDenseRangeError.lean 2>&1 | tee -a /tmp/v007-coercivity-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-coercivity-build.log /tmp/v007-coercivity-axioms.log; then
            echo '::error::Forbidden axiom in Gram coercivity'
            exit 1
          fi
          grep -F "sourceGram_positive_shift_norm_lower' depends on axioms:" /tmp/v007-coercivity-axioms.log
          grep -F "sourceGramTikhonov_error_pointwise_contract' depends on axioms:" /tmp/v007-coercivity-axioms.log
          grep -F "sourceGramTikhonov_error_opNorm_le_one' depends on axioms:" /tmp/v007-coercivity-axioms.log
          grep -F "sourceGramTikhonov_error_on_range' depends on axioms:" /tmp/v007-coercivity-axioms.log
          grep -F "sourceGramTikhonov_error_on_range_norm' depends on axioms:" /tmp/v007-coercivity-axioms.log
          echo 'V007 true Gram coercivity, contraction and dense-range Tikhonov error certified'
