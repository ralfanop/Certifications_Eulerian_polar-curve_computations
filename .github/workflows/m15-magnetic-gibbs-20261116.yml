name: M15 Magnetic Gibbs transport and geometric extensions
on:
  pull_request:
    paths:
      - 'lean/Manuscript15/MagneticGibbsTransport20261116.lean'
      - 'lean/Manuscript15/Section27PrimalWasserstein.lean'
      - 'numerics/arb/m15_magnetic_gibbs_20261116_million.py'
      - 'numerics/arb/million_decimal_common.py'
      - '.github/workflows/m15-magnetic-gibbs-20261116.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact HEAD and Lean toolchain
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile and audit
        working-directory: lean
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p .lake/build/lib/lean/Manuscript15
          git rev-parse HEAD | tee /tmp/m15-magnetic-gibbs-lean.log
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/Section27PrimalWasserstein.olean Manuscript15/Section27PrimalWasserstein.lean 2>&1 | tee -a /tmp/m15-magnetic-gibbs-lean.log
          lake env lean -M16768 Manuscript15/MagneticGibbsTransport20261116.lean 2>&1 | tee -a /tmp/m15-magnetic-gibbs-lean.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/m15-magnetic-gibbs-lean.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log=Path('/tmp/m15-magnetic-gibbs-lean.log').read_text()
          names=["Manuscript15.MagneticGibbs.odd_cell_nearest","Manuscript15.MagneticGibbs.cell_displacement_le_one","Manuscript15.MagneticGibbs.cell_displacement_endpoint","Manuscript15.MagneticGibbs.cell_cost_nearest","Manuscript15.MagneticGibbs.primal_infimum_of_attainment","Manuscript15.MagneticGibbs.cell_mass","Manuscript15.MagneticGibbs.normalized_geometric","Manuscript15.MagneticGibbs.odd_partition_formula","Manuscript15.MagneticGibbs.normalized_partition","Manuscript15.MagneticGibbs.variance_difference","Manuscript15.MagneticGibbs.wasserstein2_langevin","Manuscript15.MagneticGibbs.uniform_arcsine_relation","Manuscript15.MagneticGibbs.zeta_weighted_difference","Manuscript15.MagneticGibbs.schwarzian_majorant","Manuscript15.MagneticGibbs.dilatation_bound","Manuscript15.MagneticGibbs.kahler_boundary"]
          for name in names:
              matches=re.findall(r"'"+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]",log,re.S)
              if not matches:
                  assert "'"+name+"' does not depend on any axioms" in log, name
              for match in matches:
                  assert {a.strip() for a in match.split(',') if a.strip()} <= {'propext','Classical.choice','Quot.sound'}, name
          print('AXIOM AUDIT SUCCESS',len(names))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-magnetic-gibbs-lean
          path: /tmp/m15-magnetic-gibbs-lean.log
  arb:
    strategy:
      fail-fast: false
      matrix:
        sector: [magnetic, geometry]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact HEAD and FLINT version
        run: |
          git rev-parse HEAD | tee m15-gibbs-head.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m pip install python-flint==0.9.0
      - name: Individual relative bits and exact decimal rounding
        run: |
          set -euo pipefail
          /usr/bin/time -v python numerics/arb/m15_magnetic_gibbs_20261116_million.py ${{ matrix.sector }} 2>&1 | tee m15-gibbs.log
          grep -F 'MILLION SUCCESS m15-gibbs-${{ matrix.sector }}' m15-gibbs.log
          test -s million-m15-gibbs-${{ matrix.sector }}.json
          test -s m15-gibbs-${{ matrix.sector }}-source.json
          gzip -t million-enclosures.jsonl.gz m15-gibbs-${{ matrix.sector }}-endpoints.jsonl.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-gibbs-${{ matrix.sector }}-million
          path: |
            m15-gibbs-head.txt
            m15-gibbs.log
            million-m15-gibbs-${{ matrix.sector }}.json
            m15-gibbs-${{ matrix.sector }}-source.json
            m15-gibbs-${{ matrix.sector }}-endpoints.jsonl.gz
            million-enclosures.jsonl.gz
          compression-level: 0
