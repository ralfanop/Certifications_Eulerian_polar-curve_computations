name: M15 Nov25 full improper quartic elliptic period Lean4

on:
  pull_request:
    paths:
      - 'lean/Manuscript15/CrossQuarticImproperPeriod20261125.lean'
      - '.github/workflows/m15-quartic-improper-period-20261125.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  improper-period:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check exact PR HEAD pinned Lean and full analytic improper-period theorem
        working-directory: lean
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/m15-improper-period
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD | tee /tmp/m15-improper-period/head.txt
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
          mkdir -p .lake/build/lib/lean/Manuscript15
          lake env lean -M16768 \
            -o .lake/build/lib/lean/Manuscript15/CrossQuarticCurve20261125.olean \
            Manuscript15/CrossQuarticCurve20261125.lean \
            2>&1 | tee /tmp/m15-improper-period/quartic.log
          lake env lean -M16768 \
            -o .lake/build/lib/lean/Manuscript15/CrossQuarticPeriodDifferential20261125.olean \
            Manuscript15/CrossQuarticPeriodDifferential20261125.lean \
            2>&1 | tee /tmp/m15-improper-period/differential.log
          lake env lean -M16768 \
            -o .lake/build/lib/lean/Manuscript15/CrossQuarticFinitePeriod20261125.olean \
            Manuscript15/CrossQuarticFinitePeriod20261125.lean \
            2>&1 | tee /tmp/m15-improper-period/finite.log
          lake env lean -M16768 Manuscript15/CrossQuarticImproperPeriod20261125.lean \
            2>&1 | tee /tmp/m15-improper-period/new.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('/tmp/m15-improper-period')
          src=Path('Manuscript15/CrossQuarticImproperPeriod20261125.lean').read_text()
          others=[Path('Manuscript15/'+p).read_text() for p in [
            'CrossQuarticCurve20261125.lean',
            'CrossQuarticPeriodDifferential20261125.lean',
            'CrossQuarticFinitePeriod20261125.lean']]
          forbidden=re.compile(r'\b(sorry|sorryAx|admit|native_decide|unsafe)\b|^\s*axiom\s',re.M)
          assert not forbidden.search(src)
          assert all(not forbidden.search(o) for o in others)
          logs=[(root/p).read_text() for p in [
            'quartic.log','differential.log','finite.log','new.log']]
          assert not re.search(r'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.',''.join(logs))
          names=re.findall(r'^#print axioms (Manuscript15\.CrossQuarticImproperPeriod20261125\.\w+)$',src,re.M)
          assert len(names)==7 and len(set(names))==7,(len(names),names)
          log=logs[-1]
          for n in names:
            m=re.search(re.escape("'"+n+"'")+r' depends on axioms: \[([^\]]*)\]',log,re.S)
            if m:
              present={x.strip() for x in m.group(1).split(',') if x.strip()}
              assert present <= {'propext','Classical.choice','Quot.sound'},(n,present)
            else:
              assert "'"+n+"' does not depend on any axioms" in log,n
          print('M15 FULL IMPROPER ELLIPTIC PERIOD SEVEN LEAN THEOREMS SUCCESS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-improper-elliptic-period-lean-exact-head
          path: /tmp/m15-improper-period/
