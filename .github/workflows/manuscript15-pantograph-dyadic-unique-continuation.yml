name: Manuscript 15 — nonlinear pantograph dyadic propagation and global unique continuation
on:
  push:
    branches:
      - manuscript15-pantograph-dyadic-unique-continuation-20261112
    paths:
      - 'lean/Manuscript15/PantographAntecedent.lean'
      - 'lean/Manuscript15/PantographDyadicUniqueContinuation.lean'
      - '.github/workflows/manuscript15-pantograph-dyadic-unique-continuation.yml'
  pull_request:
    paths:
      - 'lean/Manuscript15/PantographAntecedent.lean'
      - '.github/workflows/manuscript15-pantograph-dyadic-unique-continuation.yml'
  workflow_dispatch:
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors \
            --retry-delay 5 --connect-timeout 20 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
      - name: Cache pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile pantograph dyadic continuation and strict kernel axiom audit
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Manuscript15
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/PantographAntecedent.olean Manuscript15/PantographAntecedent.lean
          lake env lean -M16768 Manuscript15/PantographDyadicUniqueContinuation.lean 2>&1 | tee /tmp/m15-pantograph-dyadic-unique-continuation.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/m15-pantograph-dyadic-unique-continuation.log; then
            echo '::error::Forbidden axiom'
            exit 1
          fi
          python3 - <<'PY'
          import pathlib, re
          s=pathlib.Path("/tmp/m15-pantograph-dyadic-unique-continuation.log").read_text()
          names=[
            "Manuscript15.pantograph_eqOn_double_of_eqOn",
            "Manuscript15.pantograph_eq_of_eqOn_near_zero",
            "Manuscript15.pantograph_eq_sine_of_local_agreement",
          ]
          found={}
          for m in re.finditer(r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms",s,re.MULTILINE):
            found[m.group(1) or m.group(3)]={a.strip() for a in (m.group(2) or "").split(",") if a.strip()}
          allowed={"propext","Classical.choice","Quot.sound"}
          for name in names:
            assert name in found, f"Missing strict Lean kernel report for {name}"
            assert found[name] <= allowed, f"Nonstandard axioms for {name}: {found[name]-allowed}"
            print(name,sorted(found[name]))
          assert "sorryAx" not in s and "Lean.ofReduceBool" not in s
          assert not re.search(r"\.lean:\d+:\d+: error",s)
          print("SUCCESS: dyadic global pantograph continuation from genuine local uniqueness")
          PY
      - name: Archive kernel logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript15-pantograph-dyadic-unique-continuation-audit
          path: /tmp/m15-pantograph-dyadic-unique-continuation.log
