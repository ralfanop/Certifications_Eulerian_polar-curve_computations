name: M12 actual finite-order correlation threshold
on:
  pull_request:
    paths:
      - 'lean/EulerianGrothendieck/CriticalWindowCorrelation.lean'
      - '.github/workflows/m12-critical-correlation.yml'
  workflow_dispatch:
jobs:
  correlation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore pinned Lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile actual Fock and matrix quotient
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          lake exe cache get
          lake build EulerianGrothendieck.FockVacuumProjection EulerianGrothendieck.VectorOptimum
          mkdir -p .lake/build/lib/lean
          for module in CriticalWindowQuartic CriticalWindowGlobalMGF CriticalWindowComplexMGF CriticalWindowAnalyticRemainder CriticalWindowFockDomination CriticalWindowGammaVacuum CriticalWindowFinalAssembly CriticalWindowPointwise CriticalWindowDCT CriticalWindowVacuumIdentification; do
            lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean"
          done
          lake env lean CriticalWindowCorrelation.lean 2>&1 | tee /tmp/m12-correlation.log
      - name: Strict declaration audit
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          data=Path('/tmp/m12-correlation.log').read_text()
          src=Path('lean/EulerianGrothendieck/CriticalWindowCorrelation.lean').read_text()
          assert not re.search(r'\b(sorry|admit|axiom|opaque|native_decide)\b',src)
          assert ': error' not in data and 'sorryAx' not in data and 'Lean.ofReduceBool' not in data
          allowed={'propext','Classical.choice','Quot.sound'}
          names=['C_pos','scale_mul_B','actual_ratio_limit','Fcrit_antitone','B_tendsto',
                 'P_tendsto','eventual_P_pos','actual_correlation_limit','actual_correlation_at_critical',
                 'uniform_vacuum_of_norm','uniform_correlation_of_norm']
          for name in names:
              full='M12CriticalCorrelation.'+name
              m=re.search(r"'"+re.escape(full)+r"' depends on axioms: \[([^\]]*)\]",data)
              if m:
                  assert {x.strip() for x in m.group(1).split(',') if x.strip()}<=allowed,full
              else:
                  assert "'"+full+"' does not depend on any axioms" in data,full
              print('AXIOM AUDIT SUCCESS',full)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-critical-correlation-audit
          path: /tmp/m12-correlation.log
