name: V007 heat generator derivative on finite Gegenbauer span

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatGeneratorFiniteSpan.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatGeneratorModes.lean'
      - '.github/workflows/v007-sturm-heat-generator-finite-span.yml'
  workflow_dispatch:

jobs:
  genuine-heat-generator-finite-span:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit infinitesimal heat generator on finite spectral span
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealHeatGeneratorFiniteSpan 2>&1 | tee /tmp/v007-generator-span-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatGeneratorFiniteSpan.lean 2>&1 | tee /tmp/v007-generator-span-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-generator-span-build.log /tmp/v007-generator-span-axioms.log; then
            echo '::error::Forbidden axiom in actual finite-span heat generator.'
            exit 1
          fi
          grep -F "sturmRealHeatLimit_generator_on_finite_Gegenbauer' depends on axioms:" /tmp/v007-generator-span-axioms.log
          echo 'V007 infinitesimal full-L2 heat generator on finite Gegenbauer span kernel-certified.'
