name: Manuscript 14 — Lean 4 certificate of the measure part of Theorem 9.3

# Manuscript 14, Theorem 9.3 and Corollary 9.4: the image of the unitarily invariant measure
# of pure spin states under the Bloch map, in the coordinates (axial component, azimuth) of the
# sphere, (131); its normalisation; the uniform law of the axial component; the averages (132)
# and (133); the Langevin mean; the invariance of the axial law under time reversal; the
# Bloch map as a bijection of the affine chart onto the sphere minus the south pole. The module
# imports only the pinned Mathlib. The job fails on any compile error, on any `sorry`, and on any
# axiom other than propext, Classical.choice and Quot.sound in the fifteen audited statements.

on:
  push:
    branches:
      - manuscript14-thm93-measure-lean-20261106
    paths:
      - 'lean/SpecialImaginaryPoint/BlochMeasureCertificate.lean'
      - '.github/workflows/manuscript14-thm93-measure-lean.yml'
  workflow_dispatch:

jobs:
  lean:
    name: Lean 4 kernel check of the Theorem 9.3 measure certificate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install repository-pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Retrieve pinned Mathlib cache
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-check the Theorem 9.3 measure certificate and audit its axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -M16768 SpecialImaginaryPoint/BlochMeasureCertificate.lean 2>&1 | tee /tmp/t93.log
          if grep -nE '^[^ ]+:[0-9]+:[0-9]+: error' /tmp/t93.log; then
            echo '::error::Compile error in the Theorem 9.3 measure certificate'
            exit 1
          fi
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' -e 'declaration uses' /tmp/t93.log; then
            echo '::error::Forbidden axiom or sorry in the Theorem 9.3 measure certificate'
            exit 1
          fi
          n_all="$(grep -c "depends on axioms: \[" /tmp/t93.log || true)"
          n_std="$(grep -cE "depends on axioms: \[((propext|Classical\.choice|Quot\.sound)(, )?)+\]" /tmp/t93.log || true)"
          echo "audited statements: $n_all, of which within the standard three axioms: $n_std"
          test "$n_all" -eq 15
          test "$n_std" -eq 15
          echo 'Theorem 9.3 measure: no sorry, no sorryAx, no Lean.ofReduceBool; fifteen audited statements'
      - name: Upload Lean log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript14-thm93-measure-lean
          path: /tmp/t93.log
          if-no-files-found: ignore
