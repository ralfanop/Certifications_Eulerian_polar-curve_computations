name: V007 singular cutoff strong recovery for genuine Fock operator
on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/CanonicalCFCSpectralCutoffStrongRecovery.lean'
      - '.github/workflows/v007-cfc-spectral-cutoff-strong-recovery.yml'
  workflow_dispatch:

concurrency:
  group: v007-cfc-spectral-cutoff-strong-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spectral-cutoff-strong:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Lean 4 toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
      - name: Restore exact pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile singular cutoff and kernel audit of strong recovery
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.CanonicalCFCSpectralCutoffStrongRecovery 2>&1 | tee /tmp/v007-cutoff-build.log
          lake env lean -M16768 GegenbauerFock/CanonicalCFCSpectralCutoffStrongRecovery.lean 2>&1 | tee /tmp/v007-cutoff-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-cutoff-build.log /tmp/v007-cutoff-axioms.log; then
            echo '::error::Forbidden axiom in strong singular-cutoff recovery.'
            exit 1
          fi
          grep -F "singularCutoff_strong_recovery' depends on axioms:" /tmp/v007-cutoff-axioms.log
          grep -F "exists_C_singularCutoff_strong_recovery' depends on axioms:" /tmp/v007-cutoff-axioms.log
          echo 'V007 actual Fock strong spectral cutoff recovery kernel-audited.'
