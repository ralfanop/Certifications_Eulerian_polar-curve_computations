name: M14 v14.122 — Bernoulli, Krein and spin-one checks
on:
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/V14122*.lean'
      - 'certificates/manuscript14/v14122_spin_one_arb.py'
      - '.github/workflows/m14-v14122-certification.yml'
  push:
    branches: [main, m14-v14122-spin-bernoulli-krein-20261128]
    paths:
      - 'lean/SpecialImaginaryPoint/V14122*.lean'
      - 'certificates/manuscript14/v14122_spin_one_arb.py'
      - '.github/workflows/m14-v14122-certification.yml'
  workflow_dispatch:
jobs:
  lean:
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: V14122Bernoulli
            count: 9
          - module: V14122Spin
            count: 5
          - module: V14122Krein
            count: 10
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Compile and audit
        working-directory: lean
        shell: bash
        env:
          EXPECTED: ${{ matrix.count }}
        run: |
          set -euo pipefail
          git rev-parse HEAD
          lake env lean SpecialImaginaryPoint/${{ matrix.module }}.lean 2>&1 | tee /tmp/audit.log
          python - <<'PY'
          import os,re
          from pathlib import Path
          log=Path('/tmp/audit.log').read_text()
          assert not re.search(r'sorryAx|Lean\.ofReduceBool|declaration uses|: error:',log)
          reports=re.findall(r"^'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",log,re.M)
          assert len(reports)==len({n for n,_ in reports})==int(os.environ['EXPECTED']),reports
          for n,axs in reports:
              assert set(filter(None,(a.strip() for a in axs.split(',')))) <= {'propext','Classical.choice','Quot.sound'},(n,axs)
          print('AXIOM AUDIT SUCCESS',len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m14-${{ matrix.module }}-lean-audit
          path: /tmp/audit.log
  arb:
    strategy:
      fail-fast: false
      matrix:
        index: [0,1,2,3]
        model: [printed,ideal]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install python-flint==0.9.0
      - name: Strict million fractional decimal enclosure
        run: |
          set -euo pipefail
          python certificates/manuscript14/v14122_spin_one_arb.py --index ${{ matrix.index }} --model ${{ matrix.model }} --bits 3600000 --digits 1000001 | tee arb.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m14-v14122-spin-${{ matrix.model }}-${{ matrix.index }}
          path: |
            m14-v14122-spin.json.gz
            arb.log
