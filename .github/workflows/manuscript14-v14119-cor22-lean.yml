name: Manuscript 14.119 — Corollary 2.2 universal exact factorial tail bounds

on:
  push:
    branches:
      - manuscript14-v14119-priorities-continuation-20261109
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Cor22Certificate.lean'
      - '.github/workflows/manuscript14-v14119-cor22-lean.yml'
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Cor22Certificate.lean'
      - '.github/workflows/manuscript14-v14119-cor22-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Kernel proof and axiom audit — exact all-N rational enclosure
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Retrieve pinned Mathlib cache
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile strict tail comparison and factorial specialization
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/V14119TailBound.olean \
            SpecialImaginaryPoint/V14119TailBound.lean 2>&1 | tee /tmp/v14119-tail-dependency.log
          lake env lean -M16768 SpecialImaginaryPoint/V14119Cor22Certificate.lean 2>&1 | tee /tmp/v14119-cor22.log
          if grep -nE '^[^ ]+:[0-9]+:[0-9]+: error' /tmp/v14119-cor22.log; then
            exit 1
          fi
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' -e 'declaration uses' /tmp/v14119-cor22.log; then
            exit 1
          fi
          tr '\n' ' ' < /tmp/v14119-cor22.log | grep -oE 'depends on axioms: \[[^]]*\]' | \
            sed -E 's/ +/ /g' > /tmp/v14119-cor22.axioms || true
          n_none="$(grep -c 'does not depend on any axioms' /tmp/v14119-cor22.log || true)"
          n_all="$(grep -c 'depends on axioms' /tmp/v14119-cor22.axioms || true)"
          n_std="$(grep -cE 'depends on axioms: \[((propext|Classical\.choice|Quot\.sound)(, )?)+\]' \
            /tmp/v14119-cor22.axioms || true)"
          echo "Audited statements: $((n_all+n_none)); standard axioms only: $((n_std+n_none))"
          test "$((n_all+n_none))" -eq 9
          test "$((n_std+n_none))" -eq 9
      - name: Upload proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript14-v14119-cor22
          path: /tmp/v14119-*.log
          if-no-files-found: ignore
