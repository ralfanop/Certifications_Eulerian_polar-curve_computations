name: V007 full heat generator and real S1 S2 joint certificate
on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleHeatResolventS1S2JointCertificate.lean'
      - '.github/workflows/v007-sturm-heat-resolvent-real-s1s2-joint.yml'
  workflow_dispatch:

jobs:
  full-generator-real-s1s2-joint:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit real S1 S2 and generator joint theorem
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleHeatResolventS1S2JointCertificate 2>&1 | tee /tmp/v007-real-s1s2-joint-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleHeatResolventS1S2JointCertificate.lean 2>&1 | tee /tmp/v007-real-s1s2-joint-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-s1s2-joint-build.log /tmp/v007-real-s1s2-joint-axioms.log; then
            echo '::error::Forbidden axiom in joint real S1/S2 and generator certificate.'
            exit 1
          fi
          grep -F "sturmRealHeatGenerator_resolvent_realS1S2_joint_certificate' depends on axioms:" /tmp/v007-real-s1s2-joint-axioms.log
          echo 'V007 genuine Sturm generator and real S1 S2 joint theorem kernel-certified.'
