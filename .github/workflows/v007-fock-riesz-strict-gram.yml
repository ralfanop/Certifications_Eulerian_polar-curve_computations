name: V007 intrinsic Fock exponential strict Gram positivity

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GaussianAreaIntrinsicRieszStrictGram.lean'
      - 'lean/GegenbauerFock/GaussianAreaIntrinsicRieszExactGramScalar.lean'
      - '.github/workflows/v007-fock-riesz-strict-gram.yml'
  workflow_dispatch:

# At most one specialist audit runs per branch; retain running SHA-scoped proof checks.
concurrency:
  group: v007-strict-gram-${{ github.ref }}
  cancel-in-progress: false

jobs:
  intrinsic-riesz-strict-gram:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version
      - name: Restore pinned Mathlib cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile strict exponential Gram criteria and audit axioms
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GaussianAreaIntrinsicRieszStrictGram 2>&1 | tee /tmp/v007-strict-gram.log
          lake env lean -M16768 GegenbauerFock/GaussianAreaIntrinsicRieszStrictGram.lean 2>&1 | tee -a /tmp/v007-strict-gram.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-strict-gram.log; then
            echo "::error::Forbidden axiom in strict intrinsic Gaussian Gram energy."
            exit 1
          fi
          grep -F "intrinsicRieszKernel_exp_gram_re_pos_iff' depends on axioms:" /tmp/v007-strict-gram.log
          grep -F "intrinsicRieszKernel_exp_gram_re_eq_zero_iff' depends on axioms:" /tmp/v007-strict-gram.log
          grep -F "intrinsicRieszKernel_exp_gram_re_pos_iff_ne_zero' depends on axioms:" /tmp/v007-strict-gram.log
          grep -F "intrinsicRieszKernel_exp_gram_positive_real_iff' depends on axioms:" /tmp/v007-strict-gram.log
          grep -F "intrinsicRieszKernel_exp_gram_positive_real_iff_exists_witness' depends on axioms:" /tmp/v007-strict-gram.log
          grep -F "intrinsicRieszKernel_exp_sum_norm_sq_le_exp_mul_gram_re' depends on axioms:" /tmp/v007-strict-gram.log
          grep -F "intrinsicRieszKernel_exp_gram_re_ge_normalized_sample' depends on axioms:" /tmp/v007-strict-gram.log
          grep -F "intrinsicRieszKernel_exp_gram_re_ge_origin_coeff_sum' depends on axioms:" /tmp/v007-strict-gram.log
          grep -F "intrinsicRieszKernel_exp_sum_uniform_disk_bound' depends on axioms:" /tmp/v007-strict-gram.log
          echo 'V007 exact strict Gaussian Fock Gram criteria: kernel and axiom audit clean.'
