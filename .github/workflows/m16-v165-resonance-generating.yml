name: M16 v16.5 finite resonance generating function
on:
  pull_request:
    paths:
      - 'lean/Manuscript16/V165ResonanceGenerating.lean'
      - '.github/workflows/m16-v165-resonance-generating.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Lean
        working-directory: lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Exact HEAD compilation and axiom audit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD | tee /tmp/m16-v165-head.log
          lake update
          lake exe cache get
          lake env lean Manuscript16/V165ResonanceGenerating.lean 2>&1 | tee /tmp/m16-v165-lean.log
          for theorem in resonance_weight_energy tailPoly_step finite_resonance_generating; do
            grep -F "'Manuscript16.V165.$theorem' depends on axioms:" /tmp/m16-v165-lean.log
          done
          if grep -E 'sorryAx|Lean.ofReduceBool|error:' /tmp/m16-v165-lean.log; then exit 1; fi
      - name: Preserve audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m16-v165-resonance-generating-log
          path: /tmp/m16-v165-*.log
