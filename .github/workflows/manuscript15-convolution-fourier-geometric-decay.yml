name: "Manuscript 15 — geometric decay of genuine Eulerian convolution Fourier values"
on:
  push:
    branches:
      - manuscript15-convolution-fourier-geometric-decay-20261112
    paths:
      - 'lean/Manuscript15/EulerianCharacteristicIntegral.lean'
      - 'lean/Manuscript15/UniformEulerianCharacteristicMeasure.lean'
      - 'lean/Manuscript15/EulerianConvolutionCharacteristicPowers.lean'
      - 'lean/Manuscript15/EulerianConvolutionDenseIdentification.lean'
      - 'lean/Manuscript15/EulerianConvolutionDistinctOrders.lean'
      - 'lean/Manuscript15/EulerianConvolutionFourierGeometricDecay.lean'
      - 'lean/EulerianCert/FourierModes.lean'
      - '.github/workflows/manuscript15-convolution-fourier-geometric-decay.yml'
  pull_request:
    paths:
      - 'lean/Manuscript15/EulerianConvolutionFourierGeometricDecay.lean'
      - 'lean/Manuscript15/EulerianConvolutionDistinctOrders.lean'
      - 'lean/Manuscript15/EulerianConvolutionFourierGeometricDecay.lean'
      - 'lean/Manuscript15/EulerianConvolutionDenseIdentification.lean'
      - 'lean/Manuscript15/EulerianCharacteristicIntegral.lean'
      - 'lean/EulerianCert/FourierModes.lean'
      - '.github/workflows/manuscript15-convolution-fourier-geometric-decay.yml'
  workflow_dispatch:
jobs:
  kernel:
    name: "Eulerian Fourier convolution geometric decay — Lean kernel audit"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors \
            --retry-delay 5 --connect-timeout 20 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
      - name: Download pinned Mathlib cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile genuine Eulerian convolution probability and Fourier powers
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/EulerianCert .lake/build/lib/lean/Manuscript15
          lake env lean -M16768 -o .lake/build/lib/lean/EulerianCert/FourierModes.olean \
            EulerianCert/FourierModes.lean 2>&1 | tee /tmp/m15-eulerian-fourier-prerequisite.log
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/EulerianCharacteristicIntegral.olean Manuscript15/EulerianCharacteristicIntegral.lean
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/UniformEulerianCharacteristicMeasure.olean Manuscript15/UniformEulerianCharacteristicMeasure.lean
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/EulerianConvolutionCharacteristicPowers.olean Manuscript15/EulerianConvolutionCharacteristicPowers.lean
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/EulerianConvolutionDenseIdentification.olean Manuscript15/EulerianConvolutionDenseIdentification.lean
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/EulerianConvolutionDistinctOrders.olean Manuscript15/EulerianConvolutionDistinctOrders.lean
          lake env lean -M16768 Manuscript15/EulerianConvolutionFourierGeometricDecay.lean 2>&1 | tee /tmp/m15-eulerian-convolution-decay.log
      - name: Strict kernel axiom audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path("/tmp/m15-eulerian-convolution-decay.log").read_text()
          pre=pathlib.Path("/tmp/m15-eulerian-fourier-prerequisite.log").read_text()
          names=["Manuscript15.eulerianConvolutionPower_charFun_pi_real_strictAnti",
                 "Manuscript15.eulerianConvolutionPower_charFun_pi_real_tendsto_zero"]
          reports={}
          for m in re.finditer(r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms",s,re.MULTILINE):
            reports[m.group(1) or m.group(3)]={a.strip() for a in (m.group(2) or "").split(",") if a.strip()}
          allowed={"propext","Classical.choice","Quot.sound"}
          for key in names:
            assert key in reports, f"Missing kernel audit {key}"
            assert reports[key] <= allowed, f"Unaccepted axioms: {reports[key]-allowed}"
            print(key, sorted(reports[key]))
          for log in (pre,s):
            assert "sorryAx" not in log and "Lean.ofReduceBool" not in log
            assert not re.search(r"\.lean:\d+:\d+: error",log)
          print("SUCCESS: strict monotonicity and geometric Fourier decay of actual Eulerian convolution distributions")
          PY
      - name: Upload Lean kernel audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript15-convolution-fourier-geometric-decay-audit
          path: |
            /tmp/m15-eulerian-fourier-prerequisite.log
            /tmp/m15-eulerian-convolution-decay.log
          if-no-files-found: ignore
