name: M12 5.14 actual hybrid residual from locality
on:
  pull_request:
    paths:
      - 'lean/EulerianGrothendieck/UniformLanczos/Rate514HybridResidual.lean'
      - '.github/workflows/m12-514-hybrid-residual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hybrid-residual:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile actual M12 hybrid residual estimate
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.24.0'
          for f in UniformLanczos/Rate514AveragedKernel.lean UniformLanczos/Rate514FrechetPath.lean UniformLanczos/Rate514HybridResidual.lean; do
            ! grep -n -E '^\s*(axiom|opaque)\b|\b(sorry|admit|native_decide)\b' "$f"
          done
          lake exe cache get
          lake build UniformLanczos.Rate514FrechetPath UniformLanczos.Rate514Residual 2>&1 | tee /tmp/m12-hybrid-resid-deps.log
          lake env lean UniformLanczos/Rate514HybridResidual.lean 2>&1 | tee /tmp/m12-hybrid-resid.log
      - name: Strict standard-axiom audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/m12-hybrid-resid.log').read_text()
          assert not re.search(r'(^|\n).*: error:',s)
          assert 'sorryAx' not in s and 'Lean.ofReduceBool' not in s
          for n in ['hybrid_on_window','actual_hybrid_residual_bound']:
              full='UniformLanczos.Rate514HybridResidual.'+n
              m=re.search(r"'"+re.escape(full)+r"' depends on axioms: \[([^\]]*)\]",s)
              if m: a={x.strip() for x in m.group(1).split(',') if x.strip()}
              else:
                  assert "'"+full+"' does not depend on any axioms" in s,full
                  a=set()
              assert a<={'propext','Classical.choice','Quot.sound'},(full,a)
              print('PASS',full,sorted(a))
          print('M12 ACTUAL HYBRID RESIDUAL SUCCESS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-hybrid-residual-logs
          path: |
            /tmp/m12-hybrid-resid-deps.log
            /tmp/m12-hybrid-resid.log
