name: V007 exact admissible coefficient iff for general CFC S1 ideal

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/PhyslibGeneralS1IdealOptimalConstantIff.lean'
      - 'lean/GegenbauerFock/PhyslibTraceClassIdealNormSharp.lean'
      - 'lean/GegenbauerFock/PhyslibGramBilateralSharpnessWitness.lean'
      - '.github/workflows/gegenbauer-fock-physlib-general-s1-ideal-iff.yml'
  workflow_dispatch:

jobs:
  verify-general-sharpness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt*8))"
          done
          test "$installed" = 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt*8))"
          done
          test "$ready" = 1
      - name: Restore fixed Mathlib manifest
        working-directory: lean
        run: lake update
      - name: Fetch pinned Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Check general Schatten S1 ideal coefficient-one optimality
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.PhyslibGeneralS1IdealOptimalConstantIff 2>&1 | tee /tmp/gf-general-s1-ideal-iff.log
          grep -F "GegenbauerFock.GeneralUltrasphericalFock.general_S1_ideal_bound_iff_coefficient_ge_one' depends on axioms:" /tmp/gf-general-s1-ideal-iff.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/gf-general-s1-ideal-iff.log; then
            echo '::error::Nonstandard axiom in general S1 ideal sharpness.'
            exit 1
          fi
          echo 'Exact admissible coefficients for CFC S1 ideal: c >= 1 audited.'
