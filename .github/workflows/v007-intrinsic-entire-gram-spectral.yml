name: V007 intrinsic Gaussian Fock source Gram compact spectral transfer

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireGramSpectral.lean'
      - '.github/workflows/v007-intrinsic-entire-gram-spectral.yml'
  workflow_dispatch:

jobs:
  intrinsic-gram-spectral:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib revision and cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Check all eight genuine holomorphic Gram spectral theorems
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireGramSpectral 2>&1 | tee /tmp/v007-intrinsic-gram-spectral.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireGramSpectral.lean 2>&1 | tee -a /tmp/v007-intrinsic-gram-spectral.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-intrinsic-gram-spectral.log; then
            echo "::error::Forbidden axiom in intrinsic spectral theorem"
            exit 1
          fi
          for theorem in \
            C_intrinsicEntire_gram_compact \
            C_intrinsicEntire_gram_selfadjoint \
            C_intrinsicEntire_gram_isPositive \
            C_intrinsicEntire_gram_nonzero_eigenspace_finite \
            C_intrinsicEntire_gram_eigenspaces_complete \
            C_intrinsicEntire_gram_eigenvalue_real \
            C_intrinsicEntire_gram_real_eigenvalue_nonneg \
            C_intrinsicEntire_gram_zero_eigenspace_bot; do
              grep -F "$theorem' depends on axioms:" /tmp/v007-intrinsic-gram-spectral.log
          done
          echo 'V007 intrinsic Gaussian Fock source Gram spectral theorem checked by Lean.'
