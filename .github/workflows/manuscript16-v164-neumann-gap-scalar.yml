name: M16 v16.4 — Neumann gap scalar Lean audit
on:
  push:
    branches: [manuscript16-v164-neumann-gap-scalar-20261115]
    paths:
      - 'lean/Manuscript16/V164NeumannGapScalar.lean'
      - '.github/workflows/manuscript16-v164-neumann-gap-scalar.yml'
  pull_request:
    paths:
      - 'lean/Manuscript16/V164NeumannGapScalar.lean'
      - '.github/workflows/manuscript16-v164-neumann-gap-scalar.yml'
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
      - name: Fetch pinned Mathlib and check axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean Manuscript16/V164NeumannGapScalar.lean 2>&1 | tee /tmp/m16-v164-neumann-gap.log
          for name in v164_neumann_gap_pos v164_neumann_ratio_lt_one v164_neumann_bound_scalar_identity v164_neumann_bound_pos; do
            grep -F "'Manuscript16.${name}' depends on axioms:" /tmp/m16-v164-neumann-gap.log
          done
          if grep -E "sorryAx|Lean.ofReduceBool|error:" /tmp/m16-v164-neumann-gap.log; then exit 1; fi
      - name: Preserve audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript16-v164-neumann-gap-lean
          path: /tmp/m16-v164-neumann-gap.log
