name: V007 intrinsic Gaussian Fock output Gram complex pairing and positivity

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireOutputGramPositivity.lean'
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireCompactQuasiaffinity.lean'
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireOutputGram.lean'
      - '.github/workflows/v007-intrinsic-output-gram-positivity.yml'
  workflow_dispatch:

jobs:
  intrinsic-output-pairing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib revision and cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile actual intrinsic output Gram pairing and positive quadratic form
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireOutputGramPositivity 2>&1 | tee /tmp/v007-intrinsic-output-pairing.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireOutputGramPositivity.lean 2>&1 | tee -a /tmp/v007-intrinsic-output-pairing.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-intrinsic-output-pairing.log; then
            echo "::error::Forbidden axiom in true intrinsic Fock Gram quadratic form"
            exit 1
          fi
          grep -F "C_intrinsicEntire_outputGram_inner_eq' depends on axioms:" /tmp/v007-intrinsic-output-pairing.log
          grep -F "C_intrinsicEntire_outputGram_re_inner_nonneg' depends on axioms:" /tmp/v007-intrinsic-output-pairing.log
          echo 'V007 genuine Gaussian Fock output Gram pairing and positivity: Lean and axiom audit passed.'
