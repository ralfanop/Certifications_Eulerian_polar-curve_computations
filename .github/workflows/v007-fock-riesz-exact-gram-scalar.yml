name: V007 exact complex Gaussian exponential Gram energy and 2x2 determinant

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GaussianAreaIntrinsicRieszExactGramScalar.lean'
      - '.github/workflows/v007-fock-riesz-exact-gram-scalar.yml'
  workflow_dispatch:

# At most one specialist audit runs per branch; retain running SHA-scoped proof checks.
concurrency:
  group: v007-exact-gram-scalar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  intrinsic-riesz-exact-gram-scalar:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version
      - name: Restore pinned Mathlib cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile exact complex Gram scalar and audit every theorem
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GaussianAreaIntrinsicRieszExactGramScalar 2>&1 | tee /tmp/v007-exact-gram-scalar.log
          lake env lean -M16768 GegenbauerFock/GaussianAreaIntrinsicRieszExactGramScalar.lean 2>&1 | tee -a /tmp/v007-exact-gram-scalar.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-exact-gram-scalar.log; then
            echo "::error::Forbidden axiom in exact intrinsic exponential Gram scalar proof."
            exit 1
          fi
          grep -F "intrinsicRieszKernel_exp_gram_eq_complex_norm_sq' depends on axioms:" /tmp/v007-exact-gram-scalar.log
          grep -F "intrinsicRieszKernel_exp_gram_im_zero' depends on axioms:" /tmp/v007-exact-gram-scalar.log
          grep -F "intrinsicRieszKernel_exp_gram_is_nonnegative_real' depends on axioms:" /tmp/v007-exact-gram-scalar.log
          grep -F "intrinsicRieszKernel_exp_twoPoint_determinant_nonneg' depends on axioms:" /tmp/v007-exact-gram-scalar.log
          echo 'V007 exact complex Gaussian exponential Gram scalar: Lean and axiom audit clean.'
