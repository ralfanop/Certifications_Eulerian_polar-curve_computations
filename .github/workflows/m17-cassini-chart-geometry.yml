name: M17 Cassini chart geometry Lean
on:
  pull_request:
    paths:
      - 'lean/Manuscript17/CassiniChartGeometry20261127.lean'
      - '.github/workflows/m17-cassini-chart-geometry.yml'
  push:
    branches: [main]
    paths:
      - 'lean/Manuscript17/CassiniChartGeometry20261127.lean'
      - '.github/workflows/m17-cassini-chart-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned toolchain and Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile dependencies and audit
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/EulerianCert
          lake env lean -o .lake/build/lib/lean/EulerianCert/CassiniAreaIntegral20261124.olean EulerianCert/CassiniAreaIntegral20261124.lean | tee /tmp/m17-area-dep.log
          lake env lean Manuscript17/CassiniChartGeometry20261127.lean 2>&1 | tee /tmp/m17-chart.log
          python - <<'PY'
          import re
          from pathlib import Path
          for path, n in [('/tmp/m17-area-dep.log', 13), ('/tmp/m17-chart.log', 13)]:
              s = Path(path).read_text()
              assert not re.search(r'sorryAx|Lean.ofReduceBool|error:', s)
              a = re.findall(r"depends on axioms: \[([^\]]*)\]", s, re.S)
              assert len(a)+s.count('does not depend on any axioms') == n
              assert all(set(x.strip() for x in b.split(',') if x.strip()) <= {'propext','Classical.choice','Quot.sound'} for b in a)
          print('M17 chart geometry axiom audit passed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m17-chart-geometry-logs
          path: /tmp/m17-*.log
