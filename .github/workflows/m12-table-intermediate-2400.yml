name: M12 Table 1 intermediate 2400-decimal strict rounding
on:
  pull_request:
    paths:
      - 'numerics/arb/m12_table_intermediate_2400.py'
      - '.github/workflows/m12-table-intermediate-2400.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate successful source jobs and archive digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          mkdir -p sources
          run=44313014167
          head=8fc451ce053a769087fb25ed16289018890bc926
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" | jq -e --arg sha "$head" '.head_sha == $sha and .conclusion == "success"'
          for spec in \
            '100 14431877216 8f2e19d47c0d0ff4011f23a915b6f3ba7c700616805f4ce5849c929dad66e784' \
            '200 14435228234 eb184d12ad6db434bbc533b0cfde30d83fa08f54b6917e54284ea4aeca8f2a26' \
            '400 14449268572 2155c46f7bef8ec70bb4bc6e5966b2ee2a485ab306299817640961fbc75ba2e6'; do
            read -r m id digest <<< "$spec"
            ep="repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            gh api "$ep" | jq -e --arg sha "$head" --arg digest "sha256:$digest" --arg name "m12-lanczos-$m" '.workflow_run.head_sha == $sha and .workflow_run.id == 44313014167 and .digest == $digest and .name == $name and .expired == false'
            gh api "$ep/zip" > "sources/$m.zip"
            printf '%s  %s\n' "$digest" "sources/$m.zip" | sha256sum -c -
            unzip -j "sources/$m.zip" "m12-lanczos-$m.json" -d sources
          done
          run=44484006385
          head=ca1d553fa059249d27a2a78c135762649f7ca4cf
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" | jq -e --arg sha "$head" '.head_sha == $sha'
          for spec in \
            'quarter 135422866604 14508829275 9990c96bd5a3472239603115c76bab8a73e315d2f56cdef52d79baa56114330e' \
            'half 135422866292 14509676518 67e2dab32d38111c75f6d6e5eccf1d4d9a6b7fb976826f6a9f28ae5b7b11c7cb' \
            'one 135422865996 14509761336 b74dd49df5008311e0bcd0b9d55beb8f51f8a43d703c917751f50f9616fc9145' \
            'two 135422866636 14510800057 16b87cb8697ba3ac849d5878a260a56558658f47d66f19a5f271b24b954c8429' \
            'four 135422866580 14509582582 3b2976875c6b84b676d16accc80332f20fb8d8774e45f48f9104f878782d7cbb'; do
            read -r slug job id digest <<< "$spec"
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job" | jq -e --arg sha "$head" --arg slug "$slug" '.head_sha == $sha and .run_id == 44484006385 and .conclusion == "success" and (.name | contains($slug+", 8192"))'
            ep="repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            gh api "$ep" | jq -e --arg sha "$head" --arg digest "sha256:$digest" --arg name "m12-profile-root-$slug-8192" '.workflow_run.head_sha == $sha and .workflow_run.id == 44484006385 and .digest == $digest and .name == $name and .expired == false'
            gh api "$ep/zip" > "sources/$slug.zip"
            printf '%s  %s\n' "$digest" "sources/$slug.zip" | sha256sum -c -
            unzip -p "sources/$slug.zip" profile-root-pilot.json > "sources/profile-$slug.json"
          done
      - name: Certify all 25 intermediate-precision values
        run: |
          set -euo pipefail
          python -m pip install python-flint==0.9.0
          python numerics/arb/m12_table_intermediate_2400.py | tee audit.log
          grep -F 'TABLE INTERMEDIATE SUCCESS 25 checks' audit.log
      - uses: actions/upload-artifact@v4
        with:
          name: m12-table-intermediate-2400
          path: |
            audit.log
            m12-table-2400.json
          if-no-files-found: error
