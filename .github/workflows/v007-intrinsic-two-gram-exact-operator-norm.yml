name: V007 exact true Gaussian Fock dual Gram operator norms

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireTwoGramExactOperatorNorm.lean'
      - '.github/workflows/v007-intrinsic-two-gram-exact-operator-norm.yml'
  workflow_dispatch:

jobs:
  intrinsic-dual-gram-norms:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit genuine two Gram exact norms
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireTwoGramExactOperatorNorm 2>&1 | tee /tmp/v007-intrinsic-exact-gram-norms.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireTwoGramExactOperatorNorm.lean 2>&1 | tee -a /tmp/v007-intrinsic-exact-gram-norms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-intrinsic-exact-gram-norms.log; then
            echo "::error::Forbidden axiom in intrinsic analytic Gram norm theorems"
            exit 1
          fi
          for theorem in \
            C_intrinsicEntire_two_gram_exact_operator_norm_eq \
            C_intrinsicEntire_outputGram_norm_eq_analysis_norm_sq \
            C_intrinsicEntire_two_gram_norms_eq_analysis_norm_sq; do
            grep -F "$theorem' depends on axioms:" /tmp/v007-intrinsic-exact-gram-norms.log
          done
          echo 'V007 exact true Gaussian output/source Gram Hilbert operator norms audited.'
