name: V007 exact polar adjoint and output Gram conjugacy

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/FullUnitaryPolarAdjointOutputGram.lean'
      - 'lean/GegenbauerFock/CompletePositiveSingularFamily.lean'
      - '.github/workflows/v007-full-polar-adjoint-output-gram.yml'
  workflow_dispatch:

jobs:
  polar-adjoint-output-gram:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit genuine polar adjoint and output Gram conjugacy
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.FullUnitaryPolarAdjointOutputGram 2>&1 | tee /tmp/v007-polar-adjoint-output-gram-build.log
          lake env lean -M16768 GegenbauerFock/FullUnitaryPolarAdjointOutputGram.lean 2>&1 | tee /tmp/v007-polar-adjoint-output-gram-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-polar-adjoint-output-gram-build.log /tmp/v007-polar-adjoint-output-gram-axioms.log; then
            echo '::error::Forbidden axiom in genuine polar adjoint and output Gram conjugacy.'
            exit 1
          fi
          grep -F "exists_full_unitary_polar_adjoint_and_outputGram_kummer' depends on axioms:" /tmp/v007-polar-adjoint-output-gram-axioms.log
          echo 'V007 genuine full-Hilbert polar adjoint and output Gram conjugacy verified and audited.'
