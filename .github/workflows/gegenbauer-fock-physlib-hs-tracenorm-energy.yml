name: V007 general HS-product CFC trace-norm energy certificate

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/PhyslibHSProductTraceNormEnergy.lean'
      - '.github/workflows/gegenbauer-fock-physlib-hs-tracenorm-energy.yml'
  workflow_dispatch:

jobs:
  hs-tracenorm-energy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned elan and Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt*8))"
          done
          test "$installed" = 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt*8))"
          done
          test "$ready" = 1
      - name: Generate manifest for fixed Mathlib
        working-directory: lean
        run: lake update
      - name: Obtain Mathlib build artifacts
        working-directory: lean
        run: lake exe cache get
      - name: Verify full Hilbert-Schmidt product trace norm energy bound
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.PhyslibHSProductTraceNormEnergy 2>&1 | tee /tmp/gf-hs-tracenorm-energy.log
          grep -F "ProbabilisticTheory.traceNorm_mul_twoHilbertSchmidt_le_polar_energy' depends on axioms:" /tmp/gf-hs-tracenorm-energy.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/gf-hs-tracenorm-energy.log; then
            echo '::error::Forbidden axiom in HS trace norm energy theorem.'
            exit 1
          fi
          echo 'CFC trace norm energy inequality: kernel compilation and axiom audit passed.'
