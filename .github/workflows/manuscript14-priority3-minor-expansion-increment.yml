name: "Priority 3 — complex principal-minor insertion exponential increment"

on:
  push:
    branches:
      - manuscript14-priority3-minor-expansion-increment-20261110
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3MinorExpansionIncrement.lean'
      - '.github/workflows/manuscript14-priority3-minor-expansion-increment.yml'
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3MinorExpansionIncrement.lean'
      - '.github/workflows/manuscript14-priority3-minor-expansion-increment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Complex subset increment and sharp exponential control — two audits
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile exact complex principal subset increment
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -M16768 SpecialImaginaryPoint/V14119Priority3MinorExpansionIncrement.lean 2>&1 | tee /tmp/p3-minor-increment.log
      - name: Kernel audit two declarations with only standard axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          log=pathlib.Path("/tmp/p3-minor-increment.log").read_text()
          prefix="Manuscript14Priority3.MinorExpansionIncrement."
          names=["principalExpansion_insert_sub","principalExpansion_insert_norm_le_exp"]
          found={}
          for m in re.finditer(r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms",log,re.MULTILINE):
            found[m.group(1) or m.group(3)]={x.strip() for x in (m.group(2) or "").split(",") if x.strip()}
          allowed={"propext","Quot.sound","Classical.choice"}
          for suffix in names:
            n=prefix+suffix
            assert n in found, f"Missing audit: {n}"
            assert found[n] <= allowed, f"Nonstandard axiom: {n}: {found[n]-allowed}"
            print(n,sorted(found[n]))
          assert "sorryAx" not in log and "Lean.ofReduceBool" not in log
          assert not re.search(r"\.lean:\d+:\d+: error",log)
          print("SUCCESS: complex subset insertion identity and sharp exponential increment")
          PY
      - name: Upload exact Lean log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priority3-minor-expansion-increment-log
          path: /tmp/p3-minor-increment.log
          if-no-files-found: ignore
