name: V007 exact complete real L2 Gegenbauer coefficient separation

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonicRealL2CoefficientSeparation.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonicPolynomialSpan.lean'
      - '.github/workflows/v007-ultraspherical-sturm-monic-real-l2-coefficient-separation.yml'
  workflow_dispatch:

jobs:
  monic-real-l2-coefficient-separation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and axiom-audit full real L2 Gegenbauer coefficients
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleMonicRealL2CoefficientSeparation 2>&1 | tee /tmp/v007-monic-l2-coeff-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleMonicRealL2CoefficientSeparation.lean 2>&1 | tee /tmp/v007-monic-l2-coeff-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-monic-l2-coeff-build.log /tmp/v007-monic-l2-coeff-axioms.log; then
            echo '::error::Forbidden axiom in Gegenbauer weighted-L2 dense span.'
            exit 1
          fi
          grep -F "sturmMonicEigenCandidate_realL2_coefficients_eq_zero_iff' depends on axioms:" /tmp/v007-monic-l2-coeff-axioms.log
          grep -F "sturmMonicEigenCandidate_realL2_coefficients_injective' depends on axioms:" /tmp/v007-monic-l2-coeff-axioms.log
          echo 'V007 complete all-degree Gegenbauer L2 coefficient separation certified.'
