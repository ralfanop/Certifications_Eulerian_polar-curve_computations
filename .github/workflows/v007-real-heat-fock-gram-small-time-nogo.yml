name: V007 actual Legendre heat versus Fock Gram small-time no-go

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatFockGramSmallTimeNoGo.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatFockGramTraceObstruction.lean'
      - '.github/workflows/v007-real-heat-fock-gram-small-time-nogo.yml'
  workflow_dispatch:

jobs:
  small-time-trace-no-go-kernel-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build small-time interval obstruction and audit axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealHeatFockGramSmallTimeNoGo 2>&1 | tee /tmp/v007-small-time-nogo-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatFockGramSmallTimeNoGo.lean 2>&1 | tee /tmp/v007-small-time-nogo-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-small-time-nogo-build.log /tmp/v007-small-time-nogo-axioms.log; then
            echo '::error::Forbidden axiom in the small-time heat/Fock Gram trace obstruction.'
            exit 1
          fi
          grep -F "legendre_heat_smallTime_trace_ge_nine_fifths' depends on axioms:" /tmp/v007-small-time-nogo-axioms.log
          grep -F "no_legendre_heat_small_positive_time_to_fock_gram_basis_intertwiner' depends on axioms:" /tmp/v007-small-time-nogo-axioms.log
          echo 'V007 small-time interval heat/Gram spectral obstruction audited.'
