name: Manuscript 15 — Arb 10000 working bits and 8182-bit certificate

on:
  push:
    branches:
      - main
      - manuscript15-arb10000-cert-20261111
    paths:
      - 'numerics/manuscript15_arb10000.py'
      - '.github/workflows/manuscript15-arb10000.yml'
  pull_request:
    paths:
      - 'numerics/manuscript15_arb10000.py'
      - '.github/workflows/manuscript15-arb10000.yml'
  workflow_dispatch:

jobs:
  arb10000:
    name: Rigorous Arb interval enclosures and decimal rounding
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned python-flint
        run: python -m pip install 'python-flint==0.9.0'
      - name: Check script syntax
        run: python -m py_compile numerics/manuscript15_arb10000.py
      - name: Certify >=8182 relative bits at 10000 working bits
        shell: bash
        run: |
          set -euo pipefail
          python numerics/manuscript15_arb10000.py 2>&1 | tee /tmp/manuscript15-arb10000.log
          grep -F "SUCCESS — fourteen rigorously enclosed values" /tmp/manuscript15-arb10000.log
          grep -F "CERTIFIED Figure 1: alpha_3 rounds to 53.1301023542 degrees" /tmp/manuscript15-arb10000.log
      - name: Upload complete reproducible Arb log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript15-arb10000-enclosures
          path: /tmp/manuscript15-arb10000.log
