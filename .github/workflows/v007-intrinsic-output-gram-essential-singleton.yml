name: V007 true intrinsic Fock output essential spectrum singleton

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireOutputGramEssentialSingleton.lean'
      - '.github/workflows/v007-intrinsic-output-gram-essential-singleton.yml'
  workflow_dispatch:

jobs:
  true-holomorphic-essential-singleton:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore exact pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Audit full true holomorphic output Fredholm spectrum
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireOutputGramEssentialSingleton 2>&1 | tee /tmp/v007-intrinsic-output-essential-singleton.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireOutputGramEssentialSingleton.lean 2>&1 | tee -a /tmp/v007-intrinsic-output-essential-singleton.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-intrinsic-output-essential-singleton.log; then
            echo "::error::Forbidden axiom in full genuine output Fredholm essential spectrum"
            exit 1
          fi
          grep -F "C_intrinsicEntire_outputGram_nonzero_shift_isFredholm' depends on axioms:" /tmp/v007-intrinsic-output-essential-singleton.log
          grep -F "C_intrinsicEntire_outputGram_fredholm_essential_eq_singleton_zero' depends on axioms:" /tmp/v007-intrinsic-output-essential-singleton.log
          echo 'V007 full real Gaussian holomorphic output essential spectrum equals singleton zero, audited.'
