name: V007 mixed nonpositive Gram S1 independent certificate

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/PhyslibMixedGramTraceClass.lean'
      - 'lean/GegenbauerFock/PhyslibTraceClassTwoSidedIdeal.lean'
      - 'lean/GegenbauerFock/PhyslibGeneralHSProductTraceClass.lean'
      - 'lean/GegenbauerFock/PhyslibTraceClassHSFactorization.lean'
      - '.github/workflows/gegenbauer-fock-physlib-mixed-s1.yml'
  workflow_dispatch:

jobs:
  physlib-mixed-s1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt*8))"
          done
          test "$installed" = 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt*8))"
          done
          test "$ready" = 1
      - name: Generate Lake manifest for pinned Mathlib
        working-directory: lean
        run: lake update
      - name: Fetch pinned Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Build mixed Gram S1 and audit theorem axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.PhyslibMixedGramTraceClass 2>&1 | tee /tmp/gf-mixed-s1.log
          for theorem in gram_twoSided_isTraceClass gramMixed_isTraceClass gramMixedTraceClass_operator; do
            grep -F "GegenbauerFock.GeneralUltrasphericalFock.${theorem}' depends on axioms:" /tmp/gf-mixed-s1.log
          done
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/gf-mixed-s1.log; then
            echo '::error::Forbidden axiom dependency in mixed S1 certificate.'
            exit 1
          fi
          echo 'Mixed S1 build and three declaration audits passed.'
