name: M12 Theorem 5.14 concrete compact-uniform bridge
on:
  pull_request:
    paths:
      - 'lean/EulerianGrothendieck/UniformLanczos/Rate514ConcreteBridge.lean'
      - '.github/workflows/m12-rate514-concrete-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Lean 4.24
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build actual hybrid and compact uniform proof
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.24.0'
          ! grep -n -E '^\s*(axiom|opaque)\b|\b(sorry|admit|native_decide)\b' UniformLanczos/Rate514ConcreteBridge.lean
          lake exe cache get
          lake build UniformLanczos.Rate514Assembly 2>&1 | tee /tmp/m12-514-bridge-build.log
          lake env lean UniformLanczos/Rate514ConcreteBridge.lean 2>&1 | tee /tmp/m12-514-bridge.log
      - name: Strict axioms and theorem inventory
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('/tmp/m12-514-bridge.log').read_text()
          assert not re.search(r'(^|\n).*: error:',s),'Lean elaboration failed'
          assert 'sorryAx' not in s and 'Lean.ofReduceBool' not in s
          ns=['actualDifference_outside','actualDifference_center','rateConstant_pos',
              'actual_rate_from_operator_certificate','compact_uniform_rate_from_operator_certificates']
          for n in ns:
              name='UniformLanczos.Rate514ConcreteBridge.'+n
              m=re.search(r"'"+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]",s)
              if m: axioms={x.strip() for x in m.group(1).split(',') if x.strip()}
              else:
                  assert "'"+name+"' does not depend on any axioms" in s, name
                  axioms=set()
              assert axioms <= {'propext','Classical.choice','Quot.sound'},(name,axioms)
              print('AUDIT',name,sorted(axioms))
          print('M12 5.14 CONDITIONAL COMPACT-UNIFORM BRIDGE SUCCESS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-514-concrete-uniform-bridge-logs
          path: |
            /tmp/m12-514-bridge-build.log
            /tmp/m12-514-bridge.log
