name: V007 sharp bilateral Gegenbauer Fock S1 Kummer norm certificate

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/PhyslibGramTwoSidedTraceNormSharp.lean'
      - 'lean/GegenbauerFock/PhyslibHSProductTraceNormHolder.lean'
      - 'lean/GegenbauerFock/PhyslibHSProductTraceNormWeightedYoung.lean'
      - 'lean/GegenbauerFock/SchattenYoungSharpReal.lean'
      - 'lean/GegenbauerFock/PhyslibMixedGramTraceClass.lean'
      - '.github/workflows/gegenbauer-fock-physlib-gram-bilateral-sharp.yml'
  workflow_dispatch:

jobs:
  gram-bilateral-sharp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt*8))"
          done
          test "$installed" = 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt*8))"
          done
          test "$ready" = 1
      - name: Resolve pinned Mathlib manifest
        working-directory: lean
        run: lake update
      - name: Load pinned Mathlib compilation cache
        working-directory: lean
        run: lake exe cache get
      - name: Check sharp ultraspherical bilateral trace-norm Kummer theorem
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.PhyslibGramTwoSidedTraceNormSharp 2>&1 | tee /tmp/gf-gram-bilateral-sharp.log
          grep -F "GegenbauerFock.GeneralUltrasphericalFock.gram_twoSided_traceNorm_le_kummer_sharp' depends on axioms:" /tmp/gf-gram-bilateral-sharp.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/gf-gram-bilateral-sharp.log; then
            echo '::error::Nonstandard axiom.'
            exit 1
          fi
          echo 'Sharp full Gegenbauer Fock Schatten S1 ideal bound audited.'
