name: V007 general rectangular HS Gram CFC trace ideal independent certificate

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/HSGramTraceIdealGeneral.lean'
      - '.github/workflows/gegenbauer-fock-hs-general-s1-gram.yml'
  pull_request:
    paths:
      - 'lean/GegenbauerFock/HSGramTraceIdealGeneral.lean'
      - '.github/workflows/gegenbauer-fock-hs-general-s1-gram.yml'
  workflow_dispatch:

jobs:
  general-hs-gram-s1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install existing pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" = 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" = 1
      - name: Generate Lake manifest preserving pinned Mathlib
        working-directory: lean
        run: lake update
      - name: Fetch matching Mathlib build artifacts
        working-directory: lean
        run: lake exe cache get
      - name: Verify pinned Lean memory argument
        working-directory: lean
        run: lake env lean -M16768 --version
      - name: Compile general HS Gram trace ideal and audit kernel axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.HSGramTraceIdealGeneral 2>&1 | tee /tmp/gf-hs-general-gram.log
          for theorem in gram_isTraceClass_of_summableRows gram_traceNorm_eq_rows rows_summable_comp_right rowEnergy_comp_right_le gram_traceNorm_comp_right_le; do
            grep -F "GegenbauerFock.FockEnergy.${theorem}' depends on axioms:" /tmp/gf-hs-general-gram.log
          done
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/gf-hs-general-gram.log; then
            echo "::error::Forbidden axiom in general S1/S2 Gram ideal."
            exit 1
          fi
          echo "General Hilbert S2/positive S1 Gram trace ideal: Lean kernel certification complete."
