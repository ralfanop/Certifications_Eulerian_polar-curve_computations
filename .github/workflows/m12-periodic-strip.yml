name: M12 streaming periodic-strip quadrature pilot
on:
  pull_request:
    paths:
      - 'numerics/arb/m12_profile_periodic_strip.py'
      - '.github/workflows/m12-periodic-strip.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        S: [4, 93]
        bits: [256, 512, 1024]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin exact HEAD and FLINT
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m pip install python-flint==0.9.0
      - name: Verify analytic strip and periodic quadrature
        run: |
          set -euo pipefail
          python numerics/arb/m12_profile_periodic_strip.py ${{ matrix.S }} --bits ${{ matrix.bits }} 2>&1 | tee pilot.log
          grep -F 'PERIODIC BENCHMARK PASS' pilot.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-periodic-${{ matrix.S }}-${{ matrix.bits }}
          path: pilot.log
