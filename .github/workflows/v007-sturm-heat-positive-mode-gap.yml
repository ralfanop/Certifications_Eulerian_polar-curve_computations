name: V007 genuine L2 heat all-positive-mode spectral-gap bound

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatPositiveModeGap.lean'
      - '.github/workflows/v007-sturm-heat-positive-mode-gap.yml'
  workflow_dispatch:

jobs:
  heat-positive-mode-gap:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and kernel audit heat positive mode bounds
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealHeatPositiveModeGap 2>&1 | tee /tmp/v007-heat-gap-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatPositiveModeGap.lean 2>&1 | tee /tmp/v007-heat-gap-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-heat-gap-build.log /tmp/v007-heat-gap-axioms.log; then
            echo '::error::Forbidden axiom in genuine L2 heat spectral-gap theorem.'
            exit 1
          fi
          grep -F "sturmRealHeatLimitCLM_positive_mode_gap_bound' depends on axioms:" /tmp/v007-heat-gap-axioms.log
          echo 'V007 genuine L2 positive-mode heat gap bound kernel-certified.'
