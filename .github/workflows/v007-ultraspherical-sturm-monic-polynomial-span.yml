name: V007 all-degree monic Gegenbauer polynomial span

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonicPolynomialSpan.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonicDegree.lean'
      - '.github/workflows/v007-ultraspherical-sturm-monic-polynomial-span.yml'
  workflow_dispatch:

jobs:
  monic-polynomial-span:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and axiom-audit polynomial span
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleMonicPolynomialSpan 2>&1 | tee /tmp/v007-monic-span-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleMonicPolynomialSpan.lean 2>&1 | tee /tmp/v007-monic-span-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-monic-span-build.log /tmp/v007-monic-span-axioms.log; then
            echo '::error::Forbidden axiom in monic polynomial span.'
            exit 1
          fi
          grep -F "sturmMonicEigenCandidate_X_pow_mem_span' depends on axioms:" /tmp/v007-monic-span-axioms.log
          grep -F "sturmMonicEigenCandidate_span_eq_top' depends on axioms:" /tmp/v007-monic-span-axioms.log
          echo 'V007 all-degree algebraic Gegenbauer span certified.'
