name: V007 heat-limit Gegenbauer-mode strong time continuity

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatLimitModeContinuity.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatLimitEigenmodes.lean'
      - '.github/workflows/v007-sturm-heat-limit-mode-continuity.yml'
  workflow_dispatch:

jobs:
  genuine-heat-limit-mode-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit strong continuity of heat-limit Gegenbauer eigenmodes
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealHeatLimitModeContinuity 2>&1 | tee /tmp/v007-heat-mode-continuity-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatLimitModeContinuity.lean 2>&1 | tee /tmp/v007-heat-mode-continuity-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-heat-mode-continuity-build.log /tmp/v007-heat-mode-continuity-axioms.log; then
            echo '::error::Forbidden axiom in heat-limit mode continuity.'
            exit 1
          fi
          grep -F "sturmRealHeatLimitNonnegativeExtended_opNorm_le' depends on axioms:" /tmp/v007-heat-mode-continuity-axioms.log
          grep -F "sturmRealHeatLimitNonnegativeExtended_mode' depends on axioms:" /tmp/v007-heat-mode-continuity-axioms.log
          grep -F "sturmRealHeatLimitNonnegativeExtended_mode_tendsto_zero' depends on axioms:" /tmp/v007-heat-mode-continuity-axioms.log
          echo 'V007 heat-limit normalized Gegenbauer mode strong C0 continuity kernel-certified.'
