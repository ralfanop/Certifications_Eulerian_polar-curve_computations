name: V007 actual Sturm heat versus Fock Gram trace obstruction

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatFockGramTraceObstruction.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatComplexCFCS1Bridge.lean'
      - 'lean/GegenbauerFock/RationalTraceAnalyticTail.lean'
      - '.github/workflows/v007-real-heat-fock-gram-trace-obstruction.yml'
  workflow_dispatch:

jobs:
  actual-operator-trace-no-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Verify actual heat versus Fock Gram trace-gap and forbidden axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealHeatFockGramTraceObstruction 2>&1 | tee /tmp/v007-heat-fock-trace-gap-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatFockGramTraceObstruction.lean 2>&1 | tee /tmp/v007-heat-fock-trace-gap-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-heat-fock-trace-gap-build.log /tmp/v007-heat-fock-trace-gap-axioms.log; then
            echo '::error::Forbidden axiom in V007 actual heat versus Gram trace-gap certificate.'
            exit 1
          fi
          grep -F "no_heat_fockGram_basis_intertwiner_of_trace_gap' depends on axioms:" /tmp/v007-heat-fock-trace-gap-axioms.log
          grep -F "no_legendre_heat_one_tenth_to_fock_gram_one_basis_intertwiner' depends on axioms:" /tmp/v007-heat-fock-trace-gap-axioms.log
          echo 'V007 trace-gap no-go theorem for actual heat and Fock Gram audited.'
