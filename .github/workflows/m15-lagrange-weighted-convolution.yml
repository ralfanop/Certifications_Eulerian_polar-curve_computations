name: M15 Lagrange weighted finite convolution exact-head

on:
  pull_request:
    paths:
      - 'lean/Manuscript15/TerminalLagrangeWeightedConvolution20261123.lean'
      - '.github/workflows/m15-lagrange-weighted-convolution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Lean/Mathlib and strict axiom audit
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
          git rev-parse HEAD | tee /tmp/m15-weighted-convolution.log
          mkdir -p .lake/build/lib/lean/Manuscript15
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/TerminalLagrangeFiniteCoefficients20261123.olean Manuscript15/TerminalLagrangeFiniteCoefficients20261123.lean 2>&1 | tee -a /tmp/m15-weighted-convolution.log
          lake env lean -M16768 Manuscript15/TerminalLagrangeWeightedConvolution20261123.lean 2>&1 | tee -a /tmp/m15-weighted-convolution.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/m15-weighted-convolution.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log=Path('/tmp/m15-weighted-convolution.log').read_text()
          names=['Manuscript15.TerminalLagrangeWeighted.'+s for s in (
             'weighted_derivative','weighted_coefficient','weighted_finite_convolution',
             'fixedpoint_subst_finite','fixedpoint_power_finite_sum',
             'weighted_range_convolution','closed_monomial_coeff',
             'general_subst_finite','coeff_derivative_mul_as_range',
             'closed_general_coeff')]
          for name in names:
              m=re.findall(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]",log,re.S)
              assert m or ("'"+name+"' does not depend on any axioms") in log, name
              for group in m:
                  assert {s.strip() for s in group.split(',') if s.strip()} <= {
                      'propext','Classical.choice','Quot.sound'}, name
          print('M15 LAGRANGE WEIGHTED COEFFICIENT AXIOM AUDIT SUCCESS',len(names))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-lagrange-weighted-lean-log
          path: /tmp/m15-weighted-convolution.log
