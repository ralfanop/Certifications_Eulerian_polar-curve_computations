name: M14 actual anisotropic potential and locally uniform limit
on:
  push:
    branches: [draft/m14-actual-anisotropic-limit-20261127]
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/EulerianLegendreAnisotropic.lean'
      - '.github/workflows/m14-actual-anisotropic-limit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Lean
        working-directory: lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Retrieve Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Compile exact dependency chain and audit 111 declarations
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          for module in EulerianLegendreDuality EulerianLegendreOrigin EulerianLegendreQuarticJet EulerianLegendreSupport EulerianLegendreTaylorRemainder EulerianLangevinRange EulerianLegendreInverseRate EulerianLegendreAnisotropic; do
            lake env lean -o ".lake/build/lib/lean/SpecialImaginaryPoint/$module.olean" "SpecialImaginaryPoint/$module.lean" 2>&1 | tee "/tmp/$module.log"
          done
          python - <<'PY'
          import re
          for module, count in [('EulerianLegendreDuality', 19), ('EulerianLegendreOrigin', 14), ('EulerianLegendreQuarticJet', 17), ('EulerianLegendreSupport', 8), ('EulerianLegendreTaylorRemainder', 8), ('EulerianLangevinRange', 6), ('EulerianLegendreInverseRate', 29), ('EulerianLegendreAnisotropic', 10)]:
              s = open('/tmp/'+module+'.log').read()
              assert not re.search(r'sorryAx|Lean\.ofReduceBool|declaration uses|: error[:(]',s)
              found = re.findall(r"depends on axioms: \[([^\]]*)\]|does not depend on any axioms",s)
              assert len(found) == count, (module, found)
              for a in found:
                  assert set(filter(None,a.split(', '))) <= {'propext','Classical.choice','Quot.sound'}, a
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m14-actual-anisotropic-limit-audit
          path: /tmp/EulerianLegendre*.log
