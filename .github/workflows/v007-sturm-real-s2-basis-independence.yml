name: V007 real Sturm HS S2 full basis independence
on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealS2BasisIndependence.lean'
      - '.github/workflows/v007-sturm-real-s2-basis-independence.yml'
  workflow_dispatch:
jobs:
  real-s2-basis-independence:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit real S2 basis-independent operator energy
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealS2BasisIndependence 2>&1 | tee /tmp/v007-real-s2-basis-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealS2BasisIndependence.lean 2>&1 | tee /tmp/v007-real-s2-basis-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-s2-basis-build.log /tmp/v007-real-s2-basis-axioms.log; then
            echo '::error::Forbidden axiom in real S2 basis invariance.'
            exit 1
          fi
          for theorem in realHilbertBasis_hasSum_inner_sq realHilbertSelfAdjoint_hsMass_hasSum_any_basis sturmRealPositiveResolvent_hsMass_any_realHilbertBasis sturmRealPositiveResolvent_isHS_any_realHilbertBasis; do
            grep -F "GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-real-s2-basis-axioms.log
          done
          echo 'V007 real Hilbert S2 basis-independent mass kernel-certified.'
