name: "M15 S2.7 coupling cost infimum order"
on:
  push:
    branches:
      - draft/m15-s27-infimum-order-20261114
  pull_request:
    paths:
      - 'lean/Manuscript15/Section27CostInfimum.lean'
      - '.github/workflows/m15-s27-infimum-order.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile imports and audit axioms
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Manuscript15
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/Section27CouplingIntegral.olean Manuscript15/Section27CouplingIntegral.lean 2>&1 | tee /tmp/base.log
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/Section27TwoCoordinate.olean Manuscript15/Section27TwoCoordinate.lean 2>&1 | tee /tmp/two.log
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/Section27WeightedCoordinate.olean Manuscript15/Section27WeightedCoordinate.lean 2>&1 | tee /tmp/weighted.log
          lake env lean -M16768 Manuscript15/Section27CostInfimum.lean 2>&1 | tee /tmp/infimum.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:' /tmp/base.log /tmp/two.log /tmp/weighted.log /tmp/infimum.log; then exit 1; fi
          grep -F "Manuscript15.Section27.discrepancy_le_coupling_cost_infimum" /tmp/infimum.log
          grep -F "Manuscript15.Section27.discrepancy_le_scaled_coupling_cost_infimum" /tmp/infimum.log
