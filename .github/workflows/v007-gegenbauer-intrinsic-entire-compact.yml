name: V007 compact ultraspherical transform into genuine intrinsic Gaussian Fock

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireCompactQuasiaffinity.lean'
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireFockOperator.lean'
      - 'lean/GegenbauerFock/CompactFockProperDenseRange.lean'
      - '.github/workflows/v007-gegenbauer-intrinsic-entire-compact.yml'
  workflow_dispatch:

jobs:
  genuine-intrinsic-compact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore existing pinned Mathlib revision and cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile intrinsic Gegenbauer compact quasiaffinity and audit axioms
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireCompactQuasiaffinity 2>&1 | tee /tmp/v007-intrinsic-gegenbauer-compact.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireCompactQuasiaffinity.lean 2>&1 | tee -a /tmp/v007-intrinsic-gegenbauer-compact.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-intrinsic-gegenbauer-compact.log; then
            echo "::error::Forbidden axioms in V007 intrinsic compact Gegenbauer transform"
            exit 1
          fi
          grep -F "C_intrinsicEntire_compact' depends on axioms:" /tmp/v007-intrinsic-gegenbauer-compact.log
          grep -F "C_intrinsicEntire_opNorm_eq' depends on axioms:" /tmp/v007-intrinsic-gegenbauer-compact.log
          grep -F "C_intrinsicEntire_not_surjective' depends on axioms:" /tmp/v007-intrinsic-gegenbauer-compact.log
          echo 'V007 genuine ultraspherical-to-entire Gaussian transform: compactness and norm certified.'
