name: V007 HS product genuine CFC trace norm sum bound

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/PhyslibHSProductTraceNormSumBound.lean'
      - 'lean/GegenbauerFock/PhyslibHSProductTraceNormEnergy.lean'
      - 'lean/GegenbauerFock/PhyslibHSRightBasisEnergyBound.lean'
      - '.github/workflows/gegenbauer-fock-physlib-hs-tracenorm-sumbound.yml'
  workflow_dispatch:

jobs:
  hs-tracenorm-sumbound:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and elan
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt*8))"
          done
          test "$installed" = 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt*8))"
          done
          test "$ready" = 1
      - name: Generate pinned Mathlib Lake manifest
        working-directory: lean
        run: lake update
      - name: Download Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Compile product trace bound and audit axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.PhyslibHSProductTraceNormSumBound 2>&1 | tee /tmp/gf-hs-trace-norm-sumbound.log
          grep -F "ProbabilisticTheory.traceNorm_mul_twoHilbertSchmidt_le_energy_sum' depends on axioms:" /tmp/gf-hs-trace-norm-sumbound.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/gf-hs-trace-norm-sumbound.log; then
            echo '::error::Non-standard axiom detected in product norm bound.'
            exit 1
          fi
          echo 'Real CFC trace-norm S2-energy sum estimate audited.'
