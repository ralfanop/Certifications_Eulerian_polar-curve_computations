name: Manuscript 15 — terminal convolution power jet Lean kernel
on:
  push:
    branches:
      - manuscript15-terminal-power-jet-20261111
    paths:
      - 'lean/Manuscript15/TerminalPowerJet.lean'
      - '.github/workflows/manuscript15-terminal-power-jet.yml'
  pull_request:
    paths:
      - 'lean/Manuscript15/TerminalPowerJet.lean'
      - '.github/workflows/manuscript15-terminal-power-jet.yml'
  workflow_dispatch:
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors \
            --retry-delay 5 --connect-timeout 20 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
      - name: Fetch pinned Mathlib cache
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-check zero-power jet and terminal coordinate derivatives
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean Manuscript15/TerminalPowerJet.lean 2>&1 | tee /tmp/m15-terminal-jet.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/m15-terminal-jet.log; then
            echo '::error::Forbidden axiom'
            exit 1
          fi
          for decl in hasDerivAt_power_zero hasDerivAt_power_reconstruction_X hasDerivAt_power_reconstruction_Y; do
            grep -F "Manuscript15.$decl" /tmp/m15-terminal-jet.log
          done
      - name: Save kernel log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript15-terminal-power-jet
          path: /tmp/m15-terminal-jet.log
