name: Gegenbauer–Fock Lean proof checks

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
  pull_request:
    paths:
      - 'lean/GegenbauerFock/**'
      - '.github/workflows/gegenbauer-fock-lean.yml'
  workflow_dispatch:

jobs:
  lean-algebraic-core:
    # Public-repository GitHub-hosted Linux runners supply 16 GB RAM in
    # TOTAL per VM/job (shared by all Lean/Lake processes in that job).
    # This cannot be interpreted as 16 GB for every concurrent process.
    runs-on: ubuntu-24.04
    steps:
      - name: Verify available 16 GB runner memory budget
        shell: bash
        run: |
          set -euo pipefail
          echo 'Public Ubuntu runner nominal RAM budget: 16 GB total per job.'
          free -h
          grep -E '^MemTotal:' /proc/meminfo
          if [ -f /sys/fs/cgroup/memory.max ]; then
            printf 'cgroup memory.max: '
            cat /sys/fs/cgroup/memory.max
          fi
          mem_kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          # 16 GB nominal VMs report slightly less after reserved memory.
          if [ "$mem_kib" -lt 14500000 ]; then
            echo "::error::Runner has less memory than the nominal 16 GB public runner."
            exit 1
          fi
          echo '16 GB public runner memory tier confirmed.'
      - uses: actions/checkout@v4

      # The existing certification repository does not check in a
      # lake-manifest.json. The lean-action composite itself refuses to
      # initialize without it, even with auto-config: false; install
      # elan directly and run lake update before requesting Mathlib cache.
      - name: Install elan and pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          # Upstream GitHub and Lean release endpoints can return transient HTTP 504.
          # Retry downloads, but never change lean/lean-toolchain or Mathlib pins.
          curl --proto '=https' --tlsv1.2 -fsSL \
            --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then
              installed=1
              break
            fi
            echo "::warning::elan bootstrap failed, attempt ${attempt}/6"
            sleep "$((attempt * 8))"
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::elan bootstrap unavailable after six attempts"
            exit 1
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            # lean --version triggers installation of the EXACT pinned
            # toolchain (lean/lean-toolchain); some failures originate here.
            if "$HOME/.elan/bin/lean" --version &&
               "$HOME/.elan/bin/lake" --version; then
              ready=1
              break
            fi
            echo "::warning::pinned Lean toolchain download failed, attempt ${attempt}/6"
            sleep "$((attempt * 8))"
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::pinned Lean installation unavailable after six attempts"
            exit 1
          fi

      - name: Generate Lake manifest for existing pinned Mathlib
        working-directory: lean
        run: lake update

      - name: Fetch Mathlib build artifacts
        working-directory: lean
        run: lake exe cache get

      # All Lake builds inherit weakLeanArgs = ["-M16768"] from
      # lean/lakefile.toml. Direct lake env lean invocations below
      # receive the same flag explicitly.
      - name: Check per-process Lean -M16768 option
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 --version

      # Check the new Mathlib-complex Gamma and positive nuclear bridge early;
      # keep the exact existing toolchain and -M16768 memory cap.
      - name: Certify real-to-complex Kummer Gamma and positive S1 witness
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.KummerRegularizedBridge GegenbauerFock.PositiveTraceClassBridge GegenbauerFock.PhyslibTraceClassCompat GegenbauerFock.PhyslibHilbertSchmidtCompat GegenbauerFock.PhyslibTraceClassScalar GegenbauerFock.PhyslibTraceClassSubtype GegenbauerFock.PositiveNuclearConjugation GegenbauerFock.HSRowBasisGeneral GegenbauerFock.PhyslibHSRightIdeal GegenbauerFock.HSOperatorIdealTwoSided GegenbauerFock.PhyslibGramConjugationIdeal GegenbauerFock.PhyslibTraceNormCore GegenbauerFock.PhyslibPositiveTraceAdd GegenbauerFock.PhyslibPositiveTraceAddNorm GegenbauerFock.PhyslibFinitePositiveTrace GegenbauerFock.PhyslibFinitePositiveTraceNorm 2>&1 | tee /tmp/gf-schatten-gamma.log

      # Develop new Beta/Kummer proof modules first so that short
      # iteration failures are visible before the longest spectral builds.
      - name: Certify sharp elementary bounds on general ultraspherical Fock row energy
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RowEnergyBounds 2>&1 | tee /tmp/gf-row-energy-bounds.log

      - name: Certify positive Kummer series bounds by real exponential
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.KummerPositiveBounds 2>&1 | tee /tmp/gf-kummer-positive-bounds.log

      - name: Certify unconditional vanishing of all odd ultraspherical moments
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalOddVanishing 2>&1 | tee /tmp/gf-ultra-odd-vanishing.log

      - name: Certify odd Beta integrand reflection and real Lebesgue invariance
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalOddReflection 2>&1 | tee /tmp/gf-ultra-odd-reflection.log

      - name: Certify pointwise symmetric Beta density reflection on the entire real line
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalBetaSymmetry 2>&1 | tee /tmp/gf-ultra-beta-symmetry.log

      - name: Certify absolute convergence of Kummer coefficients for all real arguments
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.KummerEntireReal 2>&1 | tee /tmp/gf-kummer-entire-real.log

      - name: Certify positive nuclear Gram mass as general even-moment series
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.KummerNuclearBridge 2>&1 | tee /tmp/gf-kummer-nuclear-bridge.log

      - name: Certify affine Beta-to-ultraspherical Lebesgue Jacobian
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalAffineJacobian 2>&1 | tee /tmp/gf-ultra-affine-jacobian.log

      - name: Certify measure-level ultraspherical Beta pushforward density
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalMeasureDensity 2>&1 | tee /tmp/gf-ultra-measure-density.log

      - name: Certify classical Gamma-normalized ultraspherical measure identity
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalGammaDensity 2>&1 | tee /tmp/gf-ultra-gamma-density.log

      - name: Certify general symmetric Beta pushforward test-function integration
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalDensityIntegration 2>&1 | tee /tmp/gf-ultra-density-integration.log

      - name: Certify general ultraspherical even moments as genuine symmetric Beta integrals
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalBetaMoments 2>&1 | tee /tmp/gf-ultra-beta-moments.log

      - name: Certify actual Fock energy even-moment generating series and conditional Kummer bridge
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalKummerBridge 2>&1 | tee /tmp/gf-ultra-kummer-bridge.log

      - name: Certify integrability and bounds of every general ultraspherical even moment
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalMomentBounds 2>&1 | tee /tmp/gf-ultra-moment-bounds.log

      - name: Certify Kummer series coefficients as true Pochhammer ratios
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.KummerPochhammer 2>&1 | tee /tmp/gf-kummer-pochhammer.log

      - name: Certify positive Kummer coefficient model and real series convergence
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.KummerCoefficients 2>&1 | tee /tmp/gf-kummer-coeff.log

      - name: Certify right ideal bound for Hilbert-Schmidt rows
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.HSRightIdeal 2>&1 | tee /tmp/gf-hs-ideal.log

      - name: Certify input Hilbert-basis Parseval for actual Fock rows
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.HSBasisEnergy 2>&1 | tee /tmp/gf-hs-basis.log

      - name: Certify basis-independent infinite Fock Hilbert-Schmidt norm
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.FockHilbertSchmidtNorm 2>&1 | tee /tmp/gf-hs-s2-norm.log

      - name: Certify quantitative right and two-sided Schatten S2 norm inequalities
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.FockS2IdealNormBounds GegenbauerFock.PhyslibS1S2TraceBridge GegenbauerFock.PhyslibFiniteS1S2TraceBridge 2>&1 | tee /tmp/gf-hs-s2-ideal-norm.log

      - name: Certify operator-norm nuclear Gram decomposition
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GramNuclearTrace 2>&1 | tee /tmp/gf-nuclear.log

      - name: Certify infinite-dimensional Gram spectral theorem
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GramSpectralTheorem 2>&1 | tee /tmp/gf-spectral.log

      - name: Verify Gram kernel equals Fock kernel
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GramSpectralKernel 2>&1 | tee /tmp/gf-spectral-kernel.log

      - name: Verify exact L2 integral Gram operator identity
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GramIntegralComplete 2>&1 | tee /tmp/gf-gram-complete.log

      - name: Verify full analytic Hilbert adjoint through Fock basis
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.AnalyticAdjointComplete 2>&1 | tee /tmp/gf-adjoint-complete.log

      - name: Verify bounded analytic Fock restriction L2 operator
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.AnalyticRestrictionCLM 2>&1 | tee /tmp/gf-analytic-clm.log

      - name: Check full adjoint Cauchy-Schwarz coefficient summability
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.AdjointSummability 2>&1 | tee /tmp/gf-adjoint-summability.log

      - name: Check full Gram moment integral series
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GramMomentIntegralSeries 2>&1 | tee /tmp/gf-gram-moment-integral.log

      - name: Check explicit polynomial adjoint rows
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.AdjointPolynomial 2>&1 | tee /tmp/gf-adjoint-polynomial.log

      - name: Check real exponential Gram integral is in L2
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GramIntegralL2 2>&1 | tee /tmp/gf-gram-integral-l2.log

      - name: Check measurable analytic Fock restriction
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.FockAnalyticRestriction 2>&1 | tee /tmp/gf-fock-restriction.log

      - name: Certify nonzero singular eigenvector transfer between source and Fock Grams
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GramSingularTransfer 2>&1 | tee /tmp/gf-singular-transfer.log

      - name: Certify compact positive Fock output Gram spectral decomposition
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.OutputGramSpectrum 2>&1 | tee /tmp/gf-output-gram-spectrum.log

      - name: Certify normalized singular pairs for positive Gram eigenvalues
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.SingularPairNormalization 2>&1 | tee /tmp/gf-singular-normalized.log

      - name: Check imaginary-axis integral Gram kernel
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GramIntegralKernel 2>&1 | tee /tmp/gf-gram-integral.log

      - name: Check actual Gram operator norm-convergent kernel-row series
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GramKernelSeries 2>&1 | tee /tmp/gf-gram-kernel.log

      - name: Check all-coefficient analytic adjoint series
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.AnalyticAdjoint 2>&1 | tee /tmp/gf-analytic-adjoint.log

      - name: Verify actual Fock evaluation of ultraspherical C as weighted moment series
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.EvaluationComposite 2>&1 | tee /tmp/gf-eval-composite.log

      - name: Verify explicit Gaussian norm bound for general ultraspherical Fock map
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GeneralFockNormBound 2>&1 | tee /tmp/gf-general-bound.log

      - name: Verify Gaussian coherent Fock vectors and bounded point evaluation
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.FockEvaluationSequence 2>&1 | tee /tmp/gf-fock-eval.log

      - name: Verify exponential quantitative bound for actual L2 to Fock operator
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.OperatorExpBound 2>&1 | tee /tmp/gf-operator-bound.log

      - name: Verify complete ultraspherical row-energy exponential integral formula
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RowEnergyExpIntegral 2>&1 | tee /tmp/gf-row-exp.log

      - name: Verify Gaussian exponential closed form of factorial Fock energy series
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.FockExponentialSeries 2>&1 | tee /tmp/gf-exp-series.log

      - name: Verify ultraspherical Fock row energy single-integral identity
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RowEnergyTonelli 2>&1 | tee /tmp/gf-row-tonelli.log

      - name: Verify dominated-convergence exchange of factorial series and integral
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.MomentSeriesIntegral 2>&1 | tee /tmp/gf-series-integral.log

      - name: Verify concrete ultraspherical Fock row energy equals a sum of integrals
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RowEnergyIntegral 2>&1 | tee /tmp/gf-row-integral.log

      - name: Check concrete Gegenbauer Fock weighted L2 coefficient family
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/WeightedMoments.lean | tee /tmp/gf-weighted-moments.log

      - name: Compile the concrete bounded L2 to infinite Fock Hilbert operator
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.ConcreteFockOperator 2>&1 | tee /tmp/gf-concrete-fock.log

      - name: Check actual all-parameter ultraspherical L2 to Fock Hilbert operator
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GeneralUltrasphericalFock 2>&1 | tee /tmp/gf-ultra-fock.log

      - name: Check concrete Fock Hilbert Schmidt row-energy identity
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.ConcreteFockEnergy 2>&1 | tee /tmp/gf-concrete-energy.log

      - name: Check concrete Fock adjoint on every coordinate basis vector
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.AdjointBasis 2>&1 | tee /tmp/gf-adjoint-basis.log

      - name: Check Hilbert Schmidt row summability implies compactness
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.SummableRowsCompact 2>&1 | tee /tmp/gf-rows-compact.log

      - name: Check Gegenbauer kernel identities
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/KernelCore.lean | tee /tmp/gf-kernel.log

      - name: Check two-mode oscillator algebra
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/OscillatorCore.lean | tee /tmp/gf-oscillator.log

      - name: Check analytic exponential kernel and spheroidal identity
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/AnalyticKernel.lean | tee /tmp/gf-analytic.log

      - name: Check Legendre probability moments
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/LegendreMoments.lean | tee /tmp/gf-legendre.log

      - name: Check Eulerian Fourier integral
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/EulerianFourierIntegral.lean | tee /tmp/gf-fourier.log

      - name: Check general ultraspherical probability measure
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/UltrasphericalMeasure.lean | tee /tmp/gf-measure.log

      - name: Check scalar Bochner Eulerian integral layer
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/BochnerStage.lean | tee /tmp/gf-bochner.log

      - name: Check V007 exact rational trace partial sum
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/RationalTrace.lean | tee /tmp/gf-rational.log

      - name: Check general Hilbert-space adjoint and Gram operator identities
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/HilbertGram.lean | tee /tmp/gf-hilbert-gram.log

      - name: Check actual L2 Hilbert coefficient functional and adjoint
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/L2Coefficient.lean | tee /tmp/gf-l2-coeff.log

      - name: Check finite-rank L2 coefficient truncations
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/FiniteCoefficient.lean | tee /tmp/gf-finite-coeff.log

      - name: Check genuine L2 coherent exponential sections
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/CoherentL2.lean | tee /tmp/gf-coherent-l2.log

      - name: Check infinite Fock coefficient Hilbert model
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/FockSequenceOperator.lean | tee /tmp/gf-fock-sequence.log

      - name: Check bounded infinite Fock coefficient analysis
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/InfiniteFockAnalysis.lean | tee /tmp/gf-infinite-fock.log

      - name: Check compact finite-rank maps into infinite Fock Hilbert space
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/InfiniteFockTruncations.lean | tee /tmp/gf-fock-truncations.log

      - name: Check general L2 polynomial moment bounds
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/MomentL2Bounds.lean | tee /tmp/gf-moment-l2.log

      - name: Check factorial Fock coherent coefficient energy bounds
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/FactorialFockWeights.lean | tee /tmp/gf-factorial.log

      - name: Check compactness from operator norm convergence
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/CompactnessBridge.lean | tee /tmp/gf-compactness-bridge.log

      - name: Check compactness of the concrete ultraspherical Fock operator
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.ConcreteFockCompact 2>&1 | tee /tmp/gf-concrete-compact.log

      - name: Verify concrete infinite Fock row energy identity
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.ConcreteFockRowEnergy 2>&1 | tee /tmp/gf-concrete-row-energy.log

      - name: Check L2 monomial squared norm equals genuine moment integral
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.MomentEnergyIntegral 2>&1 | tee /tmp/gf-moment-integral.log

      - name: Audit emitted theorem axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          for part in ultra-affine-jacobian ultra-measure-density ultra-gamma-density ultra-density-integration row-energy-bounds kummer-positive-bounds ultra-odd-vanishing ultra-odd-reflection ultra-beta-symmetry kummer-entire-real kummer-nuclear-bridge ultra-beta-moments ultra-kummer-bridge ultra-moment-bounds kummer-pochhammer kummer-coeff spectral-kernel singular-transfer output-gram-spectrum singular-normalized hs-ideal hs-basis hs-s2-norm hs-s2-ideal-norm nuclear spectral gram-complete adjoint-complete analytic-clm adjoint-summability gram-moment-integral adjoint-polynomial gram-integral-l2 fock-restriction gram-integral gram-kernel analytic-adjoint kernel oscillator analytic legendre fourier measure bochner rational hilbert-gram l2-coeff finite-coeff coherent-l2 fock-sequence infinite-fock fock-truncations moment-l2 factorial compactness-bridge weighted-moments concrete-fock ultra-fock concrete-energy adjoint-basis rows-compact row-integral series-integral row-tonelli exp-series row-exp operator-bound fock-eval general-bound eval-composite; do
            test -s "/tmp/gf-${part}.log"
          done
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/gf-*.log; then
            echo '::error::A verified theorem depends on an untrusted axiom.'
            exit 1
          fi
          echo 'Axiom logs contain no sorryAx or Lean.ofReduceBool.'
