name: Gegenbauer–Fock Lean proof checks

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
  pull_request:
    paths:
      - 'lean/GegenbauerFock/**'
      - '.github/workflows/gegenbauer-fock-lean.yml'
  workflow_dispatch:

jobs:
  lean-algebraic-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The existing certification repository does not check in a
      # lake-manifest.json. The lean-action composite itself refuses to
      # initialize without it, even with auto-config: false; install
      # elan directly and run lake update before requesting Mathlib cache.
      - name: Install elan and pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version

      - name: Generate Lake manifest for existing pinned Mathlib
        working-directory: lean
        run: lake update

      - name: Fetch Mathlib build artifacts
        working-directory: lean
        run: lake exe cache get

      - name: Verify ultraspherical Fock row energy single-integral identity
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RowEnergyTonelli 2>&1 | tee /tmp/gf-row-tonelli.log

      - name: Verify dominated-convergence exchange of factorial series and integral
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.MomentSeriesIntegral 2>&1 | tee /tmp/gf-series-integral.log

      - name: Verify concrete ultraspherical Fock row energy equals a sum of integrals
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RowEnergyIntegral 2>&1 | tee /tmp/gf-row-integral.log

      - name: Check concrete Gegenbauer Fock weighted L2 coefficient family
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean GegenbauerFock/WeightedMoments.lean | tee /tmp/gf-weighted-moments.log

      - name: Compile the concrete bounded L2 to infinite Fock Hilbert operator
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.ConcreteFockOperator 2>&1 | tee /tmp/gf-concrete-fock.log

      - name: Check actual all-parameter ultraspherical L2 to Fock Hilbert operator
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GeneralUltrasphericalFock 2>&1 | tee /tmp/gf-ultra-fock.log

      - name: Check concrete Fock Hilbert Schmidt row-energy identity
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.ConcreteFockEnergy 2>&1 | tee /tmp/gf-concrete-energy.log

      - name: Check concrete Fock adjoint on every coordinate basis vector
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.AdjointBasis 2>&1 | tee /tmp/gf-adjoint-basis.log

      - name: Check Hilbert Schmidt row summability implies compactness
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.SummableRowsCompact 2>&1 | tee /tmp/gf-rows-compact.log

      - name: Check Gegenbauer kernel identities
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean GegenbauerFock/KernelCore.lean | tee /tmp/gf-kernel.log

      - name: Check two-mode oscillator algebra
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean GegenbauerFock/OscillatorCore.lean | tee /tmp/gf-oscillator.log

      - name: Check analytic exponential kernel and spheroidal identity
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean GegenbauerFock/AnalyticKernel.lean | tee /tmp/gf-analytic.log

      - name: Check Legendre probability moments
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean GegenbauerFock/LegendreMoments.lean | tee /tmp/gf-legendre.log

      - name: Check Eulerian Fourier integral
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean GegenbauerFock/EulerianFourierIntegral.lean | tee /tmp/gf-fourier.log

      - name: Check general ultraspherical probability measure
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean GegenbauerFock/UltrasphericalMeasure.lean | tee /tmp/gf-measure.log

      - name: Check scalar Bochner Eulerian integral layer
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean GegenbauerFock/BochnerStage.lean | tee /tmp/gf-bochner.log

      - name: Check V007 exact rational trace partial sum
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean GegenbauerFock/RationalTrace.lean | tee /tmp/gf-rational.log

      - name: Check general Hilbert-space adjoint and Gram operator identities
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean GegenbauerFock/HilbertGram.lean | tee /tmp/gf-hilbert-gram.log

      - name: Check actual L2 Hilbert coefficient functional and adjoint
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean GegenbauerFock/L2Coefficient.lean | tee /tmp/gf-l2-coeff.log

      - name: Check finite-rank L2 coefficient truncations
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean GegenbauerFock/FiniteCoefficient.lean | tee /tmp/gf-finite-coeff.log

      - name: Check genuine L2 coherent exponential sections
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean GegenbauerFock/CoherentL2.lean | tee /tmp/gf-coherent-l2.log

      - name: Check infinite Fock coefficient Hilbert model
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean GegenbauerFock/FockSequenceOperator.lean | tee /tmp/gf-fock-sequence.log

      - name: Check bounded infinite Fock coefficient analysis
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean GegenbauerFock/InfiniteFockAnalysis.lean | tee /tmp/gf-infinite-fock.log

      - name: Check compact finite-rank maps into infinite Fock Hilbert space
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean GegenbauerFock/InfiniteFockTruncations.lean | tee /tmp/gf-fock-truncations.log

      - name: Check general L2 polynomial moment bounds
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean GegenbauerFock/MomentL2Bounds.lean | tee /tmp/gf-moment-l2.log

      - name: Check factorial Fock coherent coefficient energy bounds
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean GegenbauerFock/FactorialFockWeights.lean | tee /tmp/gf-factorial.log

      - name: Check compactness from operator norm convergence
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean GegenbauerFock/CompactnessBridge.lean | tee /tmp/gf-compactness-bridge.log

      - name: Check compactness of the concrete ultraspherical Fock operator
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.ConcreteFockCompact 2>&1 | tee /tmp/gf-concrete-compact.log

      - name: Verify concrete infinite Fock row energy identity
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.ConcreteFockRowEnergy 2>&1 | tee /tmp/gf-concrete-row-energy.log

      - name: Check L2 monomial squared norm equals genuine moment integral
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.MomentEnergyIntegral 2>&1 | tee /tmp/gf-moment-integral.log

      - name: Audit emitted theorem axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          for part in kernel oscillator analytic legendre fourier measure bochner rational hilbert-gram l2-coeff finite-coeff coherent-l2 fock-sequence infinite-fock fock-truncations moment-l2 factorial compactness-bridge weighted-moments concrete-fock ultra-fock concrete-energy adjoint-basis rows-compact row-integral series-integral row-tonelli; do
            test -s "/tmp/gf-${part}.log"
          done
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/gf-*.log; then
            echo '::error::A verified theorem depends on an untrusted axiom.'
            exit 1
          fi
          echo 'Axiom logs contain no sorryAx or Lean.ofReduceBool.'
