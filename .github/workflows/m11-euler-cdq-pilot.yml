name: M11 Eulerian length CDQ 100k pilot
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'numerics/arb/m11_euler_cdq.py'
      - '.github/workflows/m11-euler-cdq-pilot.yml'
  workflow_dispatch:
jobs:
  length-cdq:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 20000
            bits: 28000
            block: 256
            chunk: 256
          - target: 100000
            bits: 140000
            block: 256
            chunk: 256
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact head and pin FLINT
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git rev-parse HEAD
          python -m pip install python-flint==0.9.0
      - name: Certified finite-memory CDQ recurrence
        shell: bash
        run: |
          set -o pipefail
          python -u numerics/arb/m11_euler_cdq.py --bits ${{ matrix.bits }} --target ${{ matrix.target }} --block ${{ matrix.block }} --chunk ${{ matrix.chunk }} --leaf 16 --discount | tee m11-euler-cdq.log
      - uses: actions/upload-artifact@v4
        with:
          name: m11-euler-cdq-${{ matrix.target }}
          path: |
            m11-euler-cdq.json
            m11-euler-cdq.log
