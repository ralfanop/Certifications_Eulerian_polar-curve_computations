name: V007 unconditional positive orthonormal singular family and Kummer mass

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/CompletePositiveSingularFamily.lean'
      - 'lean/GegenbauerFock/DualGramEigenbasisTrace.lean'
      - 'lean/GegenbauerFock/PhyslibTraceBasisIndependence.lean'
      - 'lean/GegenbauerFock/DualGramPositiveTraceDiagonal.lean'
      - '.github/workflows/v007-complete-positive-singular-family.yml'
  workflow_dispatch:

jobs:
  positive-singular-family:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit unconditional positive singular family
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.CompletePositiveSingularFamily 2>&1 | tee /tmp/v007-positive-singular-build.log
          lake env lean -M16768 GegenbauerFock/CompletePositiveSingularFamily.lean 2>&1 | tee /tmp/v007-positive-singular-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-positive-singular-build.log /tmp/v007-positive-singular-axioms.log; then
            echo '::error::Forbidden axiom in unconditional positive singular system certificate.'
            exit 1
          fi
          grep -F "exists_compact_realEigenHilbertBasis' depends on axioms:" /tmp/v007-positive-singular-axioms.log
          grep -F "exists_sourceGram_eigenHilbertBasis_kummer' depends on axioms:" /tmp/v007-positive-singular-axioms.log
          grep -F "exists_outputGram_eigenHilbertBasis_kummer' depends on axioms:" /tmp/v007-positive-singular-axioms.log
          echo 'V007 complete compact Gram spectral Kummer sums kernel-checked and audited.'
