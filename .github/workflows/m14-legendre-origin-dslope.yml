name: M14 Legendre origin analytic regularization
on:
  push:
    branches: [draft/m14-legendre-origin-dslope-20261126]
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/EulerianLegendreOrigin.lean'
      - '.github/workflows/m14-legendre-origin-dslope.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Lean
        working-directory: lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Retrieve Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Compile exact dependency and analytic extension
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          lake env lean -o .lake/build/lib/lean/SpecialImaginaryPoint/EulerianLegendreDuality.olean SpecialImaginaryPoint/EulerianLegendreDuality.lean 2>&1 | tee /tmp/m14-legendre-dependency.log
          lake env lean SpecialImaginaryPoint/EulerianLegendreOrigin.lean 2>&1 | tee /tmp/m14-legendre-origin.log
          python - <<'PY'
          import re
          for path, count in [('/tmp/m14-legendre-dependency.log', 19), ('/tmp/m14-legendre-origin.log', 14)]:
              s = open(path).read()
              assert not re.search(r'sorryAx|Lean\.ofReduceBool|declaration uses|: error:',s)
              found = re.findall(r"depends on axioms: \[([^\]]*)\]|does not depend on any axioms",s)
              assert len(found) == count, (path, found)
              for a in found:
                  assert set(filter(None,a.split(', '))) <= {'propext','Classical.choice','Quot.sound'}, a
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m14-legendre-origin-audit
          path: /tmp/m14-legendre-*.log
