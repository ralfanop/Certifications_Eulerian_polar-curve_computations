name: V007 exact full C0 heat generator equals canonical closed Sturm graph
on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatGeneratorExactGraph.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatGeneratorClosedDomainForward.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatGeneratorReverseDomain.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatClosedGraphErrorBound.lean'
      - '.github/workflows/v007-sturm-heat-generator-exact-graph.yml'
  workflow_dispatch:
jobs:
  heat-generator-exact-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and kernel-audit full-L2 exact canonical Sturm heat generator graph
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealHeatGeneratorExactGraph 2>&1 | tee /tmp/v007-heat-generator-exact-graph-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatGeneratorExactGraph.lean 2>&1 | tee /tmp/v007-heat-generator-exact-graph-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-heat-generator-exact-graph-build.log /tmp/v007-heat-generator-exact-graph-axioms.log; then
            echo '::error::Forbidden axiom in full-L2 exact canonical Sturm heat generator graph.'
            exit 1
          fi
          grep -F "sturmRealHeatLimit_generator_exact_closedSturm_graph' depends on axioms:" /tmp/v007-heat-generator-exact-graph-axioms.log
          grep -F "sturmRealHeatLimit_generator_graph_set_eq_closedSturm' depends on axioms:" /tmp/v007-heat-generator-exact-graph-axioms.log
          echo 'V007 full-L2 exact canonical Sturm heat generator graph kernel-certified.'
