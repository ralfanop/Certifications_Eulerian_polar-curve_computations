name: V007 unitary intertwiner of full source and output compact Grams

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UnitaryDualGramIntertwiner.lean'
      - 'lean/GegenbauerFock/CompletePositiveSingularFamily.lean'
      - '.github/workflows/v007-unitary-dual-gram-intertwiner.yml'
  workflow_dispatch:

jobs:
  gram-unitary-intertwiner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit true cross-Hilbert-space unitary Gram intertwiner
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UnitaryDualGramIntertwiner 2>&1 | tee /tmp/v007-gram-unitary-intertwiner-build.log
          lake env lean -M16768 GegenbauerFock/UnitaryDualGramIntertwiner.lean 2>&1 | tee /tmp/v007-gram-unitary-intertwiner-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-gram-unitary-intertwiner-build.log /tmp/v007-gram-unitary-intertwiner-axioms.log; then
            echo '::error::Forbidden axiom in cross-Hilbert-space Gram unitary intertwiner.'
            exit 1
          fi
          grep -F "exists_unitary_dualGram_intertwiner_kummer' depends on axioms:" /tmp/v007-gram-unitary-intertwiner-axioms.log
          echo 'V007 true full Gram unitary intertwiner verified and audited.'
