name: V007 Fourier uniform sampling nonembedding and range inverse obstruction

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireFourierUniformSamplingNoEmbedding.lean'
      - '.github/workflows/v007-fourier-bochner-uniform-sampling-no-embedding.yml'
  workflow_dispatch:

# At most one specialist audit runs per branch; retain running SHA-scoped proof checks.
concurrency:
  group: v007-fourier-uniform-sampling-${{ github.ref }}
  cancel-in-progress: false

jobs:
  uniform-fourier-not-embedding:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib and cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile uniform-sampling nonembedding and no continuous inverse on actual Fourier range
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireFourierUniformSamplingNoEmbedding 2>&1 | tee /tmp/v007-fourier-uniform-no-embedding-build.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireFourierUniformSamplingNoEmbedding.lean 2>&1 | tee /tmp/v007-fourier-uniform-no-embedding-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-fourier-uniform-no-embedding-build.log /tmp/v007-fourier-uniform-no-embedding-axioms.log; then
            echo "::error::Forbidden axiom in uniform Fourier nonembedding theorem"
            exit 1
          fi
          for name in ultraspherical_fourierBochner_uniformSamples_not_isEmbedding ultraspherical_fourierBochner_uniformSamples_no_continuous_inverse_on_range ultraspherical_fourierBochner_uniformSamples_unique_but_not_embedding; do
            grep -F "${name}' depends on axioms:" /tmp/v007-fourier-uniform-no-embedding-axioms.log
          done
          echo 'V007 uniform Fourier sampling nonembedding and range inverse audit successful.'
