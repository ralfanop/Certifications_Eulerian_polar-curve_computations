name: V007 real Hilbert nuclear rank-one S1 characterization for Sturm resolvent

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventRealNuclearClass.lean'
      - '.github/workflows/v007-ultraspherical-sturm-resolvent-real-nuclear-class.yml'
  workflow_dispatch:

jobs:
  sturm-resolvent-real-nuclear-class:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then exit 0; fi
            sleep "$((attempt * 8))"
          done
          exit 1
      - name: Prepare exact Mathlib dependencies
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Certify real Hilbert general nuclear S1 rank-one series and actual Sturm resolvent
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleResolventRealNuclearClass 2>&1 | tee /tmp/v007-real-nuclear-class.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-nuclear-class.log; then
            echo '::error::Nonstandard axiom in real Hilbert nuclear-series certificate.'
            exit 1
          fi
          for theorem in HasRealNuclearRankOneSeries.operator_summable HasRealPositiveNuclearExpansion.toRealNuclearRankOneSeries sturmRealClosedResolvent_has_real_nuclear_rank_one_series sturmRealClosedResolvent_nuclear_series_mass_certificate; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-real-nuclear-class.log
          done
          echo 'Actual real closed Sturm resolvent general nuclear series kernel-certified.'
