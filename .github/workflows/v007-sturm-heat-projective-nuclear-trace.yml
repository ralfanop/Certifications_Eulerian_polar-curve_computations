name: V007 exact positive-time real heat S1 nuclear projective trace

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatNuclearProjectiveTrace.lean'
      - '.github/workflows/v007-sturm-heat-projective-nuclear-trace.yml'
  workflow_dispatch:

jobs:
  sturm-real-heat-projective-nuclear-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then exit 0; fi
            sleep "$((attempt * 8))"
          done
          exit 1
      - name: Prepare pinned Mathlib dependencies
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-check heat S1 projective infimum and audit axioms
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealHeatNuclearProjectiveTrace 2>&1 | tee /tmp/v007-heat-projective-nuclear-trace.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-heat-projective-nuclear-trace.log; then
            echo '::error::Forbidden axiom in real heat S1 projective trace certificate.'
            exit 1
          fi
          for theorem in sturmRealHeat_has_positive_real_spectralS1 sturmRealHeat_has_real_nuclear_rank_one_series sturmRealHeat_realNuclearInfimum_eq_spectralTrace sturmRealHeat_positive_time_realS1_exact_certificate; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-heat-projective-nuclear-trace.log
          done
          echo 'Positive-time real Sturm heat S1 nuclear trace norm kernel-certified.'
