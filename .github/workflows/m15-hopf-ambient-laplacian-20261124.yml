name: M15 Hopf ambient Laplacian symbol exact-HEAD Lean 4

on:
  pull_request:
    paths:
      - 'lean/Manuscript15/HopfAmbientLaplacian20261124.lean'
      - '.github/workflows/m15-hopf-ambient-laplacian-20261124.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hopf-ambient-laplacian:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build pinned Mathlib and verify exact HEAD and 20 actual 2-jet theorems
        working-directory: lean
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/m15-hopf-ambient-laplacian
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD | tee /tmp/m15-hopf-ambient-laplacian/exact-head.txt
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
          mkdir -p .lake/build/lib/lean/Manuscript15
          lake env lean -M16768 \
            -o .lake/build/lib/lean/Manuscript15/HopfSubmersionDifferential20261124.olean \
            Manuscript15/HopfSubmersionDifferential20261124.lean \
            2>&1 | tee /tmp/m15-hopf-ambient-laplacian/actual-derivative.log
          lake env lean -M16768 \
            -o .lake/build/lib/lean/Manuscript15/HopfHorizontalIsometry20261124.olean \
            Manuscript15/HopfHorizontalIsometry20261124.lean \
            2>&1 | tee /tmp/m15-hopf-ambient-laplacian/horizontal-metric.log
          lake env lean -M16768 Manuscript15/HopfAmbientLaplacian20261124.lean \
            2>&1 | tee /tmp/m15-hopf-ambient-laplacian/new-proofs.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('/tmp/m15-hopf-ambient-laplacian')
          files=['actual-derivative.log','horizontal-metric.log','new-proofs.log']
          full=''.join((root/x).read_text() for x in files)
          src=Path('Manuscript15/HopfAmbientLaplacian20261124.lean').read_text()
          assert not re.search(r'\b(sorry|sorryAx|admit|native_decide|unsafe)\b|^\s*axiom\s',src,re.M)
          assert not re.search(r'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.',full)
          names=re.findall(r'^#print axioms (Manuscript15\.HopfAmbientLaplacian20261124\.\w+)$',src,re.M)
          assert len(names)==20 and len(set(names))==20,(len(names),names)
          log=(root/'new-proofs.log').read_text()
          for n in names:
            match=re.search(re.escape("'"+n+"'")+r" depends on axioms: \[([^\]]*)\]",log,re.S)
            if match:
              axioms={x.strip() for x in match.group(1).split(',') if x.strip()}
              assert axioms <= {'propext','Classical.choice','Quot.sound'},(n,axioms)
            else:
              assert "'"+n+"' does not depend on any axioms" in log,n
          print('M15 HOPF ACTUAL AMBIENT LAPLACIAN EXACT-HEAD 20 THEOREM AUDITS SUCCESS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-hopf-ambient-laplacian-exact-head
          path: /tmp/m15-hopf-ambient-laplacian/
