name: V007 canonical Gram CFC square root via local real scalar instances

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/LocalCFCGramSquareRoot.lean'
      - 'lean/GegenbauerFock/LocalCFCGramSquareRootContinuousSpectrum.lean'
      - 'lean/GegenbauerFock/LocalCFCGramSquareRootInverseObstructions.lean'
      - 'lean/GegenbauerFock/CompletePositiveSingularFamily.lean'
      - '.github/workflows/v007-local-cfc-gram-sqrt.yml'
  workflow_dispatch:

# Bound concurrent V007 jobs per branch without stopping active theorem audits.
concurrency:
  group: v007-local-cfc-gram-sqrt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  positive-polar-amplitude:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit local canonical CFC Gram root
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.LocalCFCGramSquareRoot 2>&1 | tee /tmp/v007-local-cfc-gram-sqrt-build.log
          lake env lean -M16768 GegenbauerFock/LocalCFCGramSquareRoot.lean 2>&1 | tee /tmp/v007-local-cfc-gram-sqrt-axioms.log
          lake build GegenbauerFock.LocalCFCGramSquareRootContinuousSpectrum 2>&1 | tee /tmp/v007-local-cfc-gram-spectrum-build.log
          lake env lean -M16768 GegenbauerFock/LocalCFCGramSquareRootContinuousSpectrum.lean 2>&1 | tee /tmp/v007-local-cfc-gram-spectrum-axioms.log
          lake build GegenbauerFock.LocalCFCGramSquareRootInverseObstructions 2>&1 | tee /tmp/v007-local-cfc-gram-inverse-build.log
          lake env lean -M16768 GegenbauerFock/LocalCFCGramSquareRootInverseObstructions.lean 2>&1 | tee /tmp/v007-local-cfc-gram-inverse-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-local-cfc-gram-sqrt-build.log /tmp/v007-local-cfc-gram-sqrt-axioms.log /tmp/v007-local-cfc-gram-spectrum-build.log /tmp/v007-local-cfc-gram-spectrum-axioms.log /tmp/v007-local-cfc-gram-inverse-build.log /tmp/v007-local-cfc-gram-inverse-axioms.log; then
            echo '::error::Forbidden axiom in local canonical CFC Gram root.'
            exit 1
          fi
          grep -F "exists_local_cfc_sqrt_polar_unitary_kummer' depends on axioms:" /tmp/v007-local-cfc-gram-sqrt-axioms.log
          grep -F "exists_local_cfc_sqrt_compact_dense_nonclosed' depends on axioms:" /tmp/v007-local-cfc-gram-sqrt-axioms.log
          grep -F "local_cfc_gram_sqrt_zero_continuous_spectrum' depends on axioms:" /tmp/v007-local-cfc-gram-spectrum-axioms.log
          grep -F "local_cfc_gram_sqrt_not_surjective_and_not_antilipschitz' depends on axioms:" /tmp/v007-local-cfc-gram-inverse-axioms.log
          echo 'V007 local canonical CFC square-root theorem verified and audited.'
