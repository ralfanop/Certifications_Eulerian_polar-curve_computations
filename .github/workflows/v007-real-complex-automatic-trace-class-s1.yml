name: V007 automatic complex CFC trace class and matched real S1

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/RealComplexPositiveSpectralAutomaticTraceClassBridge.lean'
      - 'lean/GegenbauerFock/RealComplexPositiveSpectralIntertwining.lean'
      - 'lean/GegenbauerFock/RealComplexPositiveSpectralTraceBridge.lean'
      - '.github/workflows/v007-real-complex-automatic-trace-class-s1.yml'
  workflow_dispatch:

jobs:
  real-complex-automatic-class:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel check automatic CFC membership and S1 bridge
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealComplexPositiveSpectralAutomaticTraceClassBridge 2>&1 | tee /tmp/v007-real-complex-autoS1-build.log
          lake env lean -M16768 GegenbauerFock/RealComplexPositiveSpectralAutomaticTraceClassBridge.lean 2>&1 | tee /tmp/v007-real-complex-autoS1-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-complex-autoS1-build.log /tmp/v007-real-complex-autoS1-axioms.log; then
            echo '::error::Forbidden axiom in real/complex automatic CFC trace-class bridge.'
            exit 1
          fi
          grep -F "complex_nonneg_isTraceClass_of_summable_natBasis_diagonal' depends on axioms:" /tmp/v007-real-complex-autoS1-axioms.log
          grep -F "realProjectiveNuclear_eq_complexPhyslibTraceNorm_autoClass_of_intertwining' depends on axioms:" /tmp/v007-real-complex-autoS1-axioms.log
          echo 'V007 automatic CFC membership and real/complex exact S1 bridge audited.'
