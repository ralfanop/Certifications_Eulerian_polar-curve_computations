name: V007 Gaussian Fock scale independence of entire Gegenbauer output

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireAlphaCoherence.lean'
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireBochnerEvaluation.lean'
      - '.github/workflows/v007-intrinsic-fock-alpha-coherence.yml'
  workflow_dispatch:

jobs:
  intrinsic-fock-alpha-coherence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib and cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile alpha independence and audit axioms
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireAlphaCoherence 2>&1 | tee /tmp/v007-intrinsic-alpha-coherence-build.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireAlphaCoherence.lean 2>&1 | tee /tmp/v007-intrinsic-alpha-coherence-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-intrinsic-alpha-coherence-build.log /tmp/v007-intrinsic-alpha-coherence-axioms.log; then
            echo "::error::Forbidden axiom in intrinsic Fock alpha-coherence"
            exit 1
          fi
          grep -F "C_intrinsicEntire_pointwise_independent_of_alpha' depends on axioms:" /tmp/v007-intrinsic-alpha-coherence-axioms.log
          grep -F "C_intrinsicEntire_entireFunction_independent_of_alpha' depends on axioms:" /tmp/v007-intrinsic-alpha-coherence-axioms.log
          echo 'V007 intrinsic Fock alpha coherence: kernel and axiom audit successful.'
