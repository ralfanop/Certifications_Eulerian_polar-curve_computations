name: M15 S2.7 primal Wasserstein-1 metric lemmas
on:
  pull_request:
    paths:
      - 'lean/Manuscript15/Section27PrimalWasserstein.lean'
      - 'lean/Manuscript15/Section27PrimalWassersteinMetric.lean'
      - '.github/workflows/m15-s27-wasserstein-metric.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Lean
        working-directory: lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version
      - name: Fetch pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile and audit axioms on exact head
        working-directory: lean
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          mkdir -p .lake/build/lib/lean/Manuscript15
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/Section27PrimalWasserstein.olean Manuscript15/Section27PrimalWasserstein.lean
          lake env lean -M16768 Manuscript15/Section27PrimalWassersteinMetric.lean 2>&1 | tee /tmp/m15-s27-wasserstein-metric.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/m15-s27-wasserstein-metric.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/m15-s27-wasserstein-metric.log').read_text()
          names = [
              'cost_nonneg', 'cost_set_bddBelow', 'wasserstein1_le_cost',
              'diagonal_mem', 'diagonal_cost', 'wasserstein1_self',
              'swap_mem', 'swap_cost', 'wasserstein1_symm', 'wasserstein1_eq_zero_iff'
          ]
          prefix = 'Manuscript15.Section27.Primal.'
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for name in names:
              matches = re.findall(r"'" + re.escape(prefix + name) + r"' depends on axioms: \[([^\]]*)\]", log, re.S)
              assert matches, 'missing audit: ' + name
              for match in matches:
                  axioms = {x.strip() for x in match.split(',') if x.strip()}
                  assert axioms <= allowed, (name, axioms)
          print('AXIOM AUDIT SUCCESS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-s27-wasserstein-metric-log
          path: /tmp/m15-s27-wasserstein-metric.log
