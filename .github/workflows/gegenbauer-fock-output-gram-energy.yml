name: V007 exact output Gram CFC trace equals adjoint S2 energy

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/PhyslibOutputGramBasisEnergy.lean'
      - '.github/workflows/gegenbauer-fock-output-gram-energy.yml'
  workflow_dispatch:

jobs:
  output-gram-basis-energy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Lean without modifying project
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then
              installed=1
              break
            fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then
              installed=1
              break
            fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
      - name: Restore only pinned Mathlib and cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile exact trace norm and arbitrary-basis S2 energy
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.PhyslibOutputGramBasisEnergy 2>&1 | tee /tmp/v007-output-basis-energy-build.log
      - name: Audit Lean kernel axioms for both new declarations
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 GegenbauerFock/PhyslibOutputGramBasisEnergy.lean 2>&1 | tee /tmp/v007-output-basis-energy-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-output-basis-energy-axioms.log; then
            echo '::error::Untrusted axiom in output Gram basis energy theorem.'
            exit 1
          fi
          grep -F 'outputGramAfterLeft_adjoint_basisEnergy_summable' /tmp/v007-output-basis-energy-axioms.log
          grep -F 'outputGramAfterLeft_traceNorm_eq_adjoint_basisEnergy' /tmp/v007-output-basis-energy-axioms.log
