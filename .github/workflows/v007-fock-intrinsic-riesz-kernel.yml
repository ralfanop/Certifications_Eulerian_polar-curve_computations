name: V007 intrinsic Gaussian Fock genuine Riesz reproducing kernel

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GaussianAreaIntrinsicRieszKernel.lean'
      - 'lean/GegenbauerFock/GaussianAreaIntrinsicEvaluationSharpNorm.lean'
      - '.github/workflows/v007-fock-intrinsic-riesz-kernel.yml'
  workflow_dispatch:

jobs:
  intrinsic-riesz-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Lean and elan
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then
              ready=1
              break
            fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib dependency cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile true intrinsic Riesz kernel and audit all axioms
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GaussianAreaIntrinsicRieszKernel 2>&1 | tee /tmp/v007-fock-riesz.log
          lake env lean -M16768 GegenbauerFock/GaussianAreaIntrinsicRieszKernel.lean 2>&1 | tee -a /tmp/v007-fock-riesz.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-fock-riesz.log; then
            echo "::error::Forbidden axiom in intrinsic Fock Riesz kernel."
            exit 1
          fi
          grep -F "intrinsicRieszKernel_inner' depends on axioms:" /tmp/v007-fock-riesz.log
          grep -F "intrinsicRieszKernel_norm' depends on axioms:" /tmp/v007-fock-riesz.log
          grep -F "intrinsicRieszKernel_norm_sq' depends on axioms:" /tmp/v007-fock-riesz.log
          echo 'V007 genuine intrinsic Gaussian Fock Riesz kernel: verified by Lean.'
