name: V007 full infinite Fourier-Gegenbauer Poincare in genuine L2

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonicInfiniteSpectralPoincare.lean'
      - '.github/workflows/v007-ultraspherical-sturm-infinite-spectral-poincare.yml'
  workflow_dispatch:

jobs:
  infinite-real-l2-poincare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit full infinite weighted real L2 Poincare
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleMonicInfiniteSpectralPoincare 2>&1 | tee /tmp/v007-infinite-poincare-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleMonicInfiniteSpectralPoincare.lean 2>&1 | tee /tmp/v007-infinite-poincare-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-infinite-poincare-build.log /tmp/v007-infinite-poincare-axioms.log; then
            echo '::error::Forbidden axiom in full infinite real L2 Poincare.'
            exit 1
          fi
          grep -F "sturmMonic_realL2_parseval_tsum_sq' depends on axioms:" /tmp/v007-infinite-poincare-axioms.log
          grep -F "sturmMonic_realL2_infinite_spectral_poincare' depends on axioms:" /tmp/v007-infinite-poincare-axioms.log
          echo 'V007 full infinite real L2 Gegenbauer Poincare: kernel-certified.'
