name: V007 actual complex Sturm heat embedded Gegenbauer eigenmodes

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleActualComplexHeatEmbeddedEigenmodes.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleActualComplexLpIsometry.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleActualComplexHeatCLM.lean'
      - '.github/workflows/v007-actual-complex-heat-embedded-eigenmodes.yml'
  workflow_dispatch:

jobs:
  eigenmodes-actual-complex-heat:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Audit concrete complex Sturm modes and their norm
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleActualComplexHeatEmbeddedEigenmodes 2>&1 | tee /tmp/v007-complex-heat-modes-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleActualComplexHeatEmbeddedEigenmodes.lean 2>&1 | tee /tmp/v007-complex-heat-modes-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-complex-heat-modes-build.log /tmp/v007-complex-heat-modes-axioms.log; then
            echo '::error::Forbidden axiom in concrete complex Sturm heat modes.'
            exit 1
          fi
          grep -F "sturmActualComplexHeatCLM_normalized_Gegenbauer_eigen' depends on axioms:" /tmp/v007-complex-heat-modes-axioms.log
          grep -F "sturmActualComplexNormalizedGegenbauer_norm_eq_one' depends on axioms:" /tmp/v007-complex-heat-modes-axioms.log
          grep -F "sturmActualComplexNormalizedGegenbauer_ne_zero' depends on axioms:" /tmp/v007-complex-heat-modes-axioms.log
          echo 'V007 complex heat embedded modes audited.'
