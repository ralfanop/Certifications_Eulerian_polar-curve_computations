name: Manuscript 14.119 — actual Eulerian special-value bridge, Lean kernel audit

on:
  push:
    branches:
      - manuscript14-v14119-priorities-continuation-20261109
    paths:
      - 'lean/SpecialImaginaryPoint/V14119SpecialValueBridge.lean'
      - '.github/workflows/manuscript14-v14119-bridge-lean.yml'
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/V14119SpecialValueBridge.lean'
      - '.github/workflows/manuscript14-v14119-bridge-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Kernel proof and axiom audit — entire Eulerian analytic bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Retrieve pinned Mathlib cache
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile analytic dependencies and bridge; audit its axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          for f in FormalBorelComplex BorelAnalyticConvergence Corollary36 Corollary36Analytic EulerianSinhSeries V14119PrioritiesCertificate; do
            lake env lean -M16768 -o ".lake/build/lib/lean/SpecialImaginaryPoint/$f.olean" \
              "SpecialImaginaryPoint/$f.lean" 2>&1 | tee "/tmp/$f.log"
          done
          lake env lean -M16768 SpecialImaginaryPoint/V14119SpecialValueBridge.lean 2>&1 | tee /tmp/v14119-bridge.log
          if grep -nE '^[^ ]+:[0-9]+:[0-9]+: error' /tmp/v14119-bridge.log; then
            echo '::error::Lean compilation failed'
            exit 1
          fi
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' -e 'declaration uses' /tmp/v14119-bridge.log; then
            echo '::error::Forbidden axiom or sorry'
            exit 1
          fi
          tr '\n' ' ' < /tmp/v14119-bridge.log | grep -oE "depends on axioms: \[[^]]*\]" | \
            sed -E 's/ +/ /g' > /tmp/v14119-bridge.axioms || true
          n_none="$(grep -c 'does not depend on any axioms' /tmp/v14119-bridge.log || true)"
          n_all="$(grep -c 'depends on axioms' /tmp/v14119-bridge.axioms || true)"
          n_std="$(grep -cE 'depends on axioms: \[((propext|Classical\.choice|Quot\.sound)(, )?)+\]' \
            /tmp/v14119-bridge.axioms || true)"
          echo "Audited statements: $((n_all+n_none)); standard axioms only: $((n_std+n_none))"
          test "$((n_all+n_none))" -eq 3
          test "$((n_std+n_none))" -eq 3
      - name: Upload Lean proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript14-v14119-analytic-bridge
          path: /tmp/*.log
          if-no-files-found: ignore
