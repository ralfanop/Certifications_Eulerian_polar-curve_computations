name: V007 exact Eulerian uniform-law density from ultraspherical measure

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/UltrasphericalLegendreDensityExact.lean'
      - '.github/workflows/v007-ultraspherical-uniform-density.yml'
  workflow_dispatch:

jobs:
  uniform-eulerian:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib and cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit exact Eulerian uniform density and measure
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalLegendreDensityExact 2>&1 | tee /tmp/v007-uniform-density-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalLegendreDensityExact.lean 2>&1 | tee /tmp/v007-uniform-density-audit.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-uniform-density-build.log /tmp/v007-uniform-density-audit.log; then
            echo "::error::Forbidden axiom in Eulerian uniform density proof"
            exit 1
          fi
          for theorem in gammaDensity_half_eq_eulerianUniformDensity measure_half_eq_uniformDensity integral_measure_half_eq_uniformDensity; do
            grep -F "${theorem}' depends on axioms:" /tmp/v007-uniform-density-audit.log
          done
          echo 'V007 actual Eulerian uniform measure: Lean compilation and axiom audit clean.'
