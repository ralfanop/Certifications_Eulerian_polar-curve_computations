name: V007 positive multiplicity-indexed eigenbases of both compact Grams

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/DualGramPositiveEigenHilbertBases.lean'
      - 'lean/GegenbauerFock/CompactGramEigenHilbertBasis.lean'
      - 'lean/GegenbauerFock/DualGramEigenbasisTrace.lean'
      - 'lean/GegenbauerFock/PhyslibTraceBasisIndependence.lean'
      - '.github/workflows/v007-dual-gram-positive-eigen-basis.yml'
  workflow_dispatch:

jobs:
  positive-eigenbasis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then
              ready=1
              break
            fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build and axiom-audit genuine positive compact Gram eigenbases
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.DualGramPositiveEigenHilbertBases 2>&1 | tee /tmp/v007-positive-eigenbasis-build.log
          lake env lean -M16768 GegenbauerFock/DualGramPositiveEigenHilbertBases.lean 2>&1 | tee /tmp/v007-positive-eigenbasis-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-positive-eigenbasis-build.log /tmp/v007-positive-eigenbasis-axioms.log; then
            echo '::error::Forbidden axiom in positive Gram spectral eigenbasis certificate.'
            exit 1
          fi
          grep -F "positive_eigenvalue_of_ker_bot' depends on axioms:" /tmp/v007-positive-eigenbasis-axioms.log
          grep -F "exists_sourceGram_positiveEigenHilbertBasis_kummer' depends on axioms:" /tmp/v007-positive-eigenbasis-axioms.log
          grep -F "exists_outputGram_positiveEigenHilbertBasis_kummer' depends on axioms:" /tmp/v007-positive-eigenbasis-axioms.log
          echo 'V007 strictly positive dual Gram eigenbasis with exact Kummer trace: kernel/audit SUCCESS.'
