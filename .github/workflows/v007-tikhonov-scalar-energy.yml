name: V007 scalar Hilbert energy Tikhonov noise factor
on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/CanonicalCFCGramTikhonovScalarEnergy.lean'
      - '.github/workflows/v007-tikhonov-scalar-energy.yml'
  workflow_dispatch:
concurrency:
  group: v007-tikhonov-scalar-energy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scalar-energy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit exact Tikhonov scalar energy factor
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.CanonicalCFCGramTikhonovScalarEnergy 2>&1 | tee /tmp/v007-tikhonov-scalar-build.log
          lake env lean -M16768 GegenbauerFock/CanonicalCFCGramTikhonovScalarEnergy.lean 2>&1 | tee /tmp/v007-tikhonov-scalar-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-tikhonov-scalar-build.log /tmp/v007-tikhonov-scalar-axioms.log; then
            echo '::error::Forbidden axiom in Tikhonov scalar energy lemma.'
            exit 1
          fi
          grep -F "tikhonov_scalar_energy_noise_bound' depends on axioms:" /tmp/v007-tikhonov-scalar-axioms.log
          echo 'V007 Tikhonov sharp scalar energy noise factor kernel-certified.'
