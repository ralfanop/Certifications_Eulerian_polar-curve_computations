name: V007 exact essential Gram spectral norm band certificate

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/TwoSidedGramExactEssentialNormBand.lean'
      - 'lean/GegenbauerFock/TwoSidedGramEssentialSpectralBand.lean'
      - 'lean/GegenbauerFock/TwoSidedGramExactOperatorNorm.lean'
      - '.github/workflows/gegenbauer-fock-gram-exact-essential-norm-band.yml'
  workflow_dispatch:

jobs:
  exact-essential-band:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean with retry
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for i in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((i * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for i in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((i * 8))"
          done
          test "$ok" -eq 1
      - name: Restore repository-pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Check both Fredholm essential bands and their axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.TwoSidedGramExactEssentialNormBand 2>&1 | tee /tmp/v007-essential-exact-norm.log
          for theorem in sourceGram_essential_spectral_value_le_analysis_norm_sq \
            outputGram_essential_spectral_value_le_analysis_norm_sq \
            two_sided_gram_essential_zero_with_exact_norm_band; do
            grep -qF "${theorem}' depends on axioms:" /tmp/v007-essential-exact-norm.log
          done
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-essential-exact-norm.log; then
            echo '::error::Nonstandard axiom detected.'
            exit 1
          fi
          echo 'Exact squared-analysis-norm Fredholm essential spectral bands kernel certified.'
