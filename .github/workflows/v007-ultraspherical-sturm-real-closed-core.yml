name: V007 real Sturm canonical closed extension and polynomial core

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealClosedCore.lean'
      - '.github/workflows/v007-ultraspherical-sturm-real-closed-core.yml'
  workflow_dispatch:

jobs:
  true-real-Sturm-closed-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit canonical closed extension and dense polynomial graph core
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealClosedCore 2>&1 | tee /tmp/v007-sturm-closed-core-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealClosedCore.lean 2>&1 | tee /tmp/v007-sturm-closed-core-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-sturm-closed-core-build.log /tmp/v007-sturm-closed-core-axioms.log; then
            echo '::error::Forbidden axiom in the real Sturm closed extension and polynomial core.'
            exit 1
          fi
          grep -F "sturmRealPartialOperator_closed_graph_eq' depends on axioms:" /tmp/v007-sturm-closed-core-axioms.log
          grep -F "sturmRealPartialOperator_le_closed_extension' depends on axioms:" /tmp/v007-sturm-closed-core-axioms.log
          grep -F "sturmRealPartialOperator_closure_dense_domain' depends on axioms:" /tmp/v007-sturm-closed-core-axioms.log
          grep -F "sturmRealPartialOperator_closure_polynomial_core' depends on axioms:" /tmp/v007-sturm-closed-core-axioms.log
          echo 'V007 closed real Sturm extension retains the dense polynomial graph core, kernel-certified.'
