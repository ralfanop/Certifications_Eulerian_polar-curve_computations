name: "Manuscript 15 — dense-frequency finite-measure characteristic uniqueness"
on:
  push:
    branches:
      - manuscript15-dense-frequency-characteristic-uniqueness-20261112
    paths:
      - 'lean/Manuscript15/CharacteristicMeasureUniqueness.lean'
      - 'lean/Manuscript15/DenseFrequencyCharacteristicUniqueness.lean'
      - '.github/workflows/manuscript15-dense-frequency-characteristic-uniqueness.yml'
  pull_request:
    paths:
      - 'lean/Manuscript15/CharacteristicMeasureUniqueness.lean'
      - '.github/workflows/manuscript15-dense-frequency-characteristic-uniqueness.yml'
  workflow_dispatch:
jobs:
  kernel:
    name: "Dense-frequency characteristic function injectivity — Lean kernel audit"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors \
            --retry-delay 5 --connect-timeout 20 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
      - name: Download pinned Mathlib cache
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile dense-frequency measure uniqueness theorem
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Manuscript15
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/CharacteristicMeasureUniqueness.olean Manuscript15/CharacteristicMeasureUniqueness.lean
          lake env lean -M16768 Manuscript15/DenseFrequencyCharacteristicUniqueness.lean 2>&1 | tee /tmp/m15-dense-charfun-uniqueness.log
      - name: Strict kernel axiom audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path("/tmp/m15-dense-charfun-uniqueness.log").read_text()
          names=["finiteMeasure_eq_of_charFun_eqOn_dense",
                 "real_finiteMeasure_eq_of_charFun_eqOn_dense"]
          reports={}
          for m in re.finditer(r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms",s,re.MULTILINE):
            reports[m.group(1) or m.group(3)]={a.strip() for a in (m.group(2) or "").split(",") if a.strip()}
          allowed={"propext","Classical.choice","Quot.sound"}
          for name in names:
            key="Manuscript15."+name
            assert key in reports, f"Missing kernel report {key}"
            assert reports[key] <= allowed, f"Unaccepted axioms {key}: {reports[key]-allowed}"
            print(key,sorted(reports[key]))
          assert "sorryAx" not in s and "Lean.ofReduceBool" not in s
          assert not re.search(r"\.lean:\d+:\d+: error",s)
          print("SUCCESS: finite Borel measure uniqueness from values on dense frequency subsets")
          PY
      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript15-dense-frequency-characteristic-uniqueness-audit
          path: /tmp/m15-dense-charfun-uniqueness.log
          if-no-files-found: ignore
