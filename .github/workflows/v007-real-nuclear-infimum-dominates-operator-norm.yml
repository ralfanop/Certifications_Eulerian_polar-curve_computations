name: V007 real nuclear S1 norm dominates operator norm

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/RealNuclearInfimumDominatesOperatorNorm.lean'
      - '.github/workflows/v007-real-nuclear-infimum-dominates-operator-norm.yml'
  workflow_dispatch:

jobs:
  nuclear-opnorm:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Certify real S1 projective infimum dominates operator norm
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealNuclearInfimumDominatesOperatorNorm 2>&1 | tee /tmp/v007-real-nuclear-opnorm.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-nuclear-opnorm.log; then
            echo '::error::Nonstandard axiom in real nuclear nondegeneracy proof.'
            exit 1
          fi
          for theorem in RealNuclearCosts.opNorm_le realNuclearInfimum_opNorm_le realNuclearInfimum_pos_of_nuclear_ne_zero realNuclearInfimum_zero_implies_operator_zero; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-real-nuclear-opnorm.log
          done
          echo 'V007 real nuclear S1 dominates operator norm and nondegeneracy kernel-certified.'
