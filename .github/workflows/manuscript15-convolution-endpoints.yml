name: Manuscript 15 — convolution exact endpoints Lean
on:
  push:
    branches:
      - manuscript15-convolution-endpoint-values-20261111
    paths:
      - 'lean/Manuscript15/ConvolutionEndpoints.lean'
      - '.github/workflows/manuscript15-convolution-endpoints.yml'
  pull_request:
    paths:
      - 'lean/Manuscript15/ConvolutionEndpoints.lean'
      - '.github/workflows/manuscript15-convolution-endpoints.yml'
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors \
            --retry-delay 5 --connect-timeout 20 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
      - name: Fetch Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build inherited Eulerian Fourier kernel
        working-directory: lean
        run: lake build EulerianCert.FourierModes
      - name: Audit exact endpoint declarations
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean Manuscript15/ConvolutionEndpoints.lean 2>&1 | tee /tmp/m15-convolution-endpoints.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/m15-convolution-endpoints.log; then
            echo '::error::Forbidden axiom'
            exit 1
          fi
          for decl in eulerianKernel_two_pi_zero eulerianKernel_four_pi_zero convolution_endpoint_X convolution_endpoint_Y convolution_origin_X convolution_origin_Y; do
            grep -F "Manuscript15.$decl" /tmp/m15-convolution-endpoints.log
          done
      - name: Preserve kernel log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript15-convolution-endpoint-lean
          path: /tmp/m15-convolution-endpoints.log
