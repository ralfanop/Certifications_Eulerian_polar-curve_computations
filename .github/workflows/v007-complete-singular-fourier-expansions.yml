name: V007 unconditional bilateral singular Fourier expansions

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/CompleteSingularFourierExpansions.lean'
      - 'lean/GegenbauerFock/CompletePositiveSingularFamily.lean'
      - '.github/workflows/v007-complete-singular-fourier-expansions.yml'
  workflow_dispatch:

jobs:
  singular-fourier-expansions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit bilateral norm-convergent singular Fourier expansions
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.CompleteSingularFourierExpansions 2>&1 | tee /tmp/v007-singular-fourier-build.log
          lake env lean -M16768 GegenbauerFock/CompleteSingularFourierExpansions.lean 2>&1 | tee /tmp/v007-singular-fourier-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-singular-fourier-build.log /tmp/v007-singular-fourier-axioms.log; then
            echo '::error::Forbidden axiom in bilateral norm-convergent singular Fourier expansions.'
            exit 1
          fi
          grep -F "exists_complete_singular_fourier_expansions_kummer' depends on axioms:" /tmp/v007-singular-fourier-axioms.log
          echo 'V007 bilateral norm-convergent singular Fourier expansions verified and audited.'
