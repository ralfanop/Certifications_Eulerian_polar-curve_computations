name: V007 mean-zero full Sturm resolvent sharp two-source stability

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonicMeanZeroResolventTwoSource.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonicMeanZeroResolventSharpOptimal.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonicClosedMeanZeroShiftGap.lean'
      - '.github/workflows/v007-ultraspherical-sturm-mean-zero-resolvent-two-source.yml'
  workflow_dispatch:

jobs:
  true-full-resolvent-mean-zero-two-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit full mean-zero resolvent two-source stability
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleMonicMeanZeroResolventTwoSource 2>&1 | tee /tmp/v007-mean-zero-resolvent-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleMonicMeanZeroResolventTwoSource.lean 2>&1 | tee /tmp/v007-mean-zero-resolvent-audit.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-mean-zero-resolvent-build.log /tmp/v007-mean-zero-resolvent-audit.log; then
            echo '::error::Forbidden axiom in mean-zero real-L2 full resolvent proof.'
            exit 1
          fi
          grep -F "sturmRealPositiveResolventFullCLM_meanZero_twoSource_bound' depends on axioms:" /tmp/v007-mean-zero-resolvent-audit.log
          grep -F "sturmRealPositiveResolventFullCLM_meanZero_twoSource_bound_optimal' depends on axioms:" /tmp/v007-mean-zero-resolvent-audit.log
          echo 'V007 full Sturm mean-zero resolvent two-source gap and optimality: kernel-certified.'
