name: M15 Internal-Hyperlinks terminal and Gaussian weights
on:
  pull_request:
    paths:
      - 'lean/Manuscript15/InternalHyperlinks20261115.lean'
      - '.github/workflows/m15-internal-hyperlinks-20261115.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Lean and Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile and audit every theorem
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 Manuscript15/InternalHyperlinks20261115.lean 2>&1 | tee /tmp/m15-internal-hyperlinks.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/m15-internal-hyperlinks.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/m15-internal-hyperlinks.log').read_text()
          for n in ['terminal_coefficient_ratio','terminal_coefficient_shift','terminal_numerator_rewrite','gaussian_weight_succ',
                    'gaussian_weight_pos','gaussian_weight_strict_mono','gaussian_weight_ge_geometric','gaussian_gamma_ratio','gaussian_weight_central_binomial']:
              name = 'Manuscript15.InternalHyperlinks20261115.'+n
              matches = re.findall(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", log, re.S)
              assert matches, 'missing audit: '+name
              for m in matches:
                  assert {a.strip() for a in m.split(',') if a.strip()} <= {'propext','Classical.choice','Quot.sound'}
          print('AXIOM AUDIT SUCCESS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-internal-hyperlinks-lean
          path: /tmp/m15-internal-hyperlinks.log
