name: V007 bilateral exact Gram operator norm certificate

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/TwoSidedGramExactOperatorNorm.lean'
      - '.github/workflows/gegenbauer-fock-gram-exact-operator-norm.yml'
  workflow_dispatch:

jobs:
  exact-bilateral-gram-norm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4 with retries
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for i in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((i * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for i in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((i * 8))"
          done
          test "$ok" -eq 1

      - name: Restore repository-pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Compile norm identities and audit all theorem axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.TwoSidedGramExactOperatorNorm 2>&1 | tee /tmp/v007-exact-gram-operator-norm.log
          for theorem in sourceGram_norm_eq_analysis_norm_sq \
            outputGram_norm_eq_analysis_norm_sq \
            two_sided_gram_exact_operator_norm_eq; do
            grep -qF "${theorem}' depends on axioms:" /tmp/v007-exact-gram-operator-norm.log
          done
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-exact-gram-operator-norm.log; then
            echo '::error::Nonstandard axioms in exact Gram operator norm certificate.'
            exit 1
          fi
          echo 'Kernel-certified both actual Gram operator norms equal the square of the analysis norm.'
