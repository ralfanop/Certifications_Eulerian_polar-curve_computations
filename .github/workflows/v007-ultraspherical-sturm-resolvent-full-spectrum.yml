name: V007 full real spectrum of compact canonical Sturm resolvent

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealResolventFullSpectrum.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventCompactExact.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealResolventZeroSpectrum.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealResolventPointEigenvalues.lean'
      - '.github/workflows/v007-ultraspherical-sturm-resolvent-full-spectrum.yml'
  workflow_dispatch:

jobs:
  full-sturm-resolvent-spectrum:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-check full real spectrum and axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealResolventFullSpectrum 2>&1 | tee /tmp/v007-sturm-full-spectrum.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealResolventFullSpectrum.lean 2>&1 | tee /tmp/v007-sturm-full-spectrum-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-sturm-full-spectrum.log /tmp/v007-sturm-full-spectrum-axioms.log; then
            echo '::error::Forbidden axiom in exact full Sturm resolvent spectrum.'
            exit 1
          fi
          for theorem in sturmRealClosedResolvent_hasEigenvalue_iff sturmRealClosedResolvent_mem_spectrum_iff sturmRealClosedResolvent_spectrum_eq; do
            grep -F "${theorem}' depends on axioms:" /tmp/v007-sturm-full-spectrum-axioms.log
          done
          echo 'V007 full real spectrum of actual closed Sturm resolvent kernel-audited.'
