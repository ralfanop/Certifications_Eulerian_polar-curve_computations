name: V007 true densely-defined ultraspherical Sturm real Hilbert operator closure

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealPMapClosure.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealPolynomialDensity.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealDomainLinear.lean'
      - '.github/workflows/v007-ultraspherical-sturm-real-pmap-closure.yml'
  workflow_dispatch:

jobs:
  actual-real-Sturm-closure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and axiom-audit actual dense real Sturm graph closure
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealPMapClosure 2>&1 | tee /tmp/v007-real-sturm-closure-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealPMapClosure.lean 2>&1 | tee /tmp/v007-real-sturm-closure-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-sturm-closure-build.log /tmp/v007-real-sturm-closure-axioms.log; then
            echo '::error::Forbidden axiom in genuine real Sturm Hilbert operator closure.'
            exit 1
          fi
          grep -F "sturmRealPMap_domain_dense' depends on axioms:" /tmp/v007-real-sturm-closure-axioms.log
          grep -F "sturmRealPMap_formalSymmetric' depends on axioms:" /tmp/v007-real-sturm-closure-axioms.log
          grep -F "sturmRealPMap_isClosable' depends on axioms:" /tmp/v007-real-sturm-closure-axioms.log
          grep -F "sturmRealPMap_closure_isClosed' depends on axioms:" /tmp/v007-real-sturm-closure-axioms.log
          grep -F "sturmRealPMap_le_closure' depends on axioms:" /tmp/v007-real-sturm-closure-axioms.log
          echo 'V007 genuine real ultraspherical densely-defined Sturm operator closable and its closure closed.'
