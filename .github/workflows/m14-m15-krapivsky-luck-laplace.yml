name: M14-M15 actual Laplace kernel summability and strict Arb
on:
  pull_request:
    paths:
      - 'lean/Manuscript15/KrapivskyLuckMobiusBridge.lean'
      - 'lean/Manuscript15/KrapivskyLuckLaplaceKernel.lean'
      - 'numerics/arb/m14_m15_krapivsky_luck_million.py'
      - '.github/workflows/m14-m15-krapivsky-luck-laplace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Lean and Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
      - name: Lean compilation and audit
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Manuscript15
          git rev-parse HEAD | tee /tmp/kl-lean.log
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/KrapivskyLuckMobiusBridge.olean Manuscript15/KrapivskyLuckMobiusBridge.lean 2>&1 | tee -a /tmp/kl-lean.log
          lake env lean -M16768 Manuscript15/KrapivskyLuckLaplaceKernel.lean 2>&1 | tee -a /tmp/kl-lean.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/kl-lean.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/kl-lean.log').read_text()
          for n in ['mobius_fibre_delta','weighted_fibre_delta','fibre_tsum_delta','mobius_kernel_tsum','sinc_square_kernel','laplaceIntegrand_nonneg','laplaceIntegrand_dom','laplaceIntegrand_integrable','laplaceKernel_nonneg','laplaceKernel_bound','laplaceKernel_abs_summable','laplaceKernel_mobius_cancellation']:
              name = 'Manuscripts14And15.KrapivskyLuck.'+n
              matches = re.findall(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", log, re.S)
              assert matches, 'missing audit: '+name
              for match in matches:
                  assert {a.strip() for a in match.split(',') if a.strip()} <= {'propext','Classical.choice','Quot.sound'}
          print('AXIOM AUDIT SUCCESS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kl-laplace-lean
          path: /tmp/kl-lean.log

  arb:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact HEAD and pinned FLINT
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m pip install python-flint==0.9.0
      - name: Independent scalar rounding certificates
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee kl-head.txt
          python numerics/arb/m14_m15_krapivsky_luck_million.py 2>&1 | tee kl-arb.log
          grep -F 'MILLION SUCCESS kl-sine-integral' kl-arb.log
          gzip -t million-enclosures.jsonl.gz kl-endpoints.jsonl.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kl-laplace-million
          path: |
            kl-head.txt
            kl-arb.log
            kl-exact.json
            kl-endpoints.jsonl.gz
            million-enclosures.jsonl.gz
            million-kl-sine-integral.json
          compression-level: 0
