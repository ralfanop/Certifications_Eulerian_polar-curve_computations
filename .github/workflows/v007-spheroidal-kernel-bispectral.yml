name: V007 spheroidal true differential exponential kernel bispectrality

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/SpheroidalExponentialBispectral.lean'
      - '.github/workflows/v007-spheroidal-kernel-bispectral.yml'
  workflow_dispatch:

jobs:
  bispectral:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib and cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and axiom-audit actual spheroidal kernel differential balance
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.SpheroidalExponentialBispectral 2>&1 | tee /tmp/v007-spheroidal-kernel-build.log
          lake env lean -M16768 GegenbauerFock/SpheroidalExponentialBispectral.lean 2>&1 | tee /tmp/v007-spheroidal-kernel-audit.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-spheroidal-kernel-build.log /tmp/v007-spheroidal-kernel-audit.log; then
            echo "::error::Forbidden axiom in spheroidal kernel"
            exit 1
          fi
          for thm in kernel_deriv_left kernel_second_deriv_left kernel_deriv_right kernel_second_deriv_right spheroidal_exponential_pointwise_bispectral; do
            grep -F "${thm}' depends on axioms:" /tmp/v007-spheroidal-kernel-audit.log
          done
          echo 'V007 true-derivative spheroidal kernel bispectrality: certified.'
