name: V007 Kummer first excited vacuum correction independent certificate

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/KummerVacuumFirstCorrection.lean'
      - 'lean/GegenbauerFock/KummerPositiveBounds.lean'
      - 'lean/GegenbauerFock/KummerCoefficients.lean'
      - '.github/workflows/gegenbauer-fock-kummer-first-correction.yml'
  workflow_dispatch:

jobs:
  verify-kummer-first-correction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt*8))"
          done
          test "$installed" = 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt*8))"
          done
          test "$ready" = 1
      - name: Restore fixed Mathlib manifest
        working-directory: lean
        run: lake update
      - name: Fetch fixed Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Kernel-check Kummer first positive vacuum correction
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.KummerVacuumFirstCorrection 2>&1 | tee /tmp/gf-kummer-first.log
          grep -F "GegenbauerFock.KummerCoefficients.kummerSeries_ge_vacuum_add_first' depends on axioms:" /tmp/gf-kummer-first.log
          grep -F "GegenbauerFock.KummerCoefficients.kummerSeries_gt_one' depends on axioms:" /tmp/gf-kummer-first.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/gf-kummer-first.log; then
            echo '::error::Nonstandard axiom in Kummer first correction.'
            exit 1
          fi
          echo 'Kummer strict first nonvacuum contribution kernel-audited.'
