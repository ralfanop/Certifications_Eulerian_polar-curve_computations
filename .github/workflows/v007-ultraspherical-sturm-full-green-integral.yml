name: V007 actual full real-polynomial Gegenbauer Green integral symmetry

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleFullGreenIntegral.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvillePolynomialExpansion.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleAllMonomialIntegrals.lean'
      - '.github/workflows/v007-ultraspherical-sturm-full-green-integral.yml'
  workflow_dispatch:

jobs:
  full-real-Green-integral:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit actual Green real polynomial integral
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleFullGreenIntegral 2>&1 | tee /tmp/v007-sturm-fullgreen-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleFullGreenIntegral.lean 2>&1 | tee /tmp/v007-sturm-fullgreen-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-sturm-fullgreen-build.log /tmp/v007-sturm-fullgreen-axioms.log; then
            echo '::error::Forbidden axiom in genuine full real polynomial Green integral.'
            exit 1
          fi
          grep -F "sturmPolynomial_operator_monomial_integral' depends on axioms:" /tmp/v007-sturm-fullgreen-axioms.log
          grep -F "sturmPolynomial_operator_integral_eq_matrix' depends on axioms:" /tmp/v007-sturm-fullgreen-axioms.log
          grep -F "sturmPolynomial_green_integral_symmetric' depends on axioms:" /tmp/v007-sturm-fullgreen-axioms.log
          echo 'V007 actual full real polynomial Green integral identity and symmetry certified.'
