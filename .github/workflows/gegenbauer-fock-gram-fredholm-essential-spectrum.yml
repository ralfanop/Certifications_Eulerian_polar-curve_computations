name: V007 bilateral Fredholm essential spectral zero

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/TwoSidedGramFredholmEssentialSpectrum.lean'
      - '.github/workflows/gegenbauer-fock-gram-fredholm-essential-spectrum.yml'
  workflow_dispatch:

jobs:
  essential-zero-bilateral:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then break; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep "$((attempt * 8))"
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then break; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep "$((attempt * 8))"
          done
      - name: Prepare pinned Mathlib dependencies
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-compile both Fredholm essential-spectrum memberships
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.TwoSidedGramFredholmEssentialSpectrum 2>&1 | tee /tmp/v007-essential-zero.log
          for theorem in sourceGram_zero_mem_fredholm_essential_spectrum outputGram_zero_mem_fredholm_essential_spectrum two_sided_gram_zero_mem_fredholm_essential_spectra two_sided_gram_zero_essential_and_singular_weyl; do
            grep -qF "${theorem}' depends on axioms" /tmp/v007-essential-zero.log
          done
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-essential-zero.log; then
            echo '::error::Forbidden proof axiom in bilateral Fredholm essential-spectrum certificate'
            exit 1
          fi
          echo 'V007 zero in the actual bilateral Fredholm essential spectra with singular Weyl witnesses: audited.'
