name: V007 original Fourier–Bochner pointwise inverse instability

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireFourierPointwiseInstability.lean'
      - '.github/workflows/v007-fourier-bochner-pointwise-instability.yml'
  workflow_dispatch:

jobs:
  original-fourier-pointwise-instability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib and cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile original Fourier–Bochner pointwise instability and audit axioms
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireFourierPointwiseInstability 2>&1 | tee /tmp/v007-pointwise-instability-build.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireFourierPointwiseInstability.lean 2>&1 | tee /tmp/v007-pointwise-instability-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-pointwise-instability-build.log /tmp/v007-pointwise-instability-axioms.log; then
            echo "::error::Forbidden axiom in genuine Fourier–Bochner pointwise instability"
            exit 1
          fi
          grep -F "ultraspherical_fourierBochner_normalized_pointwise_null_no_strong_source_limit' depends on axioms:" /tmp/v007-pointwise-instability-axioms.log
          echo 'V007 Fourier–Bochner original pointwise instability: Lean and axiom audit successful.'
