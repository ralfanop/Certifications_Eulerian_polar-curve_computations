name: V007 intrinsic Gaussian Riesz exact diagonal kernel

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GaussianAreaIntrinsicRieszDiagonal.lean'
      - 'lean/GegenbauerFock/GaussianAreaIntrinsicRieszKernel.lean'
      - '.github/workflows/v007-fock-riesz-diagonal.yml'
  workflow_dispatch:

jobs:
  intrinsic-riesz-diagonal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib dependencies
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel compile exact Riesz diagonal and audit axioms
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GaussianAreaIntrinsicRieszDiagonal 2>&1 | tee /tmp/v007-riesz-diagonal.log
          lake env lean -M16768 GegenbauerFock/GaussianAreaIntrinsicRieszDiagonal.lean 2>&1 | tee -a /tmp/v007-riesz-diagonal.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-riesz-diagonal.log; then
            echo "::error::Forbidden axiom in intrinsic Gaussian Riesz diagonal kernel."
            exit 1
          fi
          grep -F "intrinsicRieszKernel_diagonal_value' depends on axioms:" /tmp/v007-riesz-diagonal.log
          grep -F "intrinsicRieszKernel_diagonal_ne_zero' depends on axioms:" /tmp/v007-riesz-diagonal.log
          echo 'V007 intrinsic Riesz diagonal Gaussian kernel: kernel and axioms clean.'
