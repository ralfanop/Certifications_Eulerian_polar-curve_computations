name: V007 summable squared Gegenbauer Sturm resolvent eigenvalues

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventSquareSeriesSummable.lean'
      - '.github/workflows/v007-ultraspherical-sturm-resolvent-square-series.yml'
  workflow_dispatch:

jobs:
  sturm-resolvent-square-series:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then exit 0; fi
            sleep "$((attempt * 8))"
          done
          exit 1
      - name: Prepare exact Mathlib dependencies
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Certify square summability of closed Sturm resolvent eigenvalues
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleResolventSquareSeriesSummable 2>&1 | tee /tmp/gf-sturm-finite-truncations.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/gf-sturm-finite-truncations.log; then
            echo '::error::Nonstandard axiom in squared eigenvalue summability.'
            exit 1
          fi
          for theorem in sturmResolventMultiplier_sq_summable; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/gf-sturm-finite-truncations.log
          done
          echo 'Squared Gegenbauer Sturm resolvent eigenvalues summable kernel-certified.'
