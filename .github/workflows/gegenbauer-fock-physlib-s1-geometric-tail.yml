name: V007 sharp geometric CFC S1 trace and operator tail inequalities

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/PhyslibTraceClassGeometricTailBound.lean'
      - 'lean/GegenbauerFock/PhyslibTraceClassSeriesTailEstimate.lean'
      - 'lean/GegenbauerFock/PhyslibTraceClassGeometricPowers.lean'
      - 'lean/GegenbauerFock/PhyslibTraceClassPositivePowers.lean'
      - 'lean/GegenbauerFock/PhyslibTraceClassSeriesOperatorConvergence.lean'
      - 'lean/GegenbauerFock/PhyslibTraceClassSeriesApproximation.lean'
      - 'lean/GegenbauerFock/PhyslibTraceClassInfiniteSeries.lean'
      - 'lean/GegenbauerFock/PhyslibTraceClassComplete.lean'
      - '.github/workflows/gegenbauer-fock-physlib-s1-geometric-tail.yml'
  workflow_dispatch:

jobs:
  s1-geometric-tail:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify available 16 GB runner memory budget
        shell: bash
        run: |
          set -euo pipefail
          echo 'Public Ubuntu runner nominal RAM budget: 16 GB total per job.'
          free -h
          grep -E '^MemTotal:' /proc/meminfo
          if [ -f /sys/fs/cgroup/memory.max ]; then
            printf 'cgroup memory.max: '
            cat /sys/fs/cgroup/memory.max
          fi
          mem_kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          # 16 GB nominal VMs report slightly less after reserved memory.
          if [ "$mem_kib" -lt 14500000 ]; then
            echo "::error::Runner has less memory than the nominal 16 GB public runner."
            exit 1
          fi
          echo '16 GB public runner memory tier confirmed.'
      - uses: actions/checkout@v4

      # The existing certification repository does not check in a
      # lake-manifest.json. The lean-action composite itself refuses to
      # initialize without it, even with auto-config: false; install
      # elan directly and run lake update before requesting Mathlib cache.
      - name: Install elan and pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          # Upstream GitHub and Lean release endpoints can return transient HTTP 504.
          # Retry downloads, but never change lean/lean-toolchain or Mathlib pins.
          curl --proto '=https' --tlsv1.2 -fsSL \
            --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then
              installed=1
              break
            fi
            echo "::warning::elan bootstrap failed, attempt ${attempt}/6"
            sleep "$((attempt * 8))"
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::elan bootstrap unavailable after six attempts"
            exit 1
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            # lean --version triggers installation of the EXACT pinned
            # toolchain (lean/lean-toolchain); some failures originate here.
            if "$HOME/.elan/bin/lean" --version &&
               "$HOME/.elan/bin/lake" --version; then
              ready=1
              break
            fi
            echo "::warning::pinned Lean toolchain download failed, attempt ${attempt}/6"
            sleep "$((attempt * 8))"
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::pinned Lean installation unavailable after six attempts"
            exit 1
          fi

      - name: Generate Lake manifest for existing pinned Mathlib
        working-directory: lean
        run: lake update

      - name: Fetch Mathlib build artifacts
        working-directory: lean
        run: lake exe cache get

      # All Lake builds inherit weakLeanArgs = ["-M16768"] from
      # lean/lakefile.toml. Direct lake env lean invocations below
      # receive the same flag explicitly.
      - name: Check per-process Lean -M16768 option
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 --version

      # Check actual nonunital S1 geometric powers without changing the pinned toolchain.

      - name: Certify quantitative geometric tail bounds for actual CFC S1 and operator norms
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.PhyslibTraceClassGeometricTailBound 2>&1 | tee /tmp/gf-s1-geometric-tail.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/gf-s1-geometric-tail.log; then
            echo '::error::Forbidden axiom in S1 geometric trace/operator tail bounds.'
            exit 1
          fi
          grep -F "positivePowers_traceNorm_tail_le' depends on axioms:" /tmp/gf-s1-geometric-tail.log
          grep -F "positivePowers_operatorNorm_tail_le' depends on axioms:" /tmp/gf-s1-geometric-tail.log
          lake env lean -M16768 GegenbauerFock/PhyslibTraceClassGeometricTailBound.lean 2>&1 | tee /tmp/gf-s1-geometric-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/gf-s1-geometric-axioms.log; then
            echo '::error::Forbidden axiom from independent Lean kernel check.'
            exit 1
          fi
          echo 'S1 geometric tail inequalities: clean axioms.'
