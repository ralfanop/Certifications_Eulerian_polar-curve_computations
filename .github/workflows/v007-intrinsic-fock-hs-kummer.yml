name: V007 intrinsic Gaussian entire Fock Hilbert-Schmidt Kummer trace

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireHSKummer.lean'
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireGramPairing.lean'
      - '.github/workflows/v007-intrinsic-fock-hs-kummer.yml'
  workflow_dispatch:

jobs:
  intrinsic-hs-kummer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Resolve pinned Mathlib and build cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and axiom-audit intrinsic HS and Kummer identities
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireHSKummer 2>&1 | tee /tmp/v007-intrinsic-hs-kummer.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireHSKummer.lean 2>&1 | tee -a /tmp/v007-intrinsic-hs-kummer.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-intrinsic-hs-kummer.log; then
            echo "::error::Forbidden axioms in V007 intrinsic Hilbert-Schmidt Kummer formula"
            exit 1
          fi
          grep -F "C_intrinsicEntire_HS_basis_summable' depends on axioms:" /tmp/v007-intrinsic-hs-kummer.log
          grep -F "C_intrinsicEntire_HS_energy_eq_kummer' depends on axioms:" /tmp/v007-intrinsic-hs-kummer.log
          grep -F "C_intrinsicEntire_basisHSNorm_eq_sqrt_kummer' depends on axioms:" /tmp/v007-intrinsic-hs-kummer.log
          grep -F "C_intrinsicEntire_Gram_basis_trace_eq_kummer' depends on axioms:" /tmp/v007-intrinsic-hs-kummer.log
          echo 'V007 intrinsic Gaussian Fock HS Kummer trace: kernel compilation and axiom audit clean.'
