name: V007 intrinsic real Sturm S1 S2 and generator certificate
on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleHeatResolventIntrinsicS1S2Certificate.lean'
      - '.github/workflows/v007-sturm-real-intrinsic-s1s2-certificate.yml'
  workflow_dispatch:
jobs:
  real-intrinsic-s1s2:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit intrinsic real S1 S2 and generator theorem
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleHeatResolventIntrinsicS1S2Certificate 2>&1 | tee /tmp/v007-intrinsic-s1s2-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleHeatResolventIntrinsicS1S2Certificate.lean 2>&1 | tee /tmp/v007-intrinsic-s1s2-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-intrinsic-s1s2-build.log /tmp/v007-intrinsic-s1s2-axioms.log; then
            echo '::error::Forbidden axiom in intrinsic real S1 S2 joint theorem.'
            exit 1
          fi
          grep -F "sturmRealHeatGenerator_resolvent_intrinsicS1S2_joint_certificate' depends on axioms:" /tmp/v007-intrinsic-s1s2-axioms.log
          echo 'V007 canonical heat generator real S1 and intrinsic basis-free S2 certificate kernel-certified.'
