name: V007 real Gamma integral of intrinsic Gaussian Fock HS energy

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireHSRealGammaIntegral.lean'
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireHSKummer.lean'
      - '.github/workflows/v007-intrinsic-fock-hs-real-gamma.yml'
  workflow_dispatch:

jobs:
  gamma-hs-intrinsic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Resolve pinned Mathlib and cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build and audit the intrinsic Fock Gamma-integral identities
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireHSKummer GegenbauerFock.GegenbauerIntrinsicEntireHSRealGammaIntegral 2>&1 | tee /tmp/v007-real-gamma-hs.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireHSRealGammaIntegral.lean 2>&1 | tee -a /tmp/v007-real-gamma-hs.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-gamma-hs.log; then
            echo "::error::Forbidden axiom in intrinsic Gamma-Hilbert-Schmidt identity"
            exit 1
          fi
          grep -F "C_intrinsicEntire_HS_energy_eq_gamma_integral' depends on axioms:" /tmp/v007-real-gamma-hs.log
          grep -F "C_intrinsicEntire_HS_energy_eq_pochhammer' depends on axioms:" /tmp/v007-real-gamma-hs.log
          grep -F "C_intrinsicEntire_Gram_trace_eq_gamma_integral' depends on axioms:" /tmp/v007-real-gamma-hs.log
          grep -F "C_intrinsicEntire_Gram_trace_eq_pochhammer' depends on axioms:" /tmp/v007-real-gamma-hs.log
          echo 'V007 real Gaussian Fock S2 integral and Pochhammer series kernel-checked.'
