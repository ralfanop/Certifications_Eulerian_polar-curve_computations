name: V007 ultraspherical polynomial density independent Lean certificate

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalContinuousDensity.lean'
      - 'lean/GegenbauerFock/UltrasphericalPolynomialKernel.lean'
      - 'lean/GegenbauerFock/UltrasphericalPolynomialL2.lean'
      - 'lean/GegenbauerFock/UltrasphericalPolynomialApproximation.lean'
      - 'lean/GegenbauerFock/UltrasphericalPolynomialDensityReduction.lean'
      - 'lean/GegenbauerFock/UltrasphericalComplexWeierstrass.lean'
      - '.github/workflows/gegenbauer-fock-ultraspherical-density.yml'
  workflow_dispatch:

jobs:
  ultraspherical-density:
    # Public-repository GitHub-hosted Linux runners supply 16 GB RAM in
    # TOTAL per VM/job (shared by all Lean/Lake processes in that job).
    # This cannot be interpreted as 16 GB for every concurrent process.
    runs-on: ubuntu-24.04
    steps:
      - name: Verify available 16 GB runner memory budget
        shell: bash
        run: |
          set -euo pipefail
          echo 'Public Ubuntu runner nominal RAM budget: 16 GB total per job.'
          free -h
          grep -E '^MemTotal:' /proc/meminfo
          if [ -f /sys/fs/cgroup/memory.max ]; then
            printf 'cgroup memory.max: '
            cat /sys/fs/cgroup/memory.max
          fi
          mem_kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          # 16 GB nominal VMs report slightly less after reserved memory.
          if [ "$mem_kib" -lt 14500000 ]; then
            echo "::error::Runner has less memory than the nominal 16 GB public runner."
            exit 1
          fi
          echo '16 GB public runner memory tier confirmed.'
      - uses: actions/checkout@v4

      # The existing certification repository does not check in a
      # lake-manifest.json. The lean-action composite itself refuses to
      # initialize without it, even with auto-config: false; install
      # elan directly and run lake update before requesting Mathlib cache.
      - name: Install elan and pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          # Upstream GitHub and Lean release endpoints can return transient HTTP 504.
          # Retry downloads, but never change lean/lean-toolchain or Mathlib pins.
          curl --proto '=https' --tlsv1.2 -fsSL \
            --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then
              installed=1
              break
            fi
            echo "::warning::elan bootstrap failed, attempt ${attempt}/6"
            sleep "$((attempt * 8))"
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::elan bootstrap unavailable after six attempts"
            exit 1
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            # lean --version triggers installation of the EXACT pinned
            # toolchain (lean/lean-toolchain); some failures originate here.
            if "$HOME/.elan/bin/lean" --version &&
               "$HOME/.elan/bin/lake" --version; then
              ready=1
              break
            fi
            echo "::warning::pinned Lean toolchain download failed, attempt ${attempt}/6"
            sleep "$((attempt * 8))"
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::pinned Lean installation unavailable after six attempts"
            exit 1
          fi

      - name: Generate Lake manifest for existing pinned Mathlib
        working-directory: lean
        run: lake update

      - name: Fetch Mathlib build artifacts
        working-directory: lean
        run: lake exe cache get

      # All Lake builds inherit weakLeanArgs = ["-M16768"] from
      # lean/lakefile.toml. Direct lake env lean invocations below
      # receive the same flag explicitly.
      - name: Check per-process Lean -M16768 option
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean -M16768 --version

      - name: Compile ultraspherical continuous-density and compact-support bridges
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalContinuousDensity 2>&1 | tee /tmp/v007-ultra-continuous.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-ultra-continuous.log; then
            echo "::error::Nonstandard axiom in ultraspherical continuous-density theorems."
            exit 1
          fi

      - name: Compile polynomial moment kernel and injectivity equivalence
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalPolynomialKernel 2>&1 | tee /tmp/v007-ultra-polynomial.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-ultra-polynomial.log; then
            echo "::error::Nonstandard axiom in Fock polynomial-kernel theorems."
            exit 1
          fi

      - name: Certify exact L2 representation of every complex polynomial
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalPolynomialL2 2>&1 | tee /tmp/v007-ultra-polynomial-l2.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-ultra-polynomial-l2.log; then
            echo "::error::Nonstandard axiom in exact weighted polynomial evaluation."
            exit 1
          fi

      - name: Certify weighted L2 norm approximation from complex polynomial errors
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalPolynomialApproximation 2>&1 | tee /tmp/v007-ultra-polynomial-approx.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-ultra-polynomial-approx.log; then
            echo "::error::Nonstandard axiom in weighted L2 polynomial approximation."
            exit 1
          fi

      - name: Certify final weighted polynomial-density reduction to complex Weierstrass
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalPolynomialDensityReduction 2>&1 | tee /tmp/v007-ultra-density-reduction.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-ultra-density-reduction.log; then
            echo "::error::Nonstandard axiom in weighted polynomial density reduction."
            exit 1
          fi

      - name: Certify unconditional complex polynomial density and Fock injectivity
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalComplexWeierstrass 2>&1 | tee /tmp/v007-ultra-complex-weierstrass.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-ultra-complex-weierstrass.log; then
            echo "::error::Nonstandard axiom in unconditional ultraspherical Fock injectivity."
            exit 1
          fi
