name: "Priority 3 — sharp mixed Gram Fredholm polynomial coefficient mass"

on:
  push:
    branches:
      - manuscript14-priority3-sharp-polynomial-mass-20261110
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3SharpPolynomialMass.lean'
      - '.github/workflows/manuscript14-priority3-sharp-polynomial-mass.yml'
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3UnrestrictedMixedGramHadamard.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3AmbientProjectionSharp.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3SquareAmbientMixedGramSharp.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3ComplexGramMinorBridge.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3SharpPolynomialMass.lean'
      - '.github/workflows/manuscript14-priority3-sharp-polynomial-mass.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Unrestricted complex Gram polynomial ℓ¹ coefficient mass — one kernel audit
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build exact complex Gram coefficient bridge
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          lake env lean -M16768 \
            -o .lake/build/lib/lean/SpecialImaginaryPoint/V14119Priority3ComplexGramMinorBridge.olean \
            SpecialImaginaryPoint/V14119Priority3ComplexGramMinorBridge.lean
      - name: Build square-ambient sharp complex Gram dependency
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -M16768 \
            -o .lake/build/lib/lean/SpecialImaginaryPoint/V14119Priority3SquareAmbientMixedGramSharp.olean \
            SpecialImaginaryPoint/V14119Priority3SquareAmbientMixedGramSharp.lean
      - name: Build arbitrary-ambient independent-family projection dependency
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -M16768 \
            -o .lake/build/lib/lean/SpecialImaginaryPoint/V14119Priority3AmbientProjectionSharp.olean \
            SpecialImaginaryPoint/V14119Priority3AmbientProjectionSharp.lean
      - name: Build unrestricted sharp Gram dependency
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -M16768 \
            -o .lake/build/lib/lean/SpecialImaginaryPoint/V14119Priority3UnrestrictedMixedGramHadamard.olean \
            SpecialImaginaryPoint/V14119Priority3UnrestrictedMixedGramHadamard.lean
      - name: Compile sharp Fredholm polynomial coefficient mass theorem
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -M16768 \
            SpecialImaginaryPoint/V14119Priority3SharpPolynomialMass.lean 2>&1 | tee /tmp/p3-sharp-polynomial-main.log
      - name: Audit kernel theorem and forbid nonstandard axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          log=pathlib.Path("/tmp/p3-sharp-polynomial-main.log").read_text()
          name="Manuscript14Priority3.SharpPolynomialMass.gramPolynomial_coeff_l1_le_exp"
          reports={}
          for m in re.finditer(r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms",log,re.MULTILINE):
            reports[m.group(1) or m.group(3)]={x.strip() for x in (m.group(2) or "").split(",") if x.strip()}
          assert name in reports, f"Missing exact kernel axiom report: {name}"
          allowed={"propext","Quot.sound","Classical.choice"}
          assert reports[name] <= allowed, f"Nonstandard axioms: {reports[name]-allowed}"
          assert "sorryAx" not in log and "Lean.ofReduceBool" not in log
          assert not re.search(r"\.lean:\d+:\d+: error",log)
          print(name,sorted(reports[name]))
          print("SUCCESS: unrestricted sharp Fredholm polynomial coefficient ℓ¹ mass")
          PY
      - name: Upload Lean audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priority3-sharp-polynomial-mass-log
          path: /tmp/p3-sharp-polynomial-main.log
          if-no-files-found: ignore
