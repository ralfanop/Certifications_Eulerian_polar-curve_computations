name: V007 dual Gram first excited S1 strict vacuum norm certificate

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/PhyslibDualGramsFirstExcitedTraceBounds.lean'
      - 'lean/GegenbauerFock/KummerVacuumFirstCorrection.lean'
      - 'lean/GegenbauerFock/PhyslibDualGramsActualS1NormEquality.lean'
      - '.github/workflows/gegenbauer-fock-physlib-dual-grams-first-excited.yml'
  workflow_dispatch:

jobs:
  verify-dual-first-excited:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt*8))"
          done
          test "$installed" = 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt*8))"
          done
          test "$ready" = 1
      - name: Restore fixed Mathlib manifest
        working-directory: lean
        run: lake update
      - name: Fetch fixed Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Kernel-check first nonvacuum term of dual S1 norms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.PhyslibDualGramsFirstExcitedTraceBounds 2>&1 | tee /tmp/gf-dual-grams-first-excited.log
          grep -F "GegenbauerFock.GeneralUltrasphericalFock.dualGrams_actual_S1_first_vacuum_correction_lower' depends on axioms:" /tmp/gf-dual-grams-first-excited.log
          grep -F "GegenbauerFock.GeneralUltrasphericalFock.dualGrams_actual_S1_strictly_above_vacuum' depends on axioms:" /tmp/gf-dual-grams-first-excited.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/gf-dual-grams-first-excited.log; then
            echo '::error::Nonstandard axiom in dual-Gram strict nonvacuum bounds.'
            exit 1
          fi
          echo 'Both actual CFC S1 first excited norms kernel-audited.'
