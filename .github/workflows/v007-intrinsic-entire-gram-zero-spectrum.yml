name: V007 intrinsic entire Fock Gram spectral zero and Fredholm essential zero

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireGramZeroSpectrum.lean'
      - '.github/workflows/v007-intrinsic-entire-gram-zero-spectrum.yml'
  workflow_dispatch:

jobs:
  intrinsic-gram-zero-spectrum:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile intrinsic Gram spectral zero and audit axioms
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireGramZeroSpectrum 2>&1 | tee /tmp/v007-intrinsic-gram-zero.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireGramZeroSpectrum.lean 2>&1 | tee -a /tmp/v007-intrinsic-gram-zero.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-intrinsic-gram-zero.log; then
            echo "::error::Forbidden axiom in intrinsic essential spectrum module"
            exit 1
          fi
          for theorem in \
            C_intrinsicEntire_gram_zero_mem_spectrum \
            C_intrinsicEntire_gram_zero_not_eigen \
            C_intrinsicEntire_gram_zero_mem_fredholm_essential \
            C_intrinsicEntire_gram_zero_continuous_essential; do
              grep -F "$theorem' depends on axioms:" /tmp/v007-intrinsic-gram-zero.log
          done
          echo 'V007 full intrinsic Gram zero essential spectrum is Lean checked.'
