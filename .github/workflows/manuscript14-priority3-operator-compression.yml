name: "Manuscript 14.119 Priority 3 — actual operator compressions"

on:
  push:
    branches:
      - manuscript14-priority3-operator-compression-20261109
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3OperatorCompression.lean'
      - '.github/workflows/manuscript14-priority3-operator-compression.yml'
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3OperatorCompression.lean'
      - '.github/workflows/manuscript14-priority3-operator-compression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean 4 kernel — genuine compressed Dirichlet inverse determinant
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib cache
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile source modules and actual operator compression
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          for f in DirichletFiniteDeterminant Section67ScalarCertificate V14119Priority3DirichletDiagonal V14119Priority3SpectralDetBridge V14119Priority3OperatorCompression; do
            lake env lean -M16768 -o ".lake/build/lib/lean/SpecialImaginaryPoint/$f.olean" \
              "SpecialImaginaryPoint/$f.lean" 2>&1 |
              tee "/tmp/priority3-compression-$f.log"
          done
      - name: Kernel axiom audit for actual finite operator compressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          log=pathlib.Path("/tmp/priority3-compression-V14119Priority3OperatorCompression.log").read_text()
          names=[
             "compressedInverse_eq_diagonal",
             "finiteOperatorShift_eq_diagonal",
             "finiteOperatorShift_det",
             "factor_eq_real",
             "finiteOperatorShift_det_eq_spectral",
             "finiteOperatorShift_det_tendsto"
          ]
          found={}
          for m in re.finditer(r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms",log):
              found[m.group(1) or m.group(3)]={x.strip() for x in (m.group(2) or "").split(",") if x.strip()}
          allowed={"propext","Quot.sound","Classical.choice"}
          for suffix in names:
              name="Manuscript14Priority3.OperatorCompression."+suffix
              assert name in found,f"Missing axiom report {name}"
              assert found[name] <= allowed,(name,found[name])
              print(name,sorted(found[name]))
          assert "sorryAx" not in log and "Lean.ofReduceBool" not in log
          assert not re.search(r"\.lean:\d+:\d+: error:",log)
          print("SUCCESS: 6 genuine compressed inverse determinant and convergence theorems, standard axioms")
          PY
      - name: Upload proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript14-priority3-compression-lean-audit
          path: /tmp/priority3-compression-*.log
          if-no-files-found: ignore
