name: V007 real nuclear complete positive Gram S1

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/RealNuclearGramCompletePositiveS1.lean'
      - 'lean/GegenbauerFock/RealNuclearGramSingularSummability.lean'
      - '.github/workflows/v007-real-nuclear-gram-complete-positive-s1.yml'
  workflow_dispatch:

jobs:
  complete-positive-gram-s1:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Check exact S1 trace and actual operator SVD from positive Gram basis
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealNuclearGramCompletePositiveS1 2>&1 | tee /tmp/v007-real-complete-positive-s1.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-complete-positive-s1.log; then
            echo '::error::Forbidden axiom in real positive Gram S1.'
            exit 1
          fi
          for theorem in \
            HasRealNuclearRankOneSeries.completePositiveGram_singular_summable \
            HasRealNuclearRankOneSeries.completePositiveGram_exact_nuclear_infimum \
            HasRealNuclearRankOneSeries.completePositiveGram_operator_svd; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-real-complete-positive-s1.log
          done
          echo 'Actual real nuclear operator complete positive Gram S1 and SVD kernel-certified.'
