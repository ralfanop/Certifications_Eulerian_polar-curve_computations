name: "Manuscript 14.119 Priority 3 — actual l2 inverse operator"

on:
  push:
    branches:
      - manuscript14-priority3-traceclass-diagonal-20261109
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3DirichletDiagonal.lean'
      - '.github/workflows/manuscript14-priority3-diagonal-lean.yml'
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3DirichletDiagonal.lean'
      - '.github/workflows/manuscript14-priority3-diagonal-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Kernel check actual l2 Dirichlet inverse, basis eigenvalues and positivity
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Retrieve pinned Mathlib
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Check two actual Lean modules
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/Section67ScalarCertificate.olean \
            SpecialImaginaryPoint/Section67ScalarCertificate.lean 2>&1 |
            tee /tmp/priority3-diagonal-section67.log
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/V14119Priority3DirichletDiagonal.olean \
            SpecialImaginaryPoint/V14119Priority3DirichletDiagonal.lean 2>&1 |
            tee /tmp/priority3-diagonal.axioms
      - name: Audit five exact declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          log=pathlib.Path("/tmp/priority3-diagonal.axioms").read_text()
          names=["σ_summable","term_summable","inverse_eigen","inverse_nonneg","inverse_diagonal"]
          matches={}
          for m in re.finditer(
             r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms",log):
            matches[m.group(1) or m.group(3)]=set(x.strip() for x in (m.group(2) or "").split(",") if x.strip())
          for n in names:
            name="Manuscript14Priority3.TraceClassModel."+n
            assert name in matches, "Missing kernel report: "+name
            assert not matches[name]-{"propext","Classical.choice","Quot.sound"}, name
          assert "sorryAx" not in log and "Lean.ofReduceBool" not in log
          print("SUCCESS: five Lean declarations for the actual l² Dirichlet inverse model")
          PY
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priority3-diagonal-model
          path: /tmp/priority3-diagonal*
          if-no-files-found: ignore
