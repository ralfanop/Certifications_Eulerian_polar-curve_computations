name: "M15 S2.7 zero admissible transport cost — Lean"
on:
  push:
    branches:
      - draft/m15-s27-zero-transport-cost-20261114
    paths:
      - 'lean/Manuscript15/Section27ZeroCostNormalization.lean'
      - '.github/workflows/m15-s27-zero-cost-normalization.yml'
  pull_request:
    paths:
      - 'lean/Manuscript15/Section27ZeroCostNormalization.lean'
      - '.github/workflows/m15-s27-zero-cost-normalization.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile exact dependency chain and audit new theorem
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Manuscript15
          for mod in Section27CouplingIntegral Section27TwoCoordinate Section27WeightedCoordinate Section27CostInfimum Section27AdmissibleMeasureCosts Section27AdmissibleCostPositivity; do
            lake env lean -M16768 -o ".lake/build/lib/lean/Manuscript15/${mod}.olean" "Manuscript15/${mod}.lean" 2>&1 | tee "/tmp/${mod}.log"
          done
          lake env lean -M16768 Manuscript15/Section27ZeroCostNormalization.lean 2>&1 | tee /tmp/zero-cost.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:' /tmp/Section27*.log /tmp/zero-cost.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/zero-cost.log').read_text()
          target = 'Manuscript15.Section27.zero_cost_infimum_of_nonempty'
          hits = re.findall(r"'" + re.escape(target) + r"' depends on axioms: \[([^\]]*)\]", log, re.S)
          assert len(hits) == 1, (target, 'missing/duplicate axiom audit')
          used = {s.strip() for s in hits[0].split(',') if s.strip()}
          assert used <= {'propext', 'Classical.choice', 'Quot.sound'}, used
          print('AXIOM AUDIT SUCCESS:', target, sorted(used))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-zero-cost-lean-logs
          path: /tmp/*.log
