name: V007 real Sturm exact resolvent spectral graph

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealResolventSpectralGraph.lean'
      - '.github/workflows/v007-ultraspherical-sturm-resolvent-spectral-graph.yml'
  workflow_dispatch:

jobs:
  sturm-full-resolvent-spectral-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit full resolvent graph and symmetry
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealResolventSpectralGraph 2>&1 | tee /tmp/v007-sturm-resolvent-graph-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealResolventSpectralGraph.lean 2>&1 | tee /tmp/v007-sturm-resolvent-graph-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-sturm-resolvent-graph-build.log /tmp/v007-sturm-resolvent-graph-axioms.log; then
            echo '::error::Forbidden axiom in Sturm resolvent spectral graph.'
            exit 1
          fi
          grep -F "sturmRealPositiveResolventFullCLM_inner_symmetric' depends on axioms:" /tmp/v007-sturm-resolvent-graph-axioms.log
          grep -F "sturmRealPositiveResolventFullCLM_left_inverse_closed_shift' depends on axioms:" /tmp/v007-sturm-resolvent-graph-axioms.log
          grep -F "sturmRealClosed_graph_eq_full_resolvent_range' depends on axioms:" /tmp/v007-sturm-resolvent-graph-axioms.log
          echo 'V007 exact full resolvent spectral graph kernel-certified.'
