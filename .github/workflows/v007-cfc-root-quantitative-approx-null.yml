name: V007 canonical CFC root quantitative normalized approximate-null family

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/CanonicalCFCRootQuantitativeNullFamily.lean'
      - '.github/workflows/v007-cfc-root-quantitative-approx-null.yml'
  workflow_dispatch:

jobs:
  canonical-cfc-quantitative-null:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version
      - name: Restore pinned Mathlib cache
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel check and axiom audit quantitative canonical CFC null vectors
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.CanonicalCFCRootQuantitativeNullFamily 2>&1 | tee /tmp/v007-cfc-quantitative-null.log
          lake env lean -M16768 GegenbauerFock/CanonicalCFCRootQuantitativeNullFamily.lean 2>&1 | tee -a /tmp/v007-cfc-quantitative-null.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-cfc-quantitative-null.log; then
            echo '::error::Forbidden axiom in quantitative canonical CFC root null theorem.'
            exit 1
          fi
          grep -F "canonical_cfc_sqrt_quantitative_normalized_approximate_null_family' depends on axioms:" /tmp/v007-cfc-quantitative-null.log
          echo 'V007 quantitative canonical CFC square root null theorem kernel-certified and audited.'
