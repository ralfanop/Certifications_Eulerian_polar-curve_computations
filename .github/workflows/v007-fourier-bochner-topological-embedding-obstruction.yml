name: V007 genuine Fourier continuous injective but no continuous inverse

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireFourierTopologicalEmbeddingObstruction.lean'
      - '.github/workflows/v007-fourier-bochner-topological-embedding-obstruction.yml'
  workflow_dispatch:

jobs:
  entire-fourier-topological-instability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib and cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile Fourier forward continuity, injectivity and inverse obstruction
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireFourierTopologicalEmbeddingObstruction 2>&1 | tee /tmp/v007-fourier-topological-obstruction-build.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireFourierTopologicalEmbeddingObstruction.lean 2>&1 | tee /tmp/v007-fourier-topological-obstruction-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-fourier-topological-obstruction-build.log /tmp/v007-fourier-topological-obstruction-axioms.log; then
            echo "::error::Forbidden axiom in Fourier topological inverse obstruction"
            exit 1
          fi
          for name in ultraspherical_fourierBochner_productTopology_continuous ultraspherical_fourierBochner_productTopology_injective ultraspherical_fourierBochner_continuous_injective_inverse_unstable; do
            grep -F "${name}' depends on axioms:" /tmp/v007-fourier-topological-obstruction-axioms.log
          done
          echo 'V007 Fourier forward continuity, injectivity and inverse obstruction kernel audit successful.'
