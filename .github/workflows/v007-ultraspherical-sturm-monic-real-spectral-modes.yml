name: V007 constructed Gegenbauer modes in actual closed L2 spectrum

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonicRealSpectralModes.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonicEigenPolynomial.lean'
      - '.github/workflows/v007-ultraspherical-sturm-monic-real-spectral-modes.yml'
  workflow_dispatch:

jobs:
  genuine-geg-modes:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit all-degree concrete L2 Gegenbauer eigenmodes
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleMonicRealSpectralModes 2>&1 | tee /tmp/v007-monic-real-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleMonicRealSpectralModes.lean 2>&1 | tee /tmp/v007-monic-real-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-monic-real-build.log /tmp/v007-monic-real-axioms.log; then
            echo '::error::Forbidden axiom in all-degree concrete Sturm spectral modes.'
            exit 1
          fi
          grep -F "sturmMonicEigenCandidate_closed_domain_eigen' depends on axioms:" /tmp/v007-monic-real-axioms.log
          grep -F "sturmMonicEigenCandidate_full_resolvent_diagonal' depends on axioms:" /tmp/v007-monic-real-axioms.log
          echo 'V007 all-degree real Gegenbauer spectral modes certified.'
