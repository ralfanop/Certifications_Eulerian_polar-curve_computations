name: V007 true bilateral Gram nonreal resolvent certificate

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/TwoSidedGramNonrealResolvent.lean'
      - 'lean/GegenbauerFock/TwoSidedGramNegativeResolvent.lean'
      - 'lean/GegenbauerFock/TwoSidedGramPositiveSpectrum.lean'
      - '.github/workflows/gegenbauer-fock-gram-nonreal-resolvent.yml'
  workflow_dispatch:

jobs:
  nonreal-resolvent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4 with retries
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for i in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((i * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for i in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((i * 8))"
          done
          test "$ok" -eq 1
      - name: Restore exact pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile global nonreal resolvent theorem and inspect axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.TwoSidedGramNonrealResolvent 2>&1 | tee /tmp/v007-nonreal-resolvent.log
          grep -qF "two_sided_gram_nonreal_mem_resolventSet' depends on axioms:" /tmp/v007-nonreal-resolvent.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-nonreal-resolvent.log; then
            echo '::error::Nonstandard axioms in the nonreal resolvent certificate.'
            exit 1
          fi
          echo 'Certified all nonreal complex parameters in both true Gram resolvents.'
