name: V007 weighted Schatten Young true CFC trace norm

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/PhyslibHSProductTraceNormWeightedYoung.lean'
      - '.github/workflows/gegenbauer-fock-physlib-hs-tracenorm-weighted.yml'
  workflow_dispatch:

jobs:
  hs-weighted-young:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt*8))"
          done
          test "$installed" = 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt*8))"
          done
          test "$ready" = 1
      - name: Resolve pinned Mathlib revision
        working-directory: lean
        run: lake update
      - name: Fetch pinned Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Compile real-scale CFC Schatten Young inequality
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.PhyslibHSProductTraceNormWeightedYoung 2>&1 | tee /tmp/gf-hs-trace-weighted.log
          grep -F "ProbabilisticTheory.weighted_young_traceNorm_mul_twoHilbertSchmidt' depends on axioms:" /tmp/gf-hs-trace-weighted.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/gf-hs-trace-weighted.log; then
            echo '::error::Nonstandard axiom.'
            exit 1
          fi
          echo 'Weighted Young true trace-norm inequality built and audited.'
