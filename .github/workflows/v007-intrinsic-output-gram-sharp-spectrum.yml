name: V007 true holomorphic output sharp spectral band and essential zero

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireOutputGramSharpSpectrum.lean'
      - '.github/workflows/v007-intrinsic-output-gram-sharp-spectrum.yml'
  workflow_dispatch:

jobs:
  holomorphic-output-sharp-band:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Verify true output sharp spectral band and Fredholm singleton
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireOutputGramSharpSpectrum 2>&1 | tee /tmp/v007-true-output-sharp-spectrum.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireOutputGramSharpSpectrum.lean 2>&1 | tee -a /tmp/v007-true-output-sharp-spectrum.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-true-output-sharp-spectrum.log; then
            echo "::error::Forbidden axiom in true holomorphic output sharp spectral theorem"
            exit 1
          fi
          grep -F "C_intrinsicEntire_outputGram_spectral_value_sharp_bound' depends on axioms:" /tmp/v007-true-output-sharp-spectrum.log
          grep -F "C_intrinsicEntire_outputGram_sharp_spectrum_and_essential_zero' depends on axioms:" /tmp/v007-true-output-sharp-spectrum.log
          echo 'V007 genuine output sharp spectral band and essential singleton audited.'
