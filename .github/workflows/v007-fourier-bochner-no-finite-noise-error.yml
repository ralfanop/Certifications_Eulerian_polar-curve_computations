name: V007 no finite global Fourier reconstruction error under noise

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireFourierNoFiniteNoiseError.lean'
      - '.github/workflows/v007-fourier-bochner-no-finite-noise-error.yml'
  workflow_dispatch:

concurrency:
  group: v007-fourier-no-finite-noise-error-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fourier-no-finite-noise-error:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib and cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile unbounded Fourier noise ambiguity and global minimax error
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireFourierNoFiniteNoiseError 2>&1 | tee /tmp/v007-fourier-no-finite-error-build.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireFourierNoFiniteNoiseError.lean 2>&1 | tee /tmp/v007-fourier-no-finite-error-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-fourier-no-finite-error-build.log /tmp/v007-fourier-no-finite-error-axioms.log; then
            echo "::error::Forbidden axiom in global noisy Fourier inverse obstruction"
            exit 1
          fi
          for name in ultraspherical_fourierBochner_arbitrarilyLarge_approximateNull ultraspherical_fourierBochner_noFiniteGlobalNoiseError; do
            grep -F "${name}' depends on axioms:" /tmp/v007-fourier-no-finite-error-axioms.log
          done
          echo 'V007 no finite global Fourier reconstruction error: Lean and axiom audit successful.'
