name: V007 true real Sturm positive shifted unique polynomial-domain solutions

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealPositiveShiftUniquePreimage.lean'
      - '.github/workflows/v007-ultraspherical-sturm-real-positive-shift-unique.yml'
  workflow_dispatch:

jobs:
  actual-positive-shift-unique:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit exact unique real polynomial positive shifted solutions
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealPositiveShiftUniquePreimage 2>&1 | tee /tmp/v007-real-sturm-positive-unique-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealPositiveShiftUniquePreimage.lean 2>&1 | tee /tmp/v007-real-sturm-positive-unique-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-sturm-positive-unique-build.log /tmp/v007-real-sturm-positive-unique-axioms.log; then
            echo '::error::Forbidden axiom in exact real Sturm polynomial resolvent uniqueness.'
            exit 1
          fi
          grep -F "sturmRealPartialPositiveShift_unique_polynomial_preimage' depends on axioms:" /tmp/v007-real-sturm-positive-unique-axioms.log
          grep -F "sturmRealPartialPositiveShift_unique_domain_preimage' depends on axioms:" /tmp/v007-real-sturm-positive-unique-axioms.log
          echo 'V007 true real Sturm polynomial shifted equation unique solution certified for all t>0.'
