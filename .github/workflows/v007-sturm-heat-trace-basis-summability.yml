name: V007 heat actual basis trace and HS summability

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatTraceBasisSummable.lean'
      - '.github/workflows/v007-sturm-heat-trace-basis-summability.yml'
  workflow_dispatch:

jobs:
  heat-trace-hs-basis-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel check and trace-HS basis axiom audit
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealHeatTraceBasisSummable 2>&1 | tee /tmp/v007-heat-trace-basis-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatTraceBasisSummable.lean 2>&1 | tee /tmp/v007-heat-trace-basis-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-heat-trace-basis-build.log /tmp/v007-heat-trace-basis-axioms.log; then
            echo '::error::Forbidden axiom in V007 heat trace and HS basis certificate.'
            exit 1
          fi
          grep -F "sturmRealHeat_actual_basis_trace_eq_spectral_series' depends on axioms:" /tmp/v007-heat-trace-basis-axioms.log
          grep -F "sturmRealHeat_isHS_on_actual_basis' depends on axioms:" /tmp/v007-heat-trace-basis-axioms.log
          echo 'V007 heat trace and HS basis criteria audited.'
