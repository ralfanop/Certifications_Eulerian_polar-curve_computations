name: "Manuscript 14.119 Priority 3 — genuine S1 compression tails"

on:
  push:
    branches:
      - main
      - manuscript14-priority3-S1-compression-tail-20261109
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3DirichletDiagonal.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3TraceClassModel.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3RankOneS1.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3S1Truncation.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - '.github/workflows/manuscript14-priority3-S1-compression.yml'
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3DirichletDiagonal.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3TraceClassModel.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3RankOneS1.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3S1Truncation.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - '.github/workflows/manuscript14-priority3-S1-compression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Kernel check actual rank-one trace norms and genuine S1 tails
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build existing V007 CFC trace-class dependencies
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealComplexPositiveSpectralAutomaticTraceClassBridge GegenbauerFock.PositiveTraceDiagonalSpectralBridge GegenbauerFock.PhyslibTraceClassSeriesTailEstimate 2>&1 |
            tee /tmp/priority3-S1-V007.log
      - name: Compile genuine operator, trace class and rank-one norm
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          for f in Section67ScalarCertificate V14119Priority3DirichletDiagonal V14119Priority3TraceClassModel V14119Priority3RankOneS1 V14119Priority3S1Truncation; do
            lake env lean -M16768 -o ".lake/build/lib/lean/SpecialImaginaryPoint/$f.olean" \
              "SpecialImaginaryPoint/$f.lean" 2>&1 |
              tee "/tmp/priority3-S1-$f.log"
          done
      - name: Audit three new theorems and all Lean axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          log=(pathlib.Path("/tmp/priority3-S1-V14119Priority3RankOneS1.log").read_text()
             + "\n" + pathlib.Path("/tmp/priority3-S1-V14119Priority3S1Truncation.log").read_text())
          prefix="Manuscript14Priority3.TraceClassModel."
          required=[
             "term_diagonal","term_isTraceClass","term_traceNorm_eq",
             "S1term_traceNorm_eq","S1term_norm_summable","S1term_partial_sum_operator",
             "S1sum_operator_eq_inverse","S1_truncation_traceNorm_le_tail",
             "S1_truncation_traceNorm_tendsto_zero","inverse_operatorNorm_error_le_tail"
          ]
          found={}
          for match in re.finditer(
              r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms",log,re.MULTILINE):
              found[match.group(1) or match.group(3)] = {
                s.strip() for s in (match.group(2) or "").split(",") if s.strip()
              }
          allowed={"propext","Quot.sound","Classical.choice"}
          for suffix in required:
              name=prefix+suffix
              assert name in found, f"Missing kernel axiom report: {name}"
              assert found[name] <= allowed, f"Nonstandard axioms: {name} {found[name] - allowed}"
              print(name,sorted(found[name]))
          assert "sorryAx" not in log and "Lean.ofReduceBool" not in log
          assert not re.search(r"\.lean:\d+:\d+: error",log)
          print("SUCCESS: ten genuine CFC S1 spectral inverse and compression-tail results")
          PY
      - name: Upload Lean compilation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priority3-rankone-S1-kernel-logs
          path: /tmp/priority3-S1-*.log
          if-no-files-found: ignore
