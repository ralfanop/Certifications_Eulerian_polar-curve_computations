name: V007 actual complex-linear Sturm heat on weighted L2

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleActualComplexHeatCLM.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleActualComplexHeatRealExtension.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleActualComplexLpDecomposition.lean'
      - '.github/workflows/v007-actual-complex-heat-clm.yml'
  workflow_dispatch:

jobs:
  complex-linear-actual-heat:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile true complex-linear Sturm heat and check axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleActualComplexHeatCLM 2>&1 | tee /tmp/v007-complex-heat-clm-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleActualComplexHeatCLM.lean 2>&1 | tee /tmp/v007-complex-heat-clm-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-complex-heat-clm-build.log /tmp/v007-complex-heat-clm-axioms.log; then
            echo '::error::Forbidden axiom in genuine complex-linear Sturm heat.'
            exit 1
          fi
          grep -F "sturmActualComplexHeatRealCLM_I_smul' depends on axioms:" /tmp/v007-complex-heat-clm-axioms.log
          grep -F "sturmActualComplexHeatCLM_embedded_real' depends on axioms:" /tmp/v007-complex-heat-clm-axioms.log
          echo 'V007 genuine complex Sturm heat operator audited.'
