name: V007 sharp Poincare on actual closed Sturm domain

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonicClosedPoincare.lean'
      - '.github/workflows/v007-ultraspherical-sturm-closed-poincare.yml'
  workflow_dispatch:

jobs:
  closed-sturm-poincare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit sharp Poincare on canonical closed Sturm domain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleMonicClosedPoincare 2>&1 | tee /tmp/v007-closed-poincare-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleMonicClosedPoincare.lean 2>&1 | tee /tmp/v007-closed-poincare-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-closed-poincare-build.log /tmp/v007-closed-poincare-axioms.log; then
            echo '::error::Forbidden axiom in canonical closed Sturm Poincare.'
            exit 1
          fi
          grep -F "sturmMonic_realL2_closed_spectral_energy_summable' depends on axioms:" /tmp/v007-closed-poincare-axioms.log
          grep -F "sturmMonic_realL2_closed_spectral_poincare' depends on axioms:" /tmp/v007-closed-poincare-axioms.log
          echo 'V007 sharp canonical closed Sturm Poincare: kernel-certified.'
