name: Shared core det4 fourth derivative
on:
  pull_request:
    paths:
      - 'lean/SharedCore/Det4FourthDerivative.lean'
      - '.github/workflows/shared-det4-fourth-derivative.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Lean and Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          grep -F '0272bbe1c093d038d7257ab15306abd58245f9ff' lakefile.toml
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile and audit exact declarations
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SharedCore
          lake env lean -o .lake/build/lib/lean/SharedCore/Det4ZetaMoments.olean SharedCore/Det4ZetaMoments.lean
          lake env lean -o .lake/build/lib/lean/SharedCore/Det4ComplexProduct.olean SharedCore/Det4ComplexProduct.lean
          lake env lean SharedCore/Det4FourthDerivative.lean 2>&1 | tee /tmp/det4-fourth-derivative-lean.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/det4-fourth-derivative-lean.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/det4-fourth-derivative-lean.log').read_text()
          for suffix in ["reduced_coeff_norm","reduced_coeff_summable_norm","reduced_series_radius","reduced_analytic","global_log_factor","reduced_at_zero","global_log_zero","global_log_analytic","exp_quadratic_factor","determinant_analytic_factor","determinant_analytic_at_zero","determinant_value_at_zero","determinant_derivatives","determinant_fourth_derivative","log_fourth_derivative"]:
              name = 'SharedCore.Det4Derivative.'+suffix
              matches = re.findall(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", log, re.S)
              assert matches or ("'"+name+"' does not depend on any axioms") in log, name
              for match in matches:
                  assert {x.strip() for x in match.split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'}
              print('AXIOM AUDIT SUCCESS:',name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-det4-fourth-derivative-audit
          path: /tmp/det4-fourth-derivative-lean.log
