name: M12 actual scaled Fock integrand domination
on:
  pull_request:
    paths:
      - 'lean/EulerianGrothendieck/CriticalWindowFockDomination.lean'
      - '.github/workflows/m12-critical-fock-domination.yml'
  workflow_dispatch:
jobs:
  fockdomination:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check the scaled Fock integrand
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          lake exe cache get
          mkdir -p .lake/build/lib/lean
          for module in CriticalWindowQuartic CriticalWindowGlobalMGF CriticalWindowComplexMGF; do
            lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean"
          done
          lake env lean CriticalWindowFockDomination.lean 2>&1 | tee /tmp/m12-critical-fock-domination.log
          git rev-parse HEAD
      - name: Strict axiom audit
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/m12-critical-fock-domination.log').read_text()
          assert ': error' not in text and 'sorryAx' not in text and 'Lean.ofReduceBool' not in text
          names = ['fockProfile_eq_csinhc', 'fockProfile_eq_mgf', 'quartic_le_gaussian', 'scaledIntegrand_le_majorant', 'majorant_integrable', 'gaussian_factor']
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for name in names:
              full = 'M12FockDomination.' + name
              m = re.search(r"'" + re.escape(full) + r"' depends on axioms: \[([^\]]*)\]", text)
              if m:
                  assert {x.strip() for x in m.group(1).split(',') if x.strip()} <= allowed, full
              else:
                  assert "'" + full + "' does not depend on any axioms" in text, full
              print('AXIOM AUDIT SUCCESS', full)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-critical-fock-domination-audit
          path: /tmp/m12-critical-fock-domination.log
