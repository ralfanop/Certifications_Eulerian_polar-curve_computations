name: V007 genuine real Sturm Yosida contractions and domain error
on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealYosidaContraction.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealYosidaStrongApproximation.lean'
      - '.github/workflows/v007-ultraspherical-sturm-real-yosida-contraction.yml'
  workflow_dispatch:
jobs:
  closed-sturm-yosida-contraction:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit full-L2 Sturm Yosida contractions
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealYosidaContraction 2>&1 | tee /tmp/v007-sturm-yosida-build.log
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealYosidaStrongApproximation 2>&1 | tee /tmp/v007-sturm-yosida-strong-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealYosidaContraction.lean 2>&1 | tee /tmp/v007-sturm-yosida-axioms.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealYosidaStrongApproximation.lean 2>&1 | tee /tmp/v007-sturm-yosida-strong-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-sturm-yosida-build.log /tmp/v007-sturm-yosida-axioms.log /tmp/v007-sturm-yosida-strong-build.log /tmp/v007-sturm-yosida-strong-axioms.log; then
            echo '::error::Forbidden axiom in real Sturm Yosida contraction.'
            exit 1
          fi
          grep -F "sturmRealYosidaContraction_norm_le' depends on axioms:" /tmp/v007-sturm-yosida-axioms.log
          grep -F "sturmRealYosidaContraction_on_closed_domain' depends on axioms:" /tmp/v007-sturm-yosida-axioms.log
          grep -F "sturmRealYosidaContraction_closed_domain_error_le' depends on axioms:" /tmp/v007-sturm-yosida-axioms.log
          grep -F "sturmRealYosidaContraction_dense_error_bound' depends on axioms:" /tmp/v007-sturm-yosida-strong-axioms.log
          grep -F "sturmRealYosidaContraction_strong_approximation' depends on axioms:" /tmp/v007-sturm-yosida-strong-axioms.log
          echo 'V007 full-L2 Sturm Yosida contractions, error bounds and strong approximation kernel-certified.'
