name: M12 quartic Stieltjes Lean and Arb
on:
  pull_request:
    paths:
      - 'lean/EulerianGrothendieck/QuarticStieltjes20261128.lean'
      - 'scripts/m12_quartic_stieltjes_arb_20261128.py'
      - '.github/workflows/m12-quartic-stieltjes-20261128.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Lean and exact-head audit
        working-directory: lean
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
          mkdir -p .lake/build/lib/lean/{Manuscript13,EulerianGrothendieck}
          for m in Manuscript13/EllisFourier20261124 EulerianGrothendieck/CriticalWindowGammaVacuum Manuscript13/CrossThroatElliptic20261125 Manuscript13/CrossThroatLemniscate20261126; do
            lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean"
          done
          lake env lean EulerianGrothendieck/QuarticStieltjes20261128.lean 2>&1 | tee /tmp/m12-stieltjes-lean.log
          python - <<'PY'
          import re
          s=open('/tmp/m12-stieltjes-lean.log').read()
          assert not re.search(r'sorryAx|Lean\.ofReduceBool|declaration uses|: error:',s)
          a=re.findall(r"^'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",s,re.M)
          assert len(a)==len({n for n,_ in a})==13,a
          for n,ax in a:
              assert set(filter(None,(v.strip() for v in ax.split(',')))) <= {'propext','Classical.choice','Quot.sound'},(n,ax)
          print('13/13 declarations audited; analytic premises remain explicit')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-stieltjes-lean
          path: /tmp/m12-stieltjes-lean.log
  arb:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install python-flint==0.8.0
      - run: python scripts/m12_quartic_stieltjes_arb_20261128.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-stieltjes-arb
          path: m12-stieltjes-arb/
