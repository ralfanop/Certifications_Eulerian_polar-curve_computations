name: "Priority 3 — contractive complex Euclidean compression coordinates"
on:
  push:
    branches:
      - manuscript14-priority3-compressed-euclidean-coordinates-20261111
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3CompressedEuclideanCoordinates.lean'
      - '.github/workflows/manuscript14-priority3-compressed-euclidean-coordinates.yml'
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3CompressedEuclideanCoordinates.lean'
      - '.github/workflows/manuscript14-priority3-compressed-euclidean-coordinates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile coordinate contraction and Gram identity
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -M16768 SpecialImaginaryPoint/V14119Priority3CompressedEuclideanCoordinates.lean 2>&1 | tee /tmp/p3-euclidean-coordinates.log
      - name: Audit three named kernel declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          log=pathlib.Path("/tmp/p3-euclidean-coordinates.log").read_text()
          prefix="Manuscript14Priority3.CompressedEuclideanCoordinates."
          names=["coefficients_norm_sq_le","coefficients_norm_le","coefficients_inner_eq_truncated"]
          reports={}
          for m in re.finditer(r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms",log,re.MULTILINE):
            reports[m.group(1) or m.group(3)]={a.strip() for a in (m.group(2) or "").split(",") if a.strip()}
          allowed={"propext","Quot.sound","Classical.choice"}
          for name in names:
            key=prefix+name
            assert key in reports, f"Missing kernel audit: {key}"
            assert reports[key]<=allowed, f"Nonstandard axioms in {key}: {reports[key]-allowed}"
          assert "sorryAx" not in log and "Lean.ofReduceBool" not in log
          assert not re.search(r"\.lean:\d+:\d+: error",log)
          print("SUCCESS: contractive complex finite Euclidean coordinate vectors")
          PY
      - name: Upload Lean log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priority3-compressed-euclidean-coordinates-log
          path: /tmp/p3-euclidean-coordinates.log
          if-no-files-found: ignore
