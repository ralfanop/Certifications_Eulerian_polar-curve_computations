name: V007 Section 6 statements in manuscript form (13, Thm 6.2, 6.3, Prop 6.5)
on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/Section6Corollaries.lean'
      - '.github/workflows/v007-section6-corollaries.yml'
  workflow_dispatch:
jobs:
  section6-corollaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit V007 Section 6 statements in manuscript form (13, Thm 6.2, 6.3, Prop 6.5)
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.Section6Corollaries 2>&1 | tee /tmp/section6-corollaries-build.log
          lake env lean -M16768 GegenbauerFock/Section6Corollaries.lean 2>&1 | tee /tmp/section6-corollaries-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/section6-corollaries-build.log /tmp/section6-corollaries-axioms.log; then
            echo '::error::Forbidden axiom in Section6Corollaries.'
            exit 1
          fi
          grep -F "GegenbauerFock.Section6.C_intrinsicEntire_coeff' depends on axioms:" /tmp/section6-corollaries-axioms.log
          grep -F "GegenbauerFock.Section6.C_intrinsicEntire_adjoint_ae' depends on axioms:" /tmp/section6-corollaries-axioms.log
          grep -F "GegenbauerFock.Section6.proposition_6_5' depends on axioms:" /tmp/section6-corollaries-axioms.log
          echo 'V007 Section 6 statements in manuscript form (13, Thm 6.2, 6.3, Prop 6.5): kernel-certified.'
