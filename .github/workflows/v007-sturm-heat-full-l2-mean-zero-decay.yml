name: V007 sharp exponential heat decay on full mean-zero L2

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatLimitMeanZeroDecay.lean'
      - '.github/workflows/v007-sturm-heat-full-l2-mean-zero-decay.yml'
  workflow_dispatch:

jobs:
  heat-full-mean-zero-decay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and kernel audit full mean-zero heat exponential bound
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealHeatLimitMeanZeroDecay 2>&1 | tee /tmp/v007-heat-meanzero-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatLimitMeanZeroDecay.lean 2>&1 | tee /tmp/v007-heat-meanzero-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-heat-meanzero-build.log /tmp/v007-heat-meanzero-axioms.log; then
            echo '::error::Forbidden axiom in full-L2 mean-zero heat decay theorem.'
            exit 1
          fi
          grep -F "sturmRealHeatLimitCLM_mean_zero_exponential_decay' depends on axioms:" /tmp/v007-heat-meanzero-axioms.log
          echo 'V007 sharp full weighted-L2 mean-zero heat exponential decay kernel-certified.'
