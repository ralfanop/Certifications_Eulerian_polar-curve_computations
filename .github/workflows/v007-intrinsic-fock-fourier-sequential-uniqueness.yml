name: V007 countable convergent Fourier–Bochner sample uniqueness

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireFourierSequentialUniqueness.lean'
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireFourierAccumulationUniqueness.lean'
      - '.github/workflows/v007-intrinsic-fock-fourier-sequential-uniqueness.yml'
  workflow_dispatch:

jobs:
  countable-convergent-samples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib and cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile sequential sampling uniqueness and audit three axioms
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireFourierSequentialUniqueness 2>&1 | tee /tmp/v007-fourier-sequential-build.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireFourierSequentialUniqueness.lean 2>&1 | tee /tmp/v007-fourier-sequential-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-fourier-sequential-build.log /tmp/v007-fourier-sequential-axioms.log; then
            echo "::error::Forbidden axiom in sequential Fourier uniqueness"
            exit 1
          fi
          for name in range_has_accumulation_of_tendsto_avoiding_limit ultraspherical_fourierBochner_injective_of_convergent_samples C_intrinsicEntire_crossAlpha_injective_of_convergent_samples; do
            grep -F "${name}' depends on axioms:" /tmp/v007-fourier-sequential-axioms.log
          done
          echo 'V007 convergent sequential Fourier sampling: proof and axiom audit successful.'
