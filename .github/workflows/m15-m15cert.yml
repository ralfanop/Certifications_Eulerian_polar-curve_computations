name: M15 M15Cert library and 14-constant Arb certificate
# Independent re-verification of two archives of certifications/manuscript15:
# the Lean 4 library LEAN/M15Cert (seven modules, Mathlib tag v4.35.0-rc3) is
# rebuilt from source, its 58 axiom lines must equal the archived output, and
# leanchecker is run on the seven modules; the FLINT/Arb certificate at
# 3600000 bits is recomputed and its fourteen 1000001-decimal files must be
# identical to the archived ones, then cross-checked with mpmath.
on:
  pull_request:
    paths:
      - 'certifications/manuscript15/LEAN/M15Cert/**'
      - 'certifications/manuscript15/ARB/Catenoid-Transport-Gibbs/**'
      - 'certifications/manuscript15/ARB/M15_constants_FLINT_Arb_3600000bits_1000001digits.zip'
      - '.github/workflows/m15-m15cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MODS: Kernel PrincipalRoot Stability TriangularDensity Catenoid CarliniLaplace EllisMetric
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checksums of the archive
        working-directory: certifications/manuscript15
        run: sha256sum -c SHA256SUMS.txt
      - name: Install elan
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Pinned toolchain and Mathlib cache
        working-directory: certifications/manuscript15/LEAN/M15Cert
        run: |
          set -euo pipefail
          cat lean-toolchain
          lean --version
          grep -F 'c55e6e786f49471c72fbddbec5415808896aec1e' lake-manifest.json
          lake exe cache get
      - name: Build the seven modules from source
        working-directory: certifications/manuscript15/LEAN/M15Cert
        run: |
          set -euo pipefail
          mkdir -p /tmp/m15cert
          lake build 2>&1 | tee /tmp/m15cert/build.log
          ! grep -n -E "declaration uses 'sorry'|^error|^warning" /tmp/m15cert/build.log
          ! grep -n -E "\b(sorry|admit|native_decide|unsafe)\b|^axiom " M15Cert.lean M15Cert/*.lean
          echo "BUILD SUCCESS: 7 modules, no sorry, admit, native_decide, unsafe or axiom declaration"
      - name: Axioms of the 58 audited theorems, compared with the archived output
        working-directory: certifications/manuscript15/LEAN/M15Cert
        run: |
          set -euo pipefail
          { lean --version; lake env lean M15Cert/Axioms.lean; } > /tmp/m15cert/axioms.txt 2>&1
          python3 - <<'PY'
          import re
          from pathlib import Path
          new = [l for l in Path('/tmp/m15cert/axioms.txt').read_text().splitlines() if l.strip()]
          old = [l for l in Path('axioms_output.txt').read_text().splitlines() if l.strip()]
          assert new == old, 'differs from axioms_output.txt'
          lines = [l for l in new if 'depends on axioms' in l]
          assert len(lines) == 58, len(lines)
          for l in lines:
              m = re.fullmatch(r"'(.+)' depends on axioms: \[([^\]]*)\]", l)
              assert m, l
              assert {a.strip() for a in m.group(2).split(',')} <= {'propext', 'Classical.choice', 'Quot.sound'}, l
          print('AXIOM AUDIT SUCCESS: 58 theorems, standard axioms only, identical to axioms_output.txt')
          PY
      - name: leanchecker on the seven modules
        working-directory: certifications/manuscript15/LEAN/M15Cert
        run: |
          set -euo pipefail
          : > /tmp/m15cert/leanchecker.txt
          for m in $MODS; do
            lake env leanchecker M15Cert.$m >> /tmp/m15cert/leanchecker.log 2>&1
            echo "leanchecker M15Cert.$m : exit 0" | tee -a /tmp/m15cert/leanchecker.txt
          done
          lean --version >> /tmp/m15cert/leanchecker.txt
          diff /tmp/m15cert/leanchecker.txt leanchecker_output.txt
          echo "LEANCHECKER SUCCESS: 7 modules, identical to leanchecker_output.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15cert-lean-logs
          path: /tmp/m15cert
  arb:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Checksums of the archive and of the archived decimal files
        working-directory: certifications/manuscript15
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          mkdir -p /tmp/m15c/archived
          unzip -q ARB/M15_constants_FLINT_Arb_3600000bits_1000001digits.zip -d /tmp/m15c/archived
          (cd /tmp/m15c/archived/digits && sha256sum -c "$GITHUB_WORKSPACE/certifications/manuscript15/ARB/Catenoid-Transport-Gibbs/digits_SHA256SUMS.txt")
      - name: Recompute the certificate at 3600000 bits and compare the decimal files
        working-directory: certifications/manuscript15/ARB/Catenoid-Transport-Gibbs
        run: |
          set -euo pipefail
          python -m pip install python-flint==0.9.0 mpmath==1.4.1
          python m15_arb_certify.py --out /tmp/m15c/run | tee /tmp/m15c/run_stdout.txt
          grep -E '^ALL_OK True ' /tmp/m15c/run_stdout.txt
          test "$(ls /tmp/m15c/run/digits/*.txt | wc -l)" = 14
          for f in /tmp/m15c/archived/digits/*.txt; do cmp "$f" "/tmp/m15c/run/digits/$(basename "$f")"; done
          echo "ARB SUCCESS: 14 constants, 1000001 correctly rounded decimals, identical to the archived files"
      - name: Cross-check with mpmath (19998 decimals)
        working-directory: certifications/manuscript15/ARB/Catenoid-Transport-Gibbs
        run: |
          set -euo pipefail
          python m15_mpmath_crosscheck.py /tmp/m15c/run | tee /tmp/m15c/mpmath.txt
          grep -Fx 'ALL_AGREE True' /tmp/m15c/mpmath.txt
          rm -rf /tmp/m15c/archived /tmp/m15c/run/digits
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15cert-arb-logs
          path: /tmp/m15c
