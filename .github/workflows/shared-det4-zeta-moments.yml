name: Shared core exact zeta moments and det4 majorant
on:
  pull_request:
    paths:
      - 'lean/SharedCore/Det4ZetaMoments.lean'
      - '.github/workflows/shared-det4-zeta-moments.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Lean and Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          grep -F '0272bbe1c093d038d7257ab15306abd58245f9ff' lakefile.toml
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Compile and audit exact declarations
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean SharedCore/Det4ZetaMoments.lean 2>&1 | tee /tmp/det4-zeta-moments-lean.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/det4-zeta-moments-lean.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/det4-zeta-moments-lean.log').read_text()
          for suffix in ["zeta_term_summable","zeta_shifted_sum","spectral_term_difference","spectral_term_nonneg","spectral_term_summable","moment_zeta_difference","real_zeta_series_eq_riemannZeta","moment_riemannZeta_difference","moment_positive","fourth_shell_summable","power_shell_le_geometric","power_shell_summable","power_moment_le_geometric","power_moment_nonneg","fourth_moment_identification","taylor_term_le_geometric","taylor_majorant_summable","taylor_majorant_bound","power_shell_eq_spectral","power_moment_identification"]:
              name = 'SharedCore.Det4Zeta.'+suffix
              matches = re.findall(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", log, re.S)
              assert matches or ("'"+name+"' does not depend on any axioms") in log, name
              for match in matches:
                  assert {x.strip() for x in match.split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'}
              print('AXIOM AUDIT SUCCESS:',name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-det4-zeta-moments-audit
          path: /tmp/det4-zeta-moments-lean.log
