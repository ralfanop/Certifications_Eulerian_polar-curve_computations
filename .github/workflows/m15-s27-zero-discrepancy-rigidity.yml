name: "M15 S2.7 zero discrepancy rigidity — Lean"
on:
  push:
    branches:
      - draft/m15-s27-zero-discrepancy-rigidity-20261114
  pull_request:
    paths:
      - 'lean/Manuscript15/Section27ZeroDiscrepancyRigidity.lean'
      - '.github/workflows/m15-s27-zero-discrepancy-rigidity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile theorem and audit axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build Manuscript15.Section27ZeroCostNormalization
          lake env lean -M16768 Manuscript15/Section27ZeroDiscrepancyRigidity.lean 2>&1 | tee /tmp/zero-rigidity.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:' /tmp/zero-rigidity.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/zero-rigidity.log').read_text()
          target = 'Manuscript15.Section27.discrepancy_eq_zero_of_zero_cost_bound'
          hits = re.findall(r"'" + re.escape(target) + r"' depends on axioms: \[([^\]]*)\]", log, re.S)
          assert len(hits) == 1, (target, 'missing/duplicate axiom audit')
          used = {s.strip() for s in hits[0].split(',') if s.strip()}
          assert used <= {'propext', 'Classical.choice', 'Quot.sound'}, used
          print('AXIOM AUDIT SUCCESS:', target, sorted(used))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-zero-rigidity-lean-logs
          path: /tmp/*.log
