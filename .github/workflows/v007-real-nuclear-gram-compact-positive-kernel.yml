name: V007 universal real nuclear Gram compact positive kernel

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/RealNuclearGramCompactPositiveKernel.lean'
      - '.github/workflows/v007-real-nuclear-gram-compact-positive-kernel.yml'
  workflow_dispatch:

jobs:
  real-gram-compact-positive:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel check real nuclear Gram and audit theorem axioms
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealNuclearGramCompactPositiveKernel 2>&1 | tee /tmp/v007-real-nuclear-gram.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-nuclear-gram.log; then
            echo '::error::Forbidden axiom in real nuclear Gram.'
            exit 1
          fi
          for theorem in HasRealNuclearRankOneSeries.gram_isCompactOperator realNuclearGram_isSelfAdjoint realNuclearGram_inner_eq_norm_sq realNuclearGram_inner_nonneg realNuclearGram_ker_eq realNuclearGram_norm_eq_sq; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-real-nuclear-gram.log
          done
          echo 'Real nuclear compact positive Gram with exact kernel certified.'
