name: V007 inverse discontinuity on actual real Sturm resolvent range

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealResolventInverseOnRange.lean'
      - '.github/workflows/v007-ultraspherical-sturm-resolvent-inverse-on-range.yml'
  workflow_dispatch:

jobs:
  sturm-real-resolvent-inverse-range-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build and audit inverse on actual range
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealResolventInverseOnRange 2>&1 | tee /tmp/v007-resinverse-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealResolventInverseOnRange.lean 2>&1 | tee /tmp/v007-resinverse-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-resinverse-build.log /tmp/v007-resinverse-axioms.log; then
            echo '::error::Forbidden axiom in inverse on range.'
            exit 1
          fi
          grep -F "sturmRealResolvent_inverse_on_range_discontinuous_at_zero' depends on axioms:" /tmp/v007-resinverse-axioms.log
          echo 'V007 real resolvent inverse on range kernel-audited.'
