name: M16 Krein domains Lean exact head
on:
  pull_request:
    paths:
      - 'lean/M16KreinDomains.lean'
      - '.github/workflows/m16-krein-domains-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore pinned Lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Exact head and kernel check
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          lake exe cache get
          lake env lean M16KreinDomains.lean 2>&1 | tee /tmp/m16-krein-domains.log
      - name: Strict declaration audit
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          src=Path('lean/M16KreinDomains.lean').read_text()
          data=Path('/tmp/m16-krein-domains.log').read_text()
          assert not re.search(r'\b(sorry|admit|axiom|opaque|native_decide)\b',src)
          assert ': error:' not in data and 'sorryAx' not in data and 'Lean.ofReduceBool' not in data
          names=re.findall(r'^#print axioms (\S+)$',src,re.M)
          assert len(names)==7
          for name in names:
              name='M16KreinDomains.'+name
              m=re.search(r"'"+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]",data)
              if m:
                  assert {x.strip() for x in m.group(1).split(',') if x.strip()}<={'propext','Classical.choice','Quot.sound'},name
              else:
                  assert "'"+name+"' does not depend on any axioms" in data,name
              print('AXIOM AUDIT SUCCESS',name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m16-krein-domains-audit
          path: /tmp/m16-krein-domains.log
