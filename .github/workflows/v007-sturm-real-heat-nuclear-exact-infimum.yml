name: V007 exact real heat S1 nuclear infimum

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatNuclearExactInfimum.lean'
      - '.github/workflows/v007-sturm-real-heat-nuclear-exact-infimum.yml'
  workflow_dispatch:

jobs:
  heat-real-nuclear-exact-infimum:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned Mathlib dependencies
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Certify exact real heat nuclear projective S1 norm
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealHeatNuclearExactInfimum 2>&1 | tee /tmp/v007-heat-real-exact-infimum.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-heat-real-exact-infimum.log; then
            echo '::error::Forbidden axiom in exact real heat S1.'
            exit 1
          fi
          grep -F "'GegenbauerFock.Ultraspherical.sturmRealHeat_realNuclearInfimum_eq_spectralTrace' depends on axioms:" /tmp/v007-heat-real-exact-infimum.log
          echo 'Real heat nuclear projective S1 trace identity kernel-certified.'
