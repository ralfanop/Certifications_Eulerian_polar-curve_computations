name: V007 genuine real Sturm L2 graph closure and polynomial core

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealGraphClosureCore.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealPMapClosure.lean'
      - '.github/workflows/v007-ultraspherical-sturm-real-graph-closure-core.yml'
  workflow_dispatch:

jobs:
  true-real-Sturm-graph-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit actual real polynomial graph core
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealGraphClosureCore 2>&1 | tee /tmp/v007-sturm-graph-core-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealGraphClosureCore.lean 2>&1 | tee /tmp/v007-sturm-graph-core-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-sturm-graph-core-build.log /tmp/v007-sturm-graph-core-axioms.log; then
            echo '::error::Forbidden axiom in genuine real Sturm graph closure polynomial core.'
            exit 1
          fi
          grep -F "sturmRealPMap_graph_closure_eq' depends on axioms:" /tmp/v007-sturm-graph-core-axioms.log
          grep -F "sturmRealPMap_polynomials_core' depends on axioms:" /tmp/v007-sturm-graph-core-axioms.log
          grep -F "sturmRealPMap_closure_isClosable' depends on axioms:" /tmp/v007-sturm-graph-core-axioms.log
          echo 'V007 genuine weighted real L2 Sturm graph closure and polynomial core certified.'
