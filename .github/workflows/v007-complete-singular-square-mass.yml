name: V007 isolated real Schatten p ge 2 proof audit

on:
  push:
    branches:
      - v007-schatten-pge2-20261031
    paths:
      - 'lean/GegenbauerFock/CompleteSingularSchattenPgeTwo.lean'
      - 'lean/GegenbauerFock/CompletePositiveSingularHilbertBasis.lean'
      - '.github/workflows/v007-complete-singular-square-mass.yml'
  workflow_dispatch:

jobs:
  spectral-s2-mass:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Certify real Schatten p ge two and audit all axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.CompleteSingularSchattenPgeTwo 2>&1 | tee /tmp/v007-singular-square-mass-build.log
          lake env lean -M16768 GegenbauerFock/CompleteSingularSchattenPgeTwo.lean 2>&1 | tee /tmp/v007-singular-square-mass-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-singular-square-mass-build.log /tmp/v007-singular-square-mass-axioms.log; then
            echo '::error::Forbidden axiom in squared singular-value mass certificate.'
            exit 1
          fi
          grep -F "exists_complete_singular_schatten_pge_two' depends on axioms:" /tmp/v007-singular-square-mass-axioms.log
          echo 'V007 genuine bilateral squared singular-value Kummer mass kernel-checked and audited.'
