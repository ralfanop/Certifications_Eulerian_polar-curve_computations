name: M12 actual global MGF deficit
on:
  pull_request:
    paths:
      - 'lean/EulerianGrothendieck/CriticalWindowGlobalMGF.lean'
      - '.github/workflows/m12-critical-global-mgf.yml'
  workflow_dispatch:
jobs:
  globalmgf:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile dependency and actual global deficit
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          lake exe cache get
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/CriticalWindowQuartic.olean CriticalWindowQuartic.lean
          lake env lean CriticalWindowGlobalMGF.lean 2>&1 | tee /tmp/m12-critical-global-mgf.log
          git rev-parse HEAD
      - name: Strict axiom audit
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/m12-critical-global-mgf.log').read_text()
          assert ': error' not in text and 'sorryAx' not in text and 'Lean.ofReduceBool' not in text
          names = ['sinhc_neg', 'sinh_quartic_gap', 'sinhc_quartic_gap', 'deficit_compact', 'deficit_tail', 'deficitConstant_pos', 'global_deficit', 'standardized_global_deficit']
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for name in names:
              full = 'M12GlobalMGF.' + name
              match = re.search(r"'" + re.escape(full) + r"' depends on axioms: \[([^\]]*)\]", text)
              if match:
                  assert {x.strip() for x in match.group(1).split(',') if x.strip()} <= allowed
              else:
                  assert "'" + full + "' does not depend on any axioms" in text, full
              print('AXIOM AUDIT SUCCESS', full)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-critical-global-mgf-audit
          path: /tmp/m12-critical-global-mgf.log
