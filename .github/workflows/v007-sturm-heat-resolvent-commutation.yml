name: V007 genuine heat semigroup and Sturm resolvent commutation
on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatResolventCommutation.lean'
      - '.github/workflows/v007-sturm-heat-resolvent-commutation.yml'
  workflow_dispatch:

jobs:
  full-l2-heat-resolvent-commutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and axiom-audit genuine full L2 heat-resolvent commutation
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealHeatResolventCommutation 2>&1 | tee /tmp/v007-heat-resolvent-commutation-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatResolventCommutation.lean 2>&1 | tee /tmp/v007-heat-resolvent-commutation-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-heat-resolvent-commutation-build.log /tmp/v007-heat-resolvent-commutation-axioms.log; then
            echo '::error::Forbidden axiom in heat-resolvent commutation.'
            exit 1
          fi
          grep -F "sturmRealHeatLimitCLM_comp_fullResolvent_comm' depends on axioms:" /tmp/v007-heat-resolvent-commutation-axioms.log
          echo 'V007 genuine weighted L2 heat-resolvent commutation kernel-certified.'
