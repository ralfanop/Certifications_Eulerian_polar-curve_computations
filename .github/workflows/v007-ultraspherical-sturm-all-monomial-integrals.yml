name: V007 all-degree genuine Sturm–Liouville monomial Green integrals

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleAllMonomialIntegrals.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonomialIntegralBridge.lean'
      - '.github/workflows/v007-ultraspherical-sturm-all-monomial-integrals.yml'
  workflow_dispatch:

jobs:
  all-true-monomial-integrals:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and axiom-audit true all-degree Green integrals
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleAllMonomialIntegrals 2>&1 | tee /tmp/v007-sturm-allint-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleAllMonomialIntegrals.lean 2>&1 | tee /tmp/v007-sturm-allint-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-sturm-allint-build.log /tmp/v007-sturm-allint-axioms.log; then
            echo '::error::Forbidden axiom in true all-degree Green integral.'
            exit 1
          fi
          grep -F "sturmPolynomial_monomial_integral_pair' depends on axioms:" /tmp/v007-sturm-allint-axioms.log
          grep -F "sturmPolynomial_monomial_integral_symm' depends on axioms:" /tmp/v007-sturm-allint-axioms.log
          echo 'V007 actual all-degree ultraspherical monomial Green integral identity certified.'
