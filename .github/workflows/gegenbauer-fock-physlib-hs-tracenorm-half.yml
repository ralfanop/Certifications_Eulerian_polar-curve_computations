name: V007 sharp polar Young CFC trace norm bound

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/PhyslibHSProductTraceNormHalfEnergy.lean'
      - '.github/workflows/gegenbauer-fock-physlib-hs-tracenorm-half.yml'
  workflow_dispatch:

jobs:
  hs-tracenorm-young:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and elan
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt*8))"
          done
          test "$installed" = 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt*8))"
          done
          test "$ready" = 1
      - name: Prepare locked Mathlib manifest
        working-directory: lean
        run: lake update
      - name: Restore Mathlib compiled cache
        working-directory: lean
        run: lake exe cache get
      - name: Check exact CFC sharp Young polar energy theorem
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.PhyslibHSProductTraceNormHalfEnergy 2>&1 | tee /tmp/gf-hs-trace-young.log
          grep -F "ProbabilisticTheory.two_mul_traceNorm_mul_twoHilbertSchmidt_le_polar_energy' depends on axioms:" /tmp/gf-hs-trace-young.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/gf-hs-trace-young.log; then
            echo '::error::Non-standard axiom detected.'
            exit 1
          fi
          echo 'Genuine CFC polar Young estimate audited.'
