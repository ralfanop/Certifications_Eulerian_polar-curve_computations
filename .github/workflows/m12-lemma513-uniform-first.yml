name: M12 Lemma 5.13 uniform first exponential bound
on:
  pull_request:
    paths:
      - 'lean/EulerianGrothendieck/UniformLanczos/Lemma513UniformFirst.lean'
      - '.github/workflows/m12-lemma513-uniform-first.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-uniform-first:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile and check actual uniform-first-tail theorem
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.24.0'
          for f in UniformLanczos/Lemma513BondGap.lean UniformLanczos/Lemma513BondWindow.lean UniformLanczos/Lemma513ActualTail.lean UniformLanczos/Lemma513Exponential.lean UniformLanczos/Lemma513UniformFirst.lean; do
            ! grep -n -E '^\s*(axiom|opaque)\b|\b(sorry|admit|native_decide)\b' "$f"
          done
          lake exe cache get
          lake build UniformLanczos.Lemma513Exponential 2>&1 | tee /tmp/m12-uniform-first-build.log
          lake env lean UniformLanczos/Lemma513UniformFirst.lean 2>&1 | tee /tmp/m12-uniform-first.log
      - name: Transitive axiom audit on both original new theorems
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/m12-uniform-first.log').read_text()
          assert not re.search(r'(^|\n).*: error:',s)
          assert 'sorryAx' not in s and 'Lean.ofReduceBool' not in s
          for name in ('floor_window_eventually','first_tail_uniform_for_actual_beta'):
              full='UniformLanczos.Lemma513UniformFirst.'+name
              m=re.search(r"'"+re.escape(full)+r"' depends on axioms: \[([^\]]*)\]",s)
              if m: axioms={x.strip() for x in m.group(1).split(',') if x.strip()}
              else:
                  assert "'"+full+"' does not depend on any axioms" in s
                  axioms=set()
              assert axioms <= {'propext','Classical.choice','Quot.sound'},(full,axioms)
              print('AUDITED',full,sorted(axioms))
          print('M12 UNIFORM FIRST EXPONENTIAL TAIL SUCCESS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-lemma513-uniform-first
          path: |
            /tmp/m12-uniform-first-build.log
            /tmp/m12-uniform-first.log
