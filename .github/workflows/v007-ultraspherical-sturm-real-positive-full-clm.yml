name: V007 bounded full real L2 positive Sturm resolvent extension from dense core
on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealPositiveResolventFullCLM.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealCoreResolventNorm.lean'
      - '.github/workflows/v007-ultraspherical-sturm-real-positive-full-clm.yml'
  workflow_dispatch:
jobs:
  full-positive-clm:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit actual bounded full L2 positive resolvent extension
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealPositiveResolventFullCLM 2>&1 | tee /tmp/v007-full-res-clm-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealPositiveResolventFullCLM.lean 2>&1 | tee /tmp/v007-full-res-clm-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-full-res-clm-build.log /tmp/v007-full-res-clm-axioms.log; then
            echo '::error::Forbidden axiom in bounded real L2 positive Sturm full resolvent.'
            exit 1
          fi
          grep -F "sturmRealCorePositiveResolventCLM_apply' depends on axioms:" /tmp/v007-full-res-clm-axioms.log
          grep -F "sturmRealPositiveResolventFullCLM_onCore' depends on axioms:" /tmp/v007-full-res-clm-axioms.log
          echo 'V007 full-Hilbert positive real Sturm core resolvent continuous extension kernel-certified.'
