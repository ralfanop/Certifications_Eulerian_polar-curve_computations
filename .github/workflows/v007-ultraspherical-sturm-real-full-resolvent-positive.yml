name: V007 positive full real Sturm resolvent quadratic form

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealFullResolventPositive.lean'
      - '.github/workflows/v007-ultraspherical-sturm-real-full-resolvent-positive.yml'
  workflow_dispatch:

jobs:
  genuine-full-resolvent-positive:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit full Sturm resolvent positivity
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealFullResolventPositive 2>&1 | tee /tmp/v007-resolvent-positive-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealFullResolventPositive.lean 2>&1 | tee /tmp/v007-resolvent-positive-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-resolvent-positive-build.log /tmp/v007-resolvent-positive-axioms.log; then
            echo '::error::Forbidden axiom in full Sturm resolvent positivity.'
            exit 1
          fi
          grep -F "sturmRealPositiveResolventFullCLM_inner_energy_bound' depends on axioms:" /tmp/v007-resolvent-positive-axioms.log
          grep -F "sturmRealPositiveResolventFullCLM_inner_nonneg' depends on axioms:" /tmp/v007-resolvent-positive-axioms.log
          grep -F "sturmRealPositiveResolventFullCLM_inner_pos' depends on axioms:" /tmp/v007-resolvent-positive-axioms.log
          grep -F "sturmRealPositiveResolventFullCLM_kernel_zero' depends on axioms:" /tmp/v007-resolvent-positive-axioms.log
          grep -F "sturmRealPositiveResolventFullCLM_injective' depends on axioms:" /tmp/v007-resolvent-positive-axioms.log
          echo 'Full Sturm resolvent positivity and injectivity kernel-certified.'
