name: Manuscript 14.1 entire Sonine radial series — Lean

on:
  push:
    branches:
      - manuscript14-sonine-radial-20261104
    paths:
      - 'lean/SpecialImaginaryPoint/SonineEntireRadialSeries.lean'
      - '.github/workflows/manuscript14-sonine-entire-radial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean 4 — entire series radial intertwining
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib
        working-directory: lean
        run: |
          lake update
          lake exe cache get
      - name: Kernel compile and axiom audit
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/SonineRadialFormal.olean SpecialImaginaryPoint/SonineRadialFormal.lean 2>&1 | tee /tmp/sonine-entire-radial.log
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/SonineRadialComplex.olean SpecialImaginaryPoint/SonineRadialComplex.lean 2>&1 | tee -a /tmp/sonine-entire-radial.log
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/SonineIntegralMoment.olean SpecialImaginaryPoint/SonineIntegralMoment.lean 2>&1 | tee -a /tmp/sonine-entire-radial.log
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/SonineEvenComplexPolynomials.olean SpecialImaginaryPoint/SonineEvenComplexPolynomials.lean 2>&1 | tee -a /tmp/sonine-entire-radial.log
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/SonineEntireInterchange.olean SpecialImaginaryPoint/SonineEntireInterchange.lean 2>&1 | tee -a /tmp/sonine-entire-radial.log
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/SonineEntireAveraging.olean SpecialImaginaryPoint/SonineEntireAveraging.lean 2>&1 | tee -a /tmp/sonine-entire-radial.log
          lake env lean -M16768 SpecialImaginaryPoint/SonineEntireRadialSeries.lean 2>&1 | tee -a /tmp/sonine-entire-radial.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/sonine-entire-radial.log; then
            echo "::error::Forbidden Lean axiom"
            exit 1
          fi
      - name: Upload Lean log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript14-sonine-entire-radial-lean
          path: /tmp/sonine-entire-radial.log
          if-no-files-found: ignore
