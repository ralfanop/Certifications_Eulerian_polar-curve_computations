name: Manuscript 15 — 7000 exact Eulerian profiles and Arb 10000
on:
  push:
    branches:
      - manuscript15-eulerian-profiles-arb10000-20261111
    paths:
      - 'numerics/manuscript15_eulerian_7002_arb10000.py'
      - '.github/workflows/manuscript15-eulerian-7002-arb10000.yml'
  pull_request:
    paths:
      - 'numerics/manuscript15_eulerian_7002_arb10000.py'
      - '.github/workflows/manuscript15-eulerian-7002-arb10000.yml'
  workflow_dispatch:
jobs:
  arb:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Arb bindings
        run: python -m pip install 'python-flint==0.9.0'
      - name: Run exact full-range Eulerian recurrence and eight Arb peaks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile numerics/manuscript15_eulerian_7002_arb10000.py
          python numerics/manuscript15_eulerian_7002_arb10000.py 2>&1 | tee /tmp/m15-7002-arb10000.log
          grep -F 'EXACT: normalization, positivity and symmetry checked for every n=3,...,7002' /tmp/m15-7002-arb10000.log
          grep -F 'SUCCESS — eight rigorous Eulerian histogram peaks' /tmp/m15-7002-arb10000.log
      - name: Preserve full numerical log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript15-7000-histogram-profiles-arb10000
          path: /tmp/m15-7002-arb10000.log
