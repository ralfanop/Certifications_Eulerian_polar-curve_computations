name: V007 exact equilibrium heat and resolvent sharpness

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealEquilibriumOptimal.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealEquilibriumSharp.lean'
      - '.github/workflows/v007-sturm-equilibrium-optimal.yml'
  workflow_dispatch:

concurrency:
  group: v007-equilibrium-optimal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  true-weighted-L2-equilibrium-optimality:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit six equilibrium sharpness theorems
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealEquilibriumOptimal 2>&1 | tee /tmp/v007-equilibrium-optimal-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealEquilibriumOptimal.lean 2>&1 | tee /tmp/v007-equilibrium-optimal-audit.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-equilibrium-optimal-build.log /tmp/v007-equilibrium-optimal-audit.log; then
            echo '::error::Forbidden axiom in V007 equilibrium optimality.'
            exit 1
          fi
          for theorem in \
            sturmRealConstantEquilibrium_first_mode_eq_zero \
            sturmRealHeatLimitCLM_equilibrium_bound_attained \
            sturmRealHeatLimitCLM_equilibrium_constant_optimal \
            sturmRealPositiveResolventFullCLM_first_mode_norm \
            sturmRealPositiveResolventFullCLM_equilibrium_bound_attained \
            sturmRealPositiveResolventFullCLM_equilibrium_constant_optimal
          do
            grep -F "${theorem}' depends on axioms:" /tmp/v007-equilibrium-optimal-audit.log
          done
          echo 'V007 exact full-L2 equilibrium sharpness: kernel-certified.'
