name: V007 actual real ultraspherical Hilbert L2 Green inner-product symmetry

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealL2Green.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealPolynomialLinear.lean'
      - '.github/workflows/v007-ultraspherical-sturm-real-L2-green.yml'
  workflow_dispatch:

jobs:
  true-real-Hilbert-Green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit genuine Hilbert Green identity
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealL2Green 2>&1 | tee /tmp/v007-real-Hilbert-green-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealL2Green.lean 2>&1 | tee /tmp/v007-real-Hilbert-green-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-Hilbert-green-build.log /tmp/v007-real-Hilbert-green-axioms.log; then
            echo '::error::Forbidden axiom in genuine real Hilbert Green identity.'
            exit 1
          fi
          grep -F "sturmRealPolynomialLp_inner_eq_integral' depends on axioms:" /tmp/v007-real-Hilbert-green-axioms.log
          grep -F "sturmRealPolynomialLp_green_inner_symm' depends on axioms:" /tmp/v007-real-Hilbert-green-axioms.log
          echo 'V007 actual real L2 polynomial Hilbert inner-product Green symmetry certified.'
