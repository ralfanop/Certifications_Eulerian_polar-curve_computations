name: M15 2026-11-25 positive real elliptic period differential

on:
  pull_request:
    paths:
      - 'lean/Manuscript15/CrossQuarticCurve20261125.lean'
      - 'lean/Manuscript15/CrossQuarticPeriodDifferential20261125.lean'
      - '.github/workflows/m15-cross-quartic-period-differential-20261125.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  period-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned exact-HEAD positive elliptic branch and four Lean kernel proofs
        working-directory: lean
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/m15-period-differential
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD | tee /tmp/m15-period-differential/head.txt
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
          mkdir -p .lake/build/lib/lean/Manuscript15
          lake env lean -M16768 \
            -o .lake/build/lib/lean/Manuscript15/CrossQuarticCurve20261125.olean \
            Manuscript15/CrossQuarticCurve20261125.lean \
            2>&1 | tee /tmp/m15-period-differential/dependency.log
          lake env lean -M16768 Manuscript15/CrossQuarticPeriodDifferential20261125.lean \
            2>&1 | tee /tmp/m15-period-differential/lean.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('/tmp/m15-period-differential')
          src=Path('Manuscript15/CrossQuarticPeriodDifferential20261125.lean').read_text()
          old=Path('Manuscript15/CrossQuarticCurve20261125.lean').read_text()
          log=(root/'lean.log').read_text()
          dep=(root/'dependency.log').read_text()
          forbidden=re.compile(r'\b(sorry|sorryAx|admit|native_decide|unsafe)\b|^\s*axiom\s',re.M)
          assert not forbidden.search(src) and not forbidden.search(old)
          assert not re.search(r'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.',log+dep)
          names=re.findall(r'^#print axioms (Manuscript15\.CrossQuarticPeriodDifferential20261125\.\w+)$',src,re.M)
          assert len(names)==4 and len(set(names))==4,(len(names),names)
          for n in names:
            m=re.search(re.escape("'"+n+"'")+r' depends on axioms: \[([^\]]*)\]',log,re.S)
            if m:
              present={x.strip() for x in m.group(1).split(',') if x.strip()}
              assert present <= {'propext','Classical.choice','Quot.sound'},(n,present)
            else:
              assert "'"+n+"' does not depend on any axioms" in log,n
          print('M15 POSITIVE ELLIPTIC PERIOD INTEGRAND EXACT HEAD FOUR LEAN THEOREMS SUCCESS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-20261125-period-differential-lean
          path: /tmp/m15-period-differential/
