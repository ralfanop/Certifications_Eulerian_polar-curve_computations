name: M14 Parry degree-11 residuals and error transfer
on:
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/V14119ParryResidualTransferX20.lean'
      - '.github/workflows/manuscript14-parry-residual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Lean
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
      - name: Fetch pinned Mathlib cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel check and inspect axiom reports
        working-directory: lean
        run: |
          set -euo pipefail
          for file in V14119ParryResidualTransferX20; do
            lake env lean SpecialImaginaryPoint/$file.lean 2>&1 | tee -a /tmp/m14-parry-residual-lean.log
          done
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/m14-parry-residual-lean.log; then
            exit 1
          fi
          for decl in reciprocal_residual_exact product_residual_exact eval_abs_bound reciprocal_tail_bound product_tail_bound p_bound c_bound reciprocal_residual_bound product_residual_bound inverse_transfer parry_inverse_bound product_transfer parry_product_bound parry_expansion_transfer; do
            grep -F ".$decl'" /tmp/m14-parry-residual-lean.log
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m14-parry-residual-lean-log
          path: /tmp/m14-parry-residual-lean.log
