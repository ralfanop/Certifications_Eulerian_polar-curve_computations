name: M15 2026-11-25 finite elliptic period change of variables

on:
  pull_request:
    paths:
      - 'lean/Manuscript15/CrossQuarticCurve20261125.lean'
      - 'lean/Manuscript15/CrossQuarticPeriodDifferential20261125.lean'
      - 'lean/Manuscript15/CrossQuarticFinitePeriod20261125.lean'
      - '.github/workflows/m15-cross-quartic-finite-period-20261125.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-period:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-head Lean4 analytic finite-period substitution and kernel audit
        working-directory: lean
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/m15-finite-period
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD | tee /tmp/m15-finite-period/head.txt
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
          mkdir -p .lake/build/lib/lean/Manuscript15
          lake env lean -M16768 \
            -o .lake/build/lib/lean/Manuscript15/CrossQuarticCurve20261125.olean \
            Manuscript15/CrossQuarticCurve20261125.lean \
            2>&1 | tee /tmp/m15-finite-period/quartic.log
          lake env lean -M16768 \
            -o .lake/build/lib/lean/Manuscript15/CrossQuarticPeriodDifferential20261125.olean \
            Manuscript15/CrossQuarticPeriodDifferential20261125.lean \
            2>&1 | tee /tmp/m15-finite-period/positive.log
          lake env lean -M16768 Manuscript15/CrossQuarticFinitePeriod20261125.lean \
            2>&1 | tee /tmp/m15-finite-period/finite.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('/tmp/m15-finite-period')
          paths=[
              'Manuscript15/CrossQuarticCurve20261125.lean',
              'Manuscript15/CrossQuarticPeriodDifferential20261125.lean',
              'Manuscript15/CrossQuarticFinitePeriod20261125.lean'
          ]
          forbidden=re.compile(r'\b(sorry|sorryAx|admit|native_decide|unsafe)\b|^\s*axiom\s',re.M)
          for path in paths:
              assert not forbidden.search(Path(path).read_text()),path
          logs=[(root/file).read_text() for file in ['quartic.log','positive.log','finite.log']]
          assert not re.search(r'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.', ''.join(logs))
          src=Path(paths[-1]).read_text()
          log=logs[-1]
          names=re.findall(r'^#print axioms (Manuscript15\.CrossQuarticFinitePeriod20261125\.\w+)$',src,re.M)
          assert len(names)==6 and len(set(names))==6,(len(names),names)
          for n in names:
              m=re.search(re.escape("'"+n+"'")+r' depends on axioms: \[([^\]]*)\]',log,re.S)
              if m:
                  present={x.strip() for x in m.group(1).split(',') if x.strip()}
                  assert present <= {'propext','Classical.choice','Quot.sound'},(n,present)
              else:
                  assert "'"+n+"' does not depend on any axioms" in log,n
          print('M15 REAL FINITE ELLIPTIC PERIOD SUBSTITUTION SIX LEAN PROOFS SUCCESS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-20261125-finite-period
          path: /tmp/m15-finite-period/
