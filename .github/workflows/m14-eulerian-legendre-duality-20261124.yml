name: M14 Eulerian Legendre duality — Lean and Arb
on:
  push:
    branches: [draft/m14-eulerian-legendre-duality-20261124]
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/EulerianLegendreDuality.lean'
      - 'certificates/manuscript14/arb_eulerian_legendre_duality.py'
      - '.github/workflows/m14-eulerian-legendre-duality-20261124.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m14-legendre-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Lean
        working-directory: lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Retrieve Mathlib cache
        working-directory: lean
        run: |
          lake exe cache get
      - name: Compile and audit thirteen declarations
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean SpecialImaginaryPoint/EulerianLegendreDuality.lean 2>&1 | tee /tmp/m14-legendre.log
          python - <<'PY'
          import re
          s = open('/tmp/m14-legendre.log').read()
          assert not re.search(r'sorryAx|Lean\.ofReduceBool|declaration uses|: error:',s)
          found = re.findall(r"depends on axioms: \[([^\]]*)\]",s)
          assert len(found) == 13, found
          for a in found:
              assert set(a.split(', ')) <= {'propext','Classical.choice','Quot.sound'}, a
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m14-legendre-lean-log
          path: /tmp/m14-legendre.log
  arb-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-flint==0.9.0
      - name: Six 10000-bit rounding checks
        run: |
          set -euo pipefail
          for k in dual curvature; do
            for i in 0 1 2; do
              python certificates/manuscript14/arb_eulerian_legendre_duality.py --bits 10000 --kind "$k" --index "$i" --output "out/$k-$i.json.gz"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: m14-legendre-arb-pilot
          path: out/
  arb-full:
    needs: arb-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        kind: [dual, curvature]
        index: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-flint==0.9.0
      - name: Strict 3600000-bit certificate
        run: |
          python certificates/manuscript14/arb_eulerian_legendre_duality.py --bits 3600000 --kind ${{ matrix.kind }} --index ${{ matrix.index }} --output out/certificate.json.gz
      - uses: actions/upload-artifact@v4
        with:
          name: m14-legendre-arb-${{ matrix.kind }}-${{ matrix.index }}
          path: out/
