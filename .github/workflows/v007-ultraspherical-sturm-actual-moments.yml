name: V007 real Gegenbauer Green symmetry from actual Beta moments

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleActualMoments.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleGreenMoments.lean'
      - '.github/workflows/v007-ultraspherical-sturm-actual-moments.yml'
  workflow_dispatch:

jobs:
  true-beta-green-moments:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit true Beta ultraspherical Green moments
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleActualMoments 2>&1 | tee /tmp/v007-sturm-true-green-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleActualMoments.lean 2>&1 | tee /tmp/v007-sturm-true-green-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-sturm-true-green-build.log /tmp/v007-sturm-true-green-axioms.log; then
            echo '::error::Forbidden axiom in true Beta moment Green theorem.'
            exit 1
          fi
          grep -F "sturmMoment_two_step' depends on axioms:" /tmp/v007-sturm-true-green-axioms.log
          grep -F "sturmMoment_green_high_monomials' depends on axioms:" /tmp/v007-sturm-true-green-axioms.log
          echo 'V007 genuine ultraspherical Green moment symmetry certified.'
