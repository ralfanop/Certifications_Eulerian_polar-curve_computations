name: M12 Theorem 5.14 actual residual identity
on:
  pull_request:
    paths:
      - 'lean/EulerianGrothendieck/UniformLanczos/Rate514ConcreteResidual.lean'
      - '.github/workflows/m12-rate514-residual-concrete.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  residual:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore pinned Lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile actual residual plus concrete bridge
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.24.0'
          for f in UniformLanczos/Rate514ConcreteBridge.lean UniformLanczos/Rate514ConcreteResidual.lean; do
            ! grep -n -E '^\s*(axiom|opaque)\b|\b(sorry|admit|native_decide)\b' "$f"
          done
          lake exe cache get
          lake build UniformLanczos.Rate514Assembly 2>&1 | tee /tmp/m12-514-resid-deps.log
          lake env lean UniformLanczos/Rate514ConcreteBridge.lean 2>&1 | tee /tmp/m12-514-bridge.log
          lake build UniformLanczos.Rate514ConcreteBridge 2>&1 | tee /tmp/m12-514-resid-deps2.log
          lake env lean UniformLanczos/Rate514ConcreteResidual.lean 2>&1 | tee /tmp/m12-514-resid.log
      - name: Audit standard transitive axioms
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('/tmp/m12-514-resid.log').read_text()
          assert not re.search(r'(^|\n).*: error:',s)
          assert 'sorryAx' not in s and 'Lean.ofReduceBool' not in s
          for n in ['residual_difference_actual','actualMu_lower']:
              full='UniformLanczos.Rate514ConcreteResidual.'+n
              m=re.search(r"'"+re.escape(full)+r"' depends on axioms: \[([^\]]*)\]",s)
              if m: axioms={x.strip() for x in m.group(1).split(',') if x.strip()}
              else:
                  assert "'"+full+"' does not depend on any axioms" in s,full
                  axioms=set()
              assert axioms<={'propext','Classical.choice','Quot.sound'},(full,axioms)
              print('PASS',full,sorted(axioms))
          print('M12 5.14 ACTUAL RESIDUAL IDENTITY SUCCESS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-514-residual-identity
          path: |
            /tmp/m12-514-resid-deps.log
            /tmp/m12-514-resid-deps2.log
            /tmp/m12-514-bridge.log
            /tmp/m12-514-resid.log
