name: V007 intrinsic Fock exponential two-point Hilbert bound

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GaussianAreaIntrinsicExponentialTwoPoint.lean'
      - '.github/workflows/v007-fock-exponential-two-point.yml'
  workflow_dispatch:

jobs:
  intrinsic-exponential-two-point:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version
      - name: Restore pinned Mathlib cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit exact intrinsic exponential two-point statements
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GaussianAreaIntrinsicExponentialTwoPoint 2>&1 | tee /tmp/v007-exp-two-point.log
          lake env lean -M16768 GegenbauerFock/GaussianAreaIntrinsicExponentialTwoPoint.lean 2>&1 | tee -a /tmp/v007-exp-two-point.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-exp-two-point.log; then
            echo "::error::Forbidden axiom in intrinsic exponential two-point theorems."
            exit 1
          fi
          grep -F "intrinsicRiesz_exponential_hermitian' depends on axioms:" /tmp/v007-exp-two-point.log
          grep -F "intrinsicRiesz_exponential_twoPoint_norm_sq_le' depends on axioms:" /tmp/v007-exp-two-point.log
          echo 'V007 exact exponential two-point kernel: kernel and axiom audit clean.'
