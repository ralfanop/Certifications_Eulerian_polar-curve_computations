name: V007 common Fredholm essential spectral band

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/TwoSidedGramEssentialSpectralBand.lean'
      - '.github/workflows/gegenbauer-fock-gram-essential-spectral-band.yml'
  workflow_dispatch:

jobs:
  bilateral-essential-spectral-band:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then break; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep "$((attempt * 8))"
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then break; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep "$((attempt * 8))"
          done
      - name: Prepare Mathlib at repository-pinned revision
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-check all bilateral Fredholm essential spectral band theorems
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.TwoSidedGramEssentialSpectralBand 2>&1 | tee /tmp/v007-gram-essential-band.log
          for theorem in sourceGram_essential_spectral_value_in_joint_band outputGram_essential_spectral_value_in_joint_band two_sided_gram_essential_spectra_in_joint_band two_sided_gram_essential_zero_and_joint_band; do
            grep -qF "${theorem}' depends on axioms" /tmp/v007-gram-essential-band.log
          done
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-gram-essential-band.log; then
            echo '::error::Forbidden proof axiom in essential spectral band'
            exit 1
          fi
          echo 'V007 joint Fredholm essential spectral band kernel-audited.'
