name: M12 Lemma 5.12 (Jacobi calculus)
on:
  pull_request:
    paths:
      - 'lean/EulerianGrothendieck/UniformLanczos/Lemma512*.lean'
      - '.github/workflows/m12-lemma512.yml'
  push:
    branches: [main]
    paths:
      - 'lean/EulerianGrothendieck/UniformLanczos/Lemma512*.lean'
  workflow_dispatch:

jobs:
  lemma512:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Source hygiene
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          for f in UniformLanczos/Lemma512Propagation.lean; do
            ! grep -n -E '^\s*(axiom|opaque)\b' "$f"
            ! grep -n -w -E 'sorry|admit|native_decide' "$f"
          done
      - name: Check the Lemma 5.12 modules
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          lean --version
          lake exe cache get
          lake env lean UniformLanczos/Lemma512Propagation.lean 2>&1 | tee /tmp/m12-lemma512.log
          git rev-parse HEAD
      - name: Strict individual axiom audit
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          text = Path('/tmp/m12-lemma512.log').read_text()
          assert ': error' not in text, 'compilation error'
          assert "declaration uses 'sorry'" not in text
          assert 'sorryAx' not in text and 'Lean.ofReduceBool' not in text
          names = ['UniformLanczos.Lemma512Propagation.' + n for n in (
              'col_eq_zero_far', 'sum_shift_le', 'col_norm_sq_le', 'abs_col_le_one',
              'expEntry_tail', 'poly_exp_le', 'rate_pos', 'propagation')]
          for name in names:
              match = re.search(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", text)
              if match:
                  axioms = {x.strip() for x in match.group(1).split(',') if x.strip()}
              else:
                  assert "'" + name + "' does not depend on any axioms" in text, name
                  axioms = set()
              assert axioms <= allowed, (name, axioms)
              print('AXIOM AUDIT SUCCESS', name, sorted(axioms))
          print('AUDITED', len(names))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-lemma512-audit
          path: /tmp/m12-lemma512.log
