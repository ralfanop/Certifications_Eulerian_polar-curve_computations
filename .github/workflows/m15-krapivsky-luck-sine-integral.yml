name: M15 Möbius spectral sine integral exact-head Lean audit
on:
  pull_request:
    paths:
      - 'lean/Manuscript15/KrapivskyLuckSineIntegralBridge.lean'
      - '.github/workflows/m15-krapivsky-luck-sine-integral.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Lean and Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
      - name: Lean compilation and audit
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Manuscript15
          git rev-parse HEAD | tee /tmp/kl-lean.log
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/KrapivskyLuckMobiusBridge.olean Manuscript15/KrapivskyLuckMobiusBridge.lean 2>&1 | tee -a /tmp/kl-lean.log
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/KrapivskyLuckLaplaceKernel.olean Manuscript15/KrapivskyLuckLaplaceKernel.lean 2>&1 | tee -a /tmp/kl-lean.log
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/KrapivskyLuckDampedTail.olean Manuscript15/KrapivskyLuckDampedTail.lean 2>&1 | tee -a /tmp/kl-lean.log
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/KrapivskyLuckSpectralIntegral.olean Manuscript15/KrapivskyLuckSpectralIntegral.lean 2>&1 | tee -a /tmp/kl-lean.log
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/KrapivskyLuckEnergyFubini.olean Manuscript15/KrapivskyLuckEnergyFubini.lean 2>&1 | tee -a /tmp/kl-lean.log
          lake build EulerianCert.EulerianFourier EulerianCert.Energy 2>&1 | tee -a /tmp/kl-lean.log
          lake env lean -M16768 -o .lake/build/lib/lean/EulerianCert/KrapivskyLuckEnergy.olean EulerianCert/KrapivskyLuckEnergy.lean 2>&1 | tee -a /tmp/kl-lean.log
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/KrapivskyLuckSincNormalization.olean Manuscript15/KrapivskyLuckSincNormalization.lean 2>&1 | tee -a /tmp/kl-lean.log
          lake env lean -M16768 Manuscript15/KrapivskyLuckSineIntegralBridge.lean 2>&1 | tee -a /tmp/kl-lean.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/kl-lean.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/kl-lean.log').read_text()
          for n in ['sinc_square_integrable','sinc_square_negative_tail','sinc_square_two_sided_tail','sinc_square_positive_tail','sine_integral_mobius_spectral_identity']:
              name = 'Manuscripts14And15.KrapivskyLuck.'+n
              matches = re.findall(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", log, re.S)
              assert matches, 'missing audit: '+name
              for match in matches:
                  assert {a.strip() for a in match.split(',') if a.strip()} <= {'propext','Classical.choice','Quot.sound'}
          print('AXIOM AUDIT SUCCESS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-sine-integral-lean
          path: /tmp/kl-lean.log

