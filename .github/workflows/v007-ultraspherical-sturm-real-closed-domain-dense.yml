name: V007 actual real Sturm closed extension retains dense Hilbert domain

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealClosedDomainDense.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealGraphClosureCore.lean'
      - '.github/workflows/v007-ultraspherical-sturm-real-closed-domain-dense.yml'
  workflow_dispatch:

jobs:
  genuine-closed-dense:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit closed Sturm operator still densely defined
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealClosedDomainDense 2>&1 | tee /tmp/v007-closed-dense-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealClosedDomainDense.lean 2>&1 | tee /tmp/v007-closed-dense-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-closed-dense-build.log /tmp/v007-closed-dense-axioms.log; then
            echo '::error::Forbidden axiom in real Sturm closed dense domain.'
            exit 1
          fi
          grep -F "sturmRealClosedPMap_domain_dense' depends on axioms:" /tmp/v007-closed-dense-axioms.log
          grep -F "sturmRealClosedPMap_closed_and_dense' depends on axioms:" /tmp/v007-closed-dense-axioms.log
          echo 'V007 genuine real ultraspherical Sturm closed extension retains dense domain, certified.'
