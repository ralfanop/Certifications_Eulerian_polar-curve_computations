name: Manuscript 14 Section 11 — Lean and Arb Parry thresholds

on:
  push:
    branches:
      - manuscript14-section11-parry-cert-20261103
    paths:
      - 'lean/SpecialImaginaryPoint/ParryThresholds.lean'
      - 'lean/SpecialImaginaryPoint/EulerianSinhSeries.lean'
      - 'lean/SpecialImaginaryPoint/EulerianAnalyticBracket.lean'
      - 'lean/SpecialImaginaryPoint/PeriodicOrbitAlgebraicity.lean'
      - 'lean/SpecialImaginaryPoint/EulerianTranscendenceReduction.lean'
      - 'numerics/arb/manuscript14_section11_arb.py'
      - '.github/workflows/manuscript14-section11.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manuscript14-parry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Fetch pinned Mathlib cache
        working-directory: lean
        run: |
          lake update
          lake exe cache get
      - name: Lean theorem and forbidden-axiom audit
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/ParryThresholds.olean SpecialImaginaryPoint/ParryThresholds.lean 2>&1 | tee /tmp/manuscript14-parry-lean.log
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/EulerianAnalyticBracket.olean SpecialImaginaryPoint/EulerianAnalyticBracket.lean 2>&1 | tee -a /tmp/manuscript14-parry-lean.log
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/EulerianSinhSeries.olean SpecialImaginaryPoint/EulerianSinhSeries.lean 2>&1 | tee -a /tmp/manuscript14-parry-lean.log
          lake env lean -M16768 -o .lake/build/lib/lean/SpecialImaginaryPoint/PeriodicOrbitAlgebraicity.olean SpecialImaginaryPoint/PeriodicOrbitAlgebraicity.lean 2>&1 | tee -a /tmp/manuscript14-parry-lean.log
          lake env lean -M16768 SpecialImaginaryPoint/EulerianTranscendenceReduction.lean 2>&1 | tee -a /tmp/manuscript14-parry-lean.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/manuscript14-parry-lean.log; then
            echo "::error::Forbidden Lean axiom present"
            exit 1
          fi
      - name: Upload Lean log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript14-section11-lean
          path: /tmp/manuscript14-parry-lean.log
          if-no-files-found: ignore

  arb:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Arb bindings
        run: python -m pip install python-flint==0.9.0
      - name: Execute rigorous Section 11 ball and rational checks
        run: python numerics/arb/manuscript14_section11_arb.py | tee /tmp/manuscript14-section11-arb.log
      - name: Upload Arb log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript14-section11-arb
          path: /tmp/manuscript14-section11-arb.log
          if-no-files-found: ignore
