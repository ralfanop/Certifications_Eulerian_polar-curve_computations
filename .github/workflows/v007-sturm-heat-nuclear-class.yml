name: V007 real heat nuclear class and mass certificate

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatNuclearClass.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatNuclearMass.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatPositiveNuclear.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatTraceBasisSummable.lean'
      - '.github/workflows/v007-sturm-heat-nuclear-class.yml'
  workflow_dispatch:

jobs:
  nuclear-class-kernel-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Nuclear real Hilbert rank-one class kernel proof and audit
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealHeatNuclearClass 2>&1 | tee /tmp/v007-heat-class-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatNuclearClass.lean 2>&1 | tee /tmp/v007-heat-class-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-heat-class-build.log /tmp/v007-heat-class-axioms.log; then
            echo '::error::Forbidden axiom in real heat nuclear class.'
            exit 1
          fi
          grep -F "sturmRealHeat_has_real_nuclear_rank_one_series' depends on axioms:" /tmp/v007-heat-class-axioms.log
          grep -F "sturmRealHeat_nuclear_rank_one_mass_certificate' depends on axioms:" /tmp/v007-heat-class-axioms.log
          echo 'V007 real heat nuclear class and mass certificate audited.'
