name: V007 real S1 exact norm two incomplete singular families

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/RealNuclearPartialSingularFamilyS1Exact.lean'
      - 'lean/GegenbauerFock/RealNuclearTwoOrthonormalAllCostsDual.lean'
      - 'lean/GegenbauerFock/RealNuclearTwoOrthonormalFiniteTraceDual.lean'
      - '.github/workflows/v007-real-partial-singular-family-s1-exact.yml'
  workflow_dispatch:

jobs:
  partial-families-exact-s1:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel audit of partial singular family projective trace norm
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealNuclearPartialSingularFamilyS1Exact 2>&1 | tee /tmp/v007-real-partial-singular-s1.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-partial-singular-s1.log; then
            echo '::error::Forbidden axiom in real partial singular norm.'
            exit 1
          fi
          for theorem in realTwoOrthonormalSingularSeries_basis_apply realTwoPartialSingularFamilies_nuclear_exact_trace; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-real-partial-singular-s1.log
          done
          echo 'Partial singular orthonormal families exact real S1 nuclear norm kernel-certified.'
