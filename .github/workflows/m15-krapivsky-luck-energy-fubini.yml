name: M15 actual Laplace energy Fubini exact-head Lean audit
on:
  pull_request:
    paths:
      - 'lean/Manuscript15/KrapivskyLuckEnergyFubini.lean'
      - '.github/workflows/m15-krapivsky-luck-energy-fubini.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Lean and Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
      - name: Lean compilation and audit
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Manuscript15
          git rev-parse HEAD | tee /tmp/kl-lean.log
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/KrapivskyLuckMobiusBridge.olean Manuscript15/KrapivskyLuckMobiusBridge.lean 2>&1 | tee -a /tmp/kl-lean.log
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/KrapivskyLuckLaplaceKernel.olean Manuscript15/KrapivskyLuckLaplaceKernel.lean 2>&1 | tee -a /tmp/kl-lean.log
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/KrapivskyLuckDampedTail.olean Manuscript15/KrapivskyLuckDampedTail.lean 2>&1 | tee -a /tmp/kl-lean.log
          lake env lean -M16768 -o .lake/build/lib/lean/Manuscript15/KrapivskyLuckSpectralIntegral.olean Manuscript15/KrapivskyLuckSpectralIntegral.lean 2>&1 | tee -a /tmp/kl-lean.log
          lake env lean -M16768 Manuscript15/KrapivskyLuckEnergyFubini.lean 2>&1 | tee -a /tmp/kl-lean.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/kl-lean.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/kl-lean.log').read_text()
          for n in ['mobius_fibre_delta','weighted_fibre_delta','fibre_tsum_delta','mobius_kernel_tsum','sinc_square_kernel','laplaceIntegrand_nonneg','laplaceIntegrand_dom','laplaceIntegrand_integrable','laplaceKernel_nonneg','laplaceKernel_bound','laplaceKernel_abs_summable','laplaceKernel_mobius_cancellation','tailPrimitive_deriv','tailPrimitive_bound','tailPrimitive_tendsto','damped_cosine_tail','scaled_laplaceKernel_one','spectralIntegrand_formula','spectralIntegrand_nonneg','spectralIntegrand_integrable','spectralIntegrand_integral','laplaceKernel_row_summable','spectralIntegrand_integral_norm_summable','normalizedSpectralRemainder_eq','normalizedSpectralRemainder_formula','normalizedSpectralRemainder_mobius','gamma2_integral','gamma2_scaled_integral','dampedEnergyKernel_nonneg','dampedEnergyKernel_section_integrable','dampedEnergyKernel_outer_integrable','dampedEnergyKernel_product_integrable','laplace_energy_tail','normalizedSpectralRemainder_mobius_energy']:
              name = 'Manuscripts14And15.KrapivskyLuck.'+n
              matches = re.findall(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", log, re.S)
              assert matches, 'missing audit: '+name
              for match in matches:
                  assert {a.strip() for a in match.split(',') if a.strip()} <= {'propext','Classical.choice','Quot.sound'}
          print('AXIOM AUDIT SUCCESS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-energy-fubini-lean
          path: /tmp/kl-lean.log

