name: V007 uniform quadratic tail of genuine closed Sturm resolvent

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventUniformTail.lean'
      - '.github/workflows/v007-ultraspherical-sturm-resolvent-uniform-tail.yml'
  workflow_dispatch:

jobs:
  resolvent-uniform-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then exit 0; fi
            sleep "$((attempt * 8))"
          done
          exit 1
      - name: Prepare exact Mathlib dependencies
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-check complete uniform spectral tail and all three axiom audits
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleResolventUniformTail 2>&1 | tee /tmp/v007-uniform-tail-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleResolventUniformTail.lean 2>&1 | tee /tmp/v007-uniform-tail-audit.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-uniform-tail-build.log /tmp/v007-uniform-tail-audit.log; then
            echo '::error::Forbidden axiom in uniform spectral tail.'
            exit 1
          fi
          for theorem in sturmResolventMultiplier_uniform_tail_bound sturmRealPositiveResolvent_normalized_mode_uniform_tail sturmRealPositiveResolvent_full_coordinate_uniform_tail; do
            grep -F "${theorem}' depends on axioms:" /tmp/v007-uniform-tail-audit.log
          done
          echo 'V007 three genuine closed Sturm resolvent uniform-tail theorems kernel-certified.'
