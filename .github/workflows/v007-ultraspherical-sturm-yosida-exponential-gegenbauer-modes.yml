name: V007 exact bounded Yosida semigroup on normalized Gegenbauer modes

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealYosidaExponentialGegenbauerModes.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealYosidaExponentialEigenvector.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealYosidaNormalizedEigen.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealYosidaHilbertEigenmodes.lean'
      - '.github/workflows/v007-ultraspherical-sturm-yosida-exponential-gegenbauer-modes.yml'
  workflow_dispatch:

jobs:
  exact-Yosida-Gegenbauer-semigroup-modes:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and kernel-audit explicit bounded Yosida semigroup modes
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealYosidaExponentialGegenbauerModes 2>&1 | tee /tmp/v007-yosida-exp-modes-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealYosidaExponentialGegenbauerModes.lean 2>&1 | tee /tmp/v007-yosida-exp-modes-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-yosida-exp-modes-build.log /tmp/v007-yosida-exp-modes-axioms.log; then
            echo '::error::Forbidden axiom in bounded Yosida semigroup Gegenbauer modes.'
            exit 1
          fi
          grep -F "sturmRealYosidaExponential_normalized_Gegenbauer_eigen' depends on axioms:" /tmp/v007-yosida-exp-modes-axioms.log
          grep -F "sturmRealYosidaExponential_fixed_zero_mode' depends on axioms:" /tmp/v007-yosida-exp-modes-axioms.log
          echo 'V007 exact Yosida Gegenbauer exponential eigenmodes kernel-certified.'
