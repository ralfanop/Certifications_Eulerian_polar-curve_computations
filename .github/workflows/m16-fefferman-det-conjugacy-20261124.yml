name: M16 Fefferman regularized determinant conjugacy
on:
  pull_request:
    paths:
      - 'lean/Manuscript16/FeffermanDetConjugacy20261124.lean'
      - '.github/workflows/m16-fefferman-det-conjugacy-20261124.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Lean 4 and exact-head build with declaration-level axiom audit
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
          git rev-parse HEAD | tee /tmp/m16-fefferman-det.log
          lake env lean -M16768 Manuscript16/FeffermanDetConjugacy20261124.lean 2>&1 | tee -a /tmp/m16-fefferman-det.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/m16-fefferman-det.log; then exit 1; fi
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/m16-fefferman-det.log').read_text()
          ns='Manuscript16.FeffermanDetConjugacy20261124'
          ds=['similarity_power','similarity_trace','similarity_trace_power','similarity_det','similarity_shifted_det','similarity_regDet','similarity_regDet_limit']
          for d in ds:
              name="'"+ns+'.'+d+"'"
              found=re.findall(re.escape(name)+r" depends on axioms: \[([^\]]*)\]",s,re.S)
              assert found or name+" does not depend on any axioms" in s, name
              for a in found:
                  assert {x.strip() for x in a.split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'},(name,a)
          print("SUCCESS M16 FEFFERMAN DETERMINANT AXIOM AUDIT",len(ds))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m16-fefferman-det-log
          path: /tmp/m16-fefferman-det.log
