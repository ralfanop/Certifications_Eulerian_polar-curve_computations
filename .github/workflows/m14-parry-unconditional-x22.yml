name: M14 Parry unconditional order-22 remainder
on:
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/V14119ParryUnconditionalX22.lean'
      - '.github/workflows/m14-parry-unconditional-x22.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Lean and Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
      - name: Exact-head Lean and individual axiom audit
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          git rev-parse HEAD | tee /tmp/m14-unconditional.log
          for f in V14119Asymptotic177Taylor V14119Asymptotic177Log V14119Asymptotic177Epsilon V14119ParryAnalyticInputsX20 V14119ParryResidualTransferX20 V14119ParryActualLogX20 V14119ParryActualLogsX20 V14119ParryProxyLipschitzX20 V14119ParryUnconditionalX22; do
            lake env lean -M16768 -o ".lake/build/lib/lean/SpecialImaginaryPoint/$f.olean" "SpecialImaginaryPoint/$f.lean" 2>&1 | tee -a /tmp/m14-unconditional.log
          done
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/m14-unconditional.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/m14-unconditional.log').read_text()
          for n in ['denominator_residual_exact','numerator_residual_exact','den_tail_l1','num_tail_l1','denominator_residual','numerator_residual','parry_remainder_unconditional','parry_remainder_x22']:
              name = 'Manuscript14.ParryUnconditional.' + n
              m = re.search(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]|'" + re.escape(name) + r"' does not depend on any axioms", log)
              assert m, 'missing audit: ' + name
              assert {a.strip() for a in (m.group(1) or '').split(',') if a.strip()} <= {'propext','Classical.choice','Quot.sound'}
          print('AXIOM AUDIT SUCCESS 8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m14-parry-proxy-lean-audit
          path: /tmp/m14-unconditional.log
