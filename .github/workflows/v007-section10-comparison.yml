name: V007 Section 10 Funk-Hecke multiplier, d = 4 Bessel-Catalan identity, Gegenbauer resolvent (13, Prop 10.1)
on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/Section10Comparison.lean'
      - '.github/workflows/v007-section10-comparison.yml'
  workflow_dispatch:
jobs:
  section10-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit V007 Section 10 Funk-Hecke multiplier, d = 4 Bessel-Catalan identity, Gegenbauer resolvent (13, Prop 10.1)
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.Section10Comparison 2>&1 | tee /tmp/section10-comparison-build.log
          lake env lean -M16768 GegenbauerFock/Section10Comparison.lean 2>&1 | tee /tmp/section10-comparison-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/section10-comparison-build.log /tmp/section10-comparison-axioms.log; then
            echo '::error::Forbidden axiom in Section10Comparison.'
            exit 1
          fi
          grep -F "GegenbauerFock.Section10Comparison.sigma_isProbability' depends on axioms:" /tmp/section10-comparison-axioms.log
          grep -F "GegenbauerFock.Section10Comparison.isSphericalHarmonic_const' depends on axioms:" /tmp/section10-comparison-axioms.log
          grep -F "GegenbauerFock.Section10Comparison.gegenbauerC_eigen' depends on axioms:" /tmp/section10-comparison-axioms.log
          grep -F "GegenbauerFock.Section10Comparison.sphereArea_ratio' depends on axioms:" /tmp/section10-comparison-axioms.log
          grep -F "GegenbauerFock.Section10Comparison.classicalMultiplier_eq_eta' depends on axioms:" /tmp/section10-comparison-axioms.log
          grep -F "GegenbauerFock.Section10Comparison.proposition_10_1' depends on axioms:" /tmp/section10-comparison-axioms.log
          grep -F "GegenbauerFock.Section10Comparison.d4_coeff_eq_moment' depends on axioms:" /tmp/section10-comparison-axioms.log
          grep -F "GegenbauerFock.Section10Comparison.eq_d4_bessel' depends on axioms:" /tmp/section10-comparison-axioms.log
          grep -F "GegenbauerFock.Section10Comparison.resolvent_inverts_D_add_t' depends on axioms:" /tmp/section10-comparison-axioms.log
          grep -F "GegenbauerFock.Section10Comparison.gegen_mode_eigen' depends on axioms:" /tmp/section10-comparison-axioms.log
          grep -F "GegenbauerFock.Section10Comparison.eq_gegen_resolvent' depends on axioms:" /tmp/section10-comparison-axioms.log
          echo 'V007 Section 10 Funk-Hecke multiplier, d = 4 Bessel-Catalan identity, Gegenbauer resolvent (13, Prop 10.1): kernel-certified.'
