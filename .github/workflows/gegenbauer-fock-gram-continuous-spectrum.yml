name: V007 bilateral Gram continuous spectrum Lean certification

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/TwoSidedGramContinuousSpectrum.lean'
      - 'lean/GegenbauerFock/TwoSidedGramNonclosedRange.lean'
      - 'lean/GegenbauerFock/TwoSidedGramProperDenseRange.lean'
      - 'lean/GegenbauerFock/TwoSidedGramNotSurjective.lean'
      - 'lean/GegenbauerFock/TwoSidedGramZeroNonEigen.lean'
      - '.github/workflows/gegenbauer-fock-gram-continuous-spectrum.yml'
  workflow_dispatch:

jobs:
  zero-continuous-spectrum:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean 4 toolchain with retry
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors \
            --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then
              ready=1
              break
            fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then
              ready=1
              break
            fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1

      - name: Restore pinned Mathlib artifacts
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Compile both continuous-spectrum certificates and audit their axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.TwoSidedGramContinuousSpectrum 2>&1 | tee /tmp/v007-continuous-build.log
          lake env lean -M16768 GegenbauerFock/TwoSidedGramContinuousSpectrum.lean 2>&1 | tee /tmp/v007-continuous-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-continuous-build.log /tmp/v007-continuous-axioms.log; then
            echo "::error::Forbidden Lean axiom in bilateral continuous-spectrum certificate."
            exit 1
          fi
          for theorem in source_gram_zero_continuous_spectrum \
            output_gram_zero_continuous_spectrum \
            two_sided_gram_zero_continuous_spectrum \
            two_sided_continuous_zero_nonclosed_ranges; do
            grep -F "${theorem}' depends on axioms:" /tmp/v007-continuous-axioms.log
          done
          echo 'Bilateral zero continuous-spectrum proof: compiled and cleanly audited.'
