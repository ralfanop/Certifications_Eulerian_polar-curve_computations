name: M12 periodic interval-Newton profile-root scaling
on:
  pull_request:
    paths:
      - 'numerics/arb/m12_periodic_root_pilot.py'
      - '.github/workflows/m12-periodic-root-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {row: '1/4', label: quarter, bits: 8192}
          - {row: '1/2', label: half, bits: 8192}
          - {row: '1', label: one, bits: 8192}
          - {row: '2', label: two, bits: 8192}
          - {row: '4', label: four, bits: 8192}
          - {row: '1/4', label: quarter, bits: 16384}
          - {row: '4', label: four, bits: 16384}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin HEAD and runtime
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m pip install python-flint==0.9.0
      - name: Certify actual profile root
        run: |
          set -euo pipefail
          python numerics/arb/m12_periodic_root_pilot.py '${{ matrix.row }}' --bits ${{ matrix.bits }} 2>&1 | tee root.log
          grep -F 'PROFILE ROOT PILOT PASS' root.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-profile-root-${{ matrix.label }}-${{ matrix.bits }}
          path: |
            root.log
            profile-root-pilot.json
