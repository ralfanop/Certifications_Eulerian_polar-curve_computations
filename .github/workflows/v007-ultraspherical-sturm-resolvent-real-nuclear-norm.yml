name: V007 real Sturm resolvent nuclear projective infimum

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventRealNuclearNorm.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventRealNuclearClass.lean'
      - '.github/workflows/v007-ultraspherical-sturm-resolvent-real-nuclear-norm.yml'
  workflow_dispatch:

jobs:
  real-nuclear-infimum:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then exit 0; fi
            sleep "$((attempt * 8))"
          done
          exit 1
      - name: Prepare exact Mathlib dependencies
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Certify real nuclear universal cost upper bound and actual Sturm trace bound
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleResolventRealNuclearNorm 2>&1 | tee /tmp/v007-real-nuclear-norm.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-nuclear-norm.log; then
            echo '::error::Nonstandard axiom in real Hilbert nuclear norm proof.'
            exit 1
          fi
          for theorem in RealNuclearCosts.nonneg RealNuclearCosts.bddBelow realNuclearInfimum_le_cost sturmRealClosedResolvent_nuclearInfimum_le_spectralTrace; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-real-nuclear-norm.log
          done
          echo 'Real nuclear universal infimum upper bound kernel-certified.'
