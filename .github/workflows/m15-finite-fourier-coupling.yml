name: M15 finite Fourier coupling candidate
on:
  push:
    branches:
      - draft/m15-finite-fourier-coupling-20261113
      - draft/m15-weighted-fourier-marginal-20261113
    paths:
      - 'lean/Manuscript15/FiniteFourierCoupling.lean'
      - '.github/workflows/m15-finite-fourier-coupling.yml'
  pull_request:
    paths:
      - 'lean/Manuscript15/FiniteFourierCoupling.lean'
      - '.github/workflows/m15-finite-fourier-coupling.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Retrieve pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake exe cache get
      - name: Compile and audit finite Fourier coupling
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean Manuscript15/FiniteFourierCoupling.lean 2>&1 | tee /tmp/m15-finite-coupling.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:' /tmp/m15-finite-coupling.log; then exit 1; fi
          grep -F 'Manuscript15.finite_cosine_phase_transport' /tmp/m15-finite-coupling.log
          grep -F 'Manuscript15.finite_sine_phase_transport' /tmp/m15-finite-coupling.log
          grep -F 'Manuscript15.finite_weighted_cosine_marginal_transport' /tmp/m15-finite-coupling.log
          grep -F 'Manuscript15.finite_weighted_sine_marginal_transport' /tmp/m15-finite-coupling.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-finite-fourier-coupling-log
          path: /tmp/m15-finite-coupling.log
