name: V007 Gegenbauer Sturm full monomial triangular action

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonomials.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvillePolynomialCore.lean'
      - '.github/workflows/v007-ultraspherical-sturm-monomials.yml'
  workflow_dispatch:

jobs:
  sturm-polynomial-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit triangular monomial differential action
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleMonomials 2>&1 | tee /tmp/v007-sturm-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleMonomials.lean 2>&1 | tee /tmp/v007-sturm-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-sturm-build.log /tmp/v007-sturm-axioms.log; then
            echo '::error::Forbidden axiom in polynomial Sturm-Liouville core.'
            exit 1
          fi
          grep -F "sturmPolynomial_smul' depends on axioms:" /tmp/v007-sturm-axioms.log
          grep -F "sturmPolynomial_sub' depends on axioms:" /tmp/v007-sturm-axioms.log
          grep -F "sturmPolynomial_X_pow_succ_succ' depends on axioms:" /tmp/v007-sturm-axioms.log
          echo 'V007 ultraspherical full monomial triangular formula compiled and audited.'
