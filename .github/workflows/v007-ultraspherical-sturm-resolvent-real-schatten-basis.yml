name: V007 real Gegenbauer Sturm resolvent S1 S2 basis operator criteria

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventRealSchattenBasis.lean'
      - '.github/workflows/v007-ultraspherical-sturm-resolvent-real-schatten-basis.yml'
  workflow_dispatch:

jobs:
  sturm-resolvent-real-schatten-basis:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then exit 0; fi
            sleep "$((attempt * 8))"
          done
          exit 1
      - name: Prepare exact Mathlib dependencies
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Certify real Hilbert L2 trace diagonal and HS operator basis
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleResolventRealSchattenBasis 2>&1 | tee /tmp/gf-sturm-finite-truncations.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/gf-sturm-finite-truncations.log; then
            echo '::error::Nonstandard axiom in real Hilbert S1 S2 operator basis criteria.'
            exit 1
          fi
          for theorem in sturmRealPositiveResolvent_basis_inner_diagonal sturmRealPositiveResolvent_positive_trace_diagonal_summable sturmRealPositiveResolvent_basis_norm_sq sturmRealPositiveResolvent_isHS_on_actual_basis sturmRealPositiveResolvent_actual_basis_trace_eq; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/gf-sturm-finite-truncations.log
          done
          echo 'Actual real Gegenbauer resolvent positive trace and HS basis criteria kernel-certified.'
