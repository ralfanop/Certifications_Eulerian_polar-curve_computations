name: M12 Krein editorial Arb exact digits
on:
  pull_request:
    paths:
      - 'numerics/arb/m12_krein_editorial_million.py'
      - '.github/workflows/m12-krein-editorial-arb.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact head and strict certification
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          python -m pip install python-flint==0.9.0
          python numerics/arb/m12_krein_editorial_million.py 2>&1 | tee m12-krein-editorial.log
          grep -F 'MILLION SUCCESS m12-krein-editorial checks 4' m12-krein-editorial.log
          test "$(grep -c '1000001 fixed decimal places: PASS' m12-krein-editorial.log)" -eq 4
          grep -F 'EXACT RATIONAL SPECIALIZATIONS PASS 1/2, 3' m12-krein-editorial.log
          gzip -t million-enclosures.jsonl.gz m12-krein-fixed-endpoints.jsonl.gz
          sha256sum million-enclosures.jsonl.gz m12-krein-fixed-endpoints.jsonl.gz million-m12-krein-editorial.json m12-krein-editorial.log > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: m12-krein-editorial-million
          path: |
            million-enclosures.jsonl.gz
            m12-krein-fixed-endpoints.jsonl.gz
            million-m12-krein-editorial.json
            m12-krein-editorial.log
            SHA256SUMS
          compression-level: 0
          if-no-files-found: error
