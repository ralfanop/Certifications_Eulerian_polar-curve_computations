name: Manuscript 14 — Lean 4 certificate of the displays rewritten in versions 14.95-14.104

# Manuscript 14, versions 14.95-14.104 (8 November 2026): the monic form x^4 - x^2/2 + 1/32 of (139), its
# discriminant 1/128 and its relation to 32x^4 - 16x^2 + 1, the root x_0 of (141), Bender's (144) with the
# forms (145)-(146), the discriminant on (145)-(146), (148), the fraction form of (137), and (128)-(129) from
# Mathar's L_2(s, chi_1) = (1 - 2^(-s)) zeta(s) taken as a hypothesis. The module imports only the pinned
# Mathlib. The job fails on any compile error, on any `sorry`, and on any axiom other than propext,
# Classical.choice and Quot.sound in the eleven audited statements.

on:
  push:
    branches:
      - manuscript14-v14104-cert-20261108
    paths:
      - 'lean/SpecialImaginaryPoint/V14104AdditionsCertificate.lean'
      - '.github/workflows/manuscript14-v14104-lean.yml'
  workflow_dispatch:

jobs:
  lean:
    name: Lean 4 kernel check of the versions-14.95-14.104 certificate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install repository-pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Retrieve pinned Mathlib cache
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-check the versions-14.95-14.104 certificate and audit its axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -M16768 SpecialImaginaryPoint/V14104AdditionsCertificate.lean 2>&1 | tee /tmp/v14104.log
          if grep -nE '^[^ ]+:[0-9]+:[0-9]+: error' /tmp/v14104.log; then
            echo '::error::Compile error in the versions-14.95-14.104 certificate'
            exit 1
          fi
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' -e 'declaration uses' /tmp/v14104.log; then
            echo '::error::Forbidden axiom or sorry in the versions-14.95-14.104 certificate'
            exit 1
          fi
          # Lean wraps long axiom lists over two lines: join the log before counting.
          tr '\n' ' ' < /tmp/v14104.log | grep -oE "depends on axioms: \[[^]]*\]" | sed -E 's/ +/ /g' > /tmp/v14104.axioms || true
          n_all="$(grep -c "depends on axioms" /tmp/v14104.axioms || true)"
          n_std="$(grep -cE "depends on axioms: \[((propext|Classical\.choice|Quot\.sound)(, )?)+\]" /tmp/v14104.axioms || true)"
          echo "audited statements: $n_all, of which within the standard three axioms: $n_std"
          test "$n_all" -eq 11
          test "$n_std" -eq 11
          echo 'Versions 14.95-14.104: no sorry, no sorryAx, no Lean.ofReduceBool; eleven audited statements'
      - name: Upload Lean log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript14-v14104-lean
          path: /tmp/v14104.log
          if-no-files-found: ignore
