name: V007 intrinsic Gaussian Fock Riesz closed exponential kernel

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GaussianAreaIntrinsicRieszClosedForm.lean'
      - '.github/workflows/v007-fock-riesz-closed-form.yml'
  workflow_dispatch:

jobs:
  intrinsic-riesz-closed-form:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version
      - name: Restore locked Mathlib cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile complex exponential Riesz kernel and audit axioms
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GaussianAreaIntrinsicRieszClosedForm 2>&1 | tee /tmp/v007-riesz-exponential.log
          lake env lean -M16768 GegenbauerFock/GaussianAreaIntrinsicRieszClosedForm.lean 2>&1 | tee -a /tmp/v007-riesz-exponential.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-riesz-exponential.log; then
            echo "::error::Forbidden axiom in exponential reproducing-kernel proof."
            exit 1
          fi
          grep -F "intrinsicFock_coherent_coordinate_inner' depends on axioms:" /tmp/v007-riesz-exponential.log
          grep -F "intrinsicRieszKernel_closed_form' depends on axioms:" /tmp/v007-riesz-exponential.log
          echo 'V007 actual intrinsic Fock Riesz kernel equals complex exponential: certified.'
