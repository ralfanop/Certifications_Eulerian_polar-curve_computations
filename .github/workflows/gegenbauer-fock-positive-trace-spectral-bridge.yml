name: V007 positive trace basis-independent diagonal spectral sum bridge

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/PositiveTraceDiagonalSpectralBridge.lean'
      - '.github/workflows/gegenbauer-fock-positive-trace-spectral-bridge.yml'
  workflow_dispatch:

jobs:
  positive-trace-spectral:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Lean toolchain with retries
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then
              ready=1
              break
            fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore exact pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit positive trace spectral sum bridge
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.PositiveTraceDiagonalSpectralBridge 2>&1 | tee /tmp/v007-positive-trace.log
          lake env lean -M16768 GegenbauerFock/PositiveTraceDiagonalSpectralBridge.lean 2>&1 | tee /tmp/v007-positive-trace-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-positive-trace.log /tmp/v007-positive-trace-axioms.log; then
            echo "::error::Forbidden axiom in positive trace spectral certificate."
            exit 1
          fi
          grep -F "positiveTrace_diagonal_summable' depends on axioms:" /tmp/v007-positive-trace-axioms.log
          grep -F "positiveTrace_traceNorm_eq_diagonal_tsum' depends on axioms:" /tmp/v007-positive-trace-axioms.log
          grep -F "positiveTrace_diagonalValues_summable' depends on axioms:" /tmp/v007-positive-trace-axioms.log
          grep -F "positiveTrace_diagonalValues_tsum_eq_traceNorm' depends on axioms:" /tmp/v007-positive-trace-axioms.log
          echo 'V007 positive trace diagonal spectral sum bridge: kernel and axioms checked.'
