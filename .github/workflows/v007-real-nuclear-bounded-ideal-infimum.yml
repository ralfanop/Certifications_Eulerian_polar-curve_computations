name: V007 real nuclear S1 sharp universal two-sided ideal norm

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/RealNuclearBoundedIdealInfimum.lean'
      - 'lean/GegenbauerFock/RealNuclearBoundedLeftIdeal.lean'
      - '.github/workflows/v007-real-nuclear-bounded-ideal-infimum.yml'
  workflow_dispatch:

jobs:
  nuclear-bounded-ideal-infimum:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then exit 0; fi
            sleep "$((attempt * 8))"
          done
          exit 1
      - name: Prepare pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Certify universal real nuclear S1 two-sided projective norm inequality
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealNuclearBoundedIdealInfimum 2>&1 | tee /tmp/v007-real-bounded-ideal-infimum.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-bounded-ideal-infimum.log; then
            echo '::error::Nonstandard axiom in real nuclear universal ideal norm proof.'
            exit 1
          fi
          for theorem in realNuclearInfimum_bounded_two_sided_le; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-real-bounded-ideal-infimum.log
          done
          echo 'Real nuclear universal two-sided ideal norm inequality kernel-certified.'
