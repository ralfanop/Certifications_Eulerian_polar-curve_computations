name: V007 compact closed Sturm resolvent quadratic operator norm rate

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventCompactQuadraticRate.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventCompactExact.lean'
      - '.github/workflows/v007-ultraspherical-sturm-compact-quadratic-rate.yml'
  workflow_dispatch:

jobs:
  compact-quadratic-rate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then exit 0; fi
            sleep "$((attempt * 8))"
          done
          exit 1
      - name: Prepare exact Mathlib dependencies
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Verify quadratic norm rate, operator norm convergence and axiom audit
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleResolventCompactQuadraticRate 2>&1 | tee /tmp/v007-sturm-compact-quadratic-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleResolventCompactQuadraticRate.lean 2>&1 | tee /tmp/v007-sturm-compact-quadratic-audit.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-sturm-compact-quadratic-build.log /tmp/v007-sturm-compact-quadratic-audit.log; then
            echo '::error::Forbidden axiom detected in quadratic operator norm rate.'
            exit 1
          fi
          for theorem in sturmRealClosedResolvent_finite_tail_quadratic_rate sturmRealClosedResolvent_truncations_tendsto_opNorm; do
            grep -F "${theorem}' depends on axioms:" /tmp/v007-sturm-compact-quadratic-audit.log
          done
          echo 'V007 actual closed Sturm compact resolvent quadratic rate and norm convergence kernel-certified.'
