name: Manuscript 15 — Figure 1 exact Eulerian apex angle
on:
  push:
    branches:
      - manuscript15-figure1-n3-geometry-20261111
    paths:
      - 'lean/Manuscript15/Figure1ApexGeometry.lean'
      - '.github/workflows/manuscript15-figure1-n3-geometry.yml'
  pull_request:
    paths:
      - 'lean/Manuscript15/Figure1ApexGeometry.lean'
      - '.github/workflows/manuscript15-figure1-n3-geometry.yml'
  workflow_dispatch:
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors \
            --retry-delay 5 --connect-timeout 20 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
      - name: Fetch pinned Mathlib artifacts
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build inherited Eulerian-number recurrence
        working-directory: lean
        run: lake build EulerianCert.Bracket
      - name: Kernel-check n=3 profile apex geometry
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean Manuscript15/Figure1ApexGeometry.lean 2>&1 | tee /tmp/m15-apex-n3.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/m15-apex-n3.log; then
            echo '::error::Forbidden axiom'
            exit 1
          fi
          for decl in eulerian_n3_numbers eulerian_n3_probability_mass eulerian_n3_left_slope eulerian_n3_right_slope eulerian_n3_apex_vector_data eulerian_n3_apex_cosine_quotient eulerian_n3_tan_half_angle; do
            grep -F "Manuscript15.$decl" /tmp/m15-apex-n3.log
          done
      - name: Upload audited Lean source log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript15-eulerian-n3-figure1-apex-lean
          path: /tmp/m15-apex-n3.log
