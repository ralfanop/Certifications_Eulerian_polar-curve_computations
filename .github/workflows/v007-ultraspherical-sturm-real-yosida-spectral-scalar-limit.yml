name: V007 Gegenbauer Yosida spectral scalar limit

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealYosidaSpectralScalarLimit.lean'
      - '.github/workflows/v007-ultraspherical-sturm-real-yosida-spectral-scalar-limit.yml'
  workflow_dispatch:

jobs:
  yosida-spectral-scalar-limit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit Gegenbauer Yosida spectral scalar limit
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealYosidaSpectralScalarLimit 2>&1 | tee /tmp/v007-scalar-limit-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealYosidaSpectralScalarLimit.lean 2>&1 | tee /tmp/v007-scalar-limit-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-scalar-limit-build.log /tmp/v007-scalar-limit-axioms.log; then
            echo '::error::Forbidden axiom in Gegenbauer Yosida scalar limit.'
            exit 1
          fi
          grep -F "sturmRealYosida_scalar_ratio_tendsto_one' depends on axioms:" /tmp/v007-scalar-limit-axioms.log
          grep -F "sturmRealYosida_eigenmode_exponential_tendsto' depends on axioms:" /tmp/v007-scalar-limit-axioms.log
          echo 'V007 Gegenbauer Yosida degreewise exponential limit: kernel-certified.'
