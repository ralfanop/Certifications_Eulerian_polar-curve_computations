name: "Priority 3 — uniqueness of continuous universal Fredholm extension"

on:
  push:
    branches:
      - manuscript14-priority3-universal-continuous-uniqueness-20261110
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3UniversalContinuousUniqueness.lean'
      - '.github/workflows/manuscript14-priority3-universal-continuous-uniqueness.yml'
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3UniversalContinuousUniqueness.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3UniversalNuclearDensity.lean'
      - '.github/workflows/manuscript14-priority3-universal-continuous-uniqueness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Uniqueness of trace-norm continuous extension — two kernel audits
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build actual CFC S1 finite nuclear density dependency
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          lake env lean -M16768 \
            -o .lake/build/lib/lean/SpecialImaginaryPoint/V14119Priority3ArbitraryNuclearRankOne.olean \
            SpecialImaginaryPoint/V14119Priority3ArbitraryNuclearRankOne.lean
          lake env lean -M16768 \
            -o .lake/build/lib/lean/SpecialImaginaryPoint/V14119Priority3UniversalNuclearDensity.olean \
            SpecialImaginaryPoint/V14119Priority3UniversalNuclearDensity.lean
      - name: Compile universal continuous determinant uniqueness
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -M16768 \
            SpecialImaginaryPoint/V14119Priority3UniversalContinuousUniqueness.lean 2>&1 | tee /tmp/p3-uniqueness.log
      - name: Audit two named Lean theorems — no nonstandard axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          log=pathlib.Path("/tmp/p3-uniqueness.log").read_text()
          prefix="Manuscript14Priority3.UniversalContinuousUniqueness."
          names=[
            "continuousAt_functionals_unique_of_finiteNuclear",
            "continuous_functionals_ext_of_finiteNuclear",
          ]
          reports={}
          for m in re.finditer(r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms",log,re.MULTILINE):
            reports[m.group(1) or m.group(3)]={x.strip() for x in (m.group(2) or "").split(",") if x.strip()}
          allowed={"propext","Quot.sound","Classical.choice"}
          for suffix in names:
            n=prefix+suffix
            assert n in reports, f"Missing audit for {n}"
            assert reports[n] <= allowed, f"Nonstandard axiom: {n}: {reports[n]-allowed}"
            print(n, sorted(reports[n]))
          assert "sorryAx" not in log and "Lean.ofReduceBool" not in log
          assert not re.search(r"\.lean:\d+:\d+: error",log)
          print("SUCCESS: uniqueness of all continuous universal extensions")
          PY
      - name: Upload Lean log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priority3-continuous-uniqueness-log
          path: /tmp/p3-uniqueness.log
          if-no-files-found: ignore
