name: V007 both Gram Weyl sequences - full weak convergence certificate

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/TwoSidedGramWeakConvergence.lean'
      - 'lean/GegenbauerFock/TwoSidedGramWeakOnDenseRange.lean'
      - '.github/workflows/gegenbauer-fock-gram-full-weak.yml'
  workflow_dispatch:

jobs:
  bilateral-gram-weak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exactly pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then break; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep "$((attempt * 8))"
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then break; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep "$((attempt * 8))"
          done
      - name: Prepare pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-check all Hilbert test-vector weak convergence statements
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.TwoSidedGramWeakConvergence 2>&1 | tee /tmp/v007-gram-full-weak.log
          for theorem in sourceGram_unit_approximate_zero_weakly_null outputGram_unit_approximate_zero_weakly_null two_sided_gram_unit_approximate_zero_weakly_null; do
            grep -qF "${theorem}' depends on axioms" /tmp/v007-gram-full-weak.log
          done
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-gram-full-weak.log; then
            echo '::error::Forbidden proof axiom in full weak convergence'
            exit 1
          fi
          echo 'V007 both true Gram Weyl sequences weakly converge to zero: audit passed.'
