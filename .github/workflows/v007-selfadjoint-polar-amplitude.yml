name: V007 genuine polar amplitude Hilbert selfadjointness

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/SelfAdjointPolarAmplitude.lean'
      - 'lean/GegenbauerFock/CompletePositiveSingularFamily.lean'
      - '.github/workflows/v007-selfadjoint-polar-amplitude.yml'
  workflow_dispatch:

jobs:
  selfadjoint-polar-amplitude:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit polar amplitude Hilbert selfadjointness
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.SelfAdjointPolarAmplitude 2>&1 | tee /tmp/v007-selfadjoint-polar-amplitude-build.log
          lake env lean -M16768 GegenbauerFock/SelfAdjointPolarAmplitude.lean 2>&1 | tee /tmp/v007-selfadjoint-polar-amplitude-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-selfadjoint-polar-amplitude-build.log /tmp/v007-selfadjoint-polar-amplitude-axioms.log; then
            echo '::error::Forbidden axiom in genuine polar amplitude selfadjointness.'
            exit 1
          fi
          grep -F "exists_selfadjoint_polar_amplitude_kummer' depends on axioms:" /tmp/v007-selfadjoint-polar-amplitude-axioms.log
          echo 'V007 polar amplitude selfadjointness verified and audited.'
