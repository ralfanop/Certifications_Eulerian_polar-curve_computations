name: Special Eulerian point i-sqrt2 Lean and Arb certificates

on:
  push:
    branches:
      - special-point-i-sqrt2-cert-20261103
    paths:
      - 'lean/SpecialImaginaryPoint/**'
      - 'numerics/arb/special_point_i_sqrt2_arb.py'
      - '.github/workflows/special-point-i-sqrt2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: special-point-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain via elan
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Pin and fetch Mathlib build cache
        working-directory: lean
        run: |
          lake update
          lake exe cache get
      - name: Kernel check and explicit axiom audit
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean SpecialImaginaryPoint/DenominatorRecurrence.lean 2>&1 | tee /tmp/special_point_lean.log
          lake env lean SpecialImaginaryPoint/FormalBorel.lean 2>&1 | tee -a /tmp/special_point_lean.log
          lake env lean SpecialImaginaryPoint/FormalBorelComplex.lean 2>&1 | tee -a /tmp/special_point_lean.log
          lake env lean SpecialImaginaryPoint/BorelAnalyticConvergence.lean 2>&1 | tee -a /tmp/special_point_lean.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/special_point_lean.log; then
            echo '::error::Forbidden axiom in Lean certificates'
            exit 1
          fi
      - name: Upload Lean audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: special-point-lean-audit
          path: /tmp/special_point_lean.log
          if-no-files-found: ignore

  arb:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install python-flint==0.9.0
      - name: Exact rational and 256-bit Arb checks
        run: python numerics/arb/special_point_i_sqrt2_arb.py | tee special_point_arb.log
      - name: Upload numerical log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: special-point-arb-log
          path: special_point_arb.log
          if-no-files-found: ignore
