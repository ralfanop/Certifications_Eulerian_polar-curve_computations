name: M12 5.14 averaged Frechet kernel PSD and decay
on:
  pull_request:
    paths:
      - 'lean/EulerianGrothendieck/UniformLanczos/Rate514AveragedKernel.lean'
      - '.github/workflows/m12-514-averaged-kernel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore pinned Lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile averaged Frechet kernel
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.24.0'
          ! grep -n -E '^\s*(axiom|opaque)\b|\b(sorry|admit|native_decide)\b' UniformLanczos/Rate514AveragedKernel.lean
          lake exe cache get
          lake build UniformLanczos.Rate514ConcreteResidual 2>&1 | tee /tmp/m12-averaged-deps.log
          lake env lean UniformLanczos/Rate514AveragedKernel.lean 2>&1 | tee /tmp/m12-averaged-kernel.log
      - name: Strict transitive axiom audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('/tmp/m12-averaged-kernel.log').read_text()
          assert not re.search(r'(^|\n).*: error:',s)
          assert 'sorryAx' not in s and 'Lean.ofReduceBool' not in s
          for n in ['averageKernel_symmetric','averageKernel_quadratic_integral',
                    'averageKernel_psd','averageKernel_decay','averageKernel_matrix_certificate']:
              full='UniformLanczos.Rate514AveragedKernel.'+n
              m=re.search(r"'"+re.escape(full)+r"' depends on axioms: \[([^\]]*)\]",s)
              if m: a={x.strip() for x in m.group(1).split(',') if x.strip()}
              else:
                  assert "'"+full+"' does not depend on any axioms" in s,full
                  a=set()
              assert a<={'propext','Classical.choice','Quot.sound'},(full,a)
              print('PASS',full,sorted(a))
          print('M12 AVERAGED KERNEL MATRIX CERTIFICATE SUCCESS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-514-averaged-kernel
          path: |
            /tmp/m12-averaged-deps.log
            /tmp/m12-averaged-kernel.log
