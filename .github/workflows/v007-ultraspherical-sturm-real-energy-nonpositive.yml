name: V007 genuine real Sturm Dirichlet energy and closed operator nonpositivity

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealEnergyNonpositive.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvillePolynomialEnergyLeibniz.lean'
      - '.github/workflows/v007-ultraspherical-sturm-real-energy-nonpositive.yml'
  workflow_dispatch:

jobs:
  true-real-Sturm-nonpositive:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit real Dirichlet energy of closed ultraspherical Sturm
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealEnergyNonpositive 2>&1 | tee /tmp/v007-real-sturm-energy-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealEnergyNonpositive.lean 2>&1 | tee /tmp/v007-real-sturm-energy-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-sturm-energy-build.log /tmp/v007-real-sturm-energy-axioms.log; then
            echo '::error::Forbidden axiom in concrete real Sturm closed energy nonpositivity.'
            exit 1
          fi
          grep -F "sturmPolynomial_dirichlet_energy_integral' depends on axioms:" /tmp/v007-real-sturm-energy-axioms.log
          grep -F "sturmPolynomial_dirichlet_energy_nonneg' depends on axioms:" /tmp/v007-real-sturm-energy-axioms.log
          grep -F "sturmRealPartialOperator_nonpositive' depends on axioms:" /tmp/v007-real-sturm-energy-axioms.log
          grep -F "sturmRealPartialOperator_closure_nonpositive' depends on axioms:" /tmp/v007-real-sturm-energy-axioms.log
          echo 'V007 actual real closed ultraspherical Sturm is nonpositive by exact Dirichlet energy.'
