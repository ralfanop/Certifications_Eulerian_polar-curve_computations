name: V007 Section 7 Gegenbauer-Fock intertwining and ladder form (13, Thm 7.2, Prop 7.5)
on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/Section7Intertwining.lean'
      - '.github/workflows/v007-section7-intertwining.yml'
  workflow_dispatch:
jobs:
  section7-intertwining:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit V007 Section 7 Gegenbauer-Fock intertwining and ladder form (13, Thm 7.2, Prop 7.5)
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.Section7Intertwining 2>&1 | tee /tmp/section7-intertwining-build.log
          lake env lean -M16768 GegenbauerFock/Section7Intertwining.lean 2>&1 | tee /tmp/section7-intertwining-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/section7-intertwining-build.log /tmp/section7-intertwining-axioms.log; then
            echo '::error::Forbidden axiom in Section7Intertwining.'
            exit 1
          fi
          grep -F "GegenbauerFock.Section7Intertwining.mom_gegenDiff' depends on axioms:" /tmp/section7-intertwining-axioms.log
          grep -F "GegenbauerFock.Section7Intertwining.G_hasDerivAt' depends on axioms:" /tmp/section7-intertwining-axioms.log
          grep -F "GegenbauerFock.Section7Intertwining.fockDiff_G_eq' depends on axioms:" /tmp/section7-intertwining-axioms.log
          grep -F "GegenbauerFock.Section7Intertwining.intertwining' depends on axioms:" /tmp/section7-intertwining-axioms.log
          grep -F "GegenbauerFock.Section7Intertwining.fockDiff_eq_ladder' depends on axioms:" /tmp/section7-intertwining-axioms.log
          grep -F "GegenbauerFock.Section7Intertwining.fockDiff_normalizedMonomial' depends on axioms:" /tmp/section7-intertwining-axioms.log
          echo 'V007 Section 7 Gegenbauer-Fock intertwining and ladder form (13, Thm 7.2, Prop 7.5): kernel-certified.'
