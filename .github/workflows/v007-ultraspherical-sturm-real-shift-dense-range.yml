name: V007 genuine real L2 Sturm shifted dense range

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealShiftDenseRange.lean'
      - '.github/workflows/v007-ultraspherical-sturm-real-shift-dense-range.yml'
  workflow_dispatch:

jobs:
  true-real-Sturm-shift-dense-range:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit genuine real Sturm I-L dense range
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealShiftDenseRange 2>&1 | tee /tmp/v007-sturm-shift-range-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealShiftDenseRange.lean 2>&1 | tee /tmp/v007-sturm-shift-range-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-sturm-shift-range-build.log /tmp/v007-sturm-shift-range-axioms.log; then
            echo '::error::Forbidden axiom in true real Sturm shifted dense range.'
            exit 1
          fi
          grep -F "sturmRealPartialShift_polynomial_preimage' depends on axioms:" /tmp/v007-sturm-shift-range-axioms.log
          grep -F "sturmRealPartialShift_denseRange' depends on axioms:" /tmp/v007-sturm-shift-range-axioms.log
          echo 'V007 genuine real L2 shifted Sturm dense range kernel-certified.'
