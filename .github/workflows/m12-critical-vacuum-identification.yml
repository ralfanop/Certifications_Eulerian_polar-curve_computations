name: M12 actual critical vacuum projection
on:
  pull_request:
    paths:
      - 'lean/EulerianGrothendieck/CriticalWindowVacuumIdentification.lean'
      - '.github/workflows/m12-critical-vacuum-identification.yml'
  workflow_dispatch:
jobs:
  vacuum:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore Lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact intrinsic vacuum bridge
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          lake exe cache get
          lake build EulerianGrothendieck.FockVacuumProjection
          mkdir -p .lake/build/lib/lean
          for module in CriticalWindowQuartic CriticalWindowGlobalMGF CriticalWindowComplexMGF CriticalWindowAnalyticRemainder CriticalWindowFockDomination CriticalWindowGammaVacuum CriticalWindowFinalAssembly CriticalWindowPointwise CriticalWindowDCT; do
            lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean"
          done
          lake env lean CriticalWindowVacuumIdentification.lean 2>&1 | tee /tmp/m12-vacuum.log
      - name: Strict declaration audit
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          data=Path('/tmp/m12-vacuum.log').read_text()
          src=Path('lean/EulerianGrothendieck/CriticalWindowVacuumIdentification.lean').read_text()
          assert not re.search(r'\b(sorry|admit|axiom|opaque|native_decide)\b',src)
          assert ': error' not in data and 'sorryAx' not in data and 'Lean.ofReduceBool' not in data
          allowed={'propext','Classical.choice','Quot.sound'}
          names=['rE_eq_profile','density_kernel','density_integrable','original_eq_complex_integral',
                 'original_eq_probability','original_eq_state_norm','vacuum_eq_original_inv','eventual_alpha_pos',
                 'actual_vacuum_critical_limit','actual_probability_critical_limit','actual_vacuum_at_critical']
          for name in names:
              full='M12CriticalVacuum.'+name
              m=re.search(r"'"+re.escape(full)+r"' depends on axioms: \[([^\]]*)\]",data)
              if m:
                  assert {x.strip() for x in m.group(1).split(',') if x.strip()}<=allowed,full
              else:
                  assert "'"+full+"' does not depend on any axioms" in data,full
              print('AXIOM AUDIT SUCCESS',full)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-critical-vacuum-audit
          path: /tmp/m12-vacuum.log
