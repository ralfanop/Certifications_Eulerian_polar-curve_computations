name: V007 genuine Fock Tikhonov Hilbert energy sharp noise
on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/CanonicalCFCGramTikhonovHilbertEnergy.lean'
      - '.github/workflows/v007-tikhonov-hilbert-energy-noise.yml'
  workflow_dispatch:
concurrency:
  group: v007-tikhonov-hilbert-energy-${{ github.sha }}
  cancel-in-progress: false
jobs:
  hilbert-noise:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile genuine Hilbert energy and sharp Fock-data noise theorems
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.CanonicalCFCGramTikhonovHilbertEnergy 2>&1 | tee /tmp/v007-tikhonov-energy-build.log
          lake env lean -M16768 GegenbauerFock/CanonicalCFCGramTikhonovHilbertEnergy.lean 2>&1 | tee /tmp/v007-tikhonov-energy-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-tikhonov-energy-build.log /tmp/v007-tikhonov-energy-axioms.log; then
            echo '::error::Forbidden axiom in genuine Tikhonov Hilbert energy.'
            exit 1
          fi
          for theorem in sourceGramTikhonovReconstructor_normal_equation sourceGramTikhonovReconstructor_energy_le sourceGramTikhonovReconstructor_pointwise_noise_le sourceGramTikhonovReconstructor_opNorm_le sourceGramTikhonovReconstructor_noisy_bound_explicit; do
            grep -F "${theorem}' depends on axioms:" /tmp/v007-tikhonov-energy-axioms.log
          done
          echo 'V007 genuine Hilbert Tikhonov energy and 1/(2 sqrt eps) Fock noise bound kernel-certified.'
