name: V007 true intrinsic Gegenbauer-Fock Gram pairing certificate

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireGramPairing.lean'
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireFockOperator.lean'
      - '.github/workflows/v007-gegenbauer-intrinsic-gram-pairing.yml'
  workflow_dispatch:

jobs:
  gram-pairing-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile genuine intrinsic Fock Gram pairing and audit kernel axioms
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireGramPairing 2>&1 | tee /tmp/v007-true-intrinsic-gram.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireGramPairing.lean 2>&1 | tee -a /tmp/v007-true-intrinsic-gram.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-true-intrinsic-gram.log; then
            echo "::error::Forbidden axioms in intrinsic Gaussian Fock Gram pairing"
            exit 1
          fi
          grep -F "C_intrinsicEntire_inner_eq' depends on axioms:" /tmp/v007-true-intrinsic-gram.log
          grep -F "C_intrinsicEntire_gram_pairing' depends on axioms:" /tmp/v007-true-intrinsic-gram.log
          grep -F "C_intrinsicEntire_gram_energy' depends on axioms:" /tmp/v007-true-intrinsic-gram.log
          echo 'V007 true intrinsic Gaussian Fock Gram pairing: Lean kernel audit clean.'
