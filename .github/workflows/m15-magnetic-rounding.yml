name: M15 magnetic rounding and primal exact-head Lean audit
on:
  pull_request:
    paths:
      - 'lean/Manuscript15/MagneticGibbsRounding20261117.lean'
      - 'lean/Manuscript15/MagneticGibbsGraphPrimalBridge20261117.lean'
      - 'lean/Manuscript15/MagneticGibbsGraphCoupling20261117.lean'
      - 'lean/Manuscript15/MagneticGibbsTransport20261116.lean'
      - 'lean/Manuscript15/Section27PrimalWasserstein.lean'
      - '.github/workflows/m15-magnetic-rounding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Lean and Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
          mkdir -p .lake/build/lib/lean/Manuscript15
          git rev-parse HEAD | tee /tmp/m15-magnetic-rounding.log
          for mod in Section27PrimalWasserstein MagneticGibbsTransport20261116 MagneticGibbsGraphCoupling20261117 MagneticGibbsGraphPrimalBridge20261117; do
            lake env lean -M16768 -o ".lake/build/lib/lean/Manuscript15/$mod.olean" "Manuscript15/$mod.lean" 2>&1 | tee -a /tmp/m15-magnetic-rounding.log
          done
          lake env lean -M16768 Manuscript15/MagneticGibbsRounding20261117.lean 2>&1 | tee -a /tmp/m15-magnetic-rounding.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/m15-magnetic-rounding.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log=Path('/tmp/m15-magnetic-rounding.log').read_text()
          names=['Manuscript15.MagneticGibbs.GraphPrimalBridge.graph_primal_infimum']
          names += ['Manuscript15.MagneticGibbs.Rounding.'+s for s in ['measurable_roundEnergy','round_cell','round_nearest','round_displacement_le_one','round_preimage_cell','round_atom_mass','coupling_odd_ae','coupling_nearest_ae','graph_cost_eq_ae','round_wasserstein1']]
          for name in names:
              m=re.findall(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]",log,re.S)
              assert m or ("'"+name+"' does not depend on any axioms") in log, name
              for group in m:
                  assert {s.strip() for s in group.split(',') if s.strip()} <= {'propext','Classical.choice','Quot.sound'}, name
          print('AXIOM AUDIT SUCCESS',len(names))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-magnetic-rounding-lean-log
          path: /tmp/m15-magnetic-rounding.log
