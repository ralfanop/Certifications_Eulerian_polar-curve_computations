name: V007 review - full GegenbauerFock build and axiom audit

on:
  push:
    branches:
      - v007-review-20261031
    paths:
      - '.github/workflows/v007-review-audit.yml'
      - 'lean/GFAxiomAudit.lean'
      - 'lean/GFReviewModules.txt'
      - 'lean/GFTargetedAudit.lean'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v007-review-audit
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and the pinned toolchain
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib at the pinned revision, with its build cache
        working-directory: lean
        run: |
          set -euo pipefail
          lean --version
          lake update
          lake exe cache get
      - name: Targeted build and axiom check of the declarations cited in V007
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p logs/v007_review
          lake build $(cat GFTargetedModules.txt) 2>&1 | tail -5
          lake env lean GFTargetedAudit.lean 2>&1 | tee logs/v007_review/targeted_axioms.log
          ! grep -E 'sorryAx|ofReduceBool|unknown (constant|identifier)|error' logs/v007_review/targeted_axioms.log
      - name: Build every GegenbauerFock module
        continue-on-error: true
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p logs/v007_review
          wc -l < GFReviewModules.txt
          set +e
          ( time lake build $(cat GFReviewModules.txt) ) > logs/v007_review/build.log 2>&1
          status=$?
          set -e
          tail -60 logs/v007_review/build.log
          grep -n -E '(^|\s)error(:|\b)|✖|Some required|failed' logs/v007_review/build.log | head -200 > logs/v007_review/build_errors.txt || true
          head -40 logs/v007_review/build_errors.txt | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          exit $status
      - name: Axiom audit of all GegenbauerFock declarations
        continue-on-error: true
        working-directory: lean
        run: |
          set -euo pipefail
          lake env lean GFAxiomAudit.lean 2>&1 | tee logs/v007_review/axioms.log
          grep -q 'RESULT: only propext, Classical.choice, Quot.sound' logs/v007_review/axioms.log
      - name: Commit the logs to the review branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tail -c 200000 lean/logs/v007_review/build.log > lean/logs/v007_review/build_tail.log || true
          for f in lean/logs/v007_review/build_tail.log lean/logs/v007_review/build_errors.txt lean/logs/v007_review/axioms.log lean/logs/v007_review/targeted_axioms.log; do
            [ -f "$f" ] && git add -f "$f"
          done
          git diff --cached --quiet || git commit -m "V007 review: build and axiom-audit logs (run ${{ github.run_id }})"
          git push || true
