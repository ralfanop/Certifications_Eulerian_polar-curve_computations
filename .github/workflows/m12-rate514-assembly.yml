name: M12 Theorem 5.14 assembly
on:
  pull_request:
    paths:
      - 'lean/EulerianGrothendieck/UniformLanczos/Rate514Assembly.lean'
      - '.github/workflows/m12-rate514-assembly.yml'
  push:
    branches: [main]
    paths:
      - 'lean/EulerianGrothendieck/UniformLanczos/Rate514Assembly.lean'
  workflow_dispatch:

jobs:
  rate514assembly:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore pinned Lean and Mathlib
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Source hygiene
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          for f in UniformLanczos/Rate514Assembly.lean; do
            ! grep -n -E '^\s*(axiom|opaque)\b' "$f"
            ! grep -n -w -E 'sorry|admit|native_decide' "$f"
          done
      - name: Check the Lemma 5.12 modules
        working-directory: lean/EulerianGrothendieck
        run: |
          set -euo pipefail
          lean --version
          lake exe cache get
          lake build UniformLanczos.Theorem514 UniformLanczos.Rate514Monotone
          lake env lean UniformLanczos/Rate514Assembly.lean 2>&1 | tee /tmp/m12-rate514-assembly.log
          git rev-parse HEAD
      - name: Strict individual axiom audit
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          text = Path('/tmp/m12-rate514-assembly.log').read_text()
          assert ': error' not in text, 'compilation error'
          assert "declaration uses 'sorry'" not in text
          assert 'sorryAx' not in text and 'Lean.ofReduceBool' not in text
          names = ['UniformLanczos.Rate514Assembly.' + n for n in (
              'dist_le_of_not_mem', 'hybrid_tail', 'residual_difference', 'mu_lower',
              'ω_dist_le3', 'residual_sum3', 'rate_assembly', 'theorem_5_14_conclusion')]
          for name in names:
              match = re.search(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", text)
              if match:
                  axioms = {x.strip() for x in match.group(1).split(',') if x.strip()}
              else:
                  assert "'" + name + "' does not depend on any axioms" in text, name
                  axioms = set()
              assert axioms <= allowed, (name, axioms)
              print('AXIOM AUDIT SUCCESS', name, sorted(axioms))
          print('AUDITED', len(names))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-rate514-assembly-audit
          path: /tmp/m12-rate514-assembly.log
