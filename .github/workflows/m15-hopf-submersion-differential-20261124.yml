name: M15 Hopf quadratic differential and horizontal metric Lean 4
on:
  pull_request:
    paths:
      - 'lean/Manuscript15/HopfSubmersionDifferential20261124.lean'
      - '.github/workflows/m15-hopf-submersion-differential-20261124.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-HEAD pinned Mathlib build and independent axiom audit
        working-directory: lean
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
          mkdir -p /tmp/m15-hopf-differential
          git rev-parse HEAD | tee /tmp/m15-hopf-differential/head.txt
          lake env lean -M16768 Manuscript15/HopfSubmersionDifferential20261124.lean 2>&1 | tee /tmp/m15-hopf-differential/lean.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          src=Path('Manuscript15/HopfSubmersionDifferential20261124.lean').read_text()
          log=Path('/tmp/m15-hopf-differential/lean.log').read_text()
          forbidden=re.compile(r'\b(sorry|sorryAx|admit|native_decide|unsafe)\b|(?m)^\s*axiom\s')
          assert not forbidden.search(src), "forbidden Lean source construct"
          assert not re.search(r'(sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.)',log), "Lean error or admitted proof"
          names=re.findall(r'^#print axioms (Manuscript15\.HopfDifferential20261124\.\w+)$',src,re.M)
          assert len(names)==20 and len(set(names))==20,(len(names),names)
          for name in names:
            match=re.search(re.escape("'"+name+"'")+r' depends on axioms: \[([^\]]*)\]',log,re.S)
            if match:
              axioms={x.strip() for x in match.group(1).split(',') if x.strip()}
              assert axioms <= {'propext','Classical.choice','Quot.sound'},(name,axioms)
            else:
              assert "'"+name+"' does not depend on any axioms" in log,name
          print("M15 HOPF DIFFERENTIAL EXACT-HEAD 20 AXIOM AUDITS SUCCESS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-hopf-submersion-differential-lean-log
          path: /tmp/m15-hopf-differential/
