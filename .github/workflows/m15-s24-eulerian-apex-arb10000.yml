name: "M15 S2.4 Eulerian apex Arb 10000-bit strict bound"
on:
  push:
    branches:
      - draft/m15-s24-eulerian-apex-arb10000-20261113
  pull_request:
    paths:
      - 'numerics/manuscript15_eulerian_apex_bound_arb10000.py'
      - '.github/workflows/m15-s24-eulerian-apex-arb10000.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arb10000:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Arb Python bindings
        run: python -m pip install 'python-flint==0.9.0'
      - name: Compile syntax
        run: python -m py_compile numerics/manuscript15_eulerian_apex_bound_arb10000.py
      - name: Check exact Eulerian slopes and Arb certified strict bound
        shell: bash
        run: |
          set -euo pipefail
          python numerics/manuscript15_eulerian_apex_bound_arb10000.py 2>&1 | tee /tmp/m15-apex-arb10000.log
          grep -F 'SUCCESS: exact finite slopes and N=10 strict Arb uniform apex bound, >=8182 bits' /tmp/m15-apex-arb10000.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manuscript15-eulerian-apex-arb10000
          path: /tmp/m15-apex-arb10000.log
          if-no-files-found: ignore
