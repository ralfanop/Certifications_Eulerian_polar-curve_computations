name: "Priority 3 — ambient-free sharp mixed Gram under linear independence"

on:
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3AmbientProjectionSharp.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3SquareAmbientMixedGramSharp.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3ComplexGramMinorBridge.lean'
      - '.github/workflows/manuscript14-priority3-ambient-projection-sharp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Arbitrary ambient dimension complex Hilbert sharp Gram — 1 exact kernel audit
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile original mixed Gram coefficient bridge
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          lake env lean -M16768 \
            -o .lake/build/lib/lean/SpecialImaginaryPoint/V14119Priority3ComplexGramMinorBridge.olean \
            SpecialImaginaryPoint/V14119Priority3ComplexGramMinorBridge.lean
      - name: Compile certified square-ambient Gram–Schmidt basis dependency
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -M16768 \
            -o .lake/build/lib/lean/SpecialImaginaryPoint/V14119Priority3SquareAmbientMixedGramSharp.olean \
            SpecialImaginaryPoint/V14119Priority3SquareAmbientMixedGramSharp.lean
      - name: Compile arbitrary ambient orthogonal-projection reduction
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -M16768 \
            SpecialImaginaryPoint/V14119Priority3AmbientProjectionSharp.lean 2>&1 | tee /tmp/p3-ambient-sharp-main.log
      - name: Audit exact projection theorem
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          log=pathlib.Path("/tmp/p3-ambient-sharp-main.log").read_text()
          name="Manuscript14Priority3.AmbientProjectionSharp.mixedGram_det_norm_le_sharp_of_linearIndependent"
          reports={}
          for m in re.finditer(r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms",log,re.MULTILINE):
            reports[m.group(1) or m.group(3)]={x.strip() for x in (m.group(2) or "").split(",") if x.strip()}
          assert name in reports, f"Missing kernel audit for {name}"
          allowed={"propext","Quot.sound","Classical.choice"}
          assert reports[name] <= allowed, f"Nonstandard axiom {reports[name]-allowed}"
          assert "sorryAx" not in log and "Lean.ofReduceBool" not in log
          assert not re.search(r"\.lean:\d+:\d+: error",log)
          print("SUCCESS: arbitrary ambient Hilbert complex Gram sharp bound for independent u")
          PY
      - name: Upload Lean log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priority3-ambient-sharp-projection-log
          path: /tmp/p3-ambient-sharp-main.log
          if-no-files-found: ignore
