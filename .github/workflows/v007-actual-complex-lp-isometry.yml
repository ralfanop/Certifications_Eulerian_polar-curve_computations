name: V007 actual real to complex L2 isometric inclusion

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleActualComplexLpIsometry.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleActualComplexLpDecomposition.lean'
      - '.github/workflows/v007-actual-complex-lp-isometry.yml'
  workflow_dispatch:

jobs:
  actual-complex-lp-isometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build actual complex L2 inclusion isometry and audit axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleActualComplexLpIsometry 2>&1 | tee /tmp/v007-complexLp-iso-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleActualComplexLpIsometry.lean 2>&1 | tee /tmp/v007-complexLp-iso-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-complexLp-iso-build.log /tmp/v007-complexLp-iso-axioms.log; then
            echo '::error::Forbidden axiom in real-to-complex weighted L2 isometry.'
            exit 1
          fi
          grep -F "realToComplexLp_norm_eq' depends on axioms:" /tmp/v007-complexLp-iso-axioms.log
          grep -F "realToComplexLp_injective' depends on axioms:" /tmp/v007-complexLp-iso-axioms.log
          echo 'V007 genuine weighted L2 real-to-complex norm and injection audited.'
