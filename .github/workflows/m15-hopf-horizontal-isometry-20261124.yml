name: M15 Hopf horizontal metric isometry exact-head Lean 4

on:
  pull_request:
    paths:
      - 'lean/Manuscript15/HopfHorizontalIsometry20261124.lean'
      - '.github/workflows/m15-hopf-horizontal-isometry-20261124.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  horizontal-metric:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Lean, actual Hopf derivative dependency, seven theorem audits
        working-directory: lean
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          mkdir -p /tmp/m15-hopf-horizontal
          git rev-parse HEAD | tee /tmp/m15-hopf-horizontal/head.txt
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
          mkdir -p .lake/build/lib/lean/Manuscript15
          lake env lean -M16768 \
            -o .lake/build/lib/lean/Manuscript15/HopfSubmersionDifferential20261124.olean \
            Manuscript15/HopfSubmersionDifferential20261124.lean 2>&1 | tee /tmp/m15-hopf-horizontal/dependency.log
          lake env lean -M16768 Manuscript15/HopfHorizontalIsometry20261124.lean 2>&1 | tee /tmp/m15-hopf-horizontal/lean.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          src=Path('Manuscript15/HopfHorizontalIsometry20261124.lean').read_text()
          log=Path('/tmp/m15-hopf-horizontal/lean.log').read_text()
          dep=Path('/tmp/m15-hopf-horizontal/dependency.log').read_text()
          forbidden=re.compile(r'\b(sorry|sorryAx|admit|native_decide|unsafe)\b|^\s*axiom\s',re.M)
          assert not forbidden.search(src), "no new axioms or unproved constructs"
          assert not re.search(r'(sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.)', log+dep)
          names=re.findall(r'^#print axioms (Manuscript15\.HopfHorizontalIsometry20261124\.\w+)$',src,re.M)
          assert len(names)==10 and len(set(names))==10,(len(names),names)
          for name in names:
              m=re.search(re.escape("'"+name+"'")+r" depends on axioms: \[([^\]]*)\]",log,re.S)
              if m:
                  actual={x.strip() for x in m.group(1).split(',') if x.strip()}
                  assert actual <= {'propext','Classical.choice','Quot.sound'},(name,actual)
              else:
                  assert "'"+name+"' does not depend on any axioms" in log,name
          print('M15 HOPF HORIZONTAL METRIC EXACT-HEAD LEAN SUCCESS 10 THEOREMS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-hopf-horizontal-lean-audit
          path: /tmp/m15-hopf-horizontal/
