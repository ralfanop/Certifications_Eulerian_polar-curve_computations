name: V007 simultaneous dual Gram exponential resolvent disk certificate

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/PhyslibDualGramsExponentialResolventDisk.lean'
      - 'lean/GegenbauerFock/KummerPositiveBounds.lean'
      - 'lean/GegenbauerFock/PhyslibDualGramsKummerAmbientInvertibility.lean'
      - '.github/workflows/gegenbauer-fock-physlib-dual-grams-exp-resolvent.yml'
  workflow_dispatch:

jobs:
  verify-exp-resolvent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt*8))"
          done
          test "$installed" = 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt*8))"
          done
          test "$ready" = 1
      - name: Restore fixed Mathlib manifest
        working-directory: lean
        run: lake update
      - name: Fetch fixed Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Kernel-check simultaneous exponential resolvent disk
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.PhyslibDualGramsExponentialResolventDisk 2>&1 | tee /tmp/gf-dual-grams-exp-resolvent.log
          grep -F "GegenbauerFock.GeneralUltrasphericalFock.dualGrams_ambient_one_sub_isUnit_exponential' depends on axioms:" /tmp/gf-dual-grams-exp-resolvent.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/gf-dual-grams-exp-resolvent.log; then
            echo '::error::Nonstandard axiom in simultaneous exponential resolvent.'
            exit 1
          fi
          echo 'Both actual source/output Gram ambient exponential resolvents kernel-audited.'
