name: V007 compact canonical Gegenbauer Sturm resolvent and sharp tail norm

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventCompactExact.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventFiniteRankTruncations.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventFiniteTruncationApply.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventFiniteTruncationCoordinates.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventFiniteTailLower.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventFiniteTailUpper.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventCompactnessBridge.lean'
      - '.github/workflows/v007-ultraspherical-sturm-resolvent-compact-exact.yml'
  workflow_dispatch:

jobs:
  sturm-resolvent-compact-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then exit 0; fi
            sleep "$((attempt * 8))"
          done
          exit 1
      - name: Prepare exact Mathlib dependencies
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Certify unconditional compactness and exact operator norm truncation error
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleResolventCompactExact 2>&1 | tee /tmp/gf-sturm-finite-truncations.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/gf-sturm-finite-truncations.log; then
            echo '::error::Nonstandard axiom in unconditional compact closed resolvent.'
            exit 1
          fi
          for theorem in sturmRealClosedResolvent_finite_tail_norm_eq sturmRealClosedResolvent_isCompactOperator; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/gf-sturm-finite-truncations.log
          done
          echo 'Full canonical Sturm resolvent compactness kernel-certified.'

# Recheck with kernel-certified finite rank compactness at commit 0fd91b77.
