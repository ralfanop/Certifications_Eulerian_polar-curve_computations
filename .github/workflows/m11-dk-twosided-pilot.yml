name: M11 curvature two-sided 10k pilot
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'numerics/arb/m11_dk_twosided.py'
      - '.github/workflows/m11-dk-twosided-pilot.yml'
  workflow_dispatch:
jobs:
  curvature-two-sided:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - order: 2048
            bits: 9000
            threshold: 5000
          - order: 3840
            bits: 16000
            threshold: 10000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact head and pin FLINT
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git rev-parse HEAD
          python -m pip install python-flint==0.9.0
      - name: Two-sided rigorous ODE continuation
        shell: bash
        run: |
          set -o pipefail
          python -u numerics/arb/m11_dk_twosided.py --bits ${{ matrix.bits }} --order ${{ matrix.order }} --panels 32 --minimum-bits ${{ matrix.threshold }} --adaptive --parallel | tee m11-dk-twosided.log
      - uses: actions/upload-artifact@v4
        with:
          name: m11-dk-twosided-${{ matrix.threshold }}
          path: |
            m11-dk-twosided.json
            m11-dk-twosided.log
