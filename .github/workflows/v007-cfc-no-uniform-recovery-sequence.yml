name: V007 CFC Fock Gram no uniform operator-norm recovery sequence

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/CanonicalCFCRootNoUniformRecoverySequence.lean'
      - '.github/workflows/v007-cfc-no-uniform-recovery-sequence.yml'
  workflow_dispatch:

concurrency:
  group: v007-cfc-no-uniform-recovery-sequence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cfc-no-uniform-recovery-sequence:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit nonuniform recovery obstruction
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.CanonicalCFCRootNoUniformRecoverySequence 2>&1 | tee /tmp/v007-cfc-no-uniform-build.log
          lake env lean -M16768 GegenbauerFock/CanonicalCFCRootNoUniformRecoverySequence.lean 2>&1 | tee /tmp/v007-cfc-no-uniform-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-cfc-no-uniform-build.log /tmp/v007-cfc-no-uniform-axioms.log; then
            echo '::error::Forbidden axiom in no-uniform-recovery theorem.'
            exit 1
          fi
          grep -F "no_opNorm_consistent_reconstruction_sequence_of_lower_bound' depends on axioms:" /tmp/v007-cfc-no-uniform-axioms.log
          grep -F "cfc_fock_gram_no_opNorm_consistent_reconstruction_sequence' depends on axioms:" /tmp/v007-cfc-no-uniform-axioms.log
          echo 'V007 nonuniform recovery obstruction fully audited.'
