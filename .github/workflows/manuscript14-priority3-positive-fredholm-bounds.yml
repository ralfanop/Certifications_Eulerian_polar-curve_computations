name: "Manuscript 14.119 Priority 3 — positive S1 Fredholm exponential bounds"

on:
  push:
    branches:
      - main
      - manuscript14-priority3-fredholm-positive-exponential-bounds-20261110
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3SpectralDetBridge.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3DirichletDiagonal.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3TraceClassModel.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3RankOneS1.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3S1Truncation.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3OperatorCompression.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3PositiveDiagonalFredholm.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3FredholmSectorFunctional.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3PositiveFredholmBounds.lean'
      - 'lean/SpecialImaginaryPoint/DirichletFiniteDeterminant.lean'
      - 'lean/SpecialImaginaryPoint/Section67ScalarCertificate.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - '.github/workflows/manuscript14-priority3-positive-fredholm-bounds.yml'
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3SpectralDetBridge.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3DirichletDiagonal.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3TraceClassModel.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3RankOneS1.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3S1Truncation.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3OperatorCompression.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3PositiveDiagonalFredholm.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3FredholmSectorFunctional.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3PositiveFredholmBounds.lean'
      - 'lean/SpecialImaginaryPoint/DirichletFiniteDeterminant.lean'
      - 'lean/SpecialImaginaryPoint/Section67ScalarCertificate.lean'
      - 'lean/lean-toolchain'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - '.github/workflows/manuscript14-priority3-positive-fredholm-bounds.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lean:
    name: CFC S1 positive Fredholm exponential bounds
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build V007 true Schatten S1 dependencies
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealComplexPositiveSpectralAutomaticTraceClassBridge GegenbauerFock.PositiveTraceDiagonalSpectralBridge GegenbauerFock.PhyslibTraceClassSeriesTailEstimate 2>&1 | tee /tmp/priority3-bounds-dependencies.log
      - name: Compile full operatorial determinant sector and new bounds
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          for f in DirichletFiniteDeterminant Section67ScalarCertificate V14119Priority3SpectralDetBridge V14119Priority3DirichletDiagonal V14119Priority3TraceClassModel V14119Priority3RankOneS1 V14119Priority3S1Truncation V14119Priority3OperatorCompression V14119Priority3PositiveDiagonalFredholm V14119Priority3FredholmSectorFunctional V14119Priority3PositiveFredholmBounds; do
            lake env lean -M16768 -o ".lake/build/lib/lean/SpecialImaginaryPoint/$f.olean" \
              "SpecialImaginaryPoint/$f.lean" 2>&1 | tee "/tmp/priority3-bounds-$f.log"
          done
      - name: Audit six genuine S1 determinant growth declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path("/tmp/priority3-bounds-V14119Priority3PositiveFredholmBounds.log").read_text()
          prefix = "Manuscript14Priority3.PositiveDiagonalFredholm."
          required = [
            "finiteRealShift_ge_one", "finiteRealShift_le_exp_sum",
            "determinant_ge_one", "determinant_le_exp_mass",
            "determinantOnSector_ge_one", "determinantOnSector_le_exp_traceNorm"
          ]
          found = {}
          for m in re.finditer(
              r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms",
              log, re.MULTILINE):
            found[m.group(1) or m.group(3)] = {
              s.strip() for s in (m.group(2) or "").split(",") if s.strip()
            }
          allowed = {"propext", "Quot.sound", "Classical.choice"}
          for suffix in required:
            name = prefix + suffix
            assert name in found, f"Missing kernel report: {name}"
            assert found[name] <= allowed, f"Nonstandard axioms in {name}: {found[name] - allowed}"
            print(name, sorted(found[name]))
          assert "sorryAx" not in log and "Lean.ofReduceBool" not in log
          assert not re.search(r"\.lean:\d+:\d+: error", log)
          print("SUCCESS: six unconditional positive-sector determinant growth theorems")
          PY
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priority3-positive-fredholm-bounds-logs
          path: /tmp/priority3-bounds-*.log
          if-no-files-found: ignore
