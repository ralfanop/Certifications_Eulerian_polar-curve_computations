name: V007 canonical CFC polar spectral cutoff strong recovery
on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/CanonicalCFCRootPolarCutoffStrongRecovery.lean'
      - 'lean/GegenbauerFock/CanonicalCFCSpectralCutoffStrongRecovery.lean'
      - '.github/workflows/v007-cfc-polar-cutoff-strong-recovery.yml'
  workflow_dispatch:

concurrency:
  group: v007-cfc-polar-cutoff-strong-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canonical-polar-cutoff-strong:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore exact pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile canonical CFC root cutoff and audit axioms
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.CanonicalCFCRootPolarCutoffStrongRecovery 2>&1 | tee /tmp/v007-polarcutoff-build.log
          lake env lean -M16768 GegenbauerFock/CanonicalCFCRootPolarCutoffStrongRecovery.lean 2>&1 | tee /tmp/v007-polarcutoff-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-polarcutoff-build.log /tmp/v007-polarcutoff-axioms.log; then
            echo '::error::Forbidden axiom in CFC polar cutoff strong recovery.'
            exit 1
          fi
          grep -F "exists_localCFC_polarCutoff_strong_recovery' depends on axioms:" /tmp/v007-polarcutoff-axioms.log
          echo 'V007 canonical CFC root strong cutoff recovery audited.'
