name: V007 intrinsic Gaussian Fock point-evaluation operator norm

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GaussianAreaIntrinsicEvaluationOperatorNorm.lean'
      - 'lean/GegenbauerFock/GaussianAreaIntrinsicEvaluationContinuous.lean'
      - 'lean/GegenbauerFock/GaussianAreaFullIntrinsicEvaluation.lean'
      - '.github/workflows/v007-fock-intrinsic-evaluation-opnorm.yml'
  workflow_dispatch:

jobs:
  intrinsic-evaluation-opnorm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then
              ready=1
              break
            fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib dependencies
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build intrinsic point evaluations and audit Lean kernel
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GaussianAreaIntrinsicEvaluationOperatorNorm 2>&1 | tee /tmp/v007-fock-point-opnorm.log
          lake env lean -M16768 GegenbauerFock/GaussianAreaIntrinsicEvaluationOperatorNorm.lean 2>&1 | tee -a /tmp/v007-fock-point-opnorm.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-fock-point-opnorm.log; then
            echo "::error::Forbidden axioms in full intrinsic Gaussian Fock point evaluation"
            exit 1
          fi
          grep -F "intrinsicEntireEvaluationContinuous_norm_le' depends on axioms:" /tmp/v007-fock-point-opnorm.log
          grep -F "entireRepresentative_norm_le_coherentEvaluation' depends on axioms:" /tmp/v007-fock-point-opnorm.log
          echo 'V007 intrinsic point-evaluation operator norm: Lean kernel and axioms clean.'
