name: M13 Ellis Fredholm closure exact-head audit
on:
  pull_request:
    paths:
      - 'lean/Manuscript13/EllisFourier20261124.lean'
      - 'lean/Manuscript13/EllisBirman20261124.lean'
      - 'lean/Manuscript13/BirmanOperator20261124.lean'
      - 'lean/Manuscript13/EllisGramKernelOperator20261124.lean'
      - 'lean/Manuscript13/EllisParsevalTonelli20261126.lean'
      - 'lean/Manuscript13/EllisCompactSpectrum20261127.lean'
      - 'lean/Manuscript13/EllisFredholmProduct20261127.lean'
      - 'lean/Manuscript13/EllisFredholmClosure20261127.lean'
      - '.github/workflows/m13-ellis-fredholm-closure-20261127.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-head pinned Lean 4 compile and axiom audit
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
          git rev-parse HEAD | tee /tmp/ellis-fredholm-closure.log
          mkdir -p /tmp/gram-olean/Manuscript13
          lake env lean -M16768 -o /tmp/gram-olean/Manuscript13/EllisFourier20261124.olean Manuscript13/EllisFourier20261124.lean 2>&1 | tee -a /tmp/ellis-fredholm-closure.log
          lake env bash -c 'export LEAN_PATH="/tmp/gram-olean:$LEAN_PATH"; lean -M16768 -o /tmp/gram-olean/Manuscript13/EllisBirman20261124.olean Manuscript13/EllisBirman20261124.lean' 2>&1 | tee -a /tmp/ellis-fredholm-closure.log
          lake env bash -c 'export LEAN_PATH="/tmp/gram-olean:$LEAN_PATH"; lean -M16768 -o /tmp/gram-olean/Manuscript13/BirmanOperator20261124.olean Manuscript13/BirmanOperator20261124.lean' 2>&1 | tee -a /tmp/ellis-fredholm-closure.log
          lake env bash -c 'export LEAN_PATH="/tmp/gram-olean:$LEAN_PATH"; lean -M16768 -o /tmp/gram-olean/Manuscript13/EllisGramKernelOperator20261124.olean Manuscript13/EllisGramKernelOperator20261124.lean' 2>&1 | tee -a /tmp/ellis-fredholm-closure.log
          lake env bash -c 'export LEAN_PATH="/tmp/gram-olean:$LEAN_PATH"; lean -M16768 -o /tmp/gram-olean/Manuscript13/EllisParsevalTonelli20261126.olean Manuscript13/EllisParsevalTonelli20261126.lean' 2>&1 | tee -a /tmp/ellis-fredholm-closure.log
          lake env bash -c 'export LEAN_PATH="/tmp/gram-olean:$LEAN_PATH"; lean -M16768 -o /tmp/gram-olean/Manuscript13/EllisCompactSpectrum20261127.olean Manuscript13/EllisCompactSpectrum20261127.lean' 2>&1 | tee -a /tmp/ellis-fredholm-closure.log
          lake env bash -c 'export LEAN_PATH="/tmp/gram-olean:$LEAN_PATH"; lean -M16768 -o /tmp/gram-olean/Manuscript13/EllisFredholmProduct20261127.olean Manuscript13/EllisFredholmProduct20261127.lean' 2>&1 | tee -a /tmp/ellis-fredholm-closure.log
          lake env bash -c 'export LEAN_PATH="/tmp/gram-olean:$LEAN_PATH"; lean -M16768 Manuscript13/EllisFredholmClosure20261127.lean' 2>&1 | tee -a /tmp/ellis-fredholm-closure.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/ellis-fredholm-closure.log; then exit 1; fi
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/ellis-fredholm-closure.log').read_text()
          declarations={"Manuscript13.EllisFredholmClosure20261127":["eigIndex","eigBasis","eigVec","eigVec_eigen","eigVec_orthonormal","eigVec_span_orthogonal","spectralBasis","spectralBasis_apply","gram_product_from_enumeration"]}
          count=0
          for ns, names in declarations.items():
            for name in names:
              full="'"+ns+"."+name+"'"
              found=re.findall(re.escape(full)+r" depends on axioms: \[([^\]]*)\]",t,re.S)
              assert found or full+" does not depend on any axioms" in t,full
              for a in found:
                assert {x.strip() for x in a.split(',') if x.strip()} <= {
                   'propext','Quot.sound','Classical.choice'},(full,a)
              count+=1
          assert count==9
          print("SUCCESS ELLIS FREDHOLM CLOSURE LEAN AXIOM AUDIT",count)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ellis-fredholm-closure-lean-20261126-log
          path: /tmp/ellis-fredholm-closure.log
          if-no-files-found: warn
