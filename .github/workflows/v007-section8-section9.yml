name: V007 Sections 8-9 factorial truncation, range, kernel balance, core extension (13, Thm 8.1, Prop 8.2, Prop 9.1, Lemma 9.2)
on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/Section8Section9.lean'
      - '.github/workflows/v007-section8-section9.yml'
  workflow_dispatch:
jobs:
  section8-section9:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit V007 Sections 8-9 factorial truncation, range, kernel balance, core extension (13, Thm 8.1, Prop 8.2, Prop 9.1, Lemma 9.2)
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.Section8Section9 2>&1 | tee /tmp/section8-section9-build.log
          lake env lean -M16768 GegenbauerFock/Section8Section9.lean 2>&1 | tee /tmp/section8-section9-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/section8-section9-build.log /tmp/section8-section9-axioms.log; then
            echo '::error::Forbidden axiom in Section8Section9.'
            exit 1
          fi
          grep -F "GegenbauerFock.Section8Section9.theorem_8_1_hs_tail' depends on axioms:" /tmp/section8-section9-axioms.log
          grep -F "GegenbauerFock.Section8Section9.theorem_8_1_tail_le' depends on axioms:" /tmp/section8-section9-axioms.log
          grep -F "GegenbauerFock.Section8Section9.theorem_8_1_opNorm' depends on axioms:" /tmp/section8-section9-axioms.log
          grep -F "GegenbauerFock.Section8Section9.theorem_8_1_rank' depends on axioms:" /tmp/section8-section9-axioms.log
          grep -F "GegenbauerFock.Section8Section9.theorem_8_1_approximation_number' depends on axioms:" /tmp/section8-section9-axioms.log
          grep -F "GegenbauerFock.Section8Section9.theorem_8_1_schatten' depends on axioms:" /tmp/section8-section9-axioms.log
          grep -F "GegenbauerFock.Section8Section9.proposition_8_2' depends on axioms:" /tmp/section8-section9-axioms.log
          grep -F "GegenbauerFock.Section8Section9.range_not_closed_of_compact_injective' depends on axioms:" /tmp/section8-section9-axioms.log
          grep -F "GegenbauerFock.Section8Section9.proposition_9_1' depends on axioms:" /tmp/section8-section9-axioms.log
          grep -F "GegenbauerFock.Section8Section9.lemma_9_2_graph' depends on axioms:" /tmp/section8-section9-axioms.log
          grep -F "GegenbauerFock.Section8Section9.lemma_9_2' depends on axioms:" /tmp/section8-section9-axioms.log
          echo 'V007 Sections 8-9 factorial truncation, range, kernel balance, core extension (13, Thm 8.1, Prop 8.2, Prop 9.1, Lemma 9.2): kernel-certified.'
