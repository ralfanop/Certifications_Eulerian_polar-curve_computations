name: V007 narrow Gaussian intrinsic Fock Kummer trace divergence

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireHSNarrowGaussianDivergence.lean'
      - '.github/workflows/v007-intrinsic-fock-hs-narrow-gaussian-divergence.yml'
  workflow_dispatch:

jobs:
  intrinsic-fock-divergence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib and cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit narrow-scale Fock Kummer-Gamma divergence
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireHSNarrowGaussianDivergence 2>&1 | tee /tmp/v007-narrow-fock.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireHSNarrowGaussianDivergence.lean 2>&1 | tee -a /tmp/v007-narrow-fock.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-narrow-fock.log; then
            echo "::error::Forbidden axiom in positive narrow Gaussian Fock divergence"
            exit 1
          fi
          grep -F "kummerSeries_gaussianScale_tendsto_atTop' depends on axioms:" /tmp/v007-narrow-fock.log
          grep -F "gammaDensity_exponentialTrace_tendsto_atTop' depends on axioms:" /tmp/v007-narrow-fock.log
          echo 'V007 narrow Gaussian Kummer and true Gamma trace divergence: Lean kernel checked.'
