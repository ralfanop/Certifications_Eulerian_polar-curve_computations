name: "Priority 3 — explicit exponential trace-norm zero exclusion region for genuine universal Fredholm determinant"

on:
  push:
    branches:
      - manuscript14-priority3-universal-fredholm-explicit-zero-exclusion-20261111
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3CountableUniversalSpectralZeros.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3GenericFredholmSpectralParameters.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3FredholmZeroSetNullity.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3HolomorphicFredholmReciprocal.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3MeromorphicFredholmReciprocal.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3UniversalFredholmLogDerivative.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3UniversalFredholmZeroMultiplicity.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3UniversalFredholmLocalFactorization.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3FredholmReciprocalPoleOrder.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3UniversalFredholmNonzeroDisk.lean'
      - 'lean/SpecialImaginaryPoint/V14119Priority3UniversalFredholmSpectralVariation.lean'
