name: V007 intrinsic Gaussian Fock Riesz two-point kernel bound

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GaussianAreaIntrinsicRieszKernelTwoPoint.lean'
      - 'lean/GegenbauerFock/GaussianAreaIntrinsicKernelHermitian.lean'
      - '.github/workflows/v007-fock-riesz-two-point.yml'
  workflow_dispatch:

jobs:
  intrinsic-riesz-two-point:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and elan
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib dependencies
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile Riesz two-point bound and audit axioms
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GaussianAreaIntrinsicRieszKernelTwoPoint 2>&1 | tee /tmp/v007-riesz-two-point.log
          lake env lean -M16768 GegenbauerFock/GaussianAreaIntrinsicRieszKernelTwoPoint.lean 2>&1 | tee -a /tmp/v007-riesz-two-point.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-riesz-two-point.log; then
            echo "::error::Forbidden axiom in intrinsic Gaussian Fock two-point kernel"
            exit 1
          fi
          grep -F "intrinsicRieszKernel_twoPoint_norm_sq_le' depends on axioms:" /tmp/v007-riesz-two-point.log
          grep -F "intrinsicRieszKernel_pairing_norm_sq_le' depends on axioms:" /tmp/v007-riesz-two-point.log
          grep -F "intrinsicRieszKernel_ne_zero' depends on axioms:" /tmp/v007-riesz-two-point.log
          echo 'V007 intrinsic Fock Gaussian two-point kernel verified by Lean.'
