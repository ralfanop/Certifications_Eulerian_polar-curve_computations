name: V007 full nonzero Fredholm shifts of both Grams
on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/TwoSidedGramNonzeroShiftFredholm.lean'
      - '.github/workflows/gegenbauer-fock-gram-nonzero-fredholm.yml'
  workflow_dispatch:
jobs:
  bilateral-nonzero-fredholm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then break; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep "$((attempt * 8))"
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then break; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep "$((attempt * 8))"
          done
      - name: Prepare exact pinned Mathlib revision
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-check every nonzero Gram shift is Fredholm and inspect axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.TwoSidedGramNonzeroShiftFredholm 2>&1 | tee /tmp/v007-nonzero-fredholm.log
          for theorem in sourceGram_nonzero_shift_isFredholm outputGram_nonzero_shift_isFredholm two_sided_gram_nonzero_shifts_fredholm; do
            grep -qF "${theorem}' depends on axioms" /tmp/v007-nonzero-fredholm.log
          done
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-nonzero-fredholm.log; then
            echo '::error::Forbidden proof axiom in nonzero Gram shift Fredholm certificate'
            exit 1
          fi
          echo 'V007 both actual compact Grams have Fredholm nonzero shifts: kernel-audited.'
