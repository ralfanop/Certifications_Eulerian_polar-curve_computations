name: V007 bilateral zero Fredholm essential-spectrum obstruction

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/TwoSidedGramZeroNotFredholm.lean'
      - '.github/workflows/gegenbauer-fock-gram-zero-not-fredholm.yml'
  workflow_dispatch:

jobs:
  gram-zero-non-fredholm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then break; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep "$((attempt * 8))"
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then break; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep "$((attempt * 8))"
          done
      - name: Prepare exact Mathlib revision
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-compile and axiom-audit bilateral non-Fredholmness at zero
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.TwoSidedGramZeroNotFredholm 2>&1 | tee /tmp/v007-gram-zero-not-fredholm.log
          for theorem in sourceGram_zero_not_fredholm outputGram_zero_not_fredholm two_sided_gram_zero_not_fredholm; do
            grep -qF "${theorem}' depends on axioms" /tmp/v007-gram-zero-not-fredholm.log
          done
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-gram-zero-not-fredholm.log; then
            echo '::error::Forbidden proof axiom in Gram zero non-Fredholmness'
            exit 1
          fi
          echo 'V007 source/output Grams non-Fredholm at zero: Lean kernel audit passed.'
