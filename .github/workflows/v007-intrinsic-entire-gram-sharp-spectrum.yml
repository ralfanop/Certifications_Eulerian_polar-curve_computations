name: V007 intrinsic Fock source Gram sharp spectrum and essential singleton

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireGramSharpSpectrum.lean'
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireGramEssentialSingleton.lean'
      - 'lean/GegenbauerFock/TwoSidedGramExactSpectralNormBand.lean'
      - '.github/workflows/v007-intrinsic-entire-gram-sharp-spectrum.yml'
  workflow_dispatch:

jobs:
  intrinsic-sharp-spectrum:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exact repository-pinned Lean 4
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for i in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((i * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for i in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((i * 8))"
          done
          test "$ready" -eq 1
      - name: Restore repository-pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel compile and inspect three entire Fock sharp-spectrum proofs
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireGramSharpSpectrum 2>&1 | tee /tmp/v007-intrinsic-fock-sharp.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireGramSharpSpectrum.lean 2>&1 | tee -a /tmp/v007-intrinsic-fock-sharp.log
          for theorem in \
            intrinsicEntire_sourceGram_spectral_value_sharp_bound \
            intrinsicEntire_sourceGram_outside_sharp_band_resolvent \
            intrinsicEntire_sourceGram_sharp_spectrum_and_essential_zero \
            intrinsicEntire_sourceGram_shift_fredholm_iff_nonzero; do
            grep -qF "${theorem}' depends on axioms:" /tmp/v007-intrinsic-fock-sharp.log
          done
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-intrinsic-fock-sharp.log; then
            echo '::error::Forbidden proof axiom in intrinsic sharp spectrum.'
            exit 1
          fi
          echo 'Certified genuine entire-Fock source Gram sharp spectrum, resolvent and Fredholm singleton.'
