name: V007 ultraspherical lambda order of true Fock Hilbert-Schmidt and Gram mass

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireHSLambdaOrder.lean'
      - '.github/workflows/v007-intrinsic-fock-hs-lambda-order.yml'
  workflow_dispatch:

jobs:
  intrinsic-fock-lambda-order:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit lambda-order Fock HS mass and Gram trace
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireHSLambdaOrder 2>&1 | tee /tmp/v007-lambda-order.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireHSLambdaOrder.lean 2>&1 | tee -a /tmp/v007-lambda-order.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-lambda-order.log; then
            echo "::error::Forbidden axiom in lambda order of intrinsic Fock trace"
            exit 1
          fi
          grep -F "ratio_antitone_lambda' depends on axioms:" /tmp/v007-lambda-order.log
          grep -F "kummerSeries_antitone_lambda' depends on axioms:" /tmp/v007-lambda-order.log
          grep -F "C_intrinsicEntire_HS_energy_antitone_lambda' depends on axioms:" /tmp/v007-lambda-order.log
          grep -F "C_intrinsicEntire_Gram_trace_antitone_lambda' depends on axioms:" /tmp/v007-lambda-order.log
          echo 'V007 ultraspherical-parameter Fock S2 and Gram trace ordering: kernel checked.'
