name: "Manuscript 14.119 Priority 3 — Dirichlet and mixed spectral products"

on:
  push:
    branches:
      - manuscript14-priority3-spectral-determinant-bridge-20261109
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3SpectralDetBridge.lean'
      - '.github/workflows/manuscript14-priority3-dirichlet-bridge.yml'
  pull_request:
    paths:
      - 'lean/SpecialImaginaryPoint/V14119Priority3SpectralDetBridge.lean'
      - '.github/workflows/manuscript14-priority3-dirichlet-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean 4 kernel audit — finite-to-infinite Dirichlet determinant
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile actual finite Dirichlet determinants and Euler products
        shell: bash
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/SpecialImaginaryPoint
          for f in DirichletFiniteDeterminant Section67ScalarCertificate V14119Priority3SpectralDetBridge; do
            lake env lean -M16768 -o ".lake/build/lib/lean/SpecialImaginaryPoint/$f.olean" \
              "SpecialImaginaryPoint/$f.lean" 2>&1 | tee "/tmp/$f.log"
          done
      - name: Audit all four statements without sorry or nonstandard axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          path = pathlib.Path("/tmp/V14119Priority3SpectralDetBridge.log")
          log = path.read_text()
          names = [
            "Manuscript14Priority3.dirichlet_factor_sq",
            "Manuscript14Priority3.finite_dirichlet_product",
            "Manuscript14Priority3.finite_dirichlet_product_tendsto",
            "Manuscript14Priority3.spectralProduct_sq",
            "Manuscript14Priority3.finite_mixed_product_tendsto",
            "Manuscript14Priority3.mixedSpectralProduct_eq_cosh",
          ]
          found = {}
          for m in re.finditer(
              r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms",
              log):
              found[m.group(1) or m.group(3)] = {
                  x.strip() for x in (m.group(2) or "").split(",") if x.strip()
              }
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in names:
              assert name in found, f"No kernel report: {name}"
              extra = found[name] - allowed
              assert not extra, f"Unexpected axioms for {name}: {extra}"
              print(f"{name}: {sorted(found[name])}")
          assert "sorryAx" not in log and "Lean.ofReduceBool" not in log
          assert not re.search(r"\.lean:\d+:\d+: error:", log)
          print("SUCCESS: 6 exact Dirichlet/mixed spectral product theorems, only standard axioms")
          PY
      - name: Upload proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript14-priority3-dirichlet-product-audit
          path: /tmp/*.log
          if-no-files-found: ignore
