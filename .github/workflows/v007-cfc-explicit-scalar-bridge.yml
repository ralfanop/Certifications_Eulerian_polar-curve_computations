name: V007 explicit local scalar CFC square root bridge

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/CanonicalCFCSqrtExplicitScalarBridge.lean'
      - '.github/workflows/v007-cfc-explicit-scalar-bridge.yml'
  workflow_dispatch:

jobs:
  explicit-cfc-local-instance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version
      - name: Restore pinned Mathlib cache
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel check and audit explicit local CFC sqrt
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.CanonicalCFCSqrtExplicitScalarBridge 2>&1 | tee /tmp/v007-cfc-explicit-scalar.log
          lake env lean -M16768 GegenbauerFock/CanonicalCFCSqrtExplicitScalarBridge.lean 2>&1 | tee -a /tmp/v007-cfc-explicit-scalar.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-cfc-explicit-scalar.log; then
            echo '::error::Forbidden axiom in explicit CFC scalar bridge.'
            exit 1
          fi
          grep -F "exists_cfc_sqrt_with_explicit_scalar_commutation' depends on axioms:" /tmp/v007-cfc-explicit-scalar.log
          grep -F "exists_cfc_sqrt_full_polar_adjoint_outputGram_explicit' depends on axioms:" /tmp/v007-cfc-explicit-scalar.log
          grep -F "exists_cfc_sqrt_eigenbasis_kummer_explicit' depends on axioms:" /tmp/v007-cfc-explicit-scalar.log
          echo 'V007 canonical CFC sqrt, full polar-adjoint/output-Gram, and eigenbasis/Kummer proofs kernel-certified and audited.'
