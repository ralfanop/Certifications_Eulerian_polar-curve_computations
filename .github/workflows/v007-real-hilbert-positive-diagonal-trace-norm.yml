name: V007 abstract real Hilbert positive diagonal S1 trace norm

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/RealHilbertPositiveDiagonalTraceNorm.lean'
      - '.github/workflows/v007-real-hilbert-positive-diagonal-trace-norm.yml'
  workflow_dispatch:

jobs:
  abstract-real-positive-diagonal-s1:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned Mathlib dependencies
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Certify abstract real Hilbert S1 diagonal trace norm
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RealHilbertPositiveDiagonalTraceNorm 2>&1 | tee /tmp/v007-real-diagonal-s1.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-diagonal-s1.log; then
            echo '::error::Forbidden axiom in real positive diagonal S1 trace norm.'
            exit 1
          fi
          grep -F "'GegenbauerFock.Ultraspherical.realHilbert_positiveDiagonal_nuclearInfimum_eq_trace' depends on axioms:" /tmp/v007-real-diagonal-s1.log
          echo 'Abstract positive diagonal real nuclear S1 trace norm kernel-certified.'
