name: M12 exponential Frechet exact-head audit
on:
  pull_request:
    paths:
      - 'lean/EulerianGrothendieck/JacobiExpFrechet20261127.lean'
      - 'lean/EulerianGrothendieck/JacobiDuhamel20261127.lean'
      - 'lean/EulerianGrothendieck/JacobiFrechet20261127.lean'
      - 'lean/EulerianGrothendieck/KreinBilateralJacobi20261127.lean'
      - '.github/workflows/m12-exp-frechet-20261127.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-head pinned Lean 4 compile and axiom audit
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = '0272bbe1c093d038d7257ab15306abd58245f9ff'
          lake exe cache get
          git rev-parse HEAD | tee /tmp/m12-exp-frechet.log
          mkdir -p /tmp/m12-exp-frechet-olean/Manuscript16 /tmp/m12-exp-frechet-olean/EulerianGrothendieck
          lake env bash -c 'export LEAN_PATH="/tmp/m12-exp-frechet-olean:$LEAN_PATH"; lean -M16768 -o /tmp/m12-exp-frechet-olean/Manuscript16/V166L2SpectralInverse.olean Manuscript16/V166L2SpectralInverse.lean' 2>&1 | tee -a /tmp/m12-exp-frechet.log
          lake env bash -c 'export LEAN_PATH="/tmp/m12-exp-frechet-olean:$LEAN_PATH"; lean -M16768 -o /tmp/m12-exp-frechet-olean/EulerianGrothendieck/KreinBilateralJacobi20261127.olean EulerianGrothendieck/KreinBilateralJacobi20261127.lean' 2>&1 | tee -a /tmp/m12-exp-frechet.log
          lake env bash -c 'export LEAN_PATH="/tmp/m12-exp-frechet-olean:$LEAN_PATH"; lean -M16768 -o /tmp/m12-exp-frechet-olean/EulerianGrothendieck/JacobiFrechet20261127.olean EulerianGrothendieck/JacobiFrechet20261127.lean' 2>&1 | tee -a /tmp/m12-exp-frechet.log
          lake env bash -c 'export LEAN_PATH="/tmp/m12-exp-frechet-olean:$LEAN_PATH"; lean -M16768 -o /tmp/m12-exp-frechet-olean/EulerianGrothendieck/JacobiDuhamel20261127.olean EulerianGrothendieck/JacobiDuhamel20261127.lean' 2>&1 | tee -a /tmp/m12-exp-frechet.log
          lake env bash -c 'export LEAN_PATH="/tmp/m12-exp-frechet-olean:$LEAN_PATH"; lean -M16768 EulerianGrothendieck/JacobiExpFrechet20261127.lean' 2>&1 | tee -a /tmp/m12-exp-frechet.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/m12-exp-frechet.log; then exit 1; fi
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/m12-exp-frechet.log').read_text()
          names=["exp_cont","kernel_apply","kernel_joint_cont","kernel_cont","D_cont","D_apply","exp_difference","exp_remainder","exp_hasFDerivAt","exp_fderiv","exp_fderiv_apply","jacobi_exp_fderiv","fourier_exp_fderiv"]
          count=0
          for name in names:
              full="'M12ExpFrechet."+name+"'"
              found=re.findall(re.escape(full)+r" depends on axioms: \[([^\]]*)\]",t,re.S)
              assert found or full+" does not depend on any axioms" in t,full
              for a in found:
                  assert {x.strip() for x in a.split(',') if x.strip()} <= {'propext','Quot.sound','Classical.choice'},(full,a)
              count+=1
          assert count==13
          print("SUCCESS M12 EXP FRECHET AUDIT",count)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m12-exp-frechet-audit
          path: /tmp/m12-exp-frechet.log
          if-no-files-found: warn
