name: M11-M12 Krapivsky-Luck energy Lean audit
on:
  pull_request:
    paths:
      - 'lean/EulerianCert/KrapivskyLuckEnergy.lean'
      - '.github/workflows/m11-m12-krapivsky-luck.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Lean and Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD | tee /tmp/m11-m12-head.txt
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Build existing dependency and check new identities
        working-directory: lean
        run: |
          set -euo pipefail
          lake build EulerianCert.Energy 2>&1 | tee /tmp/m11-m12-build.log
          lake env lean -M16768 EulerianCert/KrapivskyLuckEnergy.lean 2>&1 | tee /tmp/m11-m12-lean.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|error:|declaration uses .sorry.' /tmp/m11-m12-lean.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/m11-m12-lean.log').read_text()
          for n in ["integral_half","integral_symmetric","extended_energy","integral_linear","C_linear","C_energy","C_energy_set","k0_sq","C_normalized_energy","tail_set","S_tail","S_normalized_tail"]:
              name = 'Manuscripts11And12.KrapivskyLuck.'+n
              matches = re.findall(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", log, re.S)
              if not matches:
                  assert f"'{name}' does not depend on any axioms" in log, 'missing audit: '+name
              for match in matches:
                  assert {a.strip() for a in match.split(',') if a.strip()} <= {'propext','Classical.choice','Quot.sound'}
          print('AXIOM AUDIT SUCCESS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m11-m12-kl-energy-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/m11-m12-head.txt
            /tmp/m11-m12-build.log
            /tmp/m11-m12-lean.log

