name: V007 general real positive spectral S1 to nuclear class and exact norm

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleResolventRealS1EigenbasisToNuclear.lean'
      - '.github/workflows/v007-sturm-real-s1-generic-positive-eigenbasis-bridge.yml'
  workflow_dispatch:

jobs:
  positive-s1-generic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then exit 0; fi
            sleep "$((attempt * 8))"
          done
          exit 1
      - name: Prepare pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Prove generic real positive eigenbasis S1 and nuclear equivalence
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleResolventRealS1EigenbasisToNuclear 2>&1 | tee /tmp/v007-real-s1-generic-positive.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-real-s1-generic-positive.log; then
            echo '::error::Nonstandard axiom in general real positive S1 bridge.'
            exit 1
          fi
          for theorem in realPositiveEigenSummable_operator_tsum_eq HasRealPositiveS1Eigenbasis.toPositiveRealNuclearExpansion HasRealPositiveS1Eigenbasis.exists_projective_norm_eq_eigenSum; do
            grep -F "'GegenbauerFock.Ultraspherical.${theorem}' depends on axioms:" /tmp/v007-real-s1-generic-positive.log
          done
          echo 'Generic real positive spectral S1 nuclear bridge kernel-certified.'
