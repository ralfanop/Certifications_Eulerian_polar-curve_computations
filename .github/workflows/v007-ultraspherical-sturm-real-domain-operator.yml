name: V007 actual ultraspherical real L2 polynomial image Sturm operator symmetry

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealDomainOperator.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealL2Kernel.lean'
      - '.github/workflows/v007-ultraspherical-sturm-real-domain-operator.yml'
  workflow_dispatch:

jobs:
  genuine-real-Sturm-domain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit actual weighted real L2 polynomial domain action
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealDomainOperator 2>&1 | tee /tmp/v007-sturm-real-domain-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealDomainOperator.lean 2>&1 | tee /tmp/v007-sturm-real-domain-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-sturm-real-domain-build.log /tmp/v007-sturm-real-domain-axioms.log; then
            echo '::error::Forbidden axiom in true Sturm real L2 polynomial domain operator.'
            exit 1
          fi
          grep -F "sturmRealDomainRepresentative_spec' depends on axioms:" /tmp/v007-sturm-real-domain-axioms.log
          grep -F "sturmRealDomainOperator_on_polynomial' depends on axioms:" /tmp/v007-sturm-real-domain-axioms.log
          grep -F "sturmRealDomainOperator_symmetric' depends on axioms:" /tmp/v007-sturm-real-domain-axioms.log
          echo 'V007 genuine real L2 Sturm polynomial-image domain action and Green symmetry certified.'
