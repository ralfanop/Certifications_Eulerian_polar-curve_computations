name: V007 positive definiteness of finite intrinsic Fock Gaussian Gram matrices

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GaussianAreaIntrinsicRieszFiniteGramDefinite.lean'
      - 'lean/GegenbauerFock/GaussianAreaFockCoherentFiniteIndependent.lean'
      - '.github/workflows/v007-fock-intrinsic-finite-gram-definite.yml'
  workflow_dispatch:

concurrency:
  group: v007-fock-intrinsic-finite-gram-definite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gaussian-fock-finite-gram-definite:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version
      - name: Restore pinned Mathlib cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile intrinsic finite Gram definiteness and audit every theorem
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GaussianAreaIntrinsicRieszFiniteGramDefinite 2>&1 | tee /tmp/v007-fock-finite-gram-definite.log
          lake env lean -M16768 GegenbauerFock/GaussianAreaIntrinsicRieszFiniteGramDefinite.lean 2>&1 | tee -a /tmp/v007-fock-finite-gram-definite.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-fock-finite-gram-definite.log; then
            echo "::error::Forbidden axiom in intrinsic Gaussian Gram positive definiteness."
            exit 1
          fi
          grep -F "finiteIntrinsicRieszKernel_zero_coefficients' depends on axioms:" /tmp/v007-fock-finite-gram-definite.log
          grep -F "finiteIntrinsicRieszKernel_linearIndependent' depends on axioms:" /tmp/v007-fock-finite-gram-definite.log
          grep -F "finiteIntrinsicRieszKernel_exp_gram_pos_of_nonzero' depends on axioms:" /tmp/v007-fock-finite-gram-definite.log
          grep -F "finiteIntrinsicRieszKernel_exp_gram_pos_iff_nonzero' depends on axioms:" /tmp/v007-fock-finite-gram-definite.log
          echo 'V007 intrinsic finite Gaussian Gram definiteness kernel-certified.'
