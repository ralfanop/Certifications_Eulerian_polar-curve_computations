name: V007 exact first excited Kummer Fock energy correction

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/GegenbauerIntrinsicEntireHSFirstCorrectionExact.lean'
      - '.github/workflows/v007-intrinsic-fock-hs-first-correction-exact.yml'
  workflow_dispatch:

jobs:
  first-kummer-correction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit explicit intrinsic Fock first Kummer correction
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.GegenbauerIntrinsicEntireHSFirstCorrectionExact 2>&1 | tee /tmp/v007-fock-first-corr.log
          lake env lean -M16768 GegenbauerFock/GegenbauerIntrinsicEntireHSFirstCorrectionExact.lean 2>&1 | tee -a /tmp/v007-fock-first-corr.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-fock-first-corr.log; then
            echo "::error::Forbidden axiom in first excited Fock Kummer correction"
            exit 1
          fi
          grep -F "Kummer_first_excited_coefficient_exact' depends on axioms:" /tmp/v007-fock-first-corr.log
          grep -F "C_intrinsicEntire_HS_energy_explicit_first_lower' depends on axioms:" /tmp/v007-fock-first-corr.log
          grep -F "C_intrinsicEntire_Gram_trace_explicit_first_lower' depends on axioms:" /tmp/v007-fock-first-corr.log
          echo 'V007 exact intrinsic Fock first correction to trace: Lean kernel verified.'
