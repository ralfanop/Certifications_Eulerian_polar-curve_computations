name: V007 actual complex Sturm heat complete C0 semigroup

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleActualComplexHeatFullC0.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleActualComplexHeatSemigroupLaw.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealHeatLimitFullC0.lean'
      - '.github/workflows/v007-actual-complex-heat-full-c0.yml'
  workflow_dispatch:

jobs:
  actual-complex-sturm-full-c0:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then installed=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$installed" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build true complex C0 semigroup and audit axioms
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleActualComplexHeatFullC0 2>&1 | tee /tmp/v007-actual-complex-C0-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleActualComplexHeatFullC0.lean 2>&1 | tee /tmp/v007-actual-complex-C0-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-actual-complex-C0-build.log /tmp/v007-actual-complex-C0-axioms.log; then
            echo '::error::Forbidden axiom in genuine complex Sturm C0 semigroup.'
            exit 1
          fi
          grep -F "sturmActualComplexHeatNonnegativeExtended_allL2_tendsto_zero' depends on axioms:" /tmp/v007-actual-complex-C0-axioms.log
          grep -F "sturmActualComplexHeat_fullC0_joint_certificate' depends on axioms:" /tmp/v007-actual-complex-C0-axioms.log
          echo 'V007 actual complex Sturm C0 semigroup audited.'
