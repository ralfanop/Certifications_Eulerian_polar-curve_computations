name: V007 rigorous rational trace infinite Taylor tail

on:
  push:
    branches: [gegenbauer-fock-formalization-20261025]
    paths:
      - 'lean/GegenbauerFock/RationalTraceAnalyticTail.lean'
      - '.github/workflows/v007-rational-trace-analytic-tail.yml'
  workflow_dispatch:

concurrency:
  group: v007-rational-tail-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rational-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ready=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ready" -eq 1
      - name: Restore pinned Mathlib and cache
        working-directory: lean
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile exact rational endpoints and infinite Taylor remainder
        working-directory: lean
        run: |
          set -euo pipefail
          lake build GegenbauerFock.RationalTraceAnalyticTail 2>&1 | tee /tmp/v007-rational-tail-build.log
          lake env lean -M16768 GegenbauerFock/RationalTraceAnalyticTail.lean 2>&1 | tee /tmp/v007-rational-tail-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-rational-tail-build.log /tmp/v007-rational-tail-axioms.log; then
            echo "::error::Forbidden axiom in rational trace tail"
            exit 1
          fi
          for theorem in fifteen_tail_strict_bound fifteen_rational_endpoints; do
            grep -F "${theorem}' depends on axioms:" /tmp/v007-rational-tail-axioms.log
          done
          echo 'V007 rational trace tail: Lean compilation and axiom audit clean.'
