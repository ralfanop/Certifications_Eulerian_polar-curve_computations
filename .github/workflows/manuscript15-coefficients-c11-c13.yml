name: Manuscript 15 — exact rigidity coefficients c11-c13 with strict kernel audit
on:
  push:
    branches:
      - manuscript15-lean-c11-c13-20261112
    paths:
      - 'lean/Manuscript15/CoefficientRigidity.lean'
      - '.github/workflows/manuscript15-coefficients-c11-c13.yml'
  pull_request:
    paths:
      - 'lean/Manuscript15/CoefficientRigidity.lean'
      - '.github/workflows/manuscript15-coefficients-c11-c13.yml'
  workflow_dispatch:
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors \
            --retry-delay 5 --connect-timeout 20 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
      - name: Download pinned Mathlib artifacts
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Kernel-check all c0-c10 coefficient recurrence consequences
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean Manuscript15/CoefficientRigidity.lean 2>&1 | tee /tmp/m15-coeff-c11c13.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/m15-coeff-c11c13.log; then
            echo '::error::Uncertified axiom detected'
            exit 1
          fi
          for decl in one two three four five six seven eight nine ten eleven twelve thirteen; do
            grep -F "Manuscript15.coefficientRule_c_$decl" /tmp/m15-coeff-c11c13.log
          done
          grep -F 'Manuscript15.coefficientRule_unique' /tmp/m15-coeff-c11c13.log
          python3 - <<'PY'
          import pathlib, re
          s=pathlib.Path("/tmp/m15-coeff-c11c13.log").read_text()
          decls=["coefficientRule_c_"+n for n in
            ("one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen")]
          decls.append("coefficientRule_unique")
          found={}
          for m in re.finditer(r"'([^']+)' depends on axioms: \[([^\]]*)\]|'([^']+)' does not depend on any axioms",s,re.MULTILINE):
            found[m.group(1) or m.group(3)]={t.strip() for t in (m.group(2) or "").split(",") if t.strip()}
          allowed={"propext","Classical.choice","Quot.sound"}
          for name in decls:
            key="Manuscript15."+name
            assert key in found, f"Missing kernel axioms report: {key}"
            assert found[key] <= allowed, f"NONSTANDARD AXIOM in {key}: {found[key]-allowed}"
            print(key, sorted(found[key]))
          assert "sorryAx" not in s and "Lean.ofReduceBool" not in s
          assert not re.search(r"\.lean:\d+:\d+: error",s)
          print("SUCCESS: Manuscript15 exact conditional recurrence c0..c13 and uniqueness kernel-certified")
          PY
      - name: Upload complete Lean kernel/axiom logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript15-c11-c13-lean-audit
          path: /tmp/m15-coeff-c11c13.log
