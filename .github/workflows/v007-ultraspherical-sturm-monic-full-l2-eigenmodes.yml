name: V007 explicit all-degree monic Gegenbauer full-L2 Sturm eigenmodes
on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonicFullL2Eigenmodes.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleMonicEigenPolynomial.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealResolventPolynomialEigenmode.lean'
      - '.github/workflows/v007-ultraspherical-sturm-monic-full-l2-eigenmodes.yml'
  workflow_dispatch:
jobs:
  genuine-monic-full-l2-eigenmodes:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and kernel-audit explicit monic full-L2 Sturm eigenmodes
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleMonicFullL2Eigenmodes 2>&1 | tee /tmp/v007-monic-full-l2-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleMonicFullL2Eigenmodes.lean 2>&1 | tee /tmp/v007-monic-full-l2-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-monic-full-l2-build.log /tmp/v007-monic-full-l2-axioms.log; then
            echo '::error::Forbidden axiom in genuine all-degree monic full-L2 Sturm eigenmodes.'
            exit 1
          fi
          grep -F "sturmRealClosed_monic_all_degree_eigenmode' depends on axioms:" /tmp/v007-monic-full-l2-axioms.log
          grep -F "sturmRealPositiveResolventFullCLM_monic_all_degree_eigenmode' depends on axioms:" /tmp/v007-monic-full-l2-axioms.log
          grep -F "sturmRealMonicEigenCandidate_orthogonal' depends on axioms:" /tmp/v007-monic-full-l2-axioms.log
          echo 'Explicit all-degree monic full-L2 closed Sturm and resolvent eigenmodes kernel-certified.'
