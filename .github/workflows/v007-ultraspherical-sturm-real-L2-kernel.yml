name: V007 symmetric Sturm polynomial action descends to actual real L2 image

on:
  push:
    branches:
      - gegenbauer-fock-formalization-20261025
    paths:
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealL2Kernel.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealL2Green.lean'
      - 'lean/GegenbauerFock/UltrasphericalSturmLiouvilleRealPolynomialLinear.lean'
      - '.github/workflows/v007-ultraspherical-sturm-real-L2-kernel.yml'
  workflow_dispatch:

jobs:
  true-L2-Sturm-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sh /tmp/elan-init.sh -y --default-toolchain none; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if "$HOME/.elan/bin/lean" --version && "$HOME/.elan/bin/lake" --version; then ok=1; break; fi
            sleep "$((attempt * 8))"
          done
          test "$ok" -eq 1
      - name: Restore pinned Mathlib
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Compile and axiom-audit genuine L2 differential action kernel invariance
        working-directory: lean
        shell: bash
        run: |
          set -euo pipefail
          lake build GegenbauerFock.UltrasphericalSturmLiouvilleRealL2Kernel 2>&1 | tee /tmp/v007-sturm-real-kernel-build.log
          lake env lean -M16768 GegenbauerFock/UltrasphericalSturmLiouvilleRealL2Kernel.lean 2>&1 | tee /tmp/v007-sturm-real-kernel-axioms.log
          if grep -nF -e 'sorryAx' -e 'Lean.ofReduceBool' /tmp/v007-sturm-real-kernel-build.log /tmp/v007-sturm-real-kernel-axioms.log; then
            echo '::error::Forbidden axiom in actual real L2 polynomial operator.'
            exit 1
          fi
          grep -F "sturmRealPolynomialLp_kernel_invariant' depends on axioms:" /tmp/v007-sturm-real-kernel-axioms.log
          grep -F "sturmRealPolynomialLp_action_well_defined' depends on axioms:" /tmp/v007-sturm-real-kernel-axioms.log
          echo 'V007 true L2 real polynomial differential operator well-definedness certified.'
