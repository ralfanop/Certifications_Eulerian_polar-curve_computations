name = "EulerianCert"
defaultTargets = ["EulerianCert"]

# V007: per-Lean-process soft memory cap in megabytes (not reserved RAM).
# weakLeanArgs applies to Lean invoked by Lake builds without forcing
# an otherwise unnecessary full rebuild when this operational cap changes.
weakLeanArgs = ["-M16768"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "0272bbe1c093d038d7257ab15306abd58245f9ff"

[[lean_lib]]
name = "EulerianCert"

[[lean_lib]]
name = "UniformLanczos"

[[lean_lib]]
name = "GegenbauerFock"
